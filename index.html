/** 推估裝備後相對目前裝備的屬性差（僅顯示主要戰鬥屬性） */
function resolveCompareSlot(member, item){
  ensureMemberEquip(member);
  if(item && EQUIP_SLOT_IDS.includes(item.slot)) return item.slot;
  return item ? item.slot : 'weapon';
}
function invCompareMeta(member, item){
  if(!item || item.slot==='potion') return {html:'', delta:0, empty:false, upgrade:false};
  ensureMemberEquip(member);
  const slot = resolveCompareSlot(member, item);
  const cur = member.equip[slot];
  const empty = !cur;
  const stats = ['atk','matk','def','spd','hp','mp','str','con','agi','int'];
  const parts=[];
  let deltaScore = 0;
  const weights = {atk:1.2,matk:1.2,def:1.0,spd:0.9,hp:0.08,mp:0.06,str:1.1,con:1.0,agi:1.0,int:1.1};
  stats.forEach(st=>{
    const d = itemStatSum(item, st) - itemStatSum(cur, st);
    if(d===0) return;
    deltaScore += d * (weights[st]||1);
    const cls = d>0 ? 'delta-up' : 'delta-down';
    const sign = d>0 ? '+' : '';
    parts.push(`<span class="${cls}">${statLabel(st)} ${sign}${d}</span>`);
  });
  let html;
  if(empty) html = `<div class="inv-compare"><span class="delta-up">空槽可直接裝備</span></div>`;
  else if(!parts.length) html = `<div class="inv-compare delta-same">與目前裝備數值相近</div>`;
  else html = `<div class="inv-compare">相對已裝備：${parts.join(' · ')}</div>`;
  return {html, delta:deltaScore, empty, upgrade: empty || deltaScore > 0.5};
}
function invCompareHtml(member, item){
  return invCompareMeta(member, item).html;
}
function slotLabelOf(slot){
  const d = EQUIP_SLOT_DEFS.find(s=>s.id===slot);
  return d ? d.label : (slot||'');
}
function sortInventory(mode){
  if(!S || !S.inventory) return;
  const rank = (id)=>{ const i=RARITIES.findIndex(r=>r.id===id); return i<0?0:i; };
  const pots = S.inventory.filter(i=>i.slot==='potion');
  const gear = S.inventory.filter(i=>i.slot!=='potion');
  if(mode==='rarity'){
    gear.sort((a,b)=> rank(b.rarity)-rank(a.rarity) || itemPowerScore(b)-itemPowerScore(a));
  } else if(mode==='slot'){
    const order = ['weapon','offhand','armor','head','cape','hands','feet','accessory'];
    gear.sort((a,b)=>{
      const ia = order.indexOf(a.slot), ib = order.indexOf(b.slot);
      return (ia<0?99:ia)-(ib<0?99:ib) || rank(b.rarity)-rank(a.rarity);
    });
  } else if(mode==='level'){
    gear.sort((a,b)=> (b.itemLevel||1)-(a.itemLevel||1) || rank(b.rarity)-rank(a.rarity));
  } else {
    // name
    gear.sort((a,b)=> String(a.name).localeCompare(String(b.name),'zh'));
  }
  pots.sort((a,b)=> String(a.kind).localeCompare(String(b.kind)) || (b.value||0)-(a.value||0));
  S.inventory = gear.concat(pots);
  if(S.log) S.log.unshift('背包已整理（'+({rarity:'稀有度',slot:'欄位',level:'等級',name:'名稱'}[mode]||mode)+'）。');
}

function statLabel(s){
  return {
    atk:'物攻', matk:'魔攻', def:'防禦', spd:'速度',
    hp:'生命', mp:'魔力',
    str:'力量', con:'體質', agi:'敏捷', int:'智力',
    heal:'治療', luck:'幸運'
  }[s]||s;
}
function equipAffixText(item){
  if(item.affixes && item.affixes.length){
    return item.affixes.map(a=>{
      const tag = a.label && a.label!=='主屬性' ? a.label+' ' : '';
      return tag+'+'+a.value+' '+statLabel(a.stat);
    }).join(' · ');
  }
  let s = '+'+item.value+' '+statLabel(item.stat);
  if(item.extraStat) s += ' · 額外+'+item.extraValue+' '+statLabel(item.extraStat);
  return s;
}
function skillEstimate(actor, sk){
  const atk = statTotal(actor,'atk');
  const matk = statTotal(actor,'matk');
  const cc = Math.round(critChance(actor, sk)*100);
  switch(sk.type){
    case 'phys':
      return '預估 ~'+Math.round(atk*(sk.mult||1))+' 物傷（物攻×'+ (sk.mult||1) +'−防×0.5）';
    case 'phys_crit':
      return '預估 ~'+Math.round(atk*(sk.mult||1))+' 物傷，爆擊率約 '+(sk.crit!=null?Math.round(sk.crit*100):Math.max(cc,45))+'%（×'+CF.CRIT_MULT+'）';
    case 'phys_multi':
    case 'phys_multi2': {
      const hits = sk.hits || (sk.type==='phys_multi'?3:2);
      return '預估總傷 ~'+Math.round(atk*(sk.mult||1)*hits)+'（'+hits+' 連擊，每段物攻×'+(sk.mult||1)+'）';
    }
    case 'magic':
      return '預估 ~'+Math.round(matk*(sk.mult||1))+' 魔傷（魔攻×'+(sk.mult||1)+'−防×0.25）'+(sk.holy?'；對邪惡×1.25':'');
    case 'magic_aoe':
      return '預估 ~'+Math.round(matk*(sk.mult||1))+'/敵（魔攻×'+(sk.mult||1)+'）';
    case 'magic_dot':
      return '預估 ~'+Math.round(matk*(sk.mult||1))+'/敵 + 中毒'+(sk.poisonTurns||3)+'回合';
    case 'heal':
      return '預估治療 ~'+calcHealAmt(actor, sk.heal||1)+' HP（魔攻×係數+智力×0.6+Lv×2）';
    case 'heal_aoe':
      return '預估群體治療 ~'+calcHealAmt(actor, sk.heal||0.8)+' HP／人';
    case 'self_heal':
      return '恢復 ~'+Math.round(actor.maxHp*(sk.heal||0.2))+' HP + '+(sk.mpGain!=null?sk.mpGain:10)+' MP';
    case 'buff':
      return '全隊防禦+'+(Math.round((sk.buffDefRatio!=null?sk.buffDefRatio:0.2)*100))+'%，'+(sk.buffTurns||2)+' 回合';
    case 'guard':
      return '嘲諷 + 自身防禦+'+(Math.round((sk.buffDefRatio!=null?sk.buffDefRatio:0.6)*100))+'%，'+(sk.buffTurns||2)+' 回合';
    case 'steal':
      return '物傷（×'+(sk.mult||1.1)+'）+ 偷取 '+(sk.stealMin||5)+'~'+(sk.stealMax||15)+' 金';
    case 'mark':
      return '輔助：標記 '+(sk.markTurns||3)+' 回合，受傷+' + Math.round(((sk.markMult||1.35)-1)*100) + '%';
    default: return '';
  }
}
function bindInventory(){
  const selMember = S.party.find(m=>m.uid===S.invSelectedUid) || S.hero;
  ensureMemberEquip(selMember);
  // 角色立繪
  const heroCv = document.getElementById('inv-hero-sprite');
  if(heroCv) drawSprite(heroCv, (selMember.name||'hero')+'_'+selMember.uid, memberPalette(selMember), 16, {kind:'human', gender: selMember.gender || (typeof guessGenderFromName==='function'?guessGenderFromName(selMember.name):null)});
  EQUIP_SLOT_IDS.forEach(slot=>{
    const item = selMember.equip[slot];
    const cv = document.getElementById('eq-'+slot);
    if(item && cv){
      drawEquipIcon(cv, item.seed, slot, item.rarityHex);
    }
  });
  S.inventory.forEach((item,i)=>{
    if(item.slot==='potion') return;
    const el = document.getElementById('inv-'+i);
    if(el){
      drawEquipIcon(el, item.seed, item.slot, item.rarityHex);
    }
  });

  document.querySelectorAll('[data-selmember]').forEach(btn=> btn.addEventListener('click', ()=>{
    S.invSelectedUid = btn.dataset.selmember;
    S.invSelectedItemUid = null;
    render();
  }));
  document.querySelectorAll('[data-invfilter]').forEach(btn=> btn.addEventListener('click', ()=>{
    S.invFilter = btn.dataset.invfilter;
    S.invSelectedItemUid = null;
    if(S.invFilter==='warehouse') S.warePage = 0;
    render();
  }));
  document.querySelectorAll('[data-invsort]').forEach(btn=> btn.addEventListener('click', ()=>{
    sortInventory(btn.dataset.invsort);
    render();
  }));
  document.querySelectorAll('[data-invuid]').forEach(btn=> btn.addEventListener('click', ()=>{
    S.invSelectedItemUid = btn.dataset.invuid;
    S.itemModalUid = btn.dataset.invuid;
    render();
  }));
  document.querySelectorAll('[data-equid]').forEach(btn=> btn.addEventListener('click', ()=>{
    if(btn.dataset.equid){
      S.invSelectedItemUid = btn.dataset.equid;
      S.itemModalUid = btn.dataset.equid;
      render();
    }
  }));
  document.querySelectorAll('[data-unequip]').forEach(btn=> btn.addEventListener('click', ()=> {
    unequipItem(btn.dataset.unequip, selMember.uid);
    S.invSelectedItemUid = null;
  }));
  document.querySelectorAll('[data-equip]').forEach(btn=> btn.addEventListener('click', ()=>{
    const item = S.inventory.find(i=>i.uid===btn.dataset.equip);
    if(item) equipItem(item, selMember.uid);
  }));
  document.querySelectorAll('[data-usepot]').forEach(btn=> btn.addEventListener('click', ()=>{
    const item = S.inventory.find(i=>i.uid===btn.dataset.usepot);
    if(item) usePotionOutOfBattle(item, selMember.uid);
  }));
  document.querySelectorAll('[data-deposit]').forEach(btn=> btn.addEventListener('click', ()=>{
    depositToWarehouse(btn.dataset.deposit);
    S.invSelectedItemUid = null;
    render();
  }));
  document.querySelectorAll('[data-withdraw]').forEach(btn=> btn.addEventListener('click', (e)=>{
    e.preventDefault(); e.stopPropagation();
    withdrawFromWarehouse(btn.dataset.withdraw);
    S.invSelectedItemUid = null;
    S.itemModalUid = null;
    render();
  }));
  const allOut = document.getElementById('ware-withdraw-all');
  if(allOut) allOut.addEventListener('click', ()=>{
    withdrawAllFromWarehouse();
    render();
  });
  const prevP = document.getElementById('ware-page-prev');
  const nextP = document.getElementById('ware-page-next');
  if(prevP) prevP.addEventListener('click', ()=>{
    S.warePage = Math.max(0, (S.warePage||0) - 1);
    S.invSelectedItemUid = null;
    render();
  });
  if(nextP) nextP.addEventListener('click', ()=>{
    const total = Math.max(1, Math.ceil(((S.warehouse||[]).length || 1) / WAREHOUSE_PAGE_SIZE));
    S.warePage = Math.min(total - 1, (S.warePage||0) + 1);
    S.invSelectedItemUid = null;
    render();
  });
  const closeModal = ()=>{ S.itemModalUid = null; render(); };
  const c1 = document.getElementById('item-modal-close');
  const c2 = document.getElementById('item-modal-close-2');
  if(c1) c1.addEventListener('click', closeModal);
  if(c2) c2.addEventListener('click', closeModal);
  const mask = document.getElementById('item-modal-mask');
  if(mask) mask.addEventListener('click', (e)=>{ if(e.target===mask) closeModal(); });

  // 倉庫頁 icon（僅當前頁）
  if(S.invFilter==='warehouse'){
    const page = S.warePage||0;
    const start = page * WAREHOUSE_PAGE_SIZE;
    const pageItems = (S.warehouse||[]).slice(start, start + WAREHOUSE_PAGE_SIZE);
    pageItems.forEach((item,i)=>{
      if(!item || item.slot==='potion') return;
      const el = document.getElementById('wh-'+i);
      if(el){
        drawEquipIcon(el, item.seed, item.slot, item.rarityHex);
      }
    });
  }
  const back = document.getElementById('back-hub2');
  if(back) back.addEventListener('click', ()=>{ routeHome(); render(); });
}

/* ============ 商店系統 ============ */
const SHOP_SIZE = 12;
const SHOP_REROLL_COST = 25;
function potionPrice(kind){ return kind==='mp' ? 25 : 30; }
function generateShopStock(){
  const lvl = avgPartyLevel();
  const stock = [];
  for(let i=0;i<SHOP_SIZE;i++){
    if(Math.random() < 0.35){
      const kind = Math.random()<0.5 ? 'hp' : 'mp';
      const item = {
        uid:'pot_shop_'+Math.floor(Math.random()*1e9), slot:'potion', kind,
        name: kind==='mp' ? '魔力藥水' : '治療藥水', value: kind==='mp' ? 40 : 60
      };
      stock.push({item, price: potionPrice(kind), sold:false});
    } else {
      const item = rollEquip(Math.random, null, lvl);
      stock.push({item, price: equipPrice(item), sold:false});
    }
  }
  S.shopStock = stock;
}
function renderShop(){
  if(!S.shopStock) generateShopStock();
  if(S.shopStock && S.shopStock.length < SHOP_SIZE){
    const lvl = typeof avgPartyLevel==='function' ? avgPartyLevel() : (S.hero?S.hero.level:1);
    while(S.shopStock.length < SHOP_SIZE){
      if(Math.random() < 0.35){
        const kind = Math.random()<0.5 ? 'hp' : 'mp';
        S.shopStock.push({item:{uid:'pot_shop_'+Math.floor(Math.random()*1e9),slot:'potion',kind,name:kind==='mp'?'魔力藥水':'治療藥水',value:kind==='mp'?40:60}, price:potionPrice(kind), sold:false});
      } else {
        const item = rollEquip(Math.random, null, lvl);
        S.shopStock.push({item, price:equipPrice(item), sold:false});
      }
    }
  }
  const hero = S.hero;
  const tab = S.shopTab || 'buy';
  let body = '';
  if(tab==='buy'){
    const cards = S.shopStock.map((entry,i)=>{
      const it = entry.item;
      const isPotion = it.slot==='potion';
      if(entry.sold){
        return `<div class="shop-card sold"><div class="shop-name">${esc(it.name)}</div><div class="meta">已售出</div></div>`;
      }
      const canAfford = hero.gold >= entry.price;
      if(isPotion){
        const icon = it.kind==='mp' ? '💧' : '🧪';
        return `<div class="shop-card">
          <div class="shop-icon">${icon}</div>
          <div class="shop-name">${esc(it.name)}</div>
          <div class="meta">+${it.value} ${it.kind==='mp'?'MP':'HP'}</div>
          <button class="btn btn-compact ${canAfford?'gold':''}" data-buy="${i}" ${canAfford?'':'disabled'}>💰${entry.price}</button>
        </div>`;
      }
      const label = typeof slotLabelOf==='function' ? slotLabelOf(it.slot) : (it.slot||'');
      const stats = typeof equipAffixText==='function' ? equipAffixText(it) : '';
      return `<div class="shop-card">
        <canvas class="sprite" id="shop-${i}" width="36" height="36"></canvas>
        <div class="shop-name rarity-${it.rarity}">${esc(it.name)}</div>
        <div class="meta">${esc(label)} · Lv.${it.itemLevel||1}</div>
        <div class="shop-stats">${esc(stats)}</div>
        <button class="btn btn-compact ${canAfford?'gold':''}" data-buy="${i}" ${canAfford?'':'disabled'}>💰${entry.price}</button>
      </div>`;
    }).join('');
    body = `<div class="shop-grid">${cards}</div>`;
  } else {
    const equipItems = S.inventory.filter(x=>x.slot!=='potion');
    const cards = equipItems.map(it=>{
      const label = typeof slotLabelOf==='function' ? slotLabelOf(it.slot) : '';
      const sellPrice = Math.round(equipPrice(it)*0.4);
      const stats = typeof equipAffixText==='function' ? equipAffixText(it) : '';
      return `<div class="shop-card">
        <div class="shop-name rarity-${it.rarity}">${esc(it.name)}</div>
        <div class="meta">${esc(label)}${it.locked?' · 🔒':''}</div>
        <div class="shop-stats">${esc(stats)}</div>
        <button class="btn btn-compact danger" data-sell="${it.uid}" ${it.locked?'disabled':''}>${it.locked?'鎖定中':'賣 💰'+sellPrice}</button>
      </div>`;

    <div class="segmented">
      <button class="btn ${tab==='buy'?'active':''}" data-tab="buy">🛒 購買</button>
      <button class="btn ${tab==='sell'?'active':''}" data-tab="sell">💸 販賣</button>
    </div>
    ${body}
    <hr class="divider">
    <div class="action-row" style="justify-content:center;">
      <button class="btn ${rerollAfford?'':'danger'}" id="shop-reroll-btn" ${rerollAfford?'':'disabled'}>🔄 刷新貨架（${SHOP_REROLL_COST}）${hasPrecious?' ⚠':''}</button>
      <button class="btn" id="back-hub4">返回營地</button>
    </div>
    ${hasPrecious?'<p class="small" style="text-align:center;color:var(--gold);margin-top:6px;">貨架上有千古／唯一，刷新前會再確認。</p>':''}
  </div>`;

function bindShop(){
  const tab = S.shopTab || 'buy';
  if(tab==='buy'){
    S.shopStock.forEach((entry,i)=>{ if(!entry.sold && entry.item.slot!=='potion') queueEquipIcon('shop-'+i, entry.item.seed, entry.item.slot, entry.item.rarityHex); });
  }
  document.querySelectorAll('[data-tab]').forEach(btn=> btn.addEventListener('click', ()=>{
    S.shopTab = btn.dataset.tab;
    render();
  }));
  document.querySelectorAll('[data-buy]').forEach(btn=> btn.addEventListener('click', ()=>{
    const idx = parseInt(btn.dataset.buy);
    const entry = S.shopStock[idx];
    if(!entry || entry.sold) return;
    if(S.hero.gold < entry.price) return;
    if(entry.item.slot==='potion'){
      S.hero.gold -= entry.price;
      addPotion(entry.item.kind, entry.item.value, entry.item.name);
      entry.sold = true;
      S.log.unshift('花費 '+entry.price+' 金幣，從商店購入了 '+entry.item.name+'。');
    } else {
      if(!addToInventory(entry.item)){
        S.log.unshift('無法購入：'+entry.item.name+'（唯一裝備已擁有）。');
        render();
        return;
      }
      S.hero.gold -= entry.price;
      entry.sold = true;
      S.log.unshift('花費 '+entry.price+' 金幣，從商店購入了 '+entry.item.name+'。');
    }
    render();
  }));
  document.querySelectorAll('[data-sell]').forEach(btn=> btn.addEventListener('click', ()=>{
    const item = S.inventory.find(i=>i.uid===btn.dataset.sell);
    if(!item) return;
    if(item.locked){ S.log.unshift('無法賣出：'+item.name+' 已鎖定。'); render(); return; }
    const sellPrice = Math.round(equipPrice(item)*0.4);
    S.inventory = S.inventory.filter(i=>i.uid!==item.uid);
    S.hero.gold += sellPrice;
    S.log.unshift('賣出了 '+item.name+'，獲得 '+sellPrice+' 金幣。');
    render();
  }));
  const rerollBtn = document.getElementById('shop-reroll-btn') || document.getElementById('reroll-btn');
  if(rerollBtn) rerollBtn.addEventListener('click', ()=>{
    if(S.hero.gold < SHOP_REROLL_COST) return;
    const precious = (S.shopStock||[]).filter(e=>!e.sold && e.item && (e.item.rarity==='ancient'||e.item.rarity==='unique'));
    if(precious.length){
      const names = precious.map(e=>e.item.name).slice(0,5).join('、');
      const ok = confirm('貨架上還有千古／唯一裝備：\n'+names+(precious.length>5?'…':'')+'\n\n確定要刷新嗎？刷新後這些商品會消失。');
      if(!ok) return;
    }
    S.hero.gold -= SHOP_REROLL_COST;
    generateShopStock();
    S.log.unshift('花費 '+SHOP_REROLL_COST+' 金幣，更新了商店的商品。');
    render();
  });
  const sellAllBtn = document.getElementById('sell-all-btn');
  if(sellAllBtn) sellAllBtn.addEventListener('click', ()=>{
    const items = S.inventory.filter(i=>i.slot!=='potion' && !i.locked);
    if(items.length===0){ S.log.unshift('沒有可賣出的裝備（鎖定中的不會被賣）。'); render(); return; }
    let total = 0;
    const ids = new Set(items.map(it=>it.uid));
    items.forEach(it=> total += Math.round(equipPrice(it)*0.4));
    S.inventory = S.inventory.filter(i=>i.slot==='potion' || i.locked || !ids.has(i.uid));
    S.hero.gold += total;
    S.log.unshift('一鍵賣出了 '+items.length+' 件裝備，獲得 '+total+' 金幣。');
    render();
  });
  const back = document.getElementById('back-hub4');
  if(back) back.addEventListener('click', ()=>{ routeHome(); render(); });
}

/* ============ 酒館招募系統 ============ */
const TAVERN_SIZE = 8;
const TAVERN_REROLL_COST = 15;
const COMPLICITY_MAX = 100;
const COMPLICITY_GAIN_BATTLE = 9;
const COMPLICITY_GAIN_EXPLORE = 3;
const JOB_BIAS_STEP = 0.10; // 每次對話 +10% 傾向
function recruitCost(){
  return Math.round(40 + avgPartyLevel()*3);
}
function generateTavernStock(){
  const stock = [];
  for(let i=0;i<TAVERN_SIZE;i++){
    stock.push({npc: makeRandomAlly(), price: recruitCost(), recruited:false});
  }
  S.tavernStock = stock;
}
function renderTavern(){
  if(!S.tavernStock) generateTavernStock();
  // 若舊存檔是 4 人，補到 8
  if(S.tavernStock.length < TAVERN_SIZE){
    while(S.tavernStock.length < TAVERN_SIZE){
      S.tavernStock.push({npc: makeRandomAlly(), price: recruitCost(), recruited:false});
    }
  }
  const hero = S.hero;
  const full = S.party.length>=4;
  const cards = S.tavernStock.map((entry,i)=>{
    const npc = entry.npc;
    const tend = typeof jobTendencyLabel==='function' ? jobTendencyLabel(npc) : '';
    if(entry.recruited){

        <canvas class="sprite" id="tavern-${i}" width="36" height="36"></canvas>
        <div class="tavern-name">${esc(npc.name)}</div>

    const disabled = full || !canAfford;
    return `<div class="tavern-card">
      <canvas class="sprite" id="tavern-${i}" width="36" height="36"></canvas>
      <div class="tavern-name">${esc(npc.name)}</div>
      <div class="meta">Lv.${npc.level}</div>
      <div class="tavern-tend" title="建議職業">${esc(tend)}</div>
      <button class="btn btn-compact ${disabled?'':'gold'}" data-recruit="${i}" ${disabled?'disabled':''}>💰${entry.price}</button>
    </div>`;
  }).join('');
  const rerollAfford = hero.gold >= TAVERN_REROLL_COST;
  return `
  <div class="panel">
    <div class="topbar">
      <span class="pixel-font" style="font-size:11px;color:var(--gold);">💰 ${hero.gold} 金幣</span>
      <span class="small">隊伍 ${S.party.length}/4 人</span>

      <button class="btn ${rerollAfford?'':'danger'}" id="tavern-reroll-btn" ${rerollAfford?'':'disabled'}>🔄 更換旅人（${TAVERN_REROLL_COST} 金幣）</button>
      <button class="btn" id="back-hub5">返回營地</button>
    </div>
  </div>`;
}
function bindTavern(){
  S.tavernStock.forEach((entry,i)=>{ queueSprite('tavern-'+i, (entry.npc.name||'npc')+'_'+entry.npc.uid, memberPalette(entry.npc), 11, {kind:'human'}); });
  document.querySelectorAll('[data-recruit]').forEach(btn=> btn.addEventListener('click', ()=>{
    const idx = parseInt(btn.dataset.recruit);

function bindAllyTalk(){
  const hero=S.hero;
  const ally=S.party.find(m=>m.uid===S.talkTargetUid);
  if(!ally) return;
  queueSprite('talk-hero', (hero.name||'hero')+'_'+hero.uid+'_back', memberPalette(hero), 16, {kind:'human'});
  queueSprite('talk-ally', (ally.name||'ally')+'_'+ally.uid, memberPalette(ally), 16, {kind:'human'});
  const finishPick=(jobId)=>{
    if(!ally.jobBias) ally.jobBias={};
    ally.jobBias[jobId]=num(ally.jobBias[jobId],0)+JOB_BIAS_STEP;
    ally.complicity=0;
    const jn=classNameById(jobId);
    const pct=Math.round(num(ally.jobBias[jobId],0)*100);
    S.log.unshift(ally.name+' 往「'+jn+'」走的決心更堅定了一些。（傾向 +10%，目前 +'+pct+'%）');
    // 對話回覆
    const box=document.getElementById('talk-dialog-box');
    if(box){
      box.innerHTML=`
        <div class="line"><span class="speaker">${esc(hero.name)}：</span>嗨，${esc(ally.name)}，我知道你的力量在最近又增強了許多，如果可能，也許你進化成「${esc(jn)}」會在殺掉謊言之人時更有幫助。</div>
        <div class="line"><span class="speaker">${esc(ally.name)}：</span>這樣啊，我會把你的建議納入考量的。</div>
        <div class="line" style="color:var(--gold);">夥伴往「${esc(jn)}」走的決心更堅定了一些。（轉職傾向 +10%）</div>`;
    }
    document.querySelectorAll('[data-job-pick]').forEach(b=>b.remove());
    const cancel=document.getElementById('talk-cancel');
    if(cancel){ cancel.textContent='返回隊伍'; cancel.onclick=()=>{ S.screen='party'; S.talkTargetUid=null; S.talkChoices=null; render(); }; }
  };
  document.querySelectorAll('[data-job-pick]').forEach(btn=>{
    btn.addEventListener('click', ()=> finishPick(btn.dataset.jobPick));
  });
  const cancel=document.getElementById('talk-cancel');
  if(cancel) cancel.addEventListener('click', ()=>{
    S.screen='party'; S.talkTargetUid=null; S.talkChoices=null; render();
  });
}


function bindParty(){
  S.party.forEach((m,i)=> queueSprite('pty-'+i, (m.name||'hero')+'_'+m.uid, memberPalette(m), 14, {kind:'human'}));
  document.querySelectorAll('[data-talk]').forEach(btn=> btn.addEventListener('click', ()=>{
    const uid=btn.dataset.talk;
    const ally=S.party.find(m=>m.uid===uid);
    if(!ally || num(ally.complicity,0)<COMPLICITY_MAX) return;
    S.talkTargetUid=uid;
    S.talkChoices=suggestJobPair(ally, Math.random);
    S.screen='ally-talk';
    render();
  }));
  document.querySelectorAll('[data-dismiss]').forEach(btn=> btn.addEventListener('click', ()=>{
    S.party = S.party.filter(m=>m.uid!==btn.dataset.dismiss);
    render();
  }));
  const back = document.getElementById('back-hub3');
  if(back) back.addEventListener('click', ()=>{ routeHome(); render(); });
  const restartBtn = document.getElementById('restart-game-btn');
  if(restartBtn) restartBtn.addEventListener('click', restartGame);
  const manSave = document.getElementById('manual-save-btn');
  if(manSave) manSave.addEventListener('click', ()=>{ saveGame(true); render(); });
  const expBtn = document.getElementById('export-save-btn');
  if(expBtn) expBtn.addEventListener('click', ()=>{ exportSave(); render(); });
  const impBtn = document.getElementById('import-save-btn');
  const impFile = document.getElementById('import-save-file');
  if(impBtn && impFile){
    impBtn.addEventListener('click', ()=> impFile.click());
    impFile.addEventListener('change', ()=>{
      const f = impFile.files && impFile.files[0];
      if(!f) return;
      const reader = new FileReader();
      reader.onload = ()=> importSaveFromText(String(reader.result||''));
      reader.readAsText(f);
      impFile.value = '';
    });
  }
}

function bonusSummary(b){
  const parts=[];
  if(b.hp) parts.push('HP'+(b.hp>0?'+':'')+b.hp);
  if(b.mp) parts.push('MP'+(b.mp>0?'+':'')+b.mp);
  if(b.atk) parts.push('ATK'+(b.atk>0?'+':'')+b.atk);
  if(b.def) parts.push('DEF'+(b.def>0?'+':'')+b.def);
  if(b.spd) parts.push('SPD'+(b.spd>0?'+':'')+b.spd);
  return parts.join(' · ');
}

    <p class="event-text">身為 ${esc(prof.name)} 的 ${esc(hero.name)}，已經達到正式踏上冒險職業的等級！請從以下道路中選擇一個，永久決定你的戰鬥風格與專屬被動能力。</p>
    <div class="grid class-grid">${cards}</div>
  </div>`;
}
function bindEvolveClass(){
  const hero = S.hero;
  const prof = PROFESSIONS.find(p=>p.id===hero.professionId);
  if(!prof || !prof.leadsTo) return;
  const opts = CLASSES.filter(c=>prof.leadsTo.includes(c.id));
  opts.forEach((c,i)=> queueSprite('clschoice-'+i, 'class_'+c.id+'_face', c.palette, 14, {kind:'human'}));
  document.querySelectorAll('[data-cls]').forEach(card=>{
    card.addEventListener('click', ()=>{
      setClass(hero, card.dataset.cls);
      S.log.unshift(esc(hero.name)+' 覺醒為 ['+displayClassName(hero)+']！');
      S.pendingStage = null;
      evaluateEvolution(hero);
      routeHome();
      render();
    });
  });
}

/* --- 第3階：職業分支選擇（3選1） --- */

    <div class="class-card" data-adv="${adv.id}">

  </div>`;
}

/* --- 第4階：精通覺醒（Lv.30） --- */
function renderEvolveMaster(){
  const hero = S.hero;

  if(!cls || !cls.masteries || !cls.masteries.length){
    setTimeout(()=>{ S.pendingStage=null; S.screen='hub'; render(); }, 0);
    return `<div class="panel"><p class="event-text">精通資料異常，正在返回營地…</p></div>`;

      <p>${esc(ms.desc)}</p>
      <div class="small" style="color:var(--gold);margin-top:4px;">${esc(bonusSummary(ms.statBonus||{}))}</div>
      <hr class="divider">
      <div class="small"><b style="color:var(--text)">傳奇技能：${esc(ms.skill.name)}</b><br>${esc(ms.skill.desc)}</div>

    <p class="event-text">${esc(hero.name)} 已達第4次轉職門檻！請從 ${esc(cls.name)} 的傳奇職階中選擇一條新道路，獲得專屬傳奇技能與成長。</p>
    <div class="grid class-grid">${cards}</div>
  </div>`;
}
function bindEvolveMaster(){
  const hero = S.hero;
  const cls = CLASSES.find(c=>c.id===hero.classId);
  if(!cls || !cls.masteries) return;
  cls.masteries.forEach((ms,i)=> queueSprite('master-'+i, 'master_'+ms.id+'_face', cls.palette, 14, {kind:'human'}));
  document.querySelectorAll('[data-master]').forEach(card=>{
    card.addEventListener('click', ()=>{
      setMastery(hero, card.dataset.master);
      const ms = getMasteryDef(hero);
      S.log.unshift(esc(hero.name)+' 傳奇轉職為 ['+displayClassName(hero)+']！'+(ms&&ms.skill?'習得「'+ms.skill.name+'」。':''));
