function pickAncientResonance(rng, role, slot){
  rng = rng || Math.random;
  role = role || 'warrior';
  // 依角色權重過濾；若無命中則退回全池
  let pool = ANCIENT_RESONANCES.filter(r=> (r.roles||[]).includes(role));
  if(!pool.length) pool = ANCIENT_RESONANCES.slice();
  // 防具略偏防禦向、武器略偏輸出向（權重微調）
  const weighted = pool.map(r=>{
    let w = r.w || 5;
    if(slot==='armor' && (r.effect&& (r.effect.type==='dmgReduce'||r.effect.type==='thorns') || r.id==='ironwall'||r.id==='titanbone')) w *= 1.4;
    if(slot==='weapon' && (r.effect&& (r.effect.type==='lifesteal'||r.effect.type==='pierceBonus'||r.effect.type==='burnBonus'))) w *= 1.3;
    if(slot==='accessory' && (r.id==='eternity'||r.id==='harmony'||r.id==='manaspring')) w *= 1.25;
    return {item:r, w};
  });
  return weightedChoice(rng, weighted);
}

/** 把共鳴寫進 affixes + item.resonance（戰鬥用） */
function applyAncientResonance(item, rng, rarity, itemLevel){
  if(!item) return item;
  rng = rng || Math.random;
  const res = pickAncientResonance(rng, item.role, item.slot);
  if(!res) return item;
  const lvlFactor = 1 + Math.max(0, (itemLevel||1)-1) * 0.05;
  // 扁平數值：吃千古倍率，略高於普通附加
  (res.flats||[]).forEach((f, idx)=>{
    const baseV = f.v;
    const value = Math.max(1, Math.round(baseV * (rarity?.mult||5.2) * 0.55 * lvlFactor * (0.92 + rng()*0.16)));
    item.affixes = item.affixes || [];
    item.affixes.push({
      stat: f.stat,
      value,
      label: idx===0 ? ('千古共鳴·'+res.name) : ('共鳴·'+res.name)
    });
  });
  item.resonance = {
    id: res.id,
    name: res.name,
    desc: res.desc,
    type: res.effect ? res.effect.type : null,
    v: res.effect ? res.effect.v : 0
  };
  return item;
}

function resonanceDesc(item){
  if(!item || !item.resonance) return '';
  const r = item.resonance;
  return r.name ? (r.name+'：'+(r.desc||'')) : '';
}

/** 唯一 + 千古共鳴 的特殊效果加總 */
function sumEquipSpecial(member, type){
  let s = 0;
  if(typeof sumUniqueEffect === 'function') s += sumUniqueEffect(member, type);
  if(!member || !member.equip) return s;
  Object.values(member.equip).forEach(eq=>{
    if(eq && eq.resonance && eq.resonance.type===type) s += num(eq.resonance.v, 0);
  });
  return s;
}

function avgPartyLevel(s){
  s = s || S;
  if(!s || !s.party || !s.party.length) return 1;
  const sum = s.party.reduce((a,m)=> a + num(m.level, 1), 0);
  const avg = Math.round(sum / s.party.length);
  return clamp(avg, 1, MAX_PLAYER_LEVEL);
}

/** 法杖／法器／書／球 等 → 主屬應為魔攻 */
function isMagicWeaponName(name){
  if(!name) return false;
  const n = String(name);
  return /法杖|權杖|魔杖|法球|法器|魔導|聖典|法典|魔導書|法書|奧術|水晶球|星隕|法袍|巫袍/.test(n);
}

/** 主詞條可否為 matk：法器武器，或法師／治療向裝備（含頭／披風／飾品等） */
function canMainBeMatk(item){
  if(!item) return false;
  const nm = item.baseName || item.name || '';
  if(item.slot==='weapon') return isMagicWeaponName(nm);
  // 胸甲主屬仍應為防（即使 role=mage）
  if(item.slot==='armor') return false;
  // 法師／治療向的頭、披風、手、鞋、飾品、副手可主魔攻
  if(item.role==='mage' || item.role==='healer'){
    return item.stat==='matk' || item.stat==='int' || isMagicWeaponName(nm);
  }
  return false;
}

/** 依槽位／角色推一個合理的主詞條（當錯誤 matk 被擋下時用） */
function fallbackMainStat(item){
  if(!item) return 'atk';
  if(item.slot==='armor') return 'def';
  if(item.slot==='accessory'){
    if(item.role==='tank') return 'con';
    if(item.role==='mage' || item.role==='healer') return 'int';
    if(item.role==='archer' || item.role==='rogue') return 'agi';
    return 'str';
  }
  // weapon
  if(item.role==='mage' || item.role==='healer'){
    return isMagicWeaponName(item.baseName||item.name||'') ? 'matk' : 'atk';
  }
  return 'atk';
}

/** 法器主屬強制魔攻；非法器若主屬誤為 matk 則改回合理物攻／防／屬性 */
function forceMagicMainStat(item){
  if(!item || item.slot==='potion') return item;
  const nm = item.baseName || item.name || '';
  const main = (item.affixes && item.affixes.length)
    ? (item.affixes.find(a=>a.label==='主屬性') || item.affixes[0])
    : null;

  // 1) 法器武器 → 主屬必須 matk
  if(item.slot==='weapon' && isMagicWeaponName(nm)){
    if(item.stat==='atk') item.stat = 'matk';
    if(main && main.stat==='atk') main.stat = 'matk';
    return item;
  }

  // 2) 非合法魔攻主詞條 → 改掉（坦克甲、物攻武器等不可主魔攻）
  const mainStatNow = main ? main.stat : item.stat;
  if(mainStatNow==='matk' && !canMainBeMatk(item)){
    const fb = fallbackMainStat(item);
    item.stat = fb;
    if(main) main.stat = fb;
  }
  return item;
}
function itemStatSum(item, st){
  if(!item) return 0;
  if(item.affixes && item.affixes.length)
    return item.affixes.filter(a=>a.stat===st).reduce((s,a)=>s+(num(a.value,0)),0);
  let v=0;
  if(item.stat===st) v+=num(item.value,0);
  if(item.extraStat===st) v+=num(item.extraValue,0);
  return v;
}
function itemPowerScore(item){
  if(!item || item.slot==='potion') return 0;
  const weights = {atk:1.2,matk:1.2,def:1.0,spd:0.9,hp:0.08,mp:0.06,str:1.1,con:1.0,agi:1.0,int:1.1};
  let s = 0;
  Object.keys(weights).forEach(st=>{ s += itemStatSum(item, st) * weights[st]; });
  s += (item.itemLevel||1) * 0.5;
  if(item.rarity==='unique' || item.isUnique) s += 45;
  return s;
}
/** 全隊（含背包）是否已有同名唯一 */
/** 全隊裝備欄是否已有同名唯一（倉庫／背包可收藏，但不能再穿第二件） */
function uniqueAlreadyEquipped(item, ignoreUid){
  if(!item || !(item.isUnique || item.rarity==='unique')) return false;
  const st = (typeof S!=='undefined' && S) ? S : (typeof globalThis!=='undefined' ? globalThis.S : null);
  if(!st) return false;
  const key = item.baseName || item.name;
  const match = (eq)=> eq && (eq.isUnique || eq.rarity==='unique') && (eq.baseName===key || eq.name===item.name || eq.name===key);
  for(const p of (st.party||[])){
    if(!p || !p.equip) continue;
    for(const eq of Object.values(p.equip)){
      if(match(eq) && eq.uid!==ignoreUid) return true;
    }
  }
  return false;
}
function uniqueAlreadyHeld(item, ignoreUid){
  return uniqueAlreadyEquipped(item, ignoreUid);
}

function rarityById(id){
  if(RARITY_LEGACY_MAP[id]) id = RARITY_LEGACY_MAP[id];
  return RARITIES.find(r=>r.id===id) || RARITIES[1];
}

function scaleAffixValue(baseV, rarity, itemLevel, rng){
  const lvlFactor = 1 + Math.max(0, (itemLevel||1)-1) * 0.05;
  const variance = 1 + ((rng() * 2 - 1) * (rarity.variance||0.1));
  return Math.max(1, Math.round(baseV * rarity.mult * lvlFactor * variance));
}

function pickRoleAffixes(rng, role, count, rarity, itemLevel, usedStats){
  // 附加詞條：以角色池為主，約 25% 抽通用池（可出現魔攻等異屬）——僅附加，不影響主詞條
  const pool = (ROLE_AFFIX_POOL[role] || GENERIC_AFFIX_POOL).slice();
  const gen = GENERIC_AFFIX_POOL.slice();
  const result = [];
  usedStats = usedStats || new Set();
  for(let i=0;i<count;i++){
    let src;
    if(pool.length && rng() >= 0.25) src = pool;
    else if(gen.length) src = gen;
    else src = pool.length ? pool : GENERIC_AFFIX_POOL.slice();
    if(!src.length) src = GENERIC_AFFIX_POOL.slice();
    const idx = Math.floor(rng()*src.length);
    const template = src.splice(idx,1)[0] || choice(rng, GENERIC_AFFIX_POOL);
    result.push({
      stat: template.stat,
      value: scaleAffixValue(template.v, rarity, itemLevel, rng),
      label: template.label
    });
  }
  return result;
}

function rollEquip(rng, minRarity, itemLevel){
  itemLevel = itemLevel || 1;
  rng = rng || Math.random;

  // 極低機率掉唯一
  if(rng() < 0.006 && (!minRarity || RARITIES.findIndex(r=>r.id===(RARITY_LEGACY_MAP[minRarity]||minRarity)) <= 11)){
    return rollUniqueEquip(rng, itemLevel);
  }

  // 欄位權重：武器/胸甲常見，新欄位較少
  const slot = weightedChoice(rng, [
    {item:'weapon',w:28},{item:'armor',w:22},{item:'accessory',w:14},
    {item:'offhand',w:10},{item:'head',w:9},{item:'cape',w:6},{item:'hands',w:6},{item:'feet',w:5}
  ]);
  const basePool = EQUIP_BASES[slot] || EQUIP_BASES.weapon;
  const base = choice(rng, basePool);
  const minId = minRarity ? (RARITY_LEGACY_MAP[minRarity]||minRarity) : null;
  const minIdx = minId ? RARITIES.findIndex(r=>r.id===minId) : -1;
  const pool = RARITIES.filter((r,i)=> i>=Math.max(0,minIdx) && r.id!=='unique');
  const rarity = weightedChoice(rng, pool.map(r=>({item:r, w:r.w})));
  const lvlFactor = 1 + Math.max(0, itemLevel-1) * 0.05;
  const variance = 1 + ((rng()*2-1) * rarity.variance);
  // 主詞條：法器→matk；防具→def；其餘用基底。附加詞條可跨屬（含魔攻）
  let mainStat = base.stat;
  if(slot==='armor') mainStat = 'def';
  else if(slot==='weapon' && isMagicWeaponName(base.n)) mainStat = 'matk';
  // 安全網：非魔攻合法件若基底誤標 matk，改回
  if(mainStat==='matk'){
    const tmp = {slot, baseName: base.n, name: base.n, role: base.role, stat: mainStat};
    if(!canMainBeMatk(tmp)) mainStat = (slot==='armor' ? 'def' : 'atk');
  }
  let mainValue = Math.max(1, Math.round(base.v * rarity.mult * lvlFactor * variance));

  const affixes = [{stat: mainStat, value: mainValue, label: '主屬性'}];
  if(rarity.affixCount > 0){
    // 附加詞條：主池仍依角色；法器偏向法師池。附加允許出現異屬（含魔攻）
    const affRole = (slot==='weapon' && isMagicWeaponName(base.n)) ? 'mage' : base.role;
    const extras = pickRoleAffixes(rng, affRole, rarity.affixCount, rarity, itemLevel, new Set([mainStat]));
    affixes.push(...extras);
  }

  // 千古：主屬再強化；共鳴在物件組好後套用（具名詞條 + 可選戰鬥效果）
  if(rarity.id === 'ancient'){
    const boost = Math.max(1, Math.round(mainValue * 0.12));
    mainValue += boost;
    affixes[0].value = mainValue;
  }

  const item = {
    uid: 'eq_'+Math.floor(rng()*1e9),
    slot,
    name: rarity.name + base.n,
    baseName: base.n,
    material: base.mat,
    role: base.role,
    stat: mainStat,
    value: mainValue,
    affixes,
    // 相容舊欄位
    extraStat: affixes[1] ? affixes[1].stat : null,
    extraValue: affixes[1] ? affixes[1].value : 0,
    rarity: rarity.id,
    rarityName: rarity.name,
    rarityHex: rarity.hex,
    itemLevel,
    locked: false,
    seed: base.n + rarity.id + Math.floor(rng()*999)
  };
  if(rarity.id === 'ancient') applyAncientResonance(item, rng, rarity, itemLevel);
  return item;
}

function rollUniqueEquip(rng, itemLevel){
  const template = choice(rng, UNIQUE_ITEMS);
  const rarity = RARITIES.find(r=>r.id==='unique');
  // 唯一數值檔：等級係數略優於千古、主屬與專屬詞條再乘一檔
  const lvlFactor = 1 + Math.max(0, (itemLevel||1)-1) * 0.055;
  let mainStat = template.stat;
  // 唯一裝也套用主詞條規則：非法器不可主魔攻
  const probe = {slot: template.slot, baseName: template.n, name: template.n, role: template.role, stat: mainStat};
  if(mainStat==='matk' && !canMainBeMatk(probe)){
    mainStat = template.slot==='armor' ? 'def' : (template.slot==='accessory' ? fallbackMainStat(probe) : 'atk');
  }
  if(template.slot==='weapon' && isMagicWeaponName(template.n)) mainStat = 'matk';
  if(template.slot==='armor') mainStat = 'def';
  const UNIQUE_MAIN_BONUS = 1.20;   // 主屬比純倍率再高一檔
  const UNIQUE_AFFIX_BONUS = 1.30;  // 專屬四詞條再高一檔
  const mainValue = Math.max(1, Math.round(template.v * rarity.mult * lvlFactor * UNIQUE_MAIN_BONUS));
  const affixes = [{stat: mainStat, value: mainValue, label: '主屬性'}];
  template.aff.forEach(a=>{
    affixes.push({
      stat: a.stat,
      value: Math.max(1, Math.round(a.v * (1.05 + rng()*0.15) * lvlFactor * UNIQUE_AFFIX_BONUS)),
      label: a.label
    });
  });
  // 唯一以 baseName 判斷持有；uid 仍唯一避免 DOM/filter 衝突
  return {
    uid: 'unique_'+template.n+'_'+Math.floor(rng()*1e6),
    slot: template.slot,
    name: '【唯一】'+template.n,
    baseName: template.n,
    material: template.mat,
    role: template.role,
    stat: mainStat,
    value: mainValue,
    affixes,
    extraStat: affixes[1]?affixes[1].stat:null,
    extraValue: affixes[1]?affixes[1].value:0,
    rarity: 'unique',
    rarityName: '唯一',
    rarityHex: rarity.hex,
    itemLevel: itemLevel||1,
    isUnique: true,
    locked: false,
    effect: getUniqueEffect({baseName:template.n, role:template.role, isUnique:true, rarity:'unique'}),
    uniqueSkill: getUniqueSkill({baseName:template.n, role:template.role, isUnique:true, rarity:'unique'}),
    seed: 'unique_'+template.n
  };
}

function equipPrice(item){
  if(!item) return 0;
  const r = rarityById(item.rarity);
  const affixSum = (item.affixes||[]).reduce((s,a)=>s+(a.value||0),0);
  const base = item.value || 0;
  return Math.max(8, Math.round((base*8 + affixSum*6) * (r.mult||1) + (item.itemLevel||1)*3));
}

/** 把舊裝備資料升級成新 affixes 格式；修正法器主屬、唯一旗標 */
function normalizeItem(item){
  if(!item || item.slot==='potion') return item;
  const isLegacy = !item.affixes || !item.affixes.length;
  if(isLegacy && RARITY_LEGACY_MAP[item.rarity]){
    item.rarity = RARITY_LEGACY_MAP[item.rarity];
    const r = rarityById(item.rarity);
    item.rarityName = r.name;
    item.rarityHex = r.hex;
  } else if(item.rarity){
    const r = rarityById(item.rarity);
    if(!item.rarityName) item.rarityName = r.name;
    if(!item.rarityHex) item.rarityHex = r.hex;
  }
  if(item.rarity==='unique') item.isUnique = true;
  if(isLegacy){
    item.affixes = [];
    if(item.stat && item.value) item.affixes.push({stat:item.stat, value:item.value, label:'主屬性'});
    if(item.extraStat && item.extraValue) item.affixes.push({stat:item.extraStat, value:item.extraValue, label:'附加'});
  }
  // 法杖類主屬強制魔攻（修正舊存檔／錯誤 roll）
  forceMagicMainStat(item);
  // 保證主屬性與 item.stat/value 同步（equipBonus 以 affixes 為準）
  if(item.affixes && item.affixes.length){
    const main = item.affixes.find(a=>a.label==='主屬性') || item.affixes[0];
    if(main){
      item.stat = main.stat;
      item.value = main.value;
    }
  }
  // 唯一：補齊專屬技能／被動（舊存檔可能沒有）
  if(item.isUnique || item.rarity==='unique'){
    if(!item.baseName && item.name){
      item.baseName = String(item.name).replace(/^【唯一】/, '');
    }
    if(!item.uniqueSkill && typeof getUniqueSkill === 'function'){
      const sk = getUniqueSkill(item);
      if(sk) item.uniqueSkill = sk;
    }
    if(!item.effect && typeof getUniqueEffect === 'function'){
      const eff = getUniqueEffect(item);
      if(eff) item.effect = eff;
    }
  }
  return item;
}

/** 安全加入背包：正規化 + 唯一不重複 + 滿包自動進倉庫 */
function addToInventory(item){
  if(!item) return false;
  if(!S) return false;
  if(!S.inventory) S.inventory = [];
  ensureWarehouse();
  if(item.slot==='potion'){
    addPotion(item.kind, item.value, item.name);
    return true;
  }
  normalizeItem(item);
  if(item.isUnique || item.rarity==='unique'){
    if(uniqueAlreadyEquipped(item, item.uid)){
      if(S.log) S.log.unshift('【唯一】'+(item.baseName||item.name)+' 已擁有，無法再取得。');
      return false;
    }
  }
  // 背包未滿 → 進背包；已滿 → 倉庫／折價
  if(backpackHasSpace(1)){
    S.inventory.push(item);
    return true;
  }
  const fate = overflowDispose(item, false);
  return fate === 'warehouse' || fate === 'sold';
}

function dealTrapDamage(s,dmg){ s.hero.hp=clamp(s.hero.hp-dmg,1,s.hero.maxHp); return '陷阱造成了 '+dmg+' 點傷害！'; }
/** 對存活隊友治療；倒地可選復活（回復量＝治療量×reviveRatio，預設 0.25） */
function applyHealToMember(m, amt, opts){
  opts = opts || {};
  amt = Math.max(0, num(amt, 0));
  if(!m) return {healed:0, revived:false};
  if(m.hp > 0){
    const before = m.hp;
    m.hp = clamp(m.hp + amt, 0, m.maxHp);
    return {healed: m.hp - before, revived:false};
  }
  // 倒地
  if(!opts.canRevive) return {healed:0, revived:false};
  const ratio = opts.reviveRatio != null ? opts.reviveRatio : 0.25;
  const reviveHp = Math.max(1, Math.round(amt * ratio));
  m.hp = clamp(reviveHp, 1, m.maxHp);
  return {healed: m.hp, revived:true};
}
function healParty(s, amt, opts){
  opts = opts || {};
  (s.party||[]).forEach(m=> applyHealToMember(m, amt, opts));
}

// 相容舊程式：合併名單（實際抽選請用 pickNpcNameAndGender）
const NPC_NAMES = NPC_FEMALE_NAMES.concat(NPC_MALE_NAMES);

/* ============ 共犯／轉職傾向／對話 ============ */
const JOB_AFFINITY_POOLS = {
  str: ['warrior','bladesman','dragoon','monk','heavyknight'],
  agi: ['ninja','rogue','archer','bard'],
  con: ['heavyknight','warrior','paladin','monk'],
  int: ['mage','necromancer','summoner','alchemist','shaman','cleric']
};
function primaryAttrKey(m){
  const s=num(m.str,0), c=num(m.con,0), a=num(m.agi,0), i=num(m.int,0);
  const arr=[{k:'str',v:s},{k:'con',v:c},{k:'agi',v:a},{k:'int',v:i}];
  arr.sort((x,y)=>y.v-x.v || x.k.localeCompare(y.k));
  return arr[0].k;
}
function jobTendencyLabel(m){
  let pair = (m && m.seedJobs && m.seedJobs.length>=2) ? m.seedJobs : null;
  if(!pair && typeof suggestJobPair==='function'){
    pair = suggestJobPair(m, Math.random);
    if(m && pair && pair.length>=2) m.seedJobs = pair.slice(0,2);
  }
  if(!pair || !pair.length) return '—';
  return pair.map(id=>classNameById(id)).join('／');
}
/** 依屬性推兩條建議戰鬥職業（可轉職目標） */
function suggestJobPair(m, rng){
  rng = rng || Math.random;
  const k=primaryAttrKey(m);
  let pool=(JOB_AFFINITY_POOLS[k]||JOB_AFFINITY_POOLS.str).slice();
  // 若已有生活職業，優先其 leadsTo
  if(m.professionId){
    const prof=PROFESSIONS.find(p=>p.id===m.professionId);
    if(prof && prof.leadsTo && prof.leadsTo.length){
      const filtered=pool.filter(id=>prof.leadsTo.includes(id));
      if(filtered.length>=2) pool=filtered;
      else if(filtered.length===1){
        const extra=prof.leadsTo.filter(id=>id!==filtered[0]);
        pool=filtered.concat(extra);
      } else {
        pool=prof.leadsTo.slice();
      }
    }
  }
  // 若已有 class，改推三轉分支名稱不在此；仍推 class 層供未轉職前累積
  pool = pool.filter((id,i,arr)=>arr.indexOf(id)===i);
  while(pool.length<2){
    const all=CLASSES.map(c=>c.id);
    const add=all[Math.floor(rng()*all.length)];
    if(!pool.includes(add)) pool.push(add);
  }
  // 物攻向：隨機兩職；其他向也隨機抽 2
  const shuffled=pool.slice().sort(()=>rng()-0.5);
  const a=shuffled[0], b=shuffled[1]===a?shuffled[2]||pool.find(x=>x!==a):shuffled[1];
  return [a,b].filter(Boolean).slice(0,2);
}
function classNameById(id){
  const c=CLASSES.find(x=>x.id===id);
  return c?c.name:id;
}
function gainComplicity(amount, log){
  log = log || S.log;
  amount = Math.max(0, Math.round(num(amount,0)));
  if(amount<=0) return;
  (S.party||[]).forEach(m=>{
    if(!m || m.isHero) return;
    if(m.complicity==null) m.complicity=0;
    if(m.jobBias==null) m.jobBias={};
    const before=num(m.complicity,0);
    m.complicity=Math.min(COMPLICITY_MAX, before+amount);
    if(before<COMPLICITY_MAX && m.complicity>=COMPLICITY_MAX && log){
      log.unshift(m.name+' 的「共犯」情誼已滿，可以到隊伍中與他對話了。');
    }
  });
}
function weightedClassChoice(opts, biasMap, rng){
  rng=rng||Math.random;
  biasMap=biasMap||{};
  if(!opts||!opts.length) return null;
  const weights=opts.map(c=>{
    const id=typeof c==='string'?c:c.id;
    return 1 + num(biasMap[id],0);
  });
  let total=weights.reduce((a,b)=>a+b,0);
  let r=rng()*total;
  for(let i=0;i<opts.length;i++){
    r-=weights[i];
    if(r<=0) return opts[i];
  }
  return opts[opts.length-1];
}


function makeRandomAlly(){
  const rng = Math.random;
  const picked = (typeof pickNpcNameAndGender === 'function')
    ? pickNpcNameAndGender(rng)
    : { name: choice(rng, NPC_NAMES), gender: 'male' };
  const heroLv = S && S.hero ? num(S.hero.level,1) : 1;
  const minLv = Math.max(1, heroLv - 25);
  const maxLv = Math.max(minLv, heroLv);
  const lv = minLv + Math.floor(rng() * (maxLv - minLv + 1));
  const m = buildMember(picked.name, lv);
  m.isNpc = true;
  m.gender = picked.gender || guessGenderFromName(picked.name);
  const biasKey = ['str','con','agi','int'][Math.floor(rng()*4)];
  m.attrBias = {str:0, con:0, agi:0, int:0};
  m.attrBias[biasKey] = 5 + Math.floor(rng()*6);
  applyComputedStats(m);
  m.hp=m.maxHp; m.mp=m.maxMp;
  m.complicity=0;
  m.jobBias={};
  m.seedJobs = (typeof suggestJobPair==='function') ? suggestJobPair(m, rng) : [];
  return m;
}


/* ============ 角色成員建構 / 升級 / 職業成長 ============ */
/** 從裝備加總某一屬性（affixes 為準；無則回退舊欄位） */
function equipBonus(m, stat){
  let v = 0;
  if(!m || !m.equip) return 0;
  const slots = EQUIP_SLOT_IDS;
  slots.forEach(slot=>{
    const eq = m.equip[slot];
    if(!eq) return;
    // 讀取時再保險正規化一次，避免舊資料沒詞綴
    if(!eq.affixes || !eq.affixes.length) normalizeItem(eq);
    if(eq.affixes && eq.affixes.length){
      eq.affixes.forEach(a=>{
        if(a && a.stat===stat) v += num(a.value, 0);
      });
    } else {
      if(eq.stat===stat) v += num(eq.value, 0);
      if(eq.extraStat===stat) v += num(eq.extraValue, 0);
    }
  });
  return v;
}

/**
 * 主屬性加成公式（明確可見）
 * 力量 STR → 物理攻擊
 * 體質 CON → 生命上限、少量防禦
 * 敏捷 AGI → 速度
 * 智力 INT → 魔力上限、魔法攻擊
 */
const ATTR_FORMULA = {
  strToAtk: 1.2,
  conToHp: 5,
  conToDef: 0.4,
  agiToSpd: 1.1,
  intToMp: 3,
  intToMatk: 1.4
};

function computeStats(m){
  const lv = clamp(num(m.level, 1), 1, MAX_PLAYER_LEVEL);
  if(!Number.isFinite(Number(m.level)) || Number(m.level) < 1) m.level = lv;
  // 基礎戰鬥屬性（職業層）
  let maxHp = COMMONER.base.hp + COMMONER.grow.hp*(lv-1);
  let maxMp = COMMONER.base.mp + COMMONER.grow.mp*(lv-1);
  let atk = COMMONER.base.atk + COMMONER.grow.atk*(lv-1);
  let def = COMMONER.base.def + COMMONER.grow.def*(lv-1);
  let spd = COMMONER.base.spd + COMMONER.grow.spd*(lv-1);
  let matk = 5 + lv * 0.6; // 基礎魔攻

  // 主屬性基礎：每人都有，隨等級成長
  let str = 5 + Math.floor((lv-1)*0.4);
  let con = 5 + Math.floor((lv-1)*0.4);
  let agi = 5 + Math.floor((lv-1)*0.4);
  let intel = 5 + Math.floor((lv-1)*0.4); // int 是保留字，用 intel
  if(m.attrBias && typeof m.attrBias==='object'){
    str += num(m.attrBias.str,0);
    con += num(m.attrBias.con,0);
    agi += num(m.attrBias.agi,0);
    intel += num(m.attrBias.int,0);
  }

  const layers = [];
  if(m.professionId){
    const p = PROFESSIONS.find(x=>x.id===m.professionId);
    if(p) layers.push({def:p, atLevel:m.professionLevel||lv});
  }
  if(m.classId){
    const c = CLASSES.find(x=>x.id===m.classId);
    if(c) layers.push({def:c, atLevel:m.classLevel||lv});
    if(c && m.advId){
      const a = c.advancements.find(x=>x.id===m.advId);
      if(a) layers.push({def:a, atLevel:m.advLevel||lv});
    }
    if(c && m.masterId && c.masteries){
      const ms = c.masteries.find(x=>x.id===m.masterId);
      if(ms) layers.push({def:ms, atLevel:m.masterLevel||lv});
    }
  }
  layers.forEach(({def:d, atLevel})=>{
    if(!d || !d.statBonus || !d.growBonus) return;
    const since = Math.max(0, lv-atLevel);
    maxHp += d.statBonus.hp + d.growBonus.hp*since;
    maxMp += d.statBonus.mp + d.growBonus.mp*since;
    atk += d.statBonus.atk + d.growBonus.atk*since;
    def += d.statBonus.def + d.growBonus.def*since;
    spd += d.statBonus.spd + d.growBonus.spd*since;
    // 依職業偏向主屬性
    if(d.statBonus.atk > d.statBonus.mp) str += Math.floor((d.statBonus.atk + d.growBonus.atk*since)*0.3);
    if(d.statBonus.hp > 10) con += Math.floor((d.statBonus.hp + d.growBonus.hp*since)*0.08);
    if(d.statBonus.spd > 0) agi += Math.floor((d.statBonus.spd + d.growBonus.spd*since)*0.4);
    if(d.statBonus.mp > 5) intel += Math.floor((d.statBonus.mp + d.growBonus.mp*since)*0.15);
  });

  // 裝備主屬性
  str += equipBonus(m, 'str');
  con += equipBonus(m, 'con');
  agi += equipBonus(m, 'agi');
  intel += equipBonus(m, 'int');

  // 主屬性 → 戰鬥屬性
  atk += str * ATTR_FORMULA.strToAtk;
  maxHp += con * ATTR_FORMULA.conToHp;
  def += con * ATTR_FORMULA.conToDef;
  spd += agi * ATTR_FORMULA.agiToSpd;
  maxMp += intel * ATTR_FORMULA.intToMp;
  matk += intel * ATTR_FORMULA.intToMatk;

  // 裝備直接戰鬥屬性
  maxHp += equipBonus(m, 'hp');
  maxMp += equipBonus(m, 'mp');
  atk += equipBonus(m, 'atk');
  matk += equipBonus(m, 'matk');
  def += equipBonus(m, 'def');
  spd += equipBonus(m, 'spd');

  return {
    maxHp:Math.max(1,Math.round(maxHp)), maxMp:Math.max(0,Math.round(maxMp)),
    atk:Math.max(1,Math.round(atk)), matk:Math.max(1,Math.round(matk)),
    def:Math.max(0,Math.round(def)), spd:Math.max(1,Math.round(spd)),
    str:Math.max(1,Math.round(str)), con:Math.max(1,Math.round(con)),
    agi:Math.max(1,Math.round(agi)), int:Math.max(1,Math.round(intel))
  };
}
function applyComputedStats(m){
  const s = computeStats(m);
  let maxHp = s.maxHp;
  // 唯一／共鳴：最大生命% 寫入實際 maxHp（避免只在 statTotal 顯示）
  if(typeof sumEquipSpecial === 'function'){
    const hpB = sumEquipSpecial(m, 'hpBonus');
    if(hpB > 0) maxHp = Math.max(1, Math.round(maxHp * (1 + hpB)));
  }
  const dHp = maxHp - num(m.maxHp, 0);
  const dMp = s.maxMp - num(m.maxMp, 0);
  m.maxHp=maxHp; m.maxMp=s.maxMp;
  m.atk=s.atk; m.matk=s.matk; m.def=s.def; m.spd=s.spd;
  m.str=s.str; m.con=s.con; m.agi=s.agi; m.int=s.int;
  m.hp = clamp(num(m.hp, 0)+dHp, 0, m.maxHp);
  m.mp = clamp(num(m.mp, 0)+dMp, 0, m.maxMp);
}
function setProfession(m, professionId){
  m.professionId = professionId;
  m.professionLevel = m.level;
  applyComputedStats(m);
}
function setClass(m, classId){
  m.classId = classId;

}
function setAdvancement(m, advId){

}
function setMastery(m, masterId){
  m.masterId = masterId;
  m.masterLevel = m.level;

}
function getMasteryDef(m){
  if(!m || !m.classId || !m.masterId) return null;
  const cls = CLASSES.find(c=>c.id===m.classId);
  if(!cls || !cls.masteries) return null;
  return cls.masteries.find(x=>x.id===m.masterId) || null;
}
function classPassive(m){
  if(!m.classId) return null;
  const cls = CLASSES.find(c=>c.id===m.classId);
  return (cls && cls.passive) || null;
}
function hasPassive(m, id){
  const p = classPassive(m);
  return !!(p && p.id===id);
}
function displayClassName(m){
  if(m.masterId && m.classId){
    const ms = typeof getMasteryDef==='function' ? getMasteryDef(m) : null;
    if(ms) return ms.name;
  }
  if(m.advId && m.classId){
    const cls = CLASSES.find(c=>c.id===m.classId);
    const adv = cls && cls.advancements ? cls.advancements.find(a=>a.id===m.advId) : null;
    if(adv) return adv.name;
  }
  if(m.classId){
    const cls = CLASSES.find(c=>c.id===m.classId);
    if(cls) return cls.name;
  }
  if(m.professionId){
    const prof = PROFESSIONS.find(p=>p.id===m.professionId);
    if(prof) return prof.name;
  }
  return COMMONER.name;
}
function getSkills(m){
  let skills = [];
  // 第四階（傳奇轉職）完成後：不再帶普通人／生活職業技能，避免技能欄過長
  const postLegend = !!(m && m.masterId);
  if(!postLegend){
    if(COMMONER.skills && COMMONER.skills.length){
      skills = skills.concat(COMMONER.skills);
    }
    if(m.professionId){
      const prof = PROFESSIONS.find(p=>p.id===m.professionId);
      if(prof && prof.skill) skills.push(prof.skill);
    }
  }
  if(m.classId){
    const cls = CLASSES.find(c=>c.id===m.classId);
    if(cls && cls.skills) skills = skills.concat(cls.skills);
    if(cls && m.advId){
      const adv = cls.advancements.find(a=>a.id===m.advId);
      if(adv && adv.skill) skills.push(adv.skill);
    }
    if(cls && m.masterId && cls.masteries){
      const ms = cls.masteries.find(a=>a.id===m.masterId);
      if(ms && ms.skill) skills.push(ms.skill);
    }
  }
  // 已裝備唯一：附加專屬技能
  if(typeof equippedUniqueSkills === 'function'){
    skills = skills.concat(equippedUniqueSkills(m));
  }
  return skills;
}
function buildMember(name, level){
  // gender 由名字推斷（頭像用）

  const m = {
    uid:'m_'+Math.floor(Math.random()*1e9),
    name,
    professionId:null, professionLevel:null,
    classId:null, classLevel:null,
    advId:null, advLevel:null,
    level: level||1, exp:0, nextExp: expForLevel(level||1),
    maxHp:0, hp:0, maxMp:0, mp:0,
    atk:0, matk:0, def:0, spd:0,
    str:0, con:0, agi:0, int:0,
    equip:emptyEquip(),
    buffDef:0, buffTurns:0, guarding:false, taunting:false,
    usedGuardianAngel:false,
    complicity:0, // 共犯值：滿了可與主角對話強化轉職傾向
    jobBias:{}   // classId -> 額外權重（每次對話 +0.10）
  };
  applyComputedStats(m);
  m.hp = m.maxHp; m.mp = m.maxMp;
  return m;
}
function memberPalette(m){
  if(m.classId){
    const cls = CLASSES.find(c=>c.id===m.classId);
    if(cls) return cls.palette;
  }
  if(m.professionId){
    const prof = PROFESSIONS.find(p=>p.id===m.professionId);
    if(prof) return prof.palette;
  }
  return COMMONER.palette;
}
function expForLevel(lv){
  lv = clamp(lv, 1, MAX_PLAYER_LEVEL);
  return Math.round(30 * Math.pow(lv, 1.5) * (1 + lv * 0.008));
}
function statTotal(m, stat){
  // 裝備與主屬性已計入 m.*，此處加戰鬥 buff + 唯一%加成
  let v;
  if(stat==='hp') v = m.maxHp;
  else if(stat==='mp') v = m.maxMp;
  else if(stat==='matk') v = m.matk || m.atk || 1;
  else if(stat==='atk') v = (m.atk||0) - num(m.atkDebuff, 0);
  else if(stat==='spd') v = (m.spd||0) - num(m.spdDebuff, 0);
  else v = m[stat];
  if(stat==='def' && m.buffTurns>0) v = num(v,0) + num(m.buffDef,0);
  v = num(v, 0);
  if(typeof sumEquipSpecial === 'function'){
    if(stat==='atk') v *= (1 + sumEquipSpecial(m, 'atkBonus'));
    if(stat==='matk') v *= (1 + sumEquipSpecial(m, 'matkBonus'));
    if(stat==='spd') v *= (1 + sumEquipSpecial(m, 'spdBonus'));
    // hpBonus 已在 applyComputedStats 寫入 maxHp，此處不再乘
  }
  return Math.max(0, Math.round(v));
}
function evaluateEvolution(m){
  if(m.level>=PROFESSION_LEVEL && !m.professionId){ S.pendingStage='profession'; return; }
  if(m.level>=CLASS_LEVEL && m.professionId && !m.classId){ S.pendingStage='class'; return; }
  if(m.level>=BRANCH_LEVEL && m.classId && !m.advId){ S.pendingStage='branch'; return; }
  if(m.level>=MASTER_LEVEL && m.advId && !m.masterId){ S.pendingStage='legend'; return; }
}
function autoEvolveAll(m, log){
  if(m.level>=PROFESSION_LEVEL && !m.professionId){
    const prof = choice(Math.random, PROFESSIONS);
    setProfession(m, prof.id);
    log.push(m.name+' 踏上了 ['+prof.name+'] 之路！');
  }
  if(m.level>=CLASS_LEVEL && m.professionId && !m.classId){
    const prof = PROFESSIONS.find(p=>p.id===m.professionId);
    if(prof && prof.leadsTo){
      const opts = CLASSES.filter(c=>prof.leadsTo.includes(c.id));
      if(opts.length){
        const cls = (typeof weightedClassChoice==='function')
          ? weightedClassChoice(opts, m.jobBias||{}, Math.random)
          : choice(Math.random, opts);
        setClass(m, cls.id);
        log.push(m.name+' 覺醒為 ['+cls.name+']！');
      }
    }
  }
  if(m.level>=BRANCH_LEVEL && m.classId && !m.advId){
    const cls = CLASSES.find(c=>c.id===m.classId);
    if(cls && cls.advancements && cls.advancements.length){
      const adv = choice(Math.random, cls.advancements);
      setAdvancement(m, adv.id);
      log.push(m.name+' 進一步覺醒為 ['+adv.name+']！');
    }
  }
  if(m.level>=MASTER_LEVEL && m.advId && !m.masterId){
    const cls = CLASSES.find(c=>c.id===m.classId);
    if(cls && cls.masteries && cls.masteries.length){
      const ms = choice(Math.random, cls.masteries);
      setMastery(m, ms.id);
      log.push(m.name+' 傳奇轉職為 ['+ms.name+']！');
    }
  }
}
function gainExp(m, amt, log){
  if(!m) return;
  log = log || [];
  amt = Math.max(0, Math.round(num(amt, 0)));
  if(amt <= 0) return;
  if(m.level >= MAX_PLAYER_LEVEL){
    m.exp = 0;
    m.nextExp = expForLevel(MAX_PLAYER_LEVEL);
    return;
  }
  m.exp = num(m.exp, 0) + amt;
  while(m.exp >= m.nextExp && m.level < MAX_PLAYER_LEVEL){
    m.exp -= m.nextExp;
    m.level++;
    applyComputedStats(m);
    m.nextExp = expForLevel(m.level);
    log.push(m.name+' 升到了 Lv.'+m.level+'！');
    if(m.isHero){
      evaluateEvolution(m);
    } else {
      autoEvolveAll(m, log);
    }
  }
  if(m.level >= MAX_PLAYER_LEVEL){
    m.level = MAX_PLAYER_LEVEL;
    m.exp = 0;
    m.nextExp = expForLevel(MAX_PLAYER_LEVEL);
    log.push(m.name+' 已達等級上限 '+MAX_PLAYER_LEVEL+'！');
  }
}
