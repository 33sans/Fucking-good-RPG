<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0a09">
<title>灰燼紀元 - 像素文字RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Noto+Serif+TC:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#0c0a09;
  --bg-panel:#1b1512;
  --bg-panel-2:#271f19;
  --line:#4a2f1f;
  --gold:#ff6a35;
  --gold-dim:#8a3a1a;
  --hp:#d4453f;
  --mp:#5b93a8;
  --xp:#8fae52;
  --text:#ece2cc;
  --text-dim:#9c8f7c;
  --common:#9c8f7c;
  --rare:#5b93a8;
  --epic:#a565d6;
  --legend:#ff6a35;
  --mythic:#ff4fa3;
  /* 裝備稀有度色 */
  --r-crude:#6b6358;
  --r-normal:#9c8f7c;
  --r-handy:#a8a090;
  --r-common:#b7c49a;
  --r-uncommon:#5b93a8;
  --r-rare:#4a9fd8;
  --r-scarce:#6b8cff;
  --r-epic:#a565d6;
  --r-legend:#ff6a35;
  --r-mythic:#ff4fa3;
  --r-ancient:#ffd24a;
  --r-unique:#ff3b3b;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
  --touch-min: 44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{background:var(--bg-deep);-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:radial-gradient(ellipse at 50% -10%, #241a13 0%, #0c0a09 62%);
  color:var(--text);
  font-family:'Noto Serif TC',serif;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  padding:18px 10px;
  padding-top:calc(12px + var(--safe-top));
  padding-bottom:calc(18px + var(--safe-bottom));
  position:relative;
  overflow-x:hidden;
}
/* --- 信物：飄升餘燼（Ashfall 的視覺主題） --- */
#embers{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.ember-particle{
  position:absolute; bottom:-5%; width:3px; height:3px; border-radius:50%;
  background:var(--gold); box-shadow:0 0 6px 1px rgba(255,106,53,.8);
  opacity:0; animation:emberRise linear infinite;
}
@keyframes emberRise{
  0%{ transform:translate(0,0) scale(1); opacity:0; }
  8%{ opacity:.55; }
  92%{ opacity:.25; }
  100%{ transform:translate(var(--drift,20px), -108vh) scale(.4); opacity:0; }
}
#app{width:100%;max-width:900px;position:relative;z-index:1;}
.pixel-font{font-family:'Silkscreen',monospace;}
.title-bar{
  text-align:center;margin-bottom:14px;
}
.title-bar h1{
  font-size:16px;letter-spacing:3px;color:var(--gold);
  text-shadow:0 0 10px rgba(255,106,53,.5), 0 0 2px rgba(255,106,53,.8);
  margin:0 0 4px;
  animation:emberGlow 3.2s ease-in-out infinite;
}
@keyframes emberGlow{
  0%,100%{ text-shadow:0 0 10px rgba(255,106,53,.5), 0 0 2px rgba(255,106,53,.8); }
  50%{ text-shadow:0 0 16px rgba(255,106,53,.75), 0 0 3px rgba(255,106,53,1); }
}
.title-bar p{font-size:11px;color:var(--text-dim);margin:0;letter-spacing:1px;}
.panel{
  background:var(--bg-panel);
  border:1px solid var(--line);
  border-top:2px solid var(--gold-dim);
  box-shadow:0 10px 24px -12px rgba(0,0,0,.6);
  padding:14px;
  margin-bottom:12px;
  border-radius:4px;
}
.btn{
  font-family:'Noto Serif TC',serif;
  font-weight:700;
  background:var(--bg-panel-2);
  border:1px solid var(--line);
  color:var(--text);
  padding:10px 14px;
  min-height:var(--touch-min);
  cursor:pointer;
  font-size:14px;
  transition:transform .08s, background .15s, box-shadow .1s;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.06),
    inset 0 -2px 0 rgba(0,0,0,.35),
    0 1px 0 rgba(0,0,0,.4);
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
  border-radius:4px;
}
.btn:hover{background:#33291f;transform:translateY(-1px);}
.btn:active{transform:translateY(1px);box-shadow:inset 0 2px 0 rgba(0,0,0,.4);}
.btn.gold{border-color:var(--gold-dim);color:var(--gold);}
.btn.danger{border-color:#7a2c34;color:#e0655f;}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.grid{display:grid;gap:10px;}
.party-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));}
.class-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));}
.class-card{
  background:var(--bg-panel-2);border:1px solid var(--line);border-top:2px solid transparent;
  padding:12px;text-align:center;cursor:pointer;transition:border-color .12s, background .12s;
  border-radius:4px;touch-action:manipulation;
}
.class-card:hover{border-top-color:var(--gold-dim);}
.class-card:active{background:#33291f;}
.class-card.selected{border-top-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
.class-card h3{margin:6px 0 2px;font-size:14px;color:var(--gold);font-weight:700;}
.class-card p{margin:0;font-size:11px;color:var(--text-dim);line-height:1.5;}
canvas.sprite{image-rendering:pixelated;background:#0a0807;border:1px solid var(--line);flex-shrink:0;}
.statline{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 8px;font-size:11px;color:var(--text-dim);margin-top:6px;font-family:'Space Mono','Noto Serif TC',serif;}
.bar-wrap{background:#0a0807;border:1px solid var(--line);height:9px;overflow:hidden;margin:3px 0;border-radius:2px;}
.bar{height:100%;}
.topbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:10px;}
.member-card{
  background:var(--bg-panel-2);border:1px solid var(--line);border-left:3px solid var(--line);
  padding:10px;display:flex;gap:10px;align-items:center;transition:border-color .12s;
  border-radius:4px;
}
.member-card.active-turn{border-left-color:var(--gold);box-shadow:0 0 8px rgba(255,106,53,.15);}
.member-card.dead{opacity:.4;}
.member-info{flex:1;min-width:0;}
.member-name{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;}
/* 戰鬥精簡角色卡 — 縮小佔位，留給技能與怪物 */
.member-card-compact{
  padding:5px 8px;gap:6px;border-left-width:2px;
}
.member-card-compact .member-name{font-size:11px;line-height:1.25;margin-bottom:1px;}
.member-card-compact .bar-wrap{height:6px;margin:2px 0;}
.member-card-compact .bar-wrap-mp{height:4px;}
.member-card-compact .compact-stats{
  display:flex;justify-content:space-between;gap:6px;
  font-size:10px;color:var(--text-dim);font-family:'Space Mono','Noto Serif TC',serif;
  line-height:1.2;
}
.member-card-compact canvas.sprite{width:32px;height:32px;}
.battle-party-grid{
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:6px;margin:6px 0 2px;
}
.battle-log-box{height:96px;}
.rarity-crude{color:var(--r-crude);}
.rarity-normal{color:var(--r-normal);}
.rarity-handy{color:var(--r-handy);}
.rarity-common{color:var(--r-common);}
.rarity-uncommon{color:var(--r-uncommon);}
.rarity-rare{color:var(--r-rare);}
.rarity-scarce{color:var(--r-scarce);}
.rarity-epic{color:var(--r-epic);}
.rarity-legend{color:var(--r-legend);}
.rarity-mythic{color:var(--r-mythic);text-shadow:0 0 4px rgba(255,79,163,.6);}
.rarity-ancient{color:var(--r-ancient);text-shadow:0 0 6px rgba(255,210,74,.5);}
.rarity-unique{color:var(--r-unique);text-shadow:0 0 8px rgba(255,59,59,.7);font-weight:900;}
.log-box{
  background:#0a0807;border:1px solid var(--line);
  padding:10px;font-size:12px;height:130px;overflow-y:auto;line-height:1.7;
  font-family:'Space Mono','Noto Serif TC',serif;
  border-radius:4px;-webkit-overflow-scrolling:touch;
}
.log-box div{border-bottom:1px dashed #2a2119;padding-bottom:3px;margin-bottom:3px;}
.monster-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0;}
.monster-box{
  text-align:center;cursor:pointer;padding:8px 10px;border:2px solid transparent;
  border-radius:6px;touch-action:manipulation;min-width:88px;
  transition:border-color .12s, background .12s;
}
.monster-box.target-selectable:hover,
.monster-box.target-selectable:active{border-color:var(--hp);background:rgba(212,69,63,.08);}
.monster-box.dead{opacity:.25;pointer-events:none;}
.monster-name{font-size:12px;margin-top:4px;font-weight:600;}
.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
/* --- 按鍵層級系統 --- */
.btn-primary{width:100%;padding:16px;font-size:16px;letter-spacing:1px;margin-bottom:2px;min-height:52px;}
.nav-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
.nav-grid-4{grid-template-columns:repeat(4,1fr);}
.btn-nav{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;padding:14px 6px;font-size:12px;white-space:nowrap;min-height:64px;
}
.btn-nav .nav-icon{font-size:22px;line-height:1;}
.btn-compact{padding:10px 12px;font-size:13px;min-height:var(--touch-min);}
.segmented{display:flex;border:1px solid var(--line);width:fit-content;max-width:100%;margin-bottom:10px;border-radius:4px;overflow:hidden;}
.segmented .btn{border:none;box-shadow:none;padding:10px 18px;font-size:13px;background:transparent;border-radius:0;min-height:var(--touch-min);}
.segmented .btn+.btn{border-left:1px solid var(--line);}
.segmented .btn.active{background:var(--gold-dim);color:var(--bg-deep);}
.action-label{font-family:'Silkscreen',monospace;font-size:9px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase;margin:12px 0 6px;border-bottom:1px dashed var(--line);padding-bottom:4px;}
.skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;}
.skill-btn{display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;padding:10px 12px;white-space:normal;min-height:var(--touch-min);}
.skill-btn-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:8px;}
.skill-btn-desc{color:var(--text-dim);line-height:1.4;font-size:12px;}
.skill-btn-est{color:var(--gold);font-size:12px;}
.skill-btn .mp-cost{font-family:'Space Mono','Noto Serif TC',serif;color:var(--mp);font-size:11px;white-space:nowrap;}
.utility-row{display:flex;gap:8px;flex-wrap:wrap;}
.utility-row .btn{flex:1;min-width:0;}
.flee-link{background:none;border:none;box-shadow:none;color:var(--text-dim);font-size:13px;text-decoration:underline;cursor:pointer;padding:12px 8px;margin:8px 0 0 auto;display:block;min-height:var(--touch-min);touch-action:manipulation;}
.flee-link:hover,.flee-link:active{color:var(--hp);}
.choice-list{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
.choice-list .btn{text-align:left;width:100%;padding:14px 16px;font-size:15px;}
.item-row{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--bg-panel-2);border:1px solid var(--line);padding:10px;margin-bottom:8px;
  border-radius:4px;
}
.item-row .meta{font-size:11px;color:var(--text-dim);font-family:'Space Mono','Noto Serif TC',serif;}
.item-row .btn{flex-shrink:0;white-space:nowrap;}
/* 背包重做 */
.inv-stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  background:var(--bg-panel-2);border:1px solid var(--line);border-radius:6px;
  padding:10px;margin-bottom:10px;font-size:12px;
}
.inv-stats span{color:var(--text-dim);}
.inv-stats b{color:var(--text);font-weight:700;}
.equip-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;
}
.equip-slot{
  background:var(--bg-panel-2);border:1px solid var(--line);border-radius:6px;
  padding:10px;min-height:88px;display:flex;flex-direction:column;gap:6px;
}
.equip-slot.empty{border-style:dashed;opacity:0.85;}
.equip-slot-label{font-size:10px;color:var(--gold);letter-spacing:1px;font-family:'Silkscreen',monospace;}
.equip-slot-body{display:flex;align-items:flex-start;gap:8px;flex:1;}
.equip-slot-body .meta{font-size:11px;color:var(--text-dim);line-height:1.35;}
.equip-slot .btn{width:100%;margin-top:auto;}
.inv-filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.inv-filter .btn{padding:8px 12px;font-size:12px;}
.inv-filter .btn.active{background:var(--gold-dim);color:var(--bg-deep);border-color:var(--gold);}
.inv-card{
  background:var(--bg-panel-2);border:1px solid var(--line);border-radius:6px;
  padding:10px;margin-bottom:8px;
}
.inv-card-top{display:flex;align-items:flex-start;gap:10px;}
.inv-card-top > div:first-of-type{flex:1;min-width:0;}
.inv-card-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.inv-card-actions .btn{flex:1;min-width:90px;text-align:center;}
.delta-up{color:#7dcea0;}
.delta-down{color:#e07a7a;}
.delta-same{color:var(--text-dim);}
.inv-compare{font-size:11px;margin-top:4px;line-height:1.4;font-family:'Space Mono','Noto Serif TC',serif;}
.small{font-size:11px;color:var(--text-dim);font-family:'Space Mono','Noto Serif TC',serif;}
.event-text{font-size:14px;line-height:1.8;margin:10px 0;}
.hidden{display:none !important;}
.hero-slot{display:flex;align-items:center;gap:10px;background:var(--bg-panel-2);border:1px solid var(--line);padding:10px;margin-bottom:8px;border-radius:4px;}
.section-title{font-family:'Silkscreen',monospace;font-size:11px;color:var(--gold);letter-spacing:1px;margin:0 0 8px;}
.divider{border:none;border-top:1px dashed var(--line);margin:10px 0;}

/* ========== 平板 / 中等螢幕 ========== */
@media (max-width:768px){
  body{padding:12px 8px;padding-top:calc(10px + var(--safe-top));padding-bottom:calc(16px + var(--safe-bottom));}
  .panel{padding:12px;margin-bottom:10px;}
  .class-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));}
  .skill-grid{grid-template-columns:1fr 1fr;}
  .nav-grid{gap:6px;}
}

/* ========== 手機主適配 ========== */
@media (max-width:640px){
  body{
    padding:8px 6px;
    padding-top:calc(6px + var(--safe-top));
    padding-bottom:calc(12px + var(--safe-bottom));
  }
  .title-bar{margin-bottom:8px;}
  .title-bar h1{font-size:15px;letter-spacing:2px;}
  .title-bar p{font-size:10px;}

  .panel{padding:12px 10px;margin-bottom:8px;border-radius:6px;}

  /* 觸控按鈕加大 */
  .btn{padding:12px 14px;font-size:15px;min-height:48px;}
  .btn-primary{padding:16px;font-size:17px;min-height:54px;border-radius:6px;}
  .btn-compact{padding:12px 10px;font-size:14px;min-height:48px;}

  /* 營地導航：2x2 大按鈕 */
  .nav-grid,
  .nav-grid-4{
    grid-template-columns:1fr 1fr !important;
    gap:8px;
    margin-top:10px;
  }
  .btn-nav{
    padding:16px 8px;
    font-size:13px;
    min-height:72px;
    border-radius:6px;
  }
  .btn-nav .nav-icon{font-size:26px;}

  /* 隊伍卡片單欄（營地） */
  .party-grid,
  .grid[style*="minmax(220px"],
  .grid[style*="minmax(200px"]{
    grid-template-columns:1fr !important;
  }
  /* 戰鬥角色卡：2 欄緊湊 */
  .battle-party-grid{
    grid-template-columns:1fr 1fr !important;
    gap:4px;margin:4px 0 2px;
  }
  .member-card-compact{padding:4px 6px;gap:5px;}
  .member-card-compact canvas.sprite{width:26px;height:26px;}
  .member-card-compact .member-name{font-size:10px;}
  .member-card-compact .compact-stats{font-size:9px;}
  .member-card-compact .bar-wrap{height:5px;margin:1px 0;}
  .member-card-compact .bar-wrap-mp{height:3px;}
  .battle-log-box{height:80px;}
  .battle-log-panel{padding:8px 10px;}
  .battle-log-panel .section-title{margin-bottom:4px;}

  /* 轉職卡片：直向單欄，更好點 */
  .class-grid{grid-template-columns:1fr;}
  .class-card{
    display:flex;flex-direction:row;align-items:center;gap:12px;
    text-align:left;padding:14px 12px;min-height:72px;
  }
  .class-card canvas.sprite{width:56px;height:56px;flex-shrink:0;}
  .class-card h3{margin:0 0 2px;font-size:15px;}
  .class-card p{font-size:12px;line-height:1.45;}
  .class-card .divider{display:none;}
  .class-card > div.small{font-size:12px;}

  /* 戰鬥：怪物橫向可滑 */
  .monster-row{
    gap:8px;justify-content:flex-start;
    overflow-x:auto;-webkit-overflow-scrolling:touch;
    padding-bottom:6px;flex-wrap:nowrap;
    margin:8px -4px;padding-left:4px;padding-right:4px;
  }
  .monster-box{
    min-width:100px;flex:0 0 auto;padding:10px 8px;
  }
  .monster-box canvas.sprite{width:64px !important;height:64px !important;}
  .monster-name{font-size:12px;}

  /* 技能全寬單欄，好按 */
  .skill-grid{grid-template-columns:1fr;gap:8px;}
  .skill-btn{padding:12px 14px;min-height:56px;}
  .skill-btn-head{font-size:15px;}
  .skill-btn-desc{font-size:12px;}
  .skill-btn-est{font-size:12px;}

  /* 道具列：窄螢幕按鈕換行 */
  .item-row{
    flex-wrap:wrap;padding:12px;gap:8px;
  }
  .item-row > div:first-child{flex:1 1 140px;min-width:0;}
  .item-row .btn{flex:1 1 auto;min-width:88px;text-align:center;}

  /* 隊伍管理 */
  .hero-slot{flex-wrap:wrap;padding:12px;gap:10px;}
  .hero-slot .btn{width:100%;}

  /* 分段切換滿寬 */
  .segmented{width:100%;display:flex;}
  .segmented .btn{flex:1;text-align:center;padding:12px 8px;font-size:14px;}

  /* 日誌區適中高度 */
  .log-box{height:110px;font-size:12px;padding:8px;}

  /* 事件選項大按鈕 */
  .choice-list{gap:10px;}
  .choice-list .btn{padding:16px;font-size:15px;min-height:52px;}

  .event-text{font-size:14px;line-height:1.75;}
  .section-title{font-size:12px;margin-bottom:10px;}
  .member-name{font-size:13px;}
  .statline{font-size:12px;gap:6px 10px;}
  .bar-wrap{height:10px;}

  /* 工具列（回HP/MP）並排但夠大 */
  .utility-row{gap:8px;}
  .utility-row .btn{flex:1;min-height:48px;}

  /* 商店/酒館頂部 */
  .topbar{gap:10px;margin-bottom:12px;}
  .topbar .pixel-font{font-size:13px !important;}

  /* 精靈圖略縮 */
  canvas.sprite{max-width:100%;}

  /* 行動面板底部間距，避免被瀏覽器工具列擋 */
  #action-panel{padding-bottom:4px;}
  .flee-link{width:100%;text-align:center;margin:10px 0 0;padding:14px;}

  /* 減少手機效能負擔：隱藏部分餘燼粒子 */
  .ember-particle:nth-child(n+8){display:none;}
}

/* ========== 極窄螢幕（小手機） ========== */
@media (max-width:380px){
  .btn-nav{font-size:12px;padding:12px 4px;min-height:68px;}
  .btn-nav .nav-icon{font-size:22px;}
  .monster-box{min-width:88px;}
  .class-card{padding:12px 10px;gap:10px;}
  .class-card canvas.sprite{width:48px;height:48px;}
  .title-bar h1{font-size:13px;}
}

/* 橫向手機：壓縮垂直空間 */
@media (max-width:900px) and (max-height:480px) and (orientation:landscape){
  .title-bar{margin-bottom:4px;}
  .title-bar h1{font-size:13px;}
  .panel{padding:8px;margin-bottom:6px;}
  .log-box{height:72px;}

<script>
/* ============ 工具 / PRNG ============ */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(str){
  let h = 0x811c9dc5;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rint(rng,min,max){
  const a = Number(min), b = Number(max);
  if(!Number.isFinite(a) || !Number.isFinite(b)) return 0;
  return Math.floor(rng()*(b-a+1))+a;
}
/** 把值轉成有限數字，失敗則回 fallback（防 NaN 污染） */
function num(v, fallback){
  const n = Number(v);
  return Number.isFinite(n) ? n : (fallback != null ? fallback : 0);
}
function choice(rng, arr){ return arr[Math.floor(rng()*arr.length)]; }
function weightedChoice(rng, entries){ // entries: [{item,w}]
  const total = entries.reduce((s,e)=>s+e.w,0);
  let r = rng()*total;
  for(const e of entries){ if(r < e.w) return e.item; r -= e.w; }
  return entries[entries.length-1].item;
}
function clamp(v,a,b){
  const x = num(v, a), lo = num(a, 0), hi = num(b, lo);
  return Math.max(lo, Math.min(hi, x));
}
function esc(s){ return (s+'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* ============ 像素精靈產生器 ============ */
// 產生對稱的怪物/角色/裝備像素圖，以 seed 決定圖案，palette 決定配色
function drawSprite(canvas, seed, palette, size){
  size = size || 16;
  const rng = mulberry32(hashStr(seed));
  const cell = Math.floor(160/size);
  canvas.width = size*cell; canvas.height = size*cell;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const half = Math.ceil(size/2);
  const grid = [];
  for(let y=0;y<size;y++){
    grid.push([]);
    for(let x=0;x<half;x++){
      const edgeBias = (x < half*0.3 || y < size*0.15 || y > size*0.85) ? 0.32 : 0.58;
      grid[y].push(rng() < edgeBias ? weightedChoice(rng,[{item:0,w:6},{item:1,w:3},{item:2,w:2},{item:3,w:1}]) : 0);
    }
  }
  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){
      const srcX = x < half ? x : size-1-x;
      const v = grid[y][srcX];
      if(v===0) continue;
      const color = palette[v-1] || palette[0];
      ctx.fillStyle = color;
      ctx.fillRect(x*cell,y*cell,cell,cell);
    }
  }
}
function drawEquipIcon(canvas, seed, kind, rarityColor){
  const size=12, cell=Math.floor(120/size);
  canvas.width=size*cell; canvas.height=size*cell;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const rng = mulberry32(hashStr(seed));
  const base = ['#8b7355','#c9c2b0','#5a5470'];
  const shapes = {
    weapon: [[5,1],[6,1],[5,2],[6,2],[4,3],[5,3],[6,3],[7,3],[3,4],[4,4],[5,4],[6,4],[7,4],[8,4],[5,5],[6,5],[5,6],[6,6],[5,7],[6,7],[4,8],[5,8],[6,8],[7,8],[4,9],[7,9]],
    armor: [[3,2],[4,2],[7,2],[8,2],[3,3],[4,3],[5,3],[6,3],[7,3],[8,3],[3,4],[4,4],[5,4],[6,4],[7,4],[8,4],[4,5],[5,5],[6,5],[7,5],[4,6],[5,6],[6,6],[7,6],[4,7],[7,7]],
    accessory: [[5,2],[6,2],[4,3],[7,3],[4,4],[7,4],[5,5],[6,5],[5,6],[6,6],[4,7],[7,7],[5,8],[6,8]]
  };
  const pts = shapes[kind]||shapes.weapon;
  pts.forEach(([x,y])=>{
    ctx.fillStyle = rng()<0.25 ? rarityColor : choice(rng, base);
    ctx.fillRect(x*cell,y*cell,cell,cell);
  });
}

/** 30 等後至少 1 詞綴；之後每 10 等 +1，對應至 120 等 */
function rollAffixCount(tier, boss, playerLevel, isElite){
  let count = 0;
  if(playerLevel >= 30){
    count = 1 + Math.floor((playerLevel - 30) / 10); // 30→1 … 120→10
    count = Math.min(count, 8);
  } else if(boss){
    count = weightedChoice(Math.random, [{item:1,w:40},{item:2,w:40},{item:3,w:20}]);
  } else if(tier >= 3 && Math.random() < 0.45){
    count = 1;
  } else if(tier >= 4 && Math.random() < 0.7){
    count = 1;
  }
  if(boss) count = Math.max(count, 2);
  if(isElite) count = Math.max(count, 1) + 1; // 精英至少多一條常規
  return Math.min(count, MONSTER_AFFIXES.length - 1); // 預留 rare
}

function applyMonsterAffixes(mon, count, rng, forceRare){
  const pool = MONSTER_AFFIXES.filter(a=>a.id!=='rare');
  const shuffled = pool.slice().sort(()=>rng()-0.5);
  const chosen = shuffled.slice(0, Math.min(count, shuffled.length));
  chosen.forEach(aff=>{
    aff.apply(mon);
    mon.affixes.push(aff.id);
    mon.affixNames = mon.affixNames || [];
    mon.affixNames.push(aff.name);
  });
  if(forceRare){
    const rare = MONSTER_AFFIXES.find(a=>a.id==='rare');
    if(rare){ rare.apply(mon); mon.affixes.push('rare'); mon.affixNames.push('稀有'); }
  }
}

/**
 * 1–120 曲線：
 * scale ≈ (1+(tier-1)*0.45) * (1 + lv*0.07 + lv²*0.0018)
 * 高等級血量與經驗明顯拉開
 */
function makeMonster(tmpl, playerLevel, rng, opts){
  opts = opts || {};
  rng = rng || Math.random;
  const tier = clamp(num(tmpl && tmpl.tier, 1), 1, 5);
  const pl = clamp(num(playerLevel, 1), 1, MAX_PLAYER_LEVEL);
  const lvl = clamp(pl + rint(rng, -1, 2), 1, MAX_PLAYER_LEVEL);
  const tierMul = 1 + (tier - 1) * 0.45;
  const lvlMul = 1 + lvl * 0.07 + lvl * lvl * 0.0018;
  const scale = tierMul * lvlMul;
  const boss = !!(tmpl && tmpl.boss);
  const elite = !!opts.elite && !boss;
  let mon = {
    name: (elite ? '精英·' : '') + ((tmpl && tmpl.n) || '未知生物'),
    type: (tmpl && tmpl.type) || 'beast',
    tier, boss, elite,
    level: lvl,
    hp: 0, maxHp: 0, atk: 0, def: 0, spd: 0,
    exp: 0, gold: 0,
    seed: ((tmpl && tmpl.n) || 'm') + '_' + lvl + '_' + Math.floor(rng()*9999),
    status:null, statusTurns:0, rewarded:false,
    hasRegen:false, regenRate:0.05,
    affixes:[], affixNames:[],
    mech: boss ? ((tmpl && tmpl.mech) || null) : null,
    bossTurns: 0
  };
  const hpBase = boss ? 420 : (elite ? 55 : 42);
  const atkBase = boss ? 28 : (elite ? 14 : 12);
  // 防禦成長放緩：避免中後期物攻被壓成 1 傷
  const defBase = boss ? 10 : (elite ? 4 : 3);
  const expBase = boss ? 520 : (elite ? 58 : 40);
  const goldBase = boss ? 380 : (elite ? 36 : 25);
  mon.maxHp = Math.max(1, Math.round(hpBase * scale * (boss ? 1.15 : 1)));
  mon.hp = mon.maxHp;
  mon.atk = Math.max(1, Math.round(atkBase * (1+(tier-1)*0.42) * (1+lvl*0.09)));
  mon.def = Math.max(0, Math.round(defBase * (1+(tier-1)*0.20) * (1+lvl*0.04)));
  mon.spd = Math.max(1, rint(rng, 5+tier, 11+tier*2));
  mon.exp = Math.max(1, Math.round(expBase * scale * (1 + lvl * 0.01)));
  mon.gold = Math.max(0, Math.round(goldBase * scale * (0.7 + rng()*0.6)));

  if(elite){
    mon.atk = Math.max(1, Math.round(mon.atk * 1.35));
    mon.def = Math.max(0, Math.round(mon.def * 1.25));
    mon.maxHp = Math.max(1, Math.round(mon.maxHp * 1.35));
    mon.hp = mon.maxHp;
    mon.exp = Math.max(1, Math.round(mon.exp * 1.4));
    mon.gold = Math.max(0, Math.round(mon.gold * 1.35));
  }

  const wantAffix = rollAffixCount(tier, boss, pl, elite);
  const forceRare = elite;
  applyMonsterAffixes(mon, wantAffix, rng, forceRare);

  // 詞綴套用後強制數值合法，避免任何 NaN 進入戰鬥
  mon.maxHp = Math.max(1, num(mon.maxHp, 1));
  mon.hp = clamp(num(mon.hp, mon.maxHp), 0, mon.maxHp);
  mon.atk = Math.max(1, num(mon.atk, 1));
  mon.def = Math.max(0, num(mon.def, 0));
  // 防禦軟上限：約等於「同級期望物攻」的 1.1 倍，避免詞綴疊到無法輸出
  const defCap = Math.round((8 + lvl * 1.2 + tier * 3) * (elite ? 1.25 : 1) * (boss ? 1.6 : 1));
  if(mon.def > defCap) mon.def = defCap;
  mon.spd = Math.max(1, num(mon.spd, 1));
  mon.exp = Math.max(1, num(mon.exp, 1));
  mon.gold = Math.max(0, num(mon.gold, 0));

  if(boss && mon.mech){
    mon.exp = Math.max(1, Math.round(mon.exp * 1.25));
    mon.gold = Math.max(0, Math.round(mon.gold * 1.25));
  }
  return mon;
}

function avgPartyLevel(s){
  s = s || S;
  if(!s || !s.party || !s.party.length) return 1;
  const sum = s.party.reduce((a,m)=> a + num(m.level, 1), 0);
  const avg = Math.round(sum / s.party.length);
  return clamp(avg, 1, MAX_PLAYER_LEVEL);
}

function rarityById(id){
  if(RARITY_LEGACY_MAP[id]) id = RARITY_LEGACY_MAP[id];
  return RARITIES.find(r=>r.id===id) || RARITIES[1];
}

function scaleAffixValue(baseV, rarity, itemLevel, rng){
  const lvlFactor = 1 + Math.max(0, (itemLevel||1)-1) * 0.05;
  const variance = 1 + ((rng() * 2 - 1) * (rarity.variance||0.1));
  return Math.max(1, Math.round(baseV * rarity.mult * lvlFactor * variance));
}

function pickRoleAffixes(rng, role, count, rarity, itemLevel, usedStats){
  const pool = (ROLE_AFFIX_POOL[role] || GENERIC_AFFIX_POOL).slice();
  const gen = GENERIC_AFFIX_POOL.slice();
  const result = [];
  usedStats = usedStats || new Set();
  for(let i=0;i<count;i++){
    let src = pool.length ? pool : gen;
    if(!src.length) src = GENERIC_AFFIX_POOL.slice();
    const idx = Math.floor(rng()*src.length);
    const template = src.splice(idx,1)[0] || choice(rng, GENERIC_AFFIX_POOL);
    result.push({
      stat: template.stat,
      value: scaleAffixValue(template.v, rarity, itemLevel, rng),
      label: template.label
    });
  }
  return result;
}

function rollEquip(rng, minRarity, itemLevel){
  itemLevel = itemLevel || 1;
  rng = rng || Math.random;

  // 極低機率掉唯一
  if(rng() < 0.008 && (!minRarity || RARITIES.findIndex(r=>r.id===(RARITY_LEGACY_MAP[minRarity]||minRarity)) <= 11)){
    return rollUniqueEquip(rng, itemLevel);
  }

  const slot = choice(rng, ['weapon','armor','accessory']);
  const base = choice(rng, EQUIP_BASES[slot]);
  const minId = minRarity ? (RARITY_LEGACY_MAP[minRarity]||minRarity) : null;
  const minIdx = minId ? RARITIES.findIndex(r=>r.id===minId) : -1;
  const pool = RARITIES.filter((r,i)=> i>=Math.max(0,minIdx) && r.id!=='unique');
  const rarity = weightedChoice(rng, pool.map(r=>({item:r, w:r.w})));
  const lvlFactor = 1 + Math.max(0, itemLevel-1) * 0.05;
  const variance = 1 + ((rng()*2-1) * rarity.variance);
  const mainValue = Math.max(1, Math.round(base.v * rarity.mult * lvlFactor * variance));

  const affixes = [{stat: base.stat, value: mainValue, label: '主屬性'}];
  if(rarity.affixCount > 0){
    const extras = pickRoleAffixes(rng, base.role, rarity.affixCount, rarity, itemLevel);
    affixes.push(...extras);
  }

  return {
    uid: 'eq_'+Math.floor(rng()*1e9),
    slot,
    name: rarity.name + base.n,
    baseName: base.n,
    material: base.mat,
    role: base.role,
    stat: base.stat,
    value: mainValue,
    affixes,
    // 相容舊欄位
    extraStat: affixes[1] ? affixes[1].stat : null,
    extraValue: affixes[1] ? affixes[1].value : 0,
    rarity: rarity.id,
    rarityName: rarity.name,
    rarityHex: rarity.hex,
    itemLevel,
    seed: base.n + rarity.id + Math.floor(rng()*999)
  };
}

function rollUniqueEquip(rng, itemLevel){
  const template = choice(rng, UNIQUE_ITEMS);
  const rarity = RARITIES.find(r=>r.id==='unique');
  const lvlFactor = 1 + Math.max(0, (itemLevel||1)-1) * 0.04;
  const mainValue = Math.max(1, Math.round(template.v * rarity.mult * lvlFactor));
  const affixes = [{stat: template.stat, value: mainValue, label: '主屬性'}];
  template.aff.forEach(a=>{
    affixes.push({
      stat: a.stat,
      value: Math.max(1, Math.round(a.v * (0.95 + rng()*0.15) * lvlFactor)),
      label: a.label
    });
  });
  // 唯一以 baseName 判斷持有；uid 仍唯一避免 DOM/filter 衝突
  return {
    uid: 'unique_'+template.n+'_'+Math.floor(rng()*1e6),
    slot: template.slot,
    name: '【唯一】'+template.n,
    baseName: template.n,
    material: template.mat,
    role: template.role,
    stat: template.stat,
    value: mainValue,
    affixes,
    extraStat: affixes[1]?affixes[1].stat:null,
    extraValue: affixes[1]?affixes[1].value:0,
    rarity: 'unique',
    rarityName: '唯一',
    rarityHex: rarity.hex,
    itemLevel: itemLevel||1,
    isUnique: true,
    seed: 'unique_'+template.n
  };
}

function equipPrice(item){
  if(!item) return 0;
  const r = rarityById(item.rarity);
  const affixSum = (item.affixes||[]).reduce((s,a)=>s+(a.value||0),0);
  const base = item.value || 0;
  return Math.max(8, Math.round((base*8 + affixSum*6) * (r.mult||1) + (item.itemLevel||1)*3));
}

/** 把舊裝備資料升級成新 affixes 格式（避免把新「常用 common」誤映射成「一般」） */
function normalizeItem(item){
  if(!item || item.slot==='potion') return item;
  const isLegacy = !item.affixes || !item.affixes.length;
  // 僅舊存檔（沒有 affixes）才做稀有度對照：舊 common(普通)→normal(一般)
  if(isLegacy && RARITY_LEGACY_MAP[item.rarity]){
    item.rarity = RARITY_LEGACY_MAP[item.rarity];
    const r = rarityById(item.rarity);
    item.rarityName = r.name;
    item.rarityHex = r.hex;
  } else if(item.rarity){
    // 確保 rarityName/hex 與現行表一致
    const r = rarityById(item.rarity);
    if(!item.rarityName) item.rarityName = r.name;
    if(!item.rarityHex) item.rarityHex = r.hex;
  }
  if(isLegacy){
    item.affixes = [];
    if(item.stat && item.value) item.affixes.push({stat:item.stat, value:item.value, label:'主屬性'});
    if(item.extraStat && item.extraValue) item.affixes.push({stat:item.extraStat, value:item.extraValue, label:'附加'});
  }
  return item;
}

/** 安全加入背包：正規化 + 唯一裝備不重複 */
function addToInventory(item){
  if(!item) return false;
  if(item.slot==='potion'){
    addPotion(item.kind, item.value, item.name);
    return true;
  }
  normalizeItem(item);
  if(item.isUnique || item.rarity==='unique'){
    const nameKey = item.baseName || item.name;
    const exists = S.inventory.some(i=>i.baseName===nameKey || i.name===item.name) ||
      S.party.some(p=>Object.values(p.equip||{}).some(eq=>eq && (eq.baseName===nameKey || eq.name===item.name)));
    if(exists){
      if(S && S.log) S.log.unshift('【唯一】'+nameKey+' 已擁有，無法再取得。');
      return false;
    }
  }
  S.inventory.push(item);
  return true;
}

/** 從裝備加總某一屬性（支援 affixes 陣列 + 舊格式） */
function equipBonus(m, stat){
  let v = 0;
  if(!m.equip) return 0;
  Object.values(m.equip).forEach(eq=>{
    if(!eq) return;
    if(eq.affixes && eq.affixes.length){
      eq.affixes.forEach(a=>{ if(a.stat===stat) v += a.value||0; });
    } else {
      if(eq.stat===stat) v += eq.value||0;
      if(eq.extraStat===stat) v += eq.extraValue||0;
    }
  });
  return v;
}

/**
 * 主屬性加成公式（明確可見）
 * 力量 STR → 物理攻擊
 * 體質 CON → 生命上限、少量防禦
 * 敏捷 AGI → 速度
 * 智力 INT → 魔力上限、魔法攻擊
 */
const ATTR_FORMULA = {
  strToAtk: 1.2,
  conToHp: 5,
  conToDef: 0.4,
  agiToSpd: 1.1,
  intToMp: 3,
  intToMatk: 1.4
};

function computeStats(m){
  const lv = clamp(num(m.level, 1), 1, MAX_PLAYER_LEVEL);
  if(!Number.isFinite(Number(m.level)) || Number(m.level) < 1) m.level = lv;
  // 基礎戰鬥屬性（職業層）
  let maxHp = COMMONER.base.hp + COMMONER.grow.hp*(lv-1);
  let maxMp = COMMONER.base.mp + COMMONER.grow.mp*(lv-1);
  let atk = COMMONER.base.atk + COMMONER.grow.atk*(lv-1);
  let def = COMMONER.base.def + COMMONER.grow.def*(lv-1);
  let spd = COMMONER.base.spd + COMMONER.grow.spd*(lv-1);
  let matk = 5 + lv * 0.6; // 基礎魔攻

  // 主屬性基礎：每人都有，隨等級成長
  let str = 5 + Math.floor((lv-1)*0.4);
  let con = 5 + Math.floor((lv-1)*0.4);
  let agi = 5 + Math.floor((lv-1)*0.4);
  let intel = 5 + Math.floor((lv-1)*0.4); // int 是保留字，用 intel

  const layers = [];
  if(m.professionId){
    const p = PROFESSIONS.find(x=>x.id===m.professionId);
    if(p) layers.push({def:p, atLevel:m.professionLevel||lv});
  }
  if(m.classId){
    const c = CLASSES.find(x=>x.id===m.classId);
    if(c) layers.push({def:c, atLevel:m.classLevel||lv});
    if(c && m.advId){
      const a = c.advancements.find(x=>x.id===m.advId);
      if(a) layers.push({def:a, atLevel:m.advLevel||lv});
    }
  }
  layers.forEach(({def:d, atLevel})=>{
    if(!d || !d.statBonus || !d.growBonus) return;
    const since = Math.max(0, lv-atLevel);
    maxHp += d.statBonus.hp + d.growBonus.hp*since;
    maxMp += d.statBonus.mp + d.growBonus.mp*since;
    atk += d.statBonus.atk + d.growBonus.atk*since;
    def += d.statBonus.def + d.growBonus.def*since;
    spd += d.statBonus.spd + d.growBonus.spd*since;
    // 依職業偏向主屬性
    if(d.statBonus.atk > d.statBonus.mp) str += Math.floor((d.statBonus.atk + d.growBonus.atk*since)*0.3);
    if(d.statBonus.hp > 10) con += Math.floor((d.statBonus.hp + d.growBonus.hp*since)*0.08);
    if(d.statBonus.spd > 0) agi += Math.floor((d.statBonus.spd + d.growBonus.spd*since)*0.4);
    if(d.statBonus.mp > 5) intel += Math.floor((d.statBonus.mp + d.growBonus.mp*since)*0.15);
  });

  // 裝備主屬性
  str += equipBonus(m, 'str');
  con += equipBonus(m, 'con');
  agi += equipBonus(m, 'agi');
  intel += equipBonus(m, 'int');

  // 主屬性 → 戰鬥屬性
  atk += str * ATTR_FORMULA.strToAtk;
  maxHp += con * ATTR_FORMULA.conToHp;
  def += con * ATTR_FORMULA.conToDef;
  spd += agi * ATTR_FORMULA.agiToSpd;
  maxMp += intel * ATTR_FORMULA.intToMp;
  matk += intel * ATTR_FORMULA.intToMatk;

  // 裝備直接戰鬥屬性
  maxHp += equipBonus(m, 'hp');
  maxMp += equipBonus(m, 'mp');
  atk += equipBonus(m, 'atk');
  matk += equipBonus(m, 'matk');
  def += equipBonus(m, 'def');
  spd += equipBonus(m, 'spd');

  return {
    maxHp:Math.max(1,Math.round(maxHp)), maxMp:Math.max(0,Math.round(maxMp)),
    atk:Math.max(1,Math.round(atk)), matk:Math.max(1,Math.round(matk)),
    def:Math.max(0,Math.round(def)), spd:Math.max(1,Math.round(spd)),
    str:Math.max(1,Math.round(str)), con:Math.max(1,Math.round(con)),
    agi:Math.max(1,Math.round(agi)), int:Math.max(1,Math.round(intel))
  };
}
function applyComputedStats(m){
  const s = computeStats(m);
  const dHp = s.maxHp - num(m.maxHp, 0);
  const dMp = s.maxMp - num(m.maxMp, 0);
  m.maxHp=s.maxHp; m.maxMp=s.maxMp;
  m.atk=s.atk; m.matk=s.matk; m.def=s.def; m.spd=s.spd;
  m.str=s.str; m.con=s.con; m.agi=s.agi; m.int=s.int;
  m.hp = clamp(num(m.hp, 0)+dHp, 0, m.maxHp);
  m.mp = clamp(num(m.mp, 0)+dMp, 0, m.maxMp);
}
function setProfession(m, professionId){
  m.professionId = professionId;
  m.professionLevel = m.level;
  applyComputedStats(m);
}
function setClass(m, classId){
  m.classId = classId;
  m.classLevel = m.level;
  applyComputedStats(m);
}
function setAdvancement(m, advId){
  m.advId = advId;
  m.advLevel = m.level;
  applyComputedStats(m);
}
function classPassive(m){
  if(!m.classId) return null;
  const cls = CLASSES.find(c=>c.id===m.classId);
  return (cls && cls.passive) || null;
}
function hasPassive(m, id){
  const p = classPassive(m);
  return !!(p && p.id===id);
}
function displayClassName(m){
  if(m.advId && m.classId){
    const cls = CLASSES.find(c=>c.id===m.classId);
    const adv = cls && cls.advancements ? cls.advancements.find(a=>a.id===m.advId) : null;
    if(adv) return adv.name;
  }
  if(m.classId){
    const cls = CLASSES.find(c=>c.id===m.classId);
    if(cls) return cls.name;
  }
  if(m.professionId){
    const prof = PROFESSIONS.find(p=>p.id===m.professionId);
    if(prof) return prof.name;
  }
  return COMMONER.name;
}
function getSkills(m){
  let skills = COMMONER.skills.slice();
  if(m.professionId){
    const prof = PROFESSIONS.find(p=>p.id===m.professionId);
    if(prof && prof.skill) skills.push(prof.skill);
  }
  if(m.classId){
    const cls = CLASSES.find(c=>c.id===m.classId);
    if(cls && cls.skills) skills = skills.concat(cls.skills);
    if(cls && m.advId){
      const adv = cls.advancements.find(a=>a.id===m.advId);
      if(adv && adv.skill) skills.push(adv.skill);
    }
  }
  return skills;
}
function buildMember(name, level){
  const m = {
    uid:'m_'+Math.floor(Math.random()*1e9),
    name,
    professionId:null, professionLevel:null,
    classId:null, classLevel:null,
    advId:null, advLevel:null,
    level: level||1, exp:0, nextExp: expForLevel(level||1),
    maxHp:0, hp:0, maxMp:0, mp:0,
    atk:0, matk:0, def:0, spd:0,
    str:0, con:0, agi:0, int:0,
    equip:{weapon:null,armor:null,accessory:null,accessory2:null},
    buffDef:0, buffTurns:0, guarding:false, taunting:false,
    usedGuardianAngel:false
  };
  applyComputedStats(m);
  m.hp = m.maxHp; m.mp = m.maxMp;
  return m;
}
function memberPalette(m){
  if(m.classId){
    const cls = CLASSES.find(c=>c.id===m.classId);
    if(cls) return cls.palette;
  }
  if(m.professionId){
    const prof = PROFESSIONS.find(p=>p.id===m.professionId);
    if(prof) return prof.palette;
  }
  return COMMONER.palette;
}
function expForLevel(lv){
  lv = clamp(lv, 1, MAX_PLAYER_LEVEL);
  return Math.round(30 * Math.pow(lv, 1.5) * (1 + lv * 0.008));
}
function statTotal(m, stat){
  // 裝備與主屬性已計入 m.*，此處只加戰鬥中臨時 buff
  let v;
  if(stat==='hp') v = m.maxHp;
  else if(stat==='mp') v = m.maxMp;
  else if(stat==='matk') v = m.matk || m.atk || 1;
  else if(stat==='atk') v = (m.atk||0) - num(m.atkDebuff, 0);
  else if(stat==='spd') v = (m.spd||0) - num(m.spdDebuff, 0);
  else v = m[stat];
  if(stat==='def' && m.buffTurns>0) v = num(v,0) + num(m.buffDef,0);
  return Math.max(0, num(v, 0));
}
function evaluateEvolution(m){
  if(m.level>=PROFESSION_LEVEL && !m.professionId){ S.pendingStage='profession'; return; }
  if(m.level>=CLASS_LEVEL && m.professionId && !m.classId){ S.pendingStage='class'; return; }
  if(m.level>=BRANCH_LEVEL && m.classId && !m.advId){ S.pendingStage='branch'; return; }
}
function autoEvolveAll(m, log){
  if(m.level>=PROFESSION_LEVEL && !m.professionId){
    const prof = choice(Math.random, PROFESSIONS);
    setProfession(m, prof.id);
    log.push(m.name+' 踏上了 ['+prof.name+'] 之路！');
  }
  if(m.level>=CLASS_LEVEL && m.professionId && !m.classId){
    const prof = PROFESSIONS.find(p=>p.id===m.professionId);
    if(prof && prof.leadsTo){
      const opts = CLASSES.filter(c=>prof.leadsTo.includes(c.id));
      if(opts.length){
        const cls = choice(Math.random, opts);
        setClass(m, cls.id);
        log.push(m.name+' 覺醒為 ['+cls.name+']！');
      }
    }
  }
  if(m.level>=BRANCH_LEVEL && m.classId && !m.advId){
    const cls = CLASSES.find(c=>c.id===m.classId);
    if(cls && cls.advancements && cls.advancements.length){
      const adv = choice(Math.random, cls.advancements);
      setAdvancement(m, adv.id);
      log.push(m.name+' 進一步覺醒為 ['+adv.name+']！');
    }
  }
}
function gainExp(m, amt, log){
  if(m.level >= MAX_PLAYER_LEVEL){
    m.exp = 0;
    m.nextExp = expForLevel(MAX_PLAYER_LEVEL);
    return;
  }
  m.exp += amt;
  while(m.exp >= m.nextExp && m.level < MAX_PLAYER_LEVEL){
    m.exp -= m.nextExp;
    m.level++;
    applyComputedStats(m);
    m.nextExp = expForLevel(m.level);
    log.push(m.name+' 升到了 Lv.'+m.level+'！');
    if(m.isHero){
      evaluateEvolution(m);
    } else {
      autoEvolveAll(m, log);
    }
  }
  if(m.level >= MAX_PLAYER_LEVEL){
    m.level = MAX_PLAYER_LEVEL;
    m.exp = 0;
    m.nextExp = expForLevel(MAX_PLAYER_LEVEL);
    log.push(m.name+' 已達等級上限 '+MAX_PLAYER_LEVEL+'！');
  }
}

/* ============ 戰鬥系統 ============ */
function startBattle(){
  const rng = Math.random;
  const avgLevel = avgPartyLevel();
  const availableTiers = [1];
  if(avgLevel>=4) availableTiers.push(2);
  if(avgLevel>=10) availableTiers.push(3);
  if(avgLevel>=18) availableTiers.push(4);
  // Boss 僅 50 等後出現
  const bossRoll = avgLevel>=50 && rng()<0.08;
  let pool = bossRoll
    ? MONSTER_TYPES.filter(m=>m.boss)
    : MONSTER_TYPES.filter(m=>!m.boss && availableTiers.includes(m.tier));
  if(pool.length===0) pool = MONSTER_TYPES.filter(m=>m.tier===1 && !m.boss);

  let count;
  if(bossRoll){
    count = 1;
  } else {
    // 隨等級可遇到更多怪，上限 6
    let maxC = 2;
    if(avgLevel>=8) maxC = 3;
    if(avgLevel>=15) maxC = 4;
    if(avgLevel>=25) maxC = 5;
    if(avgLevel>=35) maxC = MAX_MONSTER_PARTY;
    count = rint(rng, 1, maxC);
  }
  const monsters=[];
  for(let i=0;i<count;i++){
    const tmpl = choice(rng, pool);
    // 精英：非 Boss、20 等後約 12%（高等更高）
    const eliteChance = avgLevel>=20 ? Math.min(0.08 + (avgLevel-20)*0.002, 0.22) : 0;
    const elite = !bossRoll && rng() < eliteChance;
    monsters.push(makeMonster(tmpl, avgLevel, rng, { elite }));
  }
  S.party.forEach(m=>{
    m.usedGuardianAngel=false;
    m.taunting=false; m.buffDef=0; m.buffTurns=0;
    m.skipTurn=false; m.atkDebuff=0; m.spdDebuff=0;
  });
  S.battle = {
    monsters, turnLog:[], selectedActor:null, selectedAction:null, over:false, win:null,
    order: buildTurnOrder(monsters), turnIndex:0, roundNum:1
  };
  if(bossRoll){
    S.battle.turnLog.unshift('⚠ 強大的 Boss「'+monsters[0].name+'」擋在前方！');
  }
  S.screen='battle';
  advanceBattleTurn(true);
  render();
}
function buildTurnOrder(monsters){
  const combatants = [...S.party.filter(m=>m.hp>0).map(m=>({type:'party',ref:m})), ...monsters.filter(m=>m.hp>0).map(m=>({type:'monster',ref:m}))];
  combatants.sort((a,b)=> statTotal2(b)-statTotal2(a));
  return combatants;
}
function statTotal2(c){ return c.type==='party'? statTotal(c.ref,'spd') : c.ref.spd; }
function advanceBattleTurn(first){
  const b = S.battle;
  if(!b || b.over) return;
  // rebuild order excluding dead
  b.order = buildTurnOrder(b.monsters);
  if(b.order.length===0){ return; }
  if(!first) b.turnIndex++;
  if(b.turnIndex >= b.order.length){
    b.turnIndex=0; b.roundNum++;
    S.party.forEach(m=>{
      if(m.buffTurns>0){
        m.buffTurns--;
        if(m.buffTurns<=0){ m.buffTurns=0; m.buffDef=0; m.taunting=false; }
      }
      // 玩家中毒結算（怪物毒觸／Boss 瘟疫等）
      if(m.hp>0 && m.status==='poison' && m.statusTurns>0){
        const dmg = Math.max(1, Math.round(m.maxHp * 0.05));
        m.hp = clamp(m.hp - dmg, 0, m.maxHp);
        b.turnLog.unshift(m.name+' 受到中毒侵蝕，損失 '+dmg+' HP。');
        m.statusTurns--;
        if(m.statusTurns<=0) m.status=null;
        if(m.hp===0){
          const guardian = S.party.find(p=>p.hp>0 && hasPassive(p,'guardianAngel') && !p.usedGuardianAngel);
          if(guardian){
            m.hp=1; guardian.usedGuardianAngel=true;
            b.turnLog.unshift('⚜️ '+guardian.name+' 的守護天使發動，'+m.name+' 保住 1 HP！');
          } else {
            b.turnLog.unshift(m.name+' 中毒倒下了！');
          }
        }
      }
      if(m.hp>0 && m.maxMp>0 && m.mp < m.maxMp){
        const baseRegen = Math.max(1, Math.round(m.maxMp*0.04));
        const bonusRegen = hasPassive(m,'manaRegen') ? Math.max(1, Math.round(m.maxMp*0.06)) : 0;
        const regen = baseRegen + bonusRegen;
        m.mp = clamp(m.mp+regen, 0, m.maxMp);
        if(bonusRegen>0) b.turnLog.unshift(m.name+' 的魔力自然涌動，回復 '+regen+' MP。');
      }
    });
  }
  const current = b.order[b.turnIndex];
  if(!current || (current.type==='party'&&current.ref.hp<=0) || (current.type==='monster'&&current.ref.hp<=0)){
    return advanceBattleTurn(false);
  }
  if(current.type==='monster'){
    tickMonsterStatus(current.ref);
    checkBattleEnd();
    if(!b.over && current.ref.hp>0){
      monsterAct(current.ref);
      checkBattleEnd();
    }
    if(!b.over) setTimeout(()=>{ advanceBattleTurn(false); render(); }, 550);
  }
}
function tickMonsterStatus(mon){
  const b=S.battle;
  if(mon.hasRegen && mon.hp>0 && mon.hp<mon.maxHp){
    const rate = mon.regenRate || 0.05;
    const heal = Math.max(1, Math.round(mon.maxHp*rate));
    mon.hp = clamp(mon.hp+heal, 0, mon.maxHp);
    b.turnLog.unshift(mon.name+' 再生，恢復 '+heal+' HP。');
  }
  if(mon.auraBurn && mon.hp>0){
    S.party.forEach(p=>{
      if(p.hp<=0) return;
      const bd = Math.max(1, Math.round(p.maxHp * mon.auraBurn));
      p.hp = clamp(p.hp-bd, 0, p.maxHp);
      b.turnLog.unshift(mon.name+' 的燃燒光環灼傷了 '+p.name+'（'+bd+'）。');
    });
  }
  if(mon.status==='poison' && mon.statusTurns>0){
    const dmg = Math.max(1, Math.round(mon.maxHp*(mon.poisonHeavy?0.09:0.06)));
    mon.hp = clamp(mon.hp-dmg,0,mon.maxHp);
    b.turnLog.unshift(mon.name+' 受到中毒侵蝕，損失 '+dmg+' HP。');
    mon.statusTurns--;
    if(mon.statusTurns<=0) mon.status=null;
    checkKillReward(mon, b);
    if(mon.hp===0) b.turnLog.unshift(mon.name+' 被毒素侵蝕殆盡而倒下了！');
  }
  if(mon.marked && mon.markTurns>0){
    mon.markTurns--;
    if(mon.markTurns<=0){
      mon.marked=false; mon.markMult=1; mon.markTurns=0;
      b.turnLog.unshift(mon.name+' 身上的追蹤標記消散了。');
    }
  }
}
/** 對怪物結算傷害（閃避／抗性／護盾／荊棘／不死／死亡爆炸） */
function applyDamageToMonster(actor, mon, rawDmg, isMagic, b){
  if(!mon || mon.hp<=0) return 0;
  // 防禦：任何上游 NaN 傷害在此截斷
  mon.maxHp = Math.max(1, num(mon.maxHp, 1));
  mon.hp = clamp(num(mon.hp, mon.maxHp), 0, mon.maxHp);
  let dmg = Math.max(0, num(rawDmg, 0));
  if(!Number.isFinite(dmg) || dmg < 0) dmg = 0;
  if(!isMagic && mon.evade && Math.random() < mon.evade){
    b.turnLog.unshift(mon.name+' 閃避了攻擊！');
    return 0;
  }
  if(!isMagic && mon.physResist) dmg = Math.max(1, Math.round(dmg * (1 - num(mon.physResist, 0))));
  if(isMagic && mon.magResist) dmg = Math.max(1, Math.round(dmg * (1 - num(mon.magResist, 0))));
  if(mon.shieldCharges > 0){
    const red = mon.shieldReduce != null ? num(mon.shieldReduce, 0.5) : 0.5;
    dmg = Math.max(1, Math.round(dmg * (1 - red)));
    mon.shieldCharges--;
    b.turnLog.unshift(mon.name+' 的護盾抵銷了部分傷害（剩餘 '+mon.shieldCharges+'）。');
  }
  if(dmg > 0) mon.hp = clamp(mon.hp - dmg, 0, mon.maxHp);
  if(mon.thorns && actor && actor.hp > 0){
    const ref = Math.max(1, Math.round(dmg * mon.thorns));
    actor.hp = clamp(actor.hp - ref, 0, actor.maxHp);
    b.turnLog.unshift(mon.name+' 反彈了 '+ref+' 點傷害！');
  }
  if(mon.hp <= 0 && mon.undying){
    mon.undying = false;
    mon.hp = Math.max(1, Math.round(mon.maxHp * 0.2));
    b.turnLog.unshift(mon.name+' 的不死之力發動，以殘血重生！');
  }
  if(mon.hp <= 0 && mon.deathBurst){
    S.party.forEach(p=>{
      if(p.hp<=0) return;
      const bd = Math.max(1, Math.round(p.maxHp * mon.deathBurst));
      p.hp = clamp(p.hp - bd, 0, p.maxHp);
    });
    b.turnLog.unshift(mon.name+' 死亡時發生爆炸，波及全隊！');
  }
  return dmg;
}
function effectiveMonAtk(mon){
  let atk = mon.atk;
  if(mon.enrageAt && mon.hp <= mon.maxHp * mon.enrageAt){
    atk = Math.round(atk * (mon.enrageMult || 1.5));
  }
  return atk;
}
function runBossMechanic(mon, b){
  if(!mon.boss || !mon.mech) return;
  mon.bossTurns = (mon.bossTurns || 0) + 1;
  const t = mon.bossTurns;
  const party = S.party.filter(p=>p.hp>0);
  if(!party.length) return;
  switch(mon.mech){
    case 'inferno':
      if(t % 3 === 0){
        party.forEach(p=>{ const d=Math.max(1,Math.round(mon.atk*0.7)); p.hp=clamp(p.hp-d,0,p.maxHp); });
        b.turnLog.unshift(mon.name+' 釋放【煉獄吐息】，全隊受到火焰傷害！');
      }
      break;
    case 'void':
      if(t % 4 === 0){
        const p = choice(Math.random, party);
        p.mp = clamp(p.mp - Math.round(p.maxMp*0.25), 0, p.maxMp);
        b.turnLog.unshift(mon.name+' 的【虛空汲取】抽走了 '+p.name+' 的魔力！');
      }
      break;
    case 'reaper':
      if(mon.hp < mon.maxHp*0.4 && !mon._reaperBuff){
        mon._reaperBuff=true; mon.atk=Math.round(mon.atk*1.35);
        b.turnLog.unshift(mon.name+' 進入【收割】狀態，攻擊大幅提升！');
      }
      break;
    case 'tide':
      if(t % 3 === 0){
        mon.hp = clamp(mon.hp + Math.round(mon.maxHp*0.06), 0, mon.maxHp);
        b.turnLog.unshift(mon.name+' 藉【潮汐】恢復了生命！');
      }
      break;
    case 'roots':
      if(t % 3 === 0){
        const p = choice(Math.random, party);
        p.skipTurn = true;
        b.turnLog.unshift(mon.name+' 的【纏繞根須】困住了 '+p.name+'！');
      }
      break;
    case 'colossus':
      if(t === 1){ mon.shieldCharges = (mon.shieldCharges||0)+3; mon.shieldReduce=0.4; b.turnLog.unshift(mon.name+' 展開【鋼鐵結界】！'); }
      break;
    case 'bloodmoon':
      if(t % 2 === 0){
        const d = Math.max(1, Math.round(mon.atk*0.9));
        const p = choice(Math.random, party);
        p.hp = clamp(p.hp-d,0,p.maxHp);
        mon.hp = clamp(mon.hp+Math.round(d*0.5),0,mon.maxHp);
        b.turnLog.unshift(mon.name+' 【血月噬咬】造成 '+d+' 傷害並吸血！');
      }
      break;
    case 'frost':
      if(t % 3 === 0){
        party.forEach(p=>{ p.spdDebuff = (p.spdDebuff||0)+2; });
        b.turnLog.unshift(mon.name+' 的【永凍】減慢了全隊速度！');
      }
      break;
    case 'plague':
      if(t % 2 === 0){
        const p = choice(Math.random, party);
        p.status = 'poison'; p.statusTurns = 3;
        b.turnLog.unshift(mon.name+' 散播【瘟疫】，'+p.name+' 中毒了！');
      }
      break;
    case 'shadowcourt':
      if(t % 4 === 0){ mon.evade = Math.min(0.5, (mon.evade||0)+0.15); b.turnLog.unshift(mon.name+' 隱入【影殿】，閃避提升！'); }
      break;
    case 'titan':
      if(t % 3 === 0){
        party.forEach(p=>{ const d=Math.max(1,Math.round(mon.atk*0.55)); p.hp=clamp(p.hp-d,0,p.maxHp); });
        b.turnLog.unshift(mon.name+' 【熔核重踏】震擊全隊！');
      }
      break;
    case 'kraken':
      if(t % 3 === 0){
        party.forEach(p=>{ p.hp=clamp(p.hp-Math.max(1,Math.round(mon.atk*0.4)),0,p.maxHp); });
        b.turnLog.unshift(mon.name+' 的【觸手拍擊】掃過全隊！');
      }
      break;
    case 'boneking':
      if(t % 4 === 0){
        mon.def = Math.round(mon.def*1.15);
        b.turnLog.unshift(mon.name+' 召喚骨牆，防禦上升！');
      }
      break;
    case 'berserk':
      if(mon.hp < mon.maxHp*0.5 && !mon._berserk){
        mon._berserk=true; mon.atk=Math.round(mon.atk*1.5); mon.def=Math.round(mon.def*0.8);
        b.turnLog.unshift(mon.name+' 陷入【狂戰】！');
      }
      break;
    case 'starseal':
      if(t % 5 === 0){
        party.forEach(p=>{ p.mp = clamp(p.mp - 15, 0, p.maxMp); });
        b.turnLog.unshift(mon.name+' 【星隕封印】壓制全隊魔力！');
      }
      break;
    case 'nightmare':
      if(t % 3 === 0){
        const p = choice(Math.random, party);
        p.skipTurn = true;
        b.turnLog.unshift(mon.name+' 織出【夢魘】，'+p.name+' 無法行動！');
      }
      break;
    case 'judgment':
      if(t % 3 === 0){
        const p = party.slice().sort((a,b)=>b.hp-a.hp)[0];
        const d = Math.max(1, Math.round(mon.atk*1.1));
        p.hp = clamp(p.hp-d,0,p.maxHp);
        b.turnLog.unshift(mon.name+' 【聖焰審判】點名了 '+p.name+'（'+d+'）！');
      }
      break;
    case 'garden':
      if(t % 3 === 0){
        mon.hp = clamp(mon.hp + Math.round(mon.maxHp*0.08), 0, mon.maxHp);
        party.forEach(p=>{ if(Math.random()<0.4){ p.status='poison'; p.statusTurns=2; } });
        b.turnLog.unshift(mon.name+' 的【腐朽花園】蔓延，回復並散播毒素！');
      }
      break;
  }
}
/* ============================================================
 * 戰鬥公式（J 技能重做核心）
 * ------------------------------------------------------------
 * 物理：max(1, round( 物攻 × 倍率 − 敵防 × 0.50 × (1−穿甲比例) ))
 * 魔法：max(1, round( 魔攻 × 倍率 − 敵防 × 0.25 ))
 * 治療：round( 魔攻 × 係數 + 智力 × 0.6 + 等級 × 2 )
 * 自癒：round( 自身最大HP × 係數 )，可附帶回 MP
 * 暴擊率：基礎 8% + 敏捷 × 0.4%（技能可覆寫），暴擊傷害 ×1.6
 * 標記：結算後再 × markMult
 * 聖光：對 undead / shadow 額外 ×1.25
 * 普通攻擊：物攻 × (0.9~1.2 隨機)
 * ============================================================ */
const CF = {
  PHYS_DEF: 0.32,
  MAG_DEF: 0.18,
  PHYS_FLOOR: 0.28,
  MAG_FLOOR: 0.30,
  CRIT_MULT: 1.6,
  BASE_CRIT: 0.08,
  AGI_CRIT: 0.004,
  HOLY_BONUS: 1.25,
  PIERCE_RATIO: 0.30,
  ATK_VAR_MIN: 0.90,
  ATK_VAR_MAX: 1.20
};
const EVIL_TYPES = ['undead','shadow'];
function isEvilMon(mon){ return !!(mon && EVIL_TYPES.indexOf(mon.type)>=0); }
function critChance(actor, sk){
  if(sk && sk.crit != null) return clamp(sk.crit, 0, 0.95);
  return clamp(CF.BASE_CRIT + (actor.agi||0) * CF.AGI_CRIT, 0, 0.75);
}
function rollCrit(actor, sk){ return Math.random() < critChance(actor, sk); }
function pierceIgnore(actor, targetDef){
  return hasPassive(actor,'pierce') ? targetDef * CF.PIERCE_RATIO : 0;
}
function markMultOf(target){
  let m = (target && target.marked && target.markMult) ? target.markMult : 1;
  if(target && target.markVulnerable && m > 1) m *= target.markVulnerable;
  return m;
}
/** 物理傷害。opts: {mult, variance, canCrit, sk, forceCrit} */
function calcPhysDmg(actor, target, opts){
  opts = opts || {};
  const mult = num(opts.mult != null ? opts.mult : 1, 1);
  const atk = Math.max(1, num(statTotal(actor,'atk'), 1));
  const def = Math.max(0, num(target && target.def, 0));
  const ignore = num(pierceIgnore(actor, def), 0);
  let variance = 1;
  if(opts.variance){
    variance = CF.ATK_VAR_MIN + Math.random() * (CF.ATK_VAR_MAX - CF.ATK_VAR_MIN);
  }
  const raw = atk * mult * variance;
  const mitigated = raw - (def - ignore) * CF.PHYS_DEF;
  const floor = raw * (CF.PHYS_FLOOR != null ? CF.PHYS_FLOOR : 0.28);
  let dmg = Math.max(1, Math.round(Math.max(floor, mitigated)));
  const didCrit = opts.forceCrit || (opts.canCrit && rollCrit(actor, opts.sk));
  if(didCrit) dmg = Math.round(dmg * CF.CRIT_MULT);
  dmg = Math.round(dmg * num(markMultOf(target), 1));
  return { dmg: Math.max(1, num(dmg, 1)), crit: !!didCrit, marked: markMultOf(target) > 1 };
}
/** 魔法傷害。opts: {mult, holy, sk} */
function calcMagicDmg(actor, target, opts){
  opts = opts || {};
  const mult = num(opts.mult != null ? opts.mult : 1, 1);
  const matk = Math.max(1, num(statTotal(actor,'matk'), 1));
  const def = Math.max(0, num(target && target.def, 0));
  const raw = matk * mult;
  const mitigated = raw - def * CF.MAG_DEF;
  const floor = raw * (CF.MAG_FLOOR != null ? CF.MAG_FLOOR : 0.30);
  let dmg = Math.max(1, Math.round(Math.max(floor, mitigated)));
  if(opts.holy && isEvilMon(target)) dmg = Math.round(dmg * CF.HOLY_BONUS);
  dmg = Math.round(dmg * num(markMultOf(target), 1));
  return { dmg: Math.max(1, num(dmg, 1)), crit: false, marked: markMultOf(target) > 1, holy: !!(opts.holy && isEvilMon(target)) };
}
/** 治療量（單體／群體共用係數） */
function calcHealAmt(actor, healCoef){
  const matk = statTotal(actor,'matk');
  const intel = actor.int || 0;
  return Math.max(1, Math.round(matk * (healCoef||1) + intel * 0.6 + actor.level * 2));
}
function dmgTag(r){
  let t = '';
  if(r.crit) t += '（會心一擊！）';
  if(r.holy) t += '（聖光克邪）';
  if(r.marked) t += '（標記加成）';
  return t;
}

function monsterAct(mon){
  const b=S.battle;
  runBossMechanic(mon, b);
  const aliveParty = S.party.filter(m=>m.hp>0);
  if(aliveParty.length===0) return;

  const attackOnce = (target)=>{
    let atk = Math.max(1, num(effectiveMonAtk(mon), 1));
    if(mon.execute && target.hp < target.maxHp * 0.5) atk = Math.round(atk * num(mon.execute, 1));
    // 怪物打人：攻擊略高方差、防禦折算較低、保底較高 → 有威脅但不秒殺
    const rawM = atk * (0.95 + Math.random()*0.25);
    const mitM = rawM - num(statTotal(target,'def'),0)*0.22;
    let dmg = Math.max(1, Math.round(Math.max(rawM*0.42, mitM)));
    if(mon.arcBonus) dmg = Math.round(dmg * (1 + mon.arcBonus * 0.5));
    let blocked = false;
    if(hasPassive(target,'block') && Math.random()<0.18){
      dmg = Math.max(1, Math.round(dmg*0.65));
      blocked = true;
    }
    target.hp = clamp(target.hp-dmg,0,target.maxHp);
    b.turnLog.unshift(mon.name+' 攻擊了 '+target.name+'，造成 '+dmg+' 點傷害。'+(blocked?'（格擋減傷！）':''));
    if(mon.vampiric){
      const heal = Math.max(1, Math.round(dmg * mon.vampiric));
      mon.hp = clamp(mon.hp+heal, 0, mon.maxHp);
      b.turnLog.unshift(mon.name+' 吸血恢復了 '+heal+' HP。');
    }
    if(mon.poisonTouch){
      target.status = 'poison';
      target.statusTurns = mon.poisonHeavy ? 4 : 3;
      b.turnLog.unshift(target.name+' 中毒了！');
    }
    if(mon.manaBurn){
      const burn = Math.max(3, Math.round(target.maxMp * 0.08));
      target.mp = clamp(target.mp - burn, 0, target.maxMp);
      b.turnLog.unshift(mon.name+' 灼燒了 '+target.name+' 的魔力（-'+burn+' MP）！');
    }
    if(mon.chillTouch){
      target.spdDebuff = (target.spdDebuff||0) + 3;
      b.turnLog.unshift(target.name+' 被寒氣侵襲，速度下降！');
    }
    if(mon.crippleTouch){
      target.atkDebuff = (target.atkDebuff||0) + Math.max(1, Math.round(statTotal(target,'atk')*0.08));
      b.turnLog.unshift(target.name+' 被致殘，攻擊力下降！');
    }
    if(mon.stunChance && Math.random() < mon.stunChance){
      target.skipTurn = true;
      b.turnLog.unshift(target.name+' 被震暈，下回合無法行動！');
    }
    if(target.hp===0){
      const guardian = S.party.find(p=>(p.hp>0 || p.uid===target.uid) && hasPassive(p,'guardianAngel') && !p.usedGuardianAngel);
      if(guardian){
        target.hp = 1;
        guardian.usedGuardianAngel = true;
        b.turnLog.unshift('⚜️ '+guardian.name+' 的守護天使發動，'+target.name+' 奇蹟般保住了 1 點HP！');
      } else {
        b.turnLog.unshift(target.name+' 倒下了！');
      }
    }
  };

  // 選目標：嘲諷（鐵志可無視）
  let tauntTarget = aliveParty.find(m=>m.taunting);
  if(tauntTarget && mon.ignoreTaunt && Math.random() < mon.ignoreTaunt) tauntTarget = null;
  const mainTarget = tauntTarget || choice(Math.random, aliveParty);

  if(mon.aoeAtk && Math.random() < mon.aoeAtk){
    b.turnLog.unshift(mon.name+' 使出橫掃！');
    S.party.filter(m=>m.hp>0).forEach(p=> attackOnce(p));
  } else {
    attackOnce(mainTarget);
    if(mon.doubleAtk && Math.random() < mon.doubleAtk && mainTarget.hp > 0){
      b.turnLog.unshift(mon.name+' 追加連擊！');
      attackOnce(mainTarget);
    }
  }
}
function playerAction(actorUid, action, targetIdx, skillIdx, potionUid){
  const b=S.battle;
  if(!b || b.over) return;
  const actor = S.party.find(m=>m.uid===actorUid);
  if(!actor || actor.hp<=0) return;
  actor.taunting=false;
  if(actor.skipTurn){
    actor.skipTurn=false;
    b.turnLog.unshift(actor.name+' 仍受控無法行動！');
    checkBattleEnd();
    if(!b.over) advanceBattleTurn(false);
    render();
    return;
  }
  if(action==='attack'){
    const target = b.monsters[targetIdx];
    if(!target||target.hp<=0) return;
    const r = calcPhysDmg(actor, target, { mult:1, variance:true, canCrit:true, sk:null });
    const dealt = applyDamageToMonster(actor, target, r.dmg, false, b);
    if(dealt>0) b.turnLog.unshift(actor.name+' 攻擊了 '+target.name+'，造成 '+dealt+' 點傷害'+dmgTag(r)+'。');
    if(hasPassive(actor,'doubleStrike') && target.hp>0 && Math.random()<0.22){
      const r2 = calcPhysDmg(actor, target, { mult:0.55, canCrit:false });
      const d2 = applyDamageToMonster(actor, target, r2.dmg, false, b);
      if(d2>0) b.turnLog.unshift(actor.name+' 觸發追加攻擊，額外造成 '+d2+' 點傷害！');
    }
    if(hasPassive(actor,'virulence') && target.hp>0 && !target.status && Math.random()<0.25){
      target.status='poison'; target.statusTurns=3;
      b.turnLog.unshift(target.name+' 被腐蝕氣息感染，陷入中毒狀態！');
    }
    if(hasPassive(actor,'combatFlow')){
      actor.mp = clamp(actor.mp+4,0,actor.maxMp);
    }
    checkKillReward(target, b);
    if(target.hp===0) b.turnLog.unshift(target.name+' 被擊敗了！');
  } else if(action==='skill'){
    const sk = getSkills(actor)[skillIdx];
    if(!sk){ render(); return; }
    if(actor.mp < sk.mp){ b.turnLog.unshift(actor.name+' 的MP不足以使用 '+sk.name+'！'); render(); return; }
    actor.mp -= sk.mp;
    applySkill(actor, sk, targetIdx, b);
  } else if(action==='item'){
    const item = potionUid ? S.inventory.find(i=>i.uid===potionUid) : S.inventory.find(i=>i.slot==='potion');
    if(!item){ render(); return; }
    const potName = item.name;
    const potVal = item.value;
    const potKind = item.kind;
    if(!consumePotion(item)){ render(); return; }
    if(potKind==='mp'){
      actor.mp = clamp(actor.mp+potVal,0,actor.maxMp);
      b.turnLog.unshift(actor.name+' 使用了 '+potName+'，恢復 '+potVal+' MP。');
    } else {
      actor.hp = clamp(actor.hp+potVal,0,actor.maxHp);
      b.turnLog.unshift(actor.name+' 使用了 '+potName+'，恢復 '+potVal+' HP。');
    }
  } else if(action==='defend'){
    actor.buffDef = Math.round(statTotal(actor,'def')*0.5); actor.buffTurns=1;
    b.turnLog.unshift(actor.name+' 擺出防禦姿態。');
  } else if(action==='flee'){
    const chance = 0.4 + statTotal(actor,'spd')*0.01;
    if(Math.random()<chance){
      b.turnLog.unshift('隊伍成功逃離了戰鬥！');
      b.over=true; b.win='flee';
      routeHome();
      render(); return;
    } else {
      b.turnLog.unshift(actor.name+' 試圖逃跑，但失敗了！');
    }
  }
  checkBattleEnd();
  if(!b.over) advanceBattleTurn(false);
  render();
}
function applySkill(actor, sk, targetIdx, b){
  const type = sk.type;
  if(type==='mark'){
    const target = b.monsters[targetIdx];
    if(!target||target.hp<=0) return;
    target.marked = true;
    target.markTurns = sk.markTurns||3;
    target.markMult = sk.markMult||1.35;
    b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」標記了 '+target.name+'！'+target.markTurns+' 回合內受傷提升 '+Math.round((target.markMult-1)*100)+'%。');
  } else if(type==='phys' || type==='phys_crit'){
    const target = b.monsters[targetIdx];
    if(!target||target.hp<=0) return;
    const skCrit = Object.assign({}, sk, { crit: sk.crit != null ? sk.crit : (type==='phys_crit' ? 0.45 : undefined) });
    const r = calcPhysDmg(actor, target, { mult: sk.mult||1, canCrit:true, sk: skCrit });
    const dealt = applyDamageToMonster(actor, target, r.dmg, false, b);
    if(dealt>0) b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」對 '+target.name+' 造成 '+dealt+' 點傷害'+dmgTag(r)+'。');
    if(sk.poison && target.hp>0){ target.status='poison'; target.statusTurns=sk.poisonTurns||3; b.turnLog.unshift(target.name+' 中毒了！'); }
    checkKillReward(target, b);
    if(target.hp===0) b.turnLog.unshift(target.name+' 被擊敗了！');
  } else if(type==='magic'){
    const target = b.monsters[targetIdx];
    if(!target||target.hp<=0) return;
    const r = calcMagicDmg(actor, target, { mult: sk.mult||1, holy: !!sk.holy });
    const dealt = applyDamageToMonster(actor, target, r.dmg, true, b);
    if(dealt>0) b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」對 '+target.name+' 造成 '+dealt+' 點傷害'+dmgTag(r)+'。');
    checkKillReward(target, b);
    if(target.hp===0) b.turnLog.unshift(target.name+' 被擊敗了！');
  } else if(type==='phys_multi' || type==='phys_multi2'){
    const target = b.monsters[targetIdx];
    if(!target||target.hp<=0) return;
    const hits = sk.hits || (type==='phys_multi' ? 3 : 2);
    let total=0, anyMark=false;
    for(let i=0;i<hits;i++){
      if(target.hp<=0) break;
      const r = calcPhysDmg(actor, target, { mult: sk.mult||1, canCrit: !!sk.canCrit, sk });
      total += applyDamageToMonster(actor, target, r.dmg, false, b);
      if(r.marked) anyMark=true;
    }
    b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」共 '+hits+' 擊，造成 '+total+' 點傷害'+(anyMark?'（標記加成）':'')+'。');
    if(sk.poison && target.hp>0){ target.status='poison'; target.statusTurns=sk.poisonTurns||3; }
    checkKillReward(target, b);
    if(target.hp===0) b.turnLog.unshift(target.name+' 被擊敗了！');
  } else if(type==='magic_aoe' || type==='magic_dot'){
    let total=0;
    b.monsters.forEach(mo=>{
      if(mo.hp<=0) return;
      const r = calcMagicDmg(actor, mo, { mult: sk.mult||1, holy: !!sk.holy });
      total += applyDamageToMonster(actor, mo, r.dmg, true, b);
      if(type==='magic_dot' || sk.poison){ mo.status='poison'; mo.statusTurns=sk.poisonTurns||3; }
      checkKillReward(mo, b);
    });
    b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」對全體造成共 '+total+' 點傷害'+(type==='magic_dot'||sk.poison?'，並附加中毒':'')+'。');
  } else if(type==='heal'){
    const target = S.party[targetIdx];
    if(!target) return;
    let amt = calcHealAmt(actor, sk.heal||1);
    if(hasPassive(actor,'mercyHeal') && target.hp < target.maxHp*0.3) amt = Math.round(amt*1.25);
    target.hp = clamp(target.hp+amt,0,target.maxHp);
    b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」為 '+target.name+' 恢復 '+amt+' HP。');
  } else if(type==='heal_aoe'){
    const amt = calcHealAmt(actor, sk.heal||0.8);
    healParty(S, amt);
    b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」為全隊恢復 '+amt+' HP。');
  } else if(type==='buff'){
    const turns = sk.buffTurns||2;
    const ratio = sk.buffDefRatio != null ? sk.buffDefRatio : 0.20;
    S.party.forEach(m=>{
      if(m.hp>0){ m.buffDef = Math.round(statTotal(m,'def')*ratio); m.buffTurns=turns; }
    });
    b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」，全隊防禦提升 '+Math.round(ratio*100)+'%（'+turns+' 回合）！');
  } else if(type==='guard'){
    const turns = sk.buffTurns||2;
    const ratio = sk.buffDefRatio != null ? sk.buffDefRatio : 0.60;
    actor.taunting=true;
    actor.buffDef=Math.round(statTotal(actor,'def')*ratio);
    actor.buffTurns=turns;
    b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」，嘲諷敵人並提升防禦 '+Math.round(ratio*100)+'%（'+turns+' 回合）！');
  } else if(type==='steal'){
    const target = b.monsters[targetIdx];
    if(!target||target.hp<=0) return;
    const r = calcPhysDmg(actor, target, { mult: sk.mult||1.1, canCrit:false });
    const dealt = applyDamageToMonster(actor, target, r.dmg, false, b);
    const stolen = rint(Math.random, sk.stealMin||5, sk.stealMax||15);
    S.hero.gold += stolen;
    b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」，造成 '+dealt+' 傷害並偷得 '+stolen+' 金幣。');
    checkKillReward(target, b);
    if(target.hp===0) b.turnLog.unshift(target.name+' 被擊敗了！');
  } else if(type==='self_heal'){
    const amt = Math.max(1, Math.round(actor.maxHp * (sk.heal||0.2)));
    const mpGain = sk.mpGain != null ? sk.mpGain : 10;
    actor.hp = clamp(actor.hp+amt,0,actor.maxHp);
    actor.mp = clamp(actor.mp+mpGain,0,actor.maxMp);
    b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」，恢復 '+amt+' HP 與 '+mpGain+' MP。');
  }
  if(hasPassive(actor,'combatFlow') && ['phys','phys_crit','phys_multi','phys_multi2'].includes(type)){
    actor.mp = clamp(actor.mp+5,0,actor.maxMp);
  }
}
function checkKillReward(mon, b){
  if(mon.hp>0 || mon.rewarded) return;
  mon.rewarded = true;
  const affixCount = mon.affixes ? mon.affixes.length : 0;
  const mult = 1 + affixCount*0.2;
  const exp = Math.round(mon.exp*mult);
  const gold = Math.round(mon.gold*mult);
  const log=[];
  // 修復：主角倒地仍拿經驗，避免卡在轉職門檻
  S.party.forEach(m=>{ if(m.isHero || m.hp>0) gainExp(m, exp, log); });
  S.hero.gold += gold;
  b.turnLog.unshift('獲得 '+exp+' 經驗值與 '+gold+' 金幣。'+(affixCount>0?'（詞綴加成 x'+mult.toFixed(1)+'）':''));
  log.forEach(l=> b.turnLog.unshift(l));
}
function checkBattleEnd(){
  const b=S.battle;
  if(b.monsters.every(m=>m.hp<=0)){
    if(!b.over){
      b.over=true; b.win=true;
      b.turnLog.unshift('=== 戰鬥勝利！ ===');
      let dropped=[];
      b.monsters.forEach(m=>{
        const affixCount = m.affixes ? m.affixes.length : 0;
        const dropChance = m.boss?1:(m.elite?0.55:(m.tier>=3?0.5:0.28)) + affixCount*0.08;
        if(Math.random()<dropChance){
          let floor = m.boss ? 'epic' : (m.elite ? 'rare' : null);
          if(affixCount>=3) floor='legend';
          else if(affixCount>=2) floor= floor || 'epic';
          else if(affixCount>=1 && !floor) floor='rare';
          const item = rollEquip(Math.random, floor, m.level);
          if(addToInventory(item)) dropped.push(item.name);
        }
      });
      if(dropped.length) b.turnLog.unshift('掉落裝備：'+dropped.join('、'));
    }
  } else if(S.party.every(m=>m.hp<=0)){
    b.over=true; b.win=false;
    b.turnLog.unshift('=== 隊伍全滅……你們狼狽地撤退了 ===');
    S.party.forEach(m=> m.hp = Math.max(m.hp, Math.round(m.maxHp*0.15)));
    S.hero.gold = Math.round(S.hero.gold*0.7);
    S.shopStock = null; // 復活後商店自動免費刷新一批新商品
  }
}

/* ============ 探索 / 事件 ============ */
function explore(){
  S.daysSurvived++;
  const rng=Math.random;
  const roll = rng();
  if(roll < 0.35){
    startBattle();
  } else if(roll < 0.8){
    const pool = S.party.length>=4 ? EVENTS.filter(e=>e.id!=='wanderer') : EVENTS;
    const ev = choice(rng, pool);
    S.event = ev;
    S.screen='event';
  } else {
    const gold = rint(Math.random,10,30);
    S.hero.gold += gold;
    S.log.unshift('平靜的旅途中，你撿到了 '+gold+' 金幣。');
    routeHome();
  }
  render();
}
function resolveEvent(choiceIdx){
  const ev = S.event;
  const result = ev.choices[choiceIdx].act(S);
  S.log.unshift('【'+ev.title+'】'+result);
  S.event=null;
  routeHome();
  render();
}

/* ============ 裝備 / 背包 ============ */
function equipItem(item, memberUid){
  const m = S.party.find(p=>p.uid===(memberUid||S.invSelectedUid)) || S.hero;
  normalizeItem(item);
  // 唯一裝備：全隊只能有一件（含已裝備）
  if(item.isUnique || item.rarity==='unique'){
    const held = [];
    S.party.forEach(p=>{
      Object.values(p.equip||{}).forEach(eq=>{ if(eq && eq.baseName===item.baseName) held.push({p, eq}); });
    });
    S.inventory.forEach(i=>{ if(i.uid!==item.uid && i.baseName===item.baseName) held.push({inv:true, eq:i}); });
    if(held.length){
      S.log.unshift('【唯一】'+item.baseName+' 全隊僅能持有一件。');
      render();
      return;
    }
  }
  let targetSlot = item.slot;
  if(item.slot==='accessory'){
    targetSlot = !m.equip.accessory ? 'accessory' : (!m.equip.accessory2 ? 'accessory2' : 'accessory');
  }
  const cur = m.equip[targetSlot];
  if(cur) S.inventory.push(cur);
  m.equip[targetSlot]=item;
  S.inventory = S.inventory.filter(i=>i.uid!==item.uid);
  applyComputedStats(m);
  render();
}
function unequipItem(slot, memberUid){
  const m = S.party.find(p=>p.uid===(memberUid||S.invSelectedUid)) || S.hero;
  const cur = m.equip[slot];
  if(cur){ S.inventory.push(cur); m.equip[slot]=null; }
  applyComputedStats(m); // 卸下後重算屬性
  render();
}
function addPotion(kind, value, name){
  const existing = S.inventory.find(i=>i.slot==='potion' && i.kind===kind && i.value===value);
  if(existing){
    existing.count = (existing.count||1) + 1;
    return existing;
  }
  const pot = {
    uid:'pot_'+Math.floor(Math.random()*1e9),
    slot:'potion', kind, value,
    name: name || (kind==='mp' ? '魔力藥水' : '治療藥水'),
    count:1
  };
  S.inventory.push(pot);
  return pot;
}
function consumePotion(item){
  if(!item || item.slot!=='potion') return false;
  const c = item.count||1;
  if(c<=1){
    S.inventory = S.inventory.filter(i=>i.uid!==item.uid);
  } else {
    item.count = c - 1;
  }
  return true;
}
function usePotionOutOfBattle(item, memberUid){
  const m = S.party.find(p=>p.uid===(memberUid||S.invSelectedUid)) || S.hero;
  if(item.slot!=='potion') return;
  if(item.kind==='mp'){ m.mp = clamp(m.mp+item.value,0,m.maxMp); }
  else { m.hp = clamp(m.hp+item.value,0,m.maxHp); }
  consumePotion(item);
  render();
}
/** 合併舊存檔中散落的同款藥水 */
function stackExistingPotions(){
  if(!S || !S.inventory) return;
  const pots = S.inventory.filter(i=>i.slot==='potion');
  const others = S.inventory.filter(i=>i.slot!=='potion');
  const map = {};
  pots.forEach(p=>{
    const key = p.kind+'_'+p.value;
    if(!map[key]){
      map[key] = Object.assign({}, p, {count: p.count||1});
    } else {
      map[key].count += (p.count||1);
    }
  });
  S.inventory = others.concat(Object.values(map));
}

/* ============ 渲染 ============ */
let uiTab = 'inv';
/* ============ 存檔系統（localStorage） ============ */
const SAVE_KEY = 'ashfall_era_save_v1';
function saveGame(){
  if(!S) return;
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){ /* 儲存空間不可用時安靜失敗 */ }
}
function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    S = JSON.parse(raw);
    if(!S || !S.party || !S.party.length){ S=null; return false; }
    // 致命修復：JSON.parse 後 S.hero 與 party[] 變成兩個獨立物件
    // 戰鬥升等改 party，花金幣改 S.hero → 必須合併後綁回同一參考
    const parsedHero = S.hero;
    let hero = S.party.find(m=>m.isHero)
      || (parsedHero && S.party.find(m=>m.uid===parsedHero.uid))
      || S.party[0];
    if(parsedHero && hero){
      if(typeof parsedHero.gold === 'number') hero.gold = parsedHero.gold;
      if(parsedHero.professionId && !hero.professionId){
        hero.professionId = parsedHero.professionId;
        hero.professionLevel = parsedHero.professionLevel;
      }
      if(parsedHero.classId && !hero.classId){
        hero.classId = parsedHero.classId;
        hero.classLevel = parsedHero.classLevel;
      }
      if(parsedHero.advId && !hero.advId){
        hero.advId = parsedHero.advId;
        hero.advLevel = parsedHero.advLevel;
      }
      if((parsedHero.level||0) > (hero.level||0)){
        hero.level = parsedHero.level;
        hero.exp = parsedHero.exp;
        hero.nextExp = parsedHero.nextExp;
        hero.maxHp = parsedHero.maxHp; hero.hp = parsedHero.hp;
        hero.maxMp = parsedHero.maxMp; hero.mp = parsedHero.mp;
        hero.atk = parsedHero.atk; hero.def = parsedHero.def; hero.spd = parsedHero.spd;
        if(parsedHero.equip) hero.equip = parsedHero.equip;
      }
    }
    hero.isHero = true;
    if(typeof hero.gold !== 'number') hero.gold = 0;
    S.hero = hero;
    const idx = S.party.findIndex(m=>m.uid===hero.uid);
    if(idx>=0) S.party[idx] = hero; else S.party.unshift(hero);
    if(!S.inventory) S.inventory = [];
    if(!S.log) S.log = [];
    if(S.pendingStage==null) S.pendingStage = null;
    // 合併舊存檔散落藥水 + 正規化裝備 + 重算屬性
    stackExistingPotions();
    S.inventory.forEach(normalizeItem);
    S.party.forEach(m=>{
      if(!m.equip) m.equip={weapon:null,armor:null,accessory:null,accessory2:null};
      Object.keys(m.equip).forEach(k=>{ if(m.equip[k]) normalizeItem(m.equip[k]); });
      applyComputedStats(m);
    });
    // 戰鬥／事件畫面讀檔不安全 → 強制回營地
    if(S.screen==='battle' || S.screen==='event' || !S.screen){
      S.battle = null;
      S.event = null;
      S.screen = 'hub';
    }
    // 淨化隊伍數值，避免舊存檔 level/hp 異常導致戰鬥 NaN
    S.party.forEach(m=>{
      m.level = Math.max(1, Number.isFinite(Number(m.level)) ? Math.floor(Number(m.level)) : 1);
      if(typeof applyComputedStats === 'function') applyComputedStats(m);
      m.maxHp = Math.max(1, Number(m.maxHp)||1);
      m.hp = Math.max(0, Math.min(Number(m.hp)||0, m.maxHp));
      m.maxMp = Math.max(0, Number(m.maxMp)||0);
      m.mp = Math.max(0, Math.min(Number(m.mp)||0, m.maxMp));
      m.atk = Math.max(1, Number(m.atk)||1);
      m.def = Math.max(0, Number(m.def)||0);
      m.spd = Math.max(1, Number(m.spd)||1);
      if(m.matk != null) m.matk = Math.max(1, Number(m.matk)||1);
    });
    evaluateEvolution(S.hero);
    if(S.pendingStage==='profession') S.screen='evolve-profession';
    else if(S.pendingStage==='class') S.screen='evolve-class';
    else if(S.pendingStage==='branch') S.screen='evolve-branch';
    return true;
  }catch(e){ S=null; return false; }
}
function hasSaveGame(){
  try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; }
}
function deleteSaveGame(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){ /* 忽略 */ }
}
function restartGame(){
  if(!confirm('確定要放棄目前的進度，重新開始一輪新的冒險嗎？此動作無法復原。')) return;
  deleteSaveGame();
  S = null;
  render();
}

function render(){
  const root = document.getElementById('screens');
  if(!S){ root.innerHTML = renderCharCreate(); bindCharCreate(); return; }
  if(S.screen==='hub') { root.innerHTML = renderHub(); bindHub(); }
  else if(S.screen==='battle') { root.innerHTML = renderBattle(); bindBattle(); }
  else if(S.screen==='event') { root.innerHTML = renderEvent(); bindEvent(); }
  else if(S.screen==='inventory') { root.innerHTML = renderInventory(); bindInventory(); }
  else if(S.screen==='shop') { root.innerHTML = renderShop(); bindShop(); }
  else if(S.screen==='tavern') { root.innerHTML = renderTavern(); bindTavern(); }
  else if(S.screen==='party') { root.innerHTML = renderParty(); bindParty(); }
  else if(S.screen==='evolve-profession') { root.innerHTML = renderEvolveProfession(); bindEvolveProfession(); }
  else if(S.screen==='evolve-class') { root.innerHTML = renderEvolveClass(); bindEvolveClass(); }
  else if(S.screen==='evolve-branch') { root.innerHTML = renderEvolveBranch(); bindEvolveBranch(); }
  requestAnimationFrame(paintSprites);
  // 存檔安全範圍：除了「戰鬥中」(battle.order[].ref 需要維持物件參照一致性)
  // 跟「事件選擇中」(event.choices[].act 是函式，無法被JSON序列化)以外，
  // 其他畫面（包含職業覺醒畫面）都是安全的存檔時機。
  if(S.screen!=='battle' && S.screen!=='event') saveGame();
}
let pendingSprites = [];
function queueSprite(id, seed, palette, size){ pendingSprites.push({id,seed,palette,size}); }
function queueEquipIcon(id, seed, kind, color){ pendingSprites.push({id,seed,kind,color,equip:true}); }
function paintSprites(){
  pendingSprites.forEach(p=>{
    const c = document.getElementById(p.id);
    if(!c) return;
    if(p.equip) drawEquipIcon(c, p.seed, p.kind, p.color);
    else drawSprite(c, p.seed, p.palette, p.size||14);
  });
  pendingSprites = [];
}

function renderCharCreate(){
  return `
  <div class="panel" style="text-align:center;">
    <canvas class="sprite" id="cc-commoner" width="72" height="72" style="margin:0 auto;display:block;"></canvas>
    <p class="section-title" style="margin-top:10px;">你是一介平凡的普通人</p>
    <p class="event-text">尚未踏上冒險之路，也還沒有任何專精。<br>
    隨著旅途的歷練，Lv.${PROFESSION_LEVEL} 時可以選擇一項<b style="color:var(--gold)">生活職業</b>（4選1），<br>
    Lv.${CLASS_LEVEL} 時將正式覺醒為<b style="color:var(--gold)">冒險職業</b>（該職業路線的2選1），<br>
    Lv.${BRANCH_LEVEL} 時再進行最終的<b style="color:var(--gold)">職業分支</b>（3選1）。<br>
    每一步的選擇都將深刻影響你的成長方向。</p>
    <button class="btn gold" id="start-btn" style="margin-top:10px;">踏上旅程</button>
  </div>`;
}
function bindCharCreate(){
  queueSprite('cc-commoner', 'commoner_preview', COMMONER.palette, 14);
  document.getElementById('start-btn').addEventListener('click', ()=> newGame());
}

function memberCardHtml(m, idx, opts){
  opts=opts||{};
  const hpPct = Math.round(m.hp/m.maxHp*100);
  const mpPct = m.maxMp? Math.round(m.mp/m.maxMp*100):0;
  const expPct = Math.round(m.exp/m.nextExp*100);
  const spriteId = (opts.prefix||'pc')+'-'+idx;
  if(opts.compact){
    return `
    <div class="member-card member-card-compact ${m.hp<=0?'dead':''} ${opts.activeClass||''}" data-uid="${m.uid}">
      <canvas class="sprite" id="${spriteId}" width="32" height="32"></canvas>
      <div class="member-info">
        <div class="member-name"><span>${esc(m.name)}${m.isHero?'★':''} <span class="small">Lv.${m.level}</span></span><span class="small">${esc(displayClassName(m))}</span></div>
        <div class="bar-wrap"><div class="bar" style="width:${hpPct}%;background:var(--hp)"></div></div>
        <div class="compact-stats"><span>HP ${m.hp}/${m.maxHp}</span>${m.maxMp? `<span>MP ${m.mp}/${m.maxMp}</span>`:''}</div>
        ${m.maxMp? `<div class="bar-wrap bar-wrap-mp"><div class="bar" style="width:${mpPct}%;background:var(--mp)"></div></div>`:''}
      </div>
    </div>`;
  }
  return `
  <div class="member-card ${m.hp<=0?'dead':''} ${opts.activeClass||''}" data-uid="${m.uid}">
