<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>灰燼紀元 - 像素文字RPG</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0a09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
:root{
  --bg-deep:#0c0a09;
  --bg-panel:#1b1512;
  --bg-panel-2:#271f19;
  --line:#4a2f1f;
  --gold:#ff6a35;
  --gold-dim:#8a3a1a;
  --hp:#d4453f;
  --mp:#5b93a8;
  --xp:#8fae52;
  --text:#ece2cc;
  --text-dim:#9c8f7c;
  --common:#9c8f7c;
  --rare:#5b93a8;
  --epic:#a565d6;
  --legend:#ff6a35;
  --mythic:#ff4fa3;
  /* 裝備稀有度色 */
  --r-crude:#6b6358;
  --r-normal:#9c8f7c;
  --r-handy:#a8a090;
  --r-common:#b7c49a;
  --r-uncommon:#5b93a8;
  --r-rare:#4a9fd8;
  --r-scarce:#6b8cff;
  --r-epic:#a565d6;
  --r-legend:#ff6a35;
  --r-mythic:#ff4fa3;
  --r-ancient:#ffd24a;
  --r-unique:#ff3b3b;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
  --touch-min: 44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{background:var(--bg-deep);-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:radial-gradient(ellipse at 50% -10%, #241a13 0%, #0c0a09 62%);
  color:var(--text);
  font-family:'Noto Serif TC',serif;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  padding:18px 10px;
  padding-top:calc(12px + var(--safe-top));
  padding-bottom:calc(18px + var(--safe-bottom));
  position:relative;
  overflow-x:hidden;
}
/* --- 信物：飄升餘燼（Ashfall 的視覺主題） --- */
#embers{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.ember-particle{
  position:absolute; bottom:-5%; width:3px; height:3px; border-radius:50%;
  background:var(--gold); box-shadow:0 0 6px 1px rgba(255,106,53,.8);
  opacity:0; animation:emberRise linear infinite;
}
@keyframes emberRise{
  0%{ transform:translate(0,0) scale(1); opacity:0; }
  8%{ opacity:.55; }
  92%{ opacity:.25; }
  100%{ transform:translate(var(--drift,20px), -108vh) scale(.4); opacity:0; }
}
#app{width:100%;max-width:900px;position:relative;z-index:1;}
.pixel-font{font-family:'Silkscreen',monospace;}
.title-bar{
  text-align:center;margin-bottom:14px;
}
.title-bar h1{
  font-size:16px;letter-spacing:3px;color:var(--gold);
  text-shadow:0 0 10px rgba(255,106,53,.5), 0 0 2px rgba(255,106,53,.8);
  margin:0 0 4px;
  animation:emberGlow 3.2s ease-in-out infinite;
}
@keyframes emberGlow{
  0%,100%{ text-shadow:0 0 10px rgba(255,106,53,.5), 0 0 2px rgba(255,106,53,.8); }
  50%{ text-shadow:0 0 16px rgba(255,106,53,.75), 0 0 3px rgba(255,106,53,1); }
}
.title-bar p{font-size:11px;color:var(--text-dim);margin:0;letter-spacing:1px;}
#game-version-label,.version-tag{color:var(--gold);letter-spacing:0.5px;font-size:10px;}
.panel{
  background:var(--bg-panel);
  border:1px solid var(--line);
  border-top:2px solid var(--gold-dim);
  box-shadow:0 10px 24px -12px rgba(0,0,0,.6);
  padding:14px;
  margin-bottom:12px;
  border-radius:4px;
}
.btn{
  font-family:'Noto Serif TC',serif;
  font-weight:700;
  background:var(--bg-panel-2);
  border:1px solid var(--line);
  color:var(--text);
  padding:10px 14px;
  min-height:var(--touch-min);
  cursor:pointer;
  font-size:14px;
  transition:transform .08s, background .15s, box-shadow .1s;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.06),
    inset 0 -2px 0 rgba(0,0,0,.35),
    0 1px 0 rgba(0,0,0,.4);
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
  border-radius:4px;
}
.btn:hover{background:#33291f;transform:translateY(-1px);}
.btn:active{transform:translateY(1px);box-shadow:inset 0 2px 0 rgba(0,0,0,.4);}
.btn.gold{border-color:var(--gold-dim);color:var(--gold);}
.btn.danger{border-color:#7a2c34;color:#e0655f;}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.grid{display:grid;gap:10px;}
.party-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));}

/* 主畫面隊伍卡：預設更緊湊，減少需滑動才能按到的按鈕 */

/* 酒館：8 人兩排 */

/* 商店：酒館風格卡片格 */
.shop-grid{
  display:grid;
  grid-template-columns:repeat(4, minmax(0,1fr));
  gap:6px;
  margin:6px 0;
}
.shop-card{
  background:var(--bg-panel-2);
  border:1px solid var(--line);
  border-radius:6px;
  padding:6px 4px;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  min-width:0;
}
.shop-card.sold{opacity:.4;}
.shop-card canvas.sprite{width:36px!important;height:36px!important;}
.shop-icon{font-size:22px;line-height:1.2;}
.shop-name{font-size:11px;font-weight:bold;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.shop-stats{font-size:9px;color:var(--text-dim);line-height:1.25;max-width:100%;max-height:2.6em;overflow:hidden;word-break:break-all;}
.shop-card .btn-compact{padding:4px 6px;min-height:28px;font-size:11px;width:100%;}

.tavern-grid{
  display:grid;
  grid-template-columns:repeat(4, minmax(0,1fr));
  gap:6px;
  margin:6px 0;
}
.tavern-card{
  background:var(--bg-panel-2);
  border:1px solid var(--line);
  border-radius:6px;
  padding:6px 4px;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  min-width:0;
}
.tavern-card.recruited{opacity:.45;}
.tavern-card canvas.sprite{width:36px!important;height:36px!important;}
.tavern-name{font-size:11px;font-weight:bold;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tavern-tend{font-size:9px;color:var(--gold);line-height:1.2;}
.tavern-card .btn-compact{padding:4px 6px;min-height:28px;font-size:11px;width:100%;}

/* 過肩對話場景 */
.talk-scene{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  align-items:end;
  min-height:160px;
  margin:8px 0;
  padding:10px;
  background:linear-gradient(180deg, rgba(20,30,40,.9), rgba(10,14,20,.95));
  border:1px solid var(--line);
  border-radius:8px;
  position:relative;
  overflow:hidden;
}
.talk-scene .talk-hero{
  display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;
}
.talk-scene .talk-partner{
  display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;
}
.talk-scene canvas.sprite{width:72px!important;height:72px!important;image-rendering:pixelated;}
.talk-scene .talk-hero canvas{transform:scaleX(-1);opacity:.92;} /* 背影感：水平翻轉 */
.talk-label{font-size:10px;color:var(--text-dim);margin-top:4px;}
.talk-dialog{
  background:var(--bg-panel-2);
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 12px;
  margin-top:8px;
}
.talk-dialog .line{margin:6px 0;line-height:1.45;}
.talk-dialog .speaker{color:var(--gold);font-weight:bold;}
.talk-choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:center;}
.complicity-bar{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-top:3px;}
.complicity-bar > i{display:block;height:100%;background:linear-gradient(90deg,#6af,#d6f);width:0%;}

.hub-party-grid{
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:6px;
  margin:4px 0 2px;
}
.hub-party-grid .member-card-compact{
  padding:4px 6px;
  gap:6px;
  border-left-width:2px;
}
.hub-party-grid .member-card-compact canvas.sprite{
  width:28px !important;
  height:28px !important;
}
.hub-party-grid .member-card-compact .member-name{
  font-size:11px;
  line-height:1.2;
}
.hub-party-grid .member-card-compact .compact-stats{
  font-size:9px;
}
.hub-party-grid .member-card-compact .bar-wrap{height:5px;margin:1px 0;}
.hub-party-grid .member-card-compact .bar-wrap-mp{height:3px;}
.hub-panel .btn-primary{margin-bottom:6px;}
.hub-panel .nav-grid{margin-top:6px;}
.hub-panel + .panel .log-box{height:88px;}

.class-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));}
.class-card{
  background:var(--bg-panel-2);border:1px solid var(--line);border-top:2px solid transparent;
  padding:12px;text-align:center;cursor:pointer;transition:border-color .12s, background .12s;
  border-radius:4px;touch-action:manipulation;
}
.class-card:hover{border-top-color:var(--gold-dim);}
.class-card:active{background:#33291f;}
.class-card.selected{border-top-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
.class-card h3{margin:6px 0 2px;font-size:14px;color:var(--gold);font-weight:700;}
.class-card p{margin:0;font-size:11px;color:var(--text-dim);line-height:1.5;}
canvas.sprite{image-rendering:pixelated;background:#0a0807;border:1px solid var(--line);flex-shrink:0;}
.statline{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 8px;font-size:11px;color:var(--text-dim);margin-top:6px;font-family:'Space Mono','Noto Serif TC',serif;}
.bar-wrap{background:#0a0807;border:1px solid var(--line);height:9px;overflow:hidden;margin:3px 0;border-radius:2px;}
.bar{height:100%;}
.topbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:10px;}
.member-card{
  background:var(--bg-panel-2);border:1px solid var(--line);border-left:3px solid var(--line);
  padding:10px;display:flex;gap:10px;align-items:center;transition:border-color .12s;
  border-radius:4px;
}
.member-card.active-turn{border-left-color:var(--gold);box-shadow:0 0 8px rgba(255,106,53,.15);}
.member-card.dead{opacity:.55;filter:grayscale(.3);}
.member-info{flex:1;min-width:0;}
.member-name{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;}
/* 戰鬥精簡角色卡 — 縮小佔位，留給技能與怪物 */
.member-card-compact{
  padding:5px 8px;gap:6px;border-left-width:2px;
}
.member-card-compact .member-name{font-size:11px;line-height:1.25;margin-bottom:1px;}
.member-card-compact .bar-wrap{height:6px;margin:2px 0;}
.member-card-compact .bar-wrap-mp{height:4px;}
.member-card-compact .compact-stats{
  display:flex;justify-content:space-between;gap:6px;
  font-size:10px;color:var(--text-dim);font-family:'Space Mono','Noto Serif TC',serif;
  line-height:1.2;
}
.member-card-compact canvas.sprite{width:32px;height:32px;}
.battle-party-grid{
  grid-template-columns:repeat(4, minmax(0, 1fr));
  gap:6px;margin:6px 0 2px;
}
.member-card-compact{padding:4px 6px;gap:6px;}
.member-card-compact canvas.sprite{width:28px;height:28px;}
.member-card-compact .member-name{font-size:11px;}
.member-card-compact .compact-stats{font-size:9px;}
.battle-log-box{height:96px;}
.rarity-crude{color:var(--r-crude);}
.rarity-normal{color:var(--r-normal);}
.rarity-handy{color:var(--r-handy);}
.rarity-common{color:var(--r-common);}
.rarity-uncommon{color:var(--r-uncommon);}
.rarity-rare{color:var(--r-rare);}
.rarity-scarce{color:var(--r-scarce);}
.rarity-epic{color:var(--r-epic);}
.rarity-legend{color:var(--r-legend);}
.rarity-mythic{color:var(--r-mythic);text-shadow:0 0 4px rgba(255,79,163,.6);}
.rarity-ancient{color:var(--r-ancient);text-shadow:0 0 6px rgba(255,210,74,.5);}
.rarity-unique{color:var(--r-unique);text-shadow:0 0 8px rgba(255,59,59,.7);font-weight:900;}
.log-box{
  background:#0a0807;border:1px solid var(--line);
  padding:10px;font-size:12px;height:130px;overflow-y:auto;line-height:1.7;
  font-family:'Space Mono','Noto Serif TC',serif;
  border-radius:4px;-webkit-overflow-scrolling:touch;
}
.log-box div{border-bottom:1px dashed #2a2119;padding-bottom:3px;margin-bottom:3px;}
.monster-row{
  display:grid;
  grid-template-columns:repeat(6, minmax(0, 1fr));
  gap:6px;justify-content:center;margin:8px 0;
}
.monster-box{
  text-align:center;cursor:pointer;padding:4px 2px;border:2px solid transparent;
  border-radius:6px;touch-action:manipulation;min-width:0;
  transition:border-color .12s, background .12s;
}
.monster-box canvas.sprite{
  width:40px !important;height:40px !important;
  display:block;margin:0 auto;
}
.monster-box .small{font-size:9px;line-height:1.2;}
.monster-box .bar-wrap{width:48px !important;margin:2px auto !important;}
.monster-box.target-selectable:hover,
.monster-box.target-selectable:active{border-color:var(--hp);background:rgba(212,69,63,.08);}
.monster-box.dead{opacity:.25;pointer-events:none;}
.monster-name{font-size:10px;margin-top:2px;font-weight:600;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
/* --- 按鍵層級系統 --- */
.btn-primary{width:100%;padding:16px;font-size:16px;letter-spacing:1px;margin-bottom:2px;min-height:52px;}
.nav-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
.nav-grid-4{grid-template-columns:repeat(4,1fr);}
.btn-nav{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;padding:14px 6px;font-size:12px;white-space:nowrap;min-height:64px;
}
.btn-nav .nav-icon{font-size:22px;line-height:1;}
.btn-compact{padding:10px 12px;font-size:13px;min-height:var(--touch-min);}
.segmented{display:flex;border:1px solid var(--line);width:fit-content;max-width:100%;margin-bottom:10px;border-radius:4px;overflow:hidden;}
.segmented .btn{border:none;box-shadow:none;padding:10px 18px;font-size:13px;background:transparent;border-radius:0;min-height:var(--touch-min);}
.segmented .btn+.btn{border-left:1px solid var(--line);}
.segmented .btn.active{background:var(--gold-dim);color:var(--bg-deep);}
.action-label{font-family:'Silkscreen',monospace;font-size:9px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase;margin:12px 0 6px;border-bottom:1px dashed var(--line);padding-bottom:4px;}
.skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;}
.skill-btn{display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;padding:10px 12px;white-space:normal;min-height:var(--touch-min);}
.skill-btn-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:8px;}
.skill-unique{border-color:var(--r-unique)!important;box-shadow:0 0 0 1px rgba(255,59,59,.35);}
.skill-btn-desc{color:var(--text-dim);line-height:1.4;font-size:12px;}
.skill-btn-est{color:var(--gold);font-size:12px;}
.skill-btn .mp-cost{font-family:'Space Mono','Noto Serif TC',serif;color:var(--mp);font-size:11px;white-space:nowrap;}
.utility-row{display:flex;gap:8px;flex-wrap:wrap;}
.utility-row .btn{flex:1;min-width:0;}
.flee-link{background:none;border:none;box-shadow:none;color:var(--text-dim);font-size:13px;text-decoration:underline;cursor:pointer;padding:12px 8px;margin:8px 0 0 auto;display:block;min-height:var(--touch-min);touch-action:manipulation;}
.flee-link:hover,.flee-link:active{color:var(--hp);}
.choice-list{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
.choice-list .btn{text-align:left;width:100%;padding:14px 16px;font-size:15px;}
.item-row{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--bg-panel-2);border:1px solid var(--line);padding:10px;margin-bottom:8px;
  border-radius:4px;
}
.item-row .meta{font-size:11px;color:var(--text-dim);font-family:'Space Mono','Noto Serif TC',serif;}
.item-row .btn{flex-shrink:0;white-space:nowrap;}
/* 背包重做 v3：參考經典 RPG 版面 */
.bp-wrap{display:flex;flex-direction:column;gap:10px;}
.bp-main{display:grid;grid-template-columns:1fr;gap:10px;}
@media (min-width:720px){
  .bp-main{grid-template-columns:minmax(240px,0.95fr) minmax(260px,1.15fr);}
}
.bp-left,.bp-right{
  background:linear-gradient(180deg,var(--bg-panel) 0%,var(--bg-panel-2) 100%);
  border:1px solid var(--line);border-radius:8px;padding:10px;
}
.bp-char{
  display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;
  margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line);
}
.bp-char-meta{font-size:12px;line-height:1.55;}
.bp-char-meta .nm{font-family:'Silkscreen',monospace;color:var(--gold);font-size:13px;}
.bp-bars{margin-top:4px;}
.bp-bar-row{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:11px;color:var(--text-dim);}
.bp-bar-row b{color:var(--text);min-width:64px;font-weight:600;}
.bp-bar{flex:1;height:8px;background:#1a1510;border:1px solid var(--line);border-radius:3px;overflow:hidden;}
.bp-bar > i{display:block;height:100%;}
.bp-bar.hp > i{background:linear-gradient(90deg,#8b2e2e,#e74c3c);}
.bp-bar.mp > i{background:linear-gradient(90deg,#1a4a6e,#3b9eff);}
.bp-gold-exp{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--text-dim);margin-top:6px;}
.bp-gold-exp b{color:var(--gold);}

/* 裝備紙娃娃 */
.bp-equip-title{font-family:'Silkscreen',monospace;font-size:11px;color:var(--gold);letter-spacing:1px;margin:0 0 8px;}
.bp-doll{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  grid-template-areas:
    ". head ."
    "weapon chest offhand"
    "hands armor cape"
    "acc feet .";
  gap:6px;justify-items:center;
}
.bp-slot{width:100%;max-width:88px;min-height:64px;background:var(--bg-deep);border:1px solid var(--line);border-radius:6px;padding:5px 4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;cursor:pointer;transition:border-color .15s,box-shadow .15s;overflow:hidden;box-sizing:border-box;}
.bp-slot:hover,.bp-slot.selected{border-color:var(--gold);box-shadow:0 0 0 1px rgba(255,210,74,.3);}
.bp-slot.empty{border-style:dashed;opacity:.9;}
.bp-slot.empty-can{border-color:var(--gold-dim);}
.bp-slot .sl{font-size:9px;color:var(--gold);font-family:'Silkscreen',monospace;letter-spacing:.5px;flex-shrink:0;}
.bp-slot .sn{font-size:10px;color:var(--text);text-align:center;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;}
.bp-slot .sm{font-size:9px;color:var(--text-dim);text-align:center;line-height:1.2;}
/* 紙娃娃／背包格內的裝備圖示：強制塞進格子，不撐開版面 */
.bp-slot canvas,
.bp-slot canvas.sprite{
  width:36px !important;
  height:36px !important;
  max-width:70% !important;
  max-height:36px !important;
  object-fit:contain;
  image-rendering:pixelated;
  flex-shrink:0;
  display:block;
}
.bp-cell canvas,
.bp-cell canvas.sprite{
  width:70% !important;
  height:70% !important;
  max-width:40px !important;
  max-height:40px !important;
  object-fit:contain;
  image-rendering:pixelated;

<script>

/* ===== 00-utils.js ===== */

/* ============ 工具 / PRNG ============ */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(str){
  let h = 0x811c9dc5;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rint(rng,min,max){
  const a = Number(min), b = Number(max);
  if(!Number.isFinite(a) || !Number.isFinite(b)) return 0;
  return Math.floor(rng()*(b-a+1))+a;
}
/** 把值轉成有限數字，失敗則回 fallback（防 NaN 污染） */
function num(v, fallback){
  const n = Number(v);
  return Number.isFinite(n) ? n : (fallback != null ? fallback : 0);
}
function choice(rng, arr){ return arr[Math.floor(rng()*arr.length)]; }
function weightedChoice(rng, entries){ // entries: [{item,w}]
  const total = entries.reduce((s,e)=>s+e.w,0);
  let r = rng()*total;
  for(const e of entries){ if(r < e.w) return e.item; r -= e.w; }
  return entries[entries.length-1].item;
}
function clamp(v,a,b){
  const x = num(v, a), lo = num(a, 0), hi = num(b, lo);
  return Math.max(lo, Math.min(hi, x));
}
function esc(s){ return (s+'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }



/* ===== 01-sprites.js ===== */

function pxFill(ctx, cell, pts, color){
  ctx.fillStyle = color;
  pts.forEach(([x,y])=> ctx.fillRect(x*cell, y*cell, cell, cell));
}
function pxRect(ctx, cell, x,y,w,h, color){
  ctx.fillStyle = color;
  ctx.fillRect(x*cell, y*cell, w*cell, h*cell);
}
function pxDot(ctx, cell, x,y, color){ pxRect(ctx, cell, x,y, 1,1, color); }

const FEMALE_NAME_SET = new Set(NPC_FEMALE_NAMES.map(n=>n).concat(NPC_FEMALE_NAMES.map(n=>n.toLowerCase())));
const MALE_NAME_SET = new Set(NPC_MALE_NAMES.map(n=>n).concat(NPC_MALE_NAMES.map(n=>n.toLowerCase())));
const MALE_NAME_HINTS = /先生|大叔|大哥|小子|肥哥|哥$|弟$|叔|伯|漢|君|雄|強|偉|傑|俊|鋒|龍|虎|john|jimmy|rex|barry|george/i;
const FEMALE_NAME_HINTS = /女|姐|妹|娘|媽|小姐|女孩|夫人|玫瑰|女拳|姊/;

function extractNameFromSeed(seed){
  const s = String(seed||'');
  const idx = s.lastIndexOf('_');
  if(idx>0 && /^[a-zA-Z0-9]+$/.test(s.slice(idx+1))) return s.slice(0, idx);
  return s;
}

function guessGenderFromName(name){
  const n = String(name||'').trim();
  if(!n) return 'male';
  const low = n.toLowerCase();
  if(FEMALE_NAME_SET.has(n) || FEMALE_NAME_SET.has(low)) return 'female';
  if(MALE_NAME_SET.has(n) || MALE_NAME_SET.has(low)) return 'male';
  if(FEMALE_NAME_HINTS.test(n)) return 'female';
  if(/^(艾莉|露娜|薇拉|希兒|美蘭|金燕)/.test(n)) return 'female';
  if(/\b(alice|luna|vera|anna|amy|lisa|mary|jenny|lily|rose|lucy|leggy)\b/i.test(n)) return 'female';
  if(MALE_NAME_HINTS.test(n)) return 'male';
  if(/[哥弟叔伯漢君雄強偉傑俊鋒龍虎]/.test(n)) return 'male';
  if(/\b(jay|chou|jimmy|john|rex|barry|george|tony|kevin|mike)\b/i.test(n)) return 'male';
  // 未知偏男
  let h = 0;
  for(let i=0;i<n.length;i++) h = (h*31 + n.charCodeAt(i))>>>0;
  return (h % 10 === 0) ? 'female' : 'male';
}

/** 男女雙池抽取：先定性別再抽名（約 42% 女） */
function pickNpcNameAndGender(rng){
  rng = rng || Math.random;
  const femalePool = NPC_FEMALE_NAMES;
  const malePool = NPC_MALE_NAMES;
  const wantF = rng() < 0.42;
  if(wantF && femalePool.length){
    return { name: choice(rng, femalePool), gender: 'female' };
  }
  if(malePool.length){
    return { name: choice(rng, malePool), gender: 'male' };
  }
  return { name: choice(rng, femalePool.length?femalePool:['旅人']), gender: femalePool.length?'female':'male' };
}



/** 人物：依性別區分的星露谷風半身像 */
function drawHumanPortrait(canvas, seed, size, genderOpt){
  size = size || 16;
  const name = extractNameFromSeed(seed);
  const gender = genderOpt || guessGenderFromName(name);
  const isF = gender === 'female';
  const rng = mulberry32(hashStr('human_v4_'+gender+'_'+seed));
  const cell = Math.floor(160/size);
  canvas.width = size*cell; canvas.height = size*cell;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const bgChoices = isF
    ? ['#2a1a28','#1a1a2a','#241820','#302028','#1a2430','#281a24']
    : ['#1a3040','#1a2a1a','#2a2418','#182830','#1a1a2a','#202018'];
  pxRect(ctx, cell, 0,0, size,size, bgChoices[Math.floor(rng()*bgChoices.length)]);
  for(let i=0;i<6;i++){
    if(rng()>0.5) pxDot(ctx, cell, 1+Math.floor(rng()*14), 1+Math.floor(rng()*3), 'rgba(255,255,255,0.04)');
  }

  const skin = SKIN_TONES[Math.floor(rng()*SKIN_TONES.length)];
  // 女性偏亮／暖髮色權重略高
  let hair;
  if(isF){
    const fHair = ['#1a120c','#2c1810','#4a2c14','#6b3a1f','#8b4513','#c9a227','#e8d080','#c0c0c8','#5a1a1a','#2a1a3a','#e8e0d0','#6b2030'];
    hair = fHair[Math.floor(rng()*fHair.length)];
  } else {
    hair = HAIR_COLORS[Math.floor(rng()*HAIR_COLORS.length)];
  }
  const eye = EYE_COLORS[Math.floor(rng()*EYE_COLORS.length)];
  const shirt = SHIRT_COLORS[Math.floor(rng()*SHIRT_COLORS.length)];
  // 髮型：女偏長／馬尾／蓬；男偏短／側分／刺
  let hairStyle;
  if(isF){
    const pool = [1,2,2,3,4,4,5,5]; // 中長長側分蓬馬尾
    hairStyle = pool[Math.floor(rng()*pool.length)];
  } else {
    const pool = [0,0,1,3,6,6,4];
    hairStyle = pool[Math.floor(rng()*pool.length)];
  }
  const faceW = isF ? (rng()>0.6 ? 7 : 8) : (rng()>0.4 ? 8 : 7);
  const faceX = 4;
  const hasBeard = !isF && rng()>0.55;
  const hasScar = !isF && rng()>0.82;
  const blush = isF ? rng()>0.25 : rng()>0.85;
  // 配件：女耳環／項鍊多；男眼鏡／頭帶多
  let accessory;
  if(isF){
    const pool = [0,1,1,1,2,4,4,3];
    accessory = pool[Math.floor(rng()*pool.length)];
  } else {
    const pool = [0,0,2,3,3,4];
    accessory = pool[Math.floor(rng()*pool.length)];
  }

  // 衣服／肩（男肩寬、女肩窄＋圓領）
  if(isF){
    pxRect(ctx, cell, 3,12, 10,4, shirt[0]);
    pxRect(ctx, cell, 4,12, 8,1, shirt[1]);
    pxRect(ctx, cell, 3,13, 2,2, shirt[2]||shirt[1]);
    pxRect(ctx, cell, 11,13, 2,2, shirt[2]||shirt[1]);
    pxRect(ctx, cell, 6,12, 4,1, shirt[1]);
    pxRect(ctx, cell, 7,11, 2,1, skin[1]);
  } else {
    pxRect(ctx, cell, 2,12, 12,4, shirt[0]);
    pxRect(ctx, cell, 3,12, 10,1, shirt[1]);
    pxRect(ctx, cell, 2,13, 2,2, shirt[2]||shirt[1]);
    pxRect(ctx, cell, 12,13, 2,2, shirt[2]||shirt[1]);
    pxRect(ctx, cell, 6,12, 4,1, shirt[1]);
    pxRect(ctx, cell, 7,11, 2,1, skin[1]);
  }

  // 脖子
  pxRect(ctx, cell, 7,10, 2,2, skin[1]);
  pxRect(ctx, cell, 7,11, 1,1, skin[2]);

  // 臉型
  pxRect(ctx, cell, faceX,4, faceW,7, skin[0]);
  pxRect(ctx, cell, faceX+1,3, faceW-2,1, skin[0]);
  pxRect(ctx, cell, faceX+1,10, faceW-2,1, skin[1]);
  pxRect(ctx, cell, faceX-1,5, 1,5, skin[1]);
  pxRect(ctx, cell, faceX+faceW,5, 1,5, skin[1]);
  // 陰影
  pxRect(ctx, cell, faceX+faceW-2,7, 1,3, skin[2]);
  pxRect(ctx, cell, faceX+1,9, 2,1, skin[2]);
  if(blush){
    pxDot(ctx, cell, faceX+1,8, 'rgba(220,120,120,0.45)');
    pxDot(ctx, cell, faceX+faceW-2,8, 'rgba(220,120,120,0.45)');
  }

  // 眼睛（更大更清楚）
  pxRect(ctx, cell, 5,6, 2,2, '#f8f4e8');
  pxRect(ctx, cell, 9,6, 2,2, '#f8f4e8');
  pxDot(ctx, cell, 5,6, eye);
  pxDot(ctx, cell, 6,7, eye);
  pxDot(ctx, cell, 9,6, eye);
  pxDot(ctx, cell, 10,7, eye);
  // 眼神高光
  pxDot(ctx, cell, 6,6, '#ffffff');
  pxDot(ctx, cell, 10,6, '#ffffff');
  // 眉毛
  const browY = 5;
  if(rng()>0.3){
    pxRect(ctx, cell, 5,browY, 2,1, hair);
    pxRect(ctx, cell, 9,browY, 2,1, hair);
  } else {
    pxRect(ctx, cell, 5,browY, 3,1, hair);
    pxRect(ctx, cell, 8,browY, 3,1, hair);
  }
  // 鼻子
  pxDot(ctx, cell, 7,8, skin[2]);
  pxDot(ctx, cell, 8,8, skin[3]||skin[2]);
  // 嘴
  const mouth = Math.floor(rng()*3);
  if(mouth===0) pxRect(ctx, cell, 6,9, 4,1, '#a05050');
  else if(mouth===1){ pxRect(ctx, cell, 7,9, 2,1, '#8a4040'); pxDot(ctx, cell, 6,9, '#8a4040'); }
  else pxRect(ctx, cell, 6,9, 4,1, '#6a3030');

  if(hasScar) pxRect(ctx, cell, 10,5, 1,3, 'rgba(140,60,60,0.7)');
  if(hasBeard){
    pxRect(ctx, cell, 5,10, 6,1, hair);
    pxRect(ctx, cell, 6,11, 4,1, hair);
  }

  // 頭髮樣式（更立體）
  const hd = hair;
  if(hairStyle===0){ // 短
    pxRect(ctx, cell, 4,2, 8,2, hd);
    pxRect(ctx, cell, 3,3, 2,2, hd);
    pxRect(ctx, cell, 11,3, 2,2, hd);
    pxRect(ctx, cell, 5,2, 6,1, skin[0]); // 額際
  } else if(hairStyle===1){ // 中
    pxRect(ctx, cell, 3,2, 10,3, hd);
    pxRect(ctx, cell, 2,4, 2,3, hd);
    pxRect(ctx, cell, 12,4, 2,3, hd);
  } else if(hairStyle===2){ // 長
    pxRect(ctx, cell, 3,2, 10,3, hd);
    pxRect(ctx, cell, 2,4, 2,7, hd);
    pxRect(ctx, cell, 12,4, 2,7, hd);
    pxRect(ctx, cell, 3,10, 1,2, hd);
    pxRect(ctx, cell, 12,10, 1,2, hd);
  } else if(hairStyle===3){ // 側分
    pxRect(ctx, cell, 4,2, 8,2, hd);
    pxRect(ctx, cell, 3,3, 4,3, hd);
    pxRect(ctx, cell, 11,3, 2,2, hd);
    pxRect(ctx, cell, 2,5, 2,5, hd);
  } else if(hairStyle===4){ // 蓬鬆
    pxRect(ctx, cell, 3,1, 10,3, hd);
    pxRect(ctx, cell, 2,3, 3,3, hd);
    pxRect(ctx, cell, 11,3, 3,3, hd);
    pxDot(ctx, cell, 4,4, hd); pxDot(ctx, cell, 11,4, hd);
  } else if(hairStyle===5){ // 馬尾
    pxRect(ctx, cell, 4,2, 8,2, hd);
    pxRect(ctx, cell, 3,3, 2,2, hd);
    pxRect(ctx, cell, 11,3, 2,3, hd);
    pxRect(ctx, cell, 12,6, 2,5, hd);
    pxRect(ctx, cell, 13,10, 1,2, hd);
  } else { // 短刺／光頭邊緣
    pxRect(ctx, cell, 5,3, 6,1, hd);
    pxRect(ctx, cell, 4,4, 1,2, hd);
    pxRect(ctx, cell, 11,4, 1,2, hd);
  }
  // 瀏海
  if(hairStyle!==6 && rng()>0.35){
    pxRect(ctx, cell, 5,3, 3,2, hd);
    pxRect(ctx, cell, 9,3, 2,1, hd);
  }
  // 髮絲高光
  pxDot(ctx, cell, 6,2, 'rgba(255,255,255,0.15)');

  // 配件
  if(accessory===1){ // 耳環
    pxDot(ctx, cell, 3,8, '#c9a227');
    pxDot(ctx, cell, 12,8, '#c9a227');
  } else if(accessory===2){ // 頭帶
    pxRect(ctx, cell, 4,4, 8,1, shirt[0]);
  } else if(accessory===3){ // 眼鏡
    pxRect(ctx, cell, 5,6, 2,2, 'rgba(40,40,50,0.55)');
    pxRect(ctx, cell, 9,6, 2,2, 'rgba(40,40,50,0.55)');
    pxRect(ctx, cell, 7,6, 2,1, 'rgba(40,40,50,0.4)');
  } else if(accessory===4){ // 項鍊
    pxDot(ctx, cell, 7,12, '#c9a227');
    pxDot(ctx, cell, 8,12, '#c9a227');
  }

  // 臉部高光
  pxDot(ctx, cell, 6,5, skin[0]);

  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = Math.max(1, cell/4);
  ctx.strokeRect(0.5, 0.5, canvas.width-1, canvas.height-1);
}

function inferMonsterTemplate(seed, type){
  const s = String(seed||'') + '|' + String(type||'');
  const low = s.toLowerCase();
  if(/slime|泥|史萊姆|果凍|膿|囊|瘟氣/.test(low)) return 'slime';
  if(/skel|骨|骷|亡靈|undead|骸|葬儀|殉葬/.test(low)) return 'skeleton';
  if(/wolf|狼|犬|獸|獅|熊|戰奴|月蝕|狂旗/.test(low)) return 'wolf';
  if(/dragon|龍|drake|wyrm|幼龍|泰坦|熔核|灰燼龍/.test(low)) return 'dragon';
  if(/goblin|哥布|獸人|orc|半獸|盜賊|刺客|暗契/.test(low)) return 'goblin';
  if(/ghost|幽靈|魂|影|wraith|霧|虛空|夢魘|魘|沉默|偽相/.test(low)) return 'ghost';
  if(/bug|蟲|spider|蛛|insect|蠍|蜂|蜜毒/.test(low)) return 'insect';
  if(/golem|石像|元素|construct|魔像|石衛|鉚釘|岩|銅皮|鋼鐵|星隕/.test(low)) return 'golem';
  if(/bat|蝠|鴉|鳥|鷲|羽|點火鴉|終末鴉/.test(low)) return 'bat';
  if(/frog|蛙|蟾/.test(low)) return 'frog';
  if(/spider|蛛|網|織夢/.test(low)) return 'spider';
  if(/tree|樹|木|根|林|園|花|荊|蔓|古樹|花粉|腐花|荊莠|園丁/.test(low)) return 'tree';
  if(/fish|魚|海|潮|水|觸手|墨|珍珠|女皇|深壓|寄居/.test(low)) return 'fish';
  if(/bird|鳥|鴉|鷲|羽|鐘|懺悔/.test(low)) return 'bird';
  if(/knight|騎士|衛|盾|兵|親衛|祭司|侍|執法|殿守|磁鎖|骨盾/.test(low)) return 'knight';
  if(/flower|花|花粉|腐花|荊莠|孢子/.test(low)) return 'flower';
  if(/tentacle|觸手|深淵|海怪|攫奪|碎擊/.test(low)) return 'tentacle';
  if(/rat|鼠|疫鼠/.test(low)) return 'rat';
  if(/crab|蟹|甲蟲|鐵甲/.test(low)) return 'crab';
  if(/demon|魔|血|狂|獄|罪|審判|血僕|血契|斷頭/.test(low)) return 'demon';
  if(type==='undead') return 'skeleton';
  if(type==='beast') return 'wolf';
  if(type==='shadow') return 'ghost';
  if(type==='nature') return 'tree';
  if(type==='metal') return 'golem';
  if(type==='fire' || type==='ice') return 'dragon';
  if(type==='water') return 'fish';
  if(type==='blood') return 'demon';
  return 'default';
}

function drawMonsterPortrait(canvas, seed, palette, size, type){
  size = size || 16;
  const rng = mulberry32(hashStr('mon_v3_'+seed));
  const cell = Math.floor(160/size);
  canvas.width = size*cell; canvas.height = size*cell;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const bgChoices = ['#14101a','#101818','#18120e','#0e1418','#161018','#12140c'];
  pxRect(ctx, cell, 0,0, size,size, bgChoices[Math.floor(rng()*bgChoices.length)]);
  // 邊角暗角
  pxRect(ctx, cell, 0,0, 1,size, 'rgba(0,0,0,0.25)');
  pxRect(ctx, cell, 15,0, 1,size, 'rgba(0,0,0,0.25)');

  let p = palette && palette.length ? palette.slice() : ['#6b4a2f','#9a6b3f','#c9a05f'];
  while(p.length < 3) p.push(p[p.length-1]||'#888');
  // 輕微色相偏移讓同類型也有差別
  if(rng()>0.5){
    const mix = (a,b,t)=>{
      // 簡化：偶而把主色換成次色順序
      return rng()>0.5 ? [p[1],p[0],p[2]] : p;
    };
    p = mix();
  }

  const tmpl = inferMonsterTemplate(seed, type);
  const fn = MONSTER_TEMPLATES[tmpl] || MONSTER_TEMPLATES.default;
  fn(ctx, cell, p, rng);

  // 輪廓加深一點（底部陰影）
  pxRect(ctx, cell, 4,14, 8,1, 'rgba(0,0,0,0.35)');

  const seedStr = String(seed||'');
  if(/帝王|emp_minion|emperor|眷屬|boss/.test(seedStr)){
    pxRect(ctx, cell, 1,1, 2,1, '#c9a227');
    pxRect(ctx, cell, 13,1, 2,1, '#c9a227');
    pxDot(ctx, cell, 2,2, '#e8d080');
    pxDot(ctx, cell, 13,2, '#e8d080');
  } else if(rng()>0.75){
    pxDot(ctx, cell, 1,1, p[2]);
  }
  if(rng()>0.5) pxDot(ctx, cell, 4,3, 'rgba(255,255,255,0.2)');

  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.lineWidth = Math.max(1, cell/4);
  ctx.strokeRect(0.5, 0.5, canvas.width-1, canvas.height-1);
}

/** 通用入口：kind = 'human' | 'monster' | 'legacy' */
function drawSprite(canvas, seed, palette, size, opts){
  opts = opts || {};
  if(opts.kind==='human' || opts.human){
    const g = opts.gender || guessGenderFromName(extractNameFromSeed(seed));
    drawHumanPortrait(canvas, seed, size, g);
    return;
  }
  if(opts.kind==='monster' || opts.monster || opts.type){
    drawMonsterPortrait(canvas, seed, palette, size, opts.type || opts.monsterType);
    return;
  }
  // legacy 對稱雜訊（裝備／未知）
  size = size || 16;
  const rng = mulberry32(hashStr(seed));
  const cell = Math.floor(160/size);
  canvas.width = size*cell; canvas.height = size*cell;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const half = Math.ceil(size/2);
  const grid = [];
  for(let y=0;y<size;y++){
    grid.push([]);
    for(let x=0;x<half;x++){
      const edgeBias = (x < half*0.3 || y < size*0.15 || y > size*0.85) ? 0.32 : 0.58;
      grid[y].push(rng() < edgeBias ? weightedChoice(rng,[{item:0,w:6},{item:1,w:3},{item:2,w:2},{item:3,w:1}]) : 0);
    }
  }
  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){
      const srcX = x < half ? x : size-1-x;
      const v = grid[y][srcX];
      if(v===0) continue;
      const color = (palette&&palette[v-1]) || (palette&&palette[0]) || '#888';
      ctx.fillStyle = color;
      ctx.fillRect(x*cell,y*cell,cell,cell);
    }
  }
}

      [2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1],[9,1],

    ctx.fillStyle = (edge && rng()<0.35) ? (rarityColor||base[2]) : (rng()<0.22 ? (rarityColor||base[1]) : choice(rng, base));

  });
}

/** 詞綴數量：30 等起 1 條，之後每 10 等 +1（最高 8）；Boss／精英同樣遵循 */
function rollAffixCount(tier, boss, playerLevel, isElite){
  const rng = Math.random;
  let count = 0;
  // 統一規律：30 等 → 1，40 → 2，50 → 3 … 100 → 8
  if(playerLevel >= 30){
    count = 1 + Math.floor((playerLevel - 30) / 10);
    count = Math.min(count, 8);
  } else if(tier >= 3 && rng() < 0.45){
    count = 1;
  } else if(tier >= 4 && rng() < 0.70){
    count = 1;
  } else if(tier >= 2 && rng() < 0.22){
    count = 1;
  }
  // Boss：同樣走每 10 等 +1；因 50 等才會出現，保底至少等同該等級公式（不再另隨機加）
  if(boss){
    if(playerLevel >= 30){
      count = Math.min(8, 1 + Math.floor((playerLevel - 30) / 10));
    } else {
      count = Math.max(count, 2);
    }
  }
  // 精英：在同一規律上再 +1（仍受最高 8 限制）
  if(isElite) count = Math.min(8, Math.max(count, 1) + 1);
  return Math.min(count, MONSTER_AFFIXES.length - 1); // 預留 rare
}

function applyMonsterAffixes(mon, count, rng, forceRare){
  const pool = MONSTER_AFFIXES.filter(a=>a.id!=='rare');
  const shuffled = pool.slice().sort(()=>rng()-0.5);
  const chosen = shuffled.slice(0, Math.min(count, shuffled.length));
  chosen.forEach(aff=>{
    aff.apply(mon);
    mon.affixes.push(aff.id);
    mon.affixNames = mon.affixNames || [];
    mon.affixNames.push(aff.name);
  });
  if(forceRare){
    const rare = MONSTER_AFFIXES.find(a=>a.id==='rare');
    if(rare){ rare.apply(mon); mon.affixes.push('rare'); mon.affixNames.push('稀有'); }
  }
}

function getEmperorTrait(mon){
  const base = (mon && (mon.baseName || mon.name)) ? String(mon.baseName || mon.name).replace(/^(精英|百戰|千煉|王者|帝王)·/g,'') : '';
  if(typeof EMPEROR_TRAITS_BY_NAME !== 'undefined' && EMPEROR_TRAITS_BY_NAME[base]) return EMPEROR_TRAITS_BY_NAME[base];
  const ty = (mon && mon.type) || 'beast';
  return (EMPEROR_TRAITS && EMPEROR_TRAITS[ty]) || EMPEROR_TRAITS.beast;
}

function shortMonsterBaseName(n){
  let s = String(n||'怪').replace(/^(精英|百戰|千煉|王者|帝王)·/g,'');
  if(s.length > 6) s = s.slice(0, 5) + '…';
  return s;
}
function formatMonsterName(rank, baseName){
  const r = MONSTER_RANKS[rank] || MONSTER_RANKS.normal;
  return (r.prefix||'') + shortMonsterBaseName(baseName);
}
function rollMonsterRank(avgLevel, rng){
  rng = rng || Math.random;
  const lv = num(avgLevel, 1);
  // 僅用於「非 Boss」普通遇敵的強化階；Boss 戰不走此函式
  if(lv < 5) return 'normal';
  let w;
  if(lv <= 7){
    w = [{id:'normal',w:95},{id:'elite',w:5}];
  } else if(lv <= 13){
    w = [{id:'normal',w:80},{id:'elite',w:20}];
  } else if(lv <= 21){
    w = [{id:'normal',w:80},{id:'elite',w:15},{id:'veteran',w:5}];
  } else if(lv <= 31){
    w = [{id:'normal',w:65},{id:'elite',w:20},{id:'veteran',w:10},{id:'refined',w:5}];
  } else if(lv <= 41){
    w = [{id:'normal',w:60},{id:'elite',w:15},{id:'veteran',w:10},{id:'refined',w:12},{id:'king',w:3}];
  } else {
    w = [{id:'normal',w:64},{id:'elite',w:15},{id:'veteran',w:9},{id:'refined',w:7},{id:'king',w:4},{id:'emperor',w:1}];
  }
  return weightedChoice(rng, w.map(x=>({item:x.id, w:x.w})));
}

function makeMonster(tmpl, playerLevel, rng, opts){
  opts = opts || {};
  rng = rng || Math.random;
  const tier = clamp(num(tmpl && tmpl.tier, 1), 1, 5);
  const pl = clamp(num(playerLevel, 1), 1, MAX_PLAYER_LEVEL);
  const lvl = clamp(pl + rint(rng, -1, 2), 1, MAX_PLAYER_LEVEL);
  const boss = !!(tmpl && tmpl.boss);
  let rank = opts.rank || (opts.elite ? 'elite' : 'normal');
  if(boss) rank = 'normal';
  // 隊伍平均／參考等級 5 等前強制普通（精英以上不出現）
  if(pl < 5 && rank !== 'normal') rank = 'normal';
  if(typeof MONSTER_RANKS === 'undefined' || !MONSTER_RANKS[rank]) rank = 'normal';
  const rankDef = (typeof MONSTER_RANKS !== 'undefined' && MONSTER_RANKS[rank]) ? MONSTER_RANKS[rank] : {multHp:1,multAtk:1,multDef:1,multRew:1,extraAffix:0,prefix:'',name:'普通'};
  const elite = rank === 'elite' || (!!opts.elite && rank==='normal');

  // 階級倍率：同等級也要有壓力，高階更耐打、更疼
  const tierHp = [1, 1, 1.28, 1.62, 2.05, 2.55][tier];
  const tierAtk = [1, 1, 1.22, 1.45, 1.72, 2.05][tier];
  const tierDef = [1, 1, 1.15, 1.32, 1.50, 1.70][tier];
  const tierRew = [1, 1, 1.25, 1.55, 1.90, 2.40][tier];

  let mon = {
    name: (typeof formatMonsterName==='function' ? formatMonsterName(rank, (tmpl && tmpl.n) || '未知生物') : ((elite ? '精英·' : '') + ((tmpl && tmpl.n) || '未知生物'))),
    baseName: (tmpl && tmpl.n) || '未知生物',
    type: (tmpl && tmpl.type) || 'beast',
    tier, boss, elite, rank, rankName: rankDef.name,
    level: lvl,
    hp: 0, maxHp: 0, atk: 0, def: 0, spd: 0,
    exp: 0, gold: 0,
    seed: ((tmpl && tmpl.n) || 'm') + '_' + lvl + '_' + Math.floor(rng()*9999),
    status:null, statusTurns:0, rewarded:false,
    hasRegen:false, regenRate:0.05,
    affixes:[], affixNames:[],
    mech: boss ? ((tmpl && tmpl.mech) || null) : null,
    bossTurns: 0
  };

  // 基礎曲線：刻意高於「裸裝玩家同級期望」，裝備／職業優勢才能壓制
  // 目標：普通 4~7 回合、精英 8~14 回合、Boss 需策略與消耗
  let maxHp = (58 + lvl * 13.5 + lvl * lvl * 0.085) * tierHp;
  let atk   = (16 + lvl * 1.85 + tier * 2.9) * tierAtk;
  let def   = (6.0 + lvl * 0.95 + tier * 1.9) * tierDef;
  let spd   = rint(rng, 6 + tier, 11 + tier * 2);
  let exp   = (30 + lvl * 5.5 + tier * 8) * tierRew;
  let gold  = (18 + lvl * 3.2 + tier * 5) * tierRew * (0.75 + rng() * 0.5);

  if(rank !== 'normal' && !boss){
    maxHp *= rankDef.multHp;
    atk   *= rankDef.multAtk;
    def   *= rankDef.multDef;
    exp   *= rankDef.multRew;
    gold  *= rankDef.multRew * 0.95;
    spd    = Math.round(spd * (1 + (rankDef.extraAffix||0) * 0.03));
  }
  if(boss){
    // Boss：血厚、攻高；靠機制+持續壓力取勝
    // 血攻防相對前版再 ×0.65（下降 35%）；經驗 ×1.20（提高 20%）
    maxHp *= 4.20 * 0.65;
    atk   *= 1.55 * 0.65;
    def   *= 1.55 * 0.65;
    exp   *= 4.50 * 1.20;
    gold  *= 3.80;
    spd    = Math.round(spd * 1.10);
  }

  mon.maxHp = Math.max(12, Math.round(maxHp));
  mon.hp = mon.maxHp;
  mon.atk = Math.max(1, Math.round(atk));
  mon.def = Math.max(0, Math.round(def));
  mon.spd = Math.max(1, spd);
  mon.exp = Math.max(1, Math.round(exp));
  mon.gold = Math.max(0, Math.round(gold));

  let wantAffix = rollAffixCount(tier, boss, pl, elite);
  wantAffix += (rankDef.extraAffix || 0);
  applyMonsterAffixes(mon, wantAffix, rng, elite || rank==='veteran');
  if(rank === 'emperor'){
    const trait = typeof getEmperorTrait === 'function' ? getEmperorTrait(mon) : null;
    if(trait){
      trait.apply(mon);
      mon.affixes.push(trait.id);
      mon.affixNames = mon.affixNames || [];
      if(!mon.affixNames.includes(trait.name)) mon.affixNames.unshift(trait.name);
      mon.emperorTrait = trait.name;
    }
  }

  // 數值淨化
  mon.maxHp = Math.max(12, num(mon.maxHp, 12));
  mon.hp = clamp(num(mon.hp, mon.maxHp), 0, mon.maxHp);
  mon.atk = Math.max(1, num(mon.atk, 1));
  mon.def = Math.max(0, num(mon.def, 0));
  mon.spd = Math.max(1, num(mon.spd, 1));
  mon.exp = Math.max(1, num(mon.exp, 1));
  mon.gold = Math.max(0, num(mon.gold, 0));

  // 軟上限放寬：允許詞綴強化，但仍避免無限疊防
  const atkCap = Math.round((22 + lvl * 2.80 + tier * 6) * (elite ? 1.45 : 1) * (boss ? 2.10 : 1));
  const defCap = Math.round((10 + lvl * 1.45 + tier * 3.8) * (elite ? 1.40 : 1) * (boss ? 2.20 : 1));
  if(mon.atk > atkCap) mon.atk = atkCap;
  if(mon.def > defCap) mon.def = defCap;

  // 血量軟上限（一般怪／精英）；Boss 不套此上限
  if(!boss){
    const hpCap = Math.round((70 + lvl * 18 + lvl * lvl * 0.12) * tierHp * (elite ? 1.85 : 1));
    if(mon.maxHp > hpCap){
      mon.maxHp = hpCap;
      mon.hp = Math.min(mon.hp, mon.maxHp);
    }
  } else {
    // 魔王血量：再整體 ×0.65（血攻防下降 35%）
    const bossFloor = Math.round((12000 + lvl * lvl * 9.6) * 0.65);
    const scaled = Math.round(num(mon.maxHp, 1) * 8.5); // maxHp 已含 0.65
    mon.maxHp = Math.max(bossFloor, scaled);
    mon.hp = mon.maxHp;
    mon.atk = Math.max(1, Math.round(num(mon.atk, 1) * 1.35)); // atk 已含 0.65
    mon.def = Math.max(0, Math.round(num(mon.def, 0) * 1.40));
    mon.baseAtk = num(mon.atk, 1);
    mon.baseDef = num(mon.def, 0);
    mon.baseSpd = num(mon.spd, 1);
  }

  if(boss && mon.mech){
    mon.exp = Math.max(1, Math.round(mon.exp * 1.15));
    mon.gold = Math.max(0, Math.round(mon.gold * 1.15));
  }
  return mon;
}

function getBossMinionRoster(boss){
  const mech = (boss && boss.mech) || '';
  if(BOSS_MINION_ROSTERS[mech]) return BOSS_MINION_ROSTERS[mech];
  // fallback: generic 5
  return [
    {id:'g1', n:'護衛', hp:0.14, atk:0.25, def:0.35, spd:0.90, role:'taunt', note:'護衛'},
    {id:'g2', n:'先鋒', hp:0.11, atk:0.32, def:0.24, spd:1.05, role:'burn_hit', note:'先鋒'},
    {id:'g3', n:'咒師', hp:0.10, atk:0.28, def:0.22, spd:0.98, role:'poison_hit', note:'咒師'},
    {id:'g4', n:'祭司', hp:0.11, atk:0.20, def:0.26, spd:0.95, role:'tide_echo', note:'祭司'},
    {id:'g5', n:'刺客', hp:0.09, atk:0.36, def:0.18, spd:1.12, role:'hunt_healer', note:'刺客'}
  ];
}

function makeBossMinion(boss, playerLevel, rng, idx){
  rng = rng || Math.random;
  const pl = clamp(num(playerLevel, boss && boss.level || 1), 1, MAX_PLAYER_LEVEL);
  const roster = getBossMinionRoster(boss) || [];
  const def = roster[num(idx, 0) % Math.max(1, roster.length)] || {id:'g'+(idx||0), n:'眷屬'+(num(idx,0)+1), hp:0.12, atk:0.28, def:0.3, spd:1, role:'taunt', note:'護衛'};
  // 外觀底：同屬性怪；數值階固定「帝王」
  const typePool = MONSTER_TYPES.filter(m=>!m.boss && m.type===(boss && boss.type) && m.tier<=3);
  const anyPool = MONSTER_TYPES.filter(m=>!m.boss && m.tier<=3);
  const tmpl = choice(rng, typePool.length ? typePool : (anyPool.length ? anyPool : MONSTER_TYPES.filter(m=>!m.boss)));
  const baseTmpl = Object.assign({}, tmpl || {n:'小怪',type:'beast',tier:2}, { n: def.n || '眷屬' });
  // 以帝王階生成：詞條數＋數值倍率走帝王
  const mon = makeMonster(baseTmpl, Math.max(1, pl), rng, { rank:'emperor' });
  mon.name = '帝王·' + (def.n || ('眷屬'+(num(idx,0)+1)));
  mon.baseName = def.n || mon.baseName;
  mon.isBossMinion = true;
  mon.minionId = def.id || ('minion_'+idx);
  mon.minionRole = def.role || 'taunt';
  mon.minionNote = def.note || '';
  mon.bossUid = boss ? boss.seed : null;
  mon.bossLink = true;
  mon.bossMech = boss ? boss.mech : null;
  mon.boss = false;
  mon.elite = false;
  mon.mech = null;
  mon.rank = 'emperor';
  mon.rankName = '帝王';
  // 數值：帝王底 × 眷屬角色倍率，並與魔王血量掛鉤（約 12%~22%）
  const rankDef = (typeof MONSTER_RANKS!=='undefined' && MONSTER_RANKS.emperor) ? MONSTER_RANKS.emperor : {multHp:3.6,multAtk:2,multDef:1.7};
  const bHp = Math.max(30000, num(boss && boss.maxHp, 30000));
  const roleHp = num(def.hp, 0.12);
  mon.maxHp = Math.max(2500, Math.round(Math.max(mon.maxHp, bHp * roleHp * 1.35)));
  mon.hp = mon.maxHp;
  mon.atk = Math.max(1, Math.round(Math.max(mon.atk, num(boss&&boss.atk,20) * num(def.atk,0.28) * 1.15)));
  mon.def = Math.max(0, Math.round(Math.max(mon.def, num(boss&&boss.def,8) * num(def.def,0.35) * 1.1)));
  mon.spd = Math.max(1, Math.round(num(mon.spd,8) * num(def.spd,1)));
  mon.exp = Math.max(1, Math.round(num(mon.exp,30) * 1.4));
  mon.gold = Math.max(0, Math.round(num(mon.gold,20) * 1.2));
  // 詞條：保留帝王詞＋隨機詞，並標註眷屬職能
  mon.affixNames = mon.affixNames || [];
  const jobTag = '眷屬·'+(def.note||def.role||'');
  if(!mon.affixNames.includes(jobTag)) mon.affixNames.unshift(jobTag);
  if(mon.emperorTrait && !mon.affixNames.includes(mon.emperorTrait)) mon.affixNames.unshift(mon.emperorTrait);
  mon.seed = 'emp_minion_' + (boss && boss.seed || 'b') + '_' + def.id + '_' + (def.n||idx);
  // 鎖定 Boss 基底屬性，避免光環每回合複利暴衝
  if(boss){
    if(boss.baseAtk == null) boss.baseAtk = num(boss.atk, 1);
    if(boss.baseDef == null) boss.baseDef = num(boss.def, 0);
    if(boss.baseSpd == null) boss.baseSpd = num(boss.spd, 1);
  }
  // 角色特殊起始狀態
  if(def.role==='pearl_shield' || def.role==='frost_shield' || def.role==='shell'){
    mon.shieldCharges = (mon.shieldCharges||0) + 2;
    mon.shieldReduce = 0.35;
  }
  if(def.role==='flower') mon.flower = true;
  return mon;
}


/** 眷屬光環／回合效果（每回合開始掃一次） */
function tickBossMinionAuras(b){
  if(!b || !b.monsters) return;
  if(typeof S === 'undefined' || !S || !Array.isArray(S.party)) return;
  const boss = getBattleBoss(b);
  if(!boss || boss.hp<=0) return;
  if(boss.baseAtk == null) boss.baseAtk = num(boss.atk, 1);
  if(boss.baseDef == null) boss.baseDef = num(boss.def, 0);
  if(boss.baseSpd == null) boss.baseSpd = num(boss.spd, 1);
  const party = S.party.filter(p=>p && p.hp>0);
  if(!party.length) return;
  const minions = b.monsters.filter(m=>m.isBossMinion && m.hp>0);
  let breathCharge = 0, funeral = 0, flowers = 0, entropy = 0, rootUp = 0;
  let pearl = 0, frostShield = 0, shell = 0, bodyguard = 0, tumor = 0;
  minions.forEach(m=>{
    const role = m.minionRole;
    if(role==='breath_charge') breathCharge++;
    if(role==='funeral_stack') funeral++;
    if(role==='flower' || m.flower) flowers++;
    if(role==='entropy_aura') entropy++;
    if(role==='root_up') rootUp++;
    if(role==='pearl_shield') pearl++;
    if(role==='frost_shield') frostShield++;
    if(role==='shell') shell++;
    if(role==='bodyguard_low') bodyguard++;
    if(role==='tumor') tumor++;

    if(role==='scorch_field'){
      party.forEach(p=>{ p.hp = clamp(p.hp - Math.max(1, Math.round(p.maxHp * 0.02)), 0, p.maxHp); });
      b.turnLog.unshift(m.name+' 的焦土灼燒了隊伍！');
      boss._scorchActive = true;
    }
    if(role==='spd_aura'){
      party.forEach(p=>{ p.spdDebuff = (p.spdDebuff||0) + 1; });
    }
    if(role==='anti_heal'){
      b._antiHeal = Math.min(0.55, (b._antiHeal||0) + 0.1);
    }
    if(role==='miss_aura'){
      b._missAura = Math.min(0.35, (b._missAura||0) + 0.07);
    }
    if(role==='pressure'){
      party.forEach(p=>{ p._pressure = true; });
      b._pressureAura = true;
    }
    if(role==='geothermal'){
      party.forEach(p=>{
        p.hp = clamp(p.hp - Math.max(1, Math.round(num(boss.atk,20) * 0.12)), 0, p.maxHp);
      });
      b.turnLog.unshift(m.name+' 釋出地熱！');
    }
    if(role==='mutual_vuln'){ b._mutualVuln = true; }
    if(role==='skill_dampen'){
      b._skillDampen = Math.min(0.45, (b._skillDampen||0) + 0.12);
    }
    if(role==='bone_aura'){
      boss.def = Math.round(num(boss.baseDef, boss.def) * (1 + 0.04 * minions.filter(x=>x.minionRole==='bone_aura').length));
    }
    if(role==='repair_shield' && (boss.shieldCharges||0) < 6 && Math.random() < 0.45){
      boss.shieldCharges = (boss.shieldCharges||0) + 1;
      boss.shieldReduce = boss.shieldReduce || 0.35;
      b.turnLog.unshift(m.name+' 修復了 '+boss.name+' 的結界！');
    }
    if(role==='plant'){
      boss.hp = clamp(boss.hp + Math.round(boss.maxHp * 0.015), 0, boss.maxHp);
      if(flowers < 5 && Math.random() < 0.3){
        b.turnLog.unshift(m.name+' 正在栽種腐花……（盤根加深）');
        boss._gardenStacks = (boss._gardenStacks||0) + 1;
      }
    }
    if(role==='tide_amp'){ boss._tideAmp = (boss._tideAmp||0) + 0.04; }
    if(role==='lowhp_vamp' && boss.hp < boss.maxHp * 0.5){ boss._bonusLifesteal = 0.12; }
    if(role==='haste_boss'){
      if(boss.baseSpd == null) boss.baseSpd = num(boss.spd, 1);
      boss.spd = Math.round(num(boss.baseSpd, boss.spd) * 1.08);
    }
    if(role==='rage_feed' && Math.random() < 0.3){
      const cut = Math.max(1, Math.round(boss.maxHp * 0.012));
      boss.hp = clamp(boss.hp - cut, 1, boss.maxHp);
      boss.atk = Math.round(num(boss.baseAtk, boss.atk) * 1.05);
      b.turnLog.unshift(m.name+' 以血餵養，'+boss.name+' 攻擊上升！');
    }
    if(role==='self_buff_boss' && Math.random() < 0.35){
      const cut = Math.max(1, Math.round(m.maxHp * 0.08));
      m.hp = clamp(m.hp - cut, 1, m.maxHp);
      if(boss.baseAtk == null) boss.baseAtk = num(boss.atk, 1);
      boss._bloodPact = (boss._bloodPact||0) + 1;
      boss.atk = Math.round(num(boss.baseAtk, boss.atk) * (1 + 0.03 * Math.min(8, boss._bloodPact)));
      b.turnLog.unshift(m.name+' 締下血契，'+boss.name+' 攻擊提升！');
    }
    if(role==='shadow_scale' && boss.hp < boss.maxHp * 0.4){
      boss.evade = Math.min(0.5, (boss.evade||0) + 0.04);
    }
    if(role==='dream_cocoon' && !boss._cocoon){
      boss._cocoon = 3;
      boss.shieldCharges = Math.max(boss.shieldCharges||0, 2);
      boss.shieldReduce = Math.max(boss.shieldReduce||0, 0.3);
      b.turnLog.unshift(m.name+' 為 '+boss.name+' 織上夢繭！');
    }
    if(role==='heat_valve'){ boss._heatStable = true; }
    if(role==='heat_charge'){
      boss._heat = (boss._heat||0) + 1;
      if(boss._heat >= 5){
        boss._heat = 0;
        party.forEach(p=>{ p.hp = clamp(p.hp - Math.max(1, Math.round(boss.atk * 0.45)), 0, p.maxHp); });
        b.turnLog.unshift(m.name+' 填滿熔核！'+boss.name+' 爆發熱浪！');
      }
    }
    if(role==='blizzard' && b.roundNum % 3 === 0){
      party.forEach(p=>{
        p.hp = clamp(p.hp - Math.max(1, Math.round(num(m.atk,10)*0.7)), 0, p.maxHp);
        p.spdDebuff = (p.spdDebuff||0) + 1;
      });
      b.turnLog.unshift(m.name+' 掀起暴風雪！');
    }
    if(role==='meteor' && b.roundNum % 4 === 0){
      const p = choice(Math.random, party);
      const d = Math.max(1, Math.round(num(m.atk,10) * 1.8));
      p.hp = clamp(p.hp - d, 0, p.maxHp);
      b.turnLog.unshift(m.name+' 召來隕石，砸向 '+p.name+'（'+d+'）！');
    }
    if(role==='judgment_bell' && b.roundNum % 3 === 0){
      const p = choice(Math.random, party);
      if(!(p.buffDef > 0)){
        const d = Math.max(1, Math.round(num(boss.atk,20) * 0.85));
        p.hp = clamp(p.hp - d, 0, p.maxHp);
        b.turnLog.unshift(m.name+' 敲響懺悔鐘！'+p.name+' 未防禦，受到 '+d+' 傷害！');
      } else {
        b.turnLog.unshift(m.name+' 敲響懺悔鐘，'+p.name+' 以防禦撐過審判。');
      }
    }
    if(role==='echo_void' && b.roundNum % 4 === 0){
      const p = choice(Math.random, party);
      p.mp = clamp((p.mp||0) - Math.round((p.maxMp||10)*0.12), 0, p.maxMp||0);
      b.turnLog.unshift(m.name+' 鏡映虛空，再抽走 '+p.name+' 的魔力！');
    }
    if(role==='delay' && Math.random() < 0.12){
      const p = choice(Math.random, party);
      p.skipTurn = true;
      b.turnLog.unshift(m.name+' 讓 '+p.name+' 的行動遲緩了一拍！');
    }
    if(role==='taunt'){
      b._hasTauntMinion = true;
    }
    if(role==='shield_dps' && (boss.shieldCharges||0) > 0){
      m.atk = Math.round(num(m.atk,1) * 1.15);
    }
    if(role==='bee' && (flowers + (boss._gardenStacks||0)) > 0){
      m.atk = Math.round(num(m.atk,1) * (1 + 0.06 * Math.min(5, flowers + (boss._gardenStacks||0))));
    }
    if(role==='plague_flag'){
      const poisoned = party.filter(p=>p.status==='poison').length;
      if(poisoned >= 2){
        boss._plagueBurst = true;
      }
    }
    if(role==='bleed_shield'){
      const bleeds = party.reduce((s,p)=>s+(p._bleed||0),0);
      if(bleeds > 0){
        boss.shieldCharges = Math.max(boss.shieldCharges||0, Math.min(3, bleeds));
        boss.shieldReduce = Math.max(boss.shieldReduce||0, 0.25);
      }
    }
    if(role==='sin_altar'){
      b._sinAltar = true;
    }
    if(role==='threat_heal'){
      b._focusHealer = true;
    }
  });
  if(breathCharge > 0) boss._breathBonus = 0.3 * breathCharge;
  if(funeral > 0) boss._funeral = funeral;
  if(rootUp > 0) boss._rootUp = rootUp;
  if(pearl + frostShield + shell > 0 && (boss.shieldCharges||0) < 1){
    boss.shieldCharges = (boss.shieldCharges||0) + 1;
    boss.shieldReduce = Math.max(boss.shieldReduce||0, 0.3);
  }
  if(flowers > 0 || (boss._gardenStacks||0) > 0){
    const g = flowers + Math.min(5, boss._gardenStacks||0);
    boss.hp = clamp(boss.hp + Math.round(boss.maxHp * 0.006 * g), 0, boss.maxHp);
    boss.atk = Math.round(num(boss.baseAtk, boss.atk) * (1 + 0.015 * g));
  }
  if(entropy > 0){
    const mpGone = party.reduce((s,p)=> s + Math.max(0, (p.maxMp||0) - (p.mp||0)), 0);
    boss._entropyBonus = Math.min(0.4, mpGone * 0.0025 * entropy);
  }
  if(bodyguard && boss.hp < boss.maxHp * 0.3){
    if(boss.baseDef == null) boss.baseDef = num(boss.def, 0);
    boss.def = Math.round(num(boss.baseDef, boss.def) * 1.25);
    boss._bodyguard = true;
  } else if(boss._bodyguard && boss.hp >= boss.maxHp * 0.3){
    boss._bodyguard = false;
    if(boss.baseDef != null) boss.def = num(boss.baseDef, boss.def);
  }
  if(tumor){ boss._tumor = true; }
  // 過載砲台：結界在則更疼（上面 shield_dps）；結界破則自傷換爆在攻擊時處理
}

/** 眷屬死亡時觸發 */
function onBossMinionDeath(mon, b){
  if(!mon || !mon.isBossMinion) return;
  const boss = getBattleBoss(b);
  const party = (S && Array.isArray(S.party)) ? S.party.filter(p=>p && p.hp>0) : [];
  const role = mon.minionRole;
  if(mon.minionId==='ember_whelp' && party.length){
    party.forEach(p=>{ p.hp = clamp(p.hp - Math.max(1, Math.round(num(mon.atk,10)*0.85)), 0, p.maxHp); });
    b.turnLog.unshift(mon.name+' 爆成餘燼，灼傷全隊！');
  }
  if(role==='death_spore' || role==='death_poison'){
    party.forEach(p=>{ p.status='poison'; p.statusTurns=Math.max(num(p.statusTurns,0), 2); });
    b.turnLog.unshift(mon.name+' 破裂，毒霧擴散！');
  }
  if(role==='sacrifice_heal' && boss && boss.hp>0){
    const heal = Math.round(boss.maxHp * 0.12);
    boss.hp = clamp(boss.hp + heal, 0, boss.maxHp);
    if(boss._funeral) boss.atk = Math.round(num(boss.atk,1) * (1 + 0.03 * boss._funeral));
    b.turnLog.unshift(mon.name+' 殉葬，'+boss.name+' 回復 '+heal+' HP！');
  }
  if(role==='death_magma' && party.length){
    party.forEach(p=>{ p.hp = clamp(p.hp - Math.max(1, Math.round(num(mon.atk,10)*0.65)), 0, p.maxHp); });
    b.turnLog.unshift(mon.name+' 化作熔池！');
  }
  if(role==='death_charge' && boss){
    boss._starCharge = (boss._starCharge||0) + 2;
    b.turnLog.unshift(mon.name+' 為 '+boss.name+' 注入星屑充能！');
  }
  if(role==='fake_death' && boss){
    boss.evade = Math.min(0.55, (boss.evade||0) + 0.2);
    b.turnLog.unshift(mon.name+' 消散，'+boss.name+' 隱入影中！');
  }
  if(role==='cleanse_boss' && boss){
    boss.status = null; boss.statusTurns = 0;
    b.turnLog.unshift(mon.name+' 淨化了 '+boss.name+' 的異常！');
  }
  if(role==='shield_break_nova' && party.length){
    party.forEach(p=>{ p.hp = clamp(p.hp - Math.max(1, Math.round(num(mon.atk,10)*0.75)), 0, p.maxHp); });
    b.turnLog.unshift(mon.name+' 引發碎屑風暴！');
  }
  if(role==='mini_rez' && boss && boss.hp>0 && !mon._rezzed){
    if(!boss._minionRezUsed){
      boss._minionRezUsed = true;
      mon.hp = Math.max(1, Math.round(mon.maxHp * 0.35));
      mon._rezzed = true;
      b.turnLog.unshift('骸巫之力讓眷屬再起！');
      return;
    }
  }
  // 骸巫死亡時嘗試復活其他已死眷屬位：用 flag 讓下次 refill 多一隻
  if(mon.minionId==='bone_witch' && boss && !boss._witchRez){
    boss._witchRez = true;
    if(typeof refillBossMinions === 'function'){
      // 不強制滿編，只標記
    }
  }
}

/** 眷屬攻擊命中後的特殊效果 */
function applyMinionOnHit(mon, target, dmg, b){
  if(!mon || !mon.isBossMinion || !target || dmg<=0) return;
  const boss = getBattleBoss(b);
  const role = mon.minionRole;
  if(role==='burn_hit' || role==='focus_burn'){
    target.status = 'poison';
    target.statusTurns = Math.max(num(target.statusTurns,0), 2);
    target._burn = (target._burn||0) + 1;
    if(role==='focus_burn' && (target._burn||0) >= 3){
      target.hp = clamp(target.hp - Math.max(1, Math.round(dmg * 0.4)), 0, target.maxHp);
      target._burn = 0;
      b.turnLog.unshift(mon.name+' 點燃爆發！');
    }
  }
  if(role==='mp_drain'){
    const drain = Math.max(1, Math.round((target.maxMp||10) * 0.1));
    target.mp = clamp((target.mp||0) - drain, 0, target.maxMp||0);
    if((target.mp||0) <= 0){
      target.hp = clamp(target.hp - Math.max(1, Math.round(dmg * 0.25)), 0, target.maxHp);
    }
  }
  if(role==='bleed_hit' || role==='bleed_crit'){
    target._bleed = (target._bleed||0) + 1;
    if(role==='bleed_crit' && (target._bleed||0) >= 2){
      target.hp = clamp(target.hp - Math.max(1, Math.round(dmg * 0.3)), 0, target.maxHp);
    }
  }
  if(role==='poison_hit' || role==='flower_thorn'){
    target.status = 'poison';
    target.statusTurns = Math.max(num(target.statusTurns,0), 3);
  }
  if(role==='wet'){ target._wet = true; target.spdDebuff = (target.spdDebuff||0) + 1; }
  if(role==='star_mark'){ target._starMark = (target._starMark||0) + 1; }
  if(role==='sin_scribe' || role==='sin_hunter'){
    target._sin = (target._sin||0) + 1;
    if(role==='sin_hunter' && (target._sin||0) >= 2){
      target.hp = clamp(target.hp - Math.max(1, Math.round(dmg * 0.2)), 0, target.maxHp);
    }
  }
  if(role==='fear' && Math.random() < 0.22){
    target.skipTurn = true;
    b.turnLog.unshift(mon.name+' 使 '+target.name+' 陷入恐懼！');
  }
  if(role==='freeze_chance' && Math.random() < (0.12 + ((target.spdDebuff||0) > 0 ? 0.1 : 0))){
    target.skipTurn = true;
    b.turnLog.unshift(mon.name+' 冰封了 '+target.name+'！');
  }
  if((role==='extra_root' || role==='root_hit') && Math.random() < (0.16 + 0.05 * num(boss && boss._rootUp, 0))){
    target.skipTurn = true;
    b.turnLog.unshift(mon.name+' 纏住了 '+target.name+'！');
  }
  if(role==='skill_jam' && Math.random() < 0.18){
    target._skillJam = 1;
    b.turnLog.unshift(mon.name+' 干擾了 '+target.name+' 的施法！');
  }
  if(role==='execute' && target.hp < target.maxHp * 0.25){
    target.hp = clamp(target.hp - Math.max(1, Math.round(dmg * 0.55)), 0, target.maxHp);
  }
  if(role==='hunt_low' && target.hp < target.maxHp * 0.4){
    target.hp = clamp(target.hp - Math.max(1, Math.round(dmg * 0.22)), 0, target.maxHp);
  }
  if(role==='hunt_healer'){
    const isHealer = target.classId==='cleric' || target.classId==='paladin' || num(target.matk,0) > num(target.atk,0) * 1.1;
    if(isHealer || (b && b._focusHealer)){
      target.hp = clamp(target.hp - Math.max(1, Math.round(dmg * 0.2)), 0, target.maxHp);
    }
  }
  if(role==='slow_crit' && (target.spdDebuff||0) > 0){
    target.hp = clamp(target.hp - Math.max(1, Math.round(dmg * 0.25)), 0, target.maxHp);
  }
  if(role==='cleave'){
    // 額外掃到另一個存活隊員
    const others = (S && S.party) ? S.party.filter(p=>p.hp>0 && p.uid !== target.uid) : [];
    if(others.length){
      const o = choice(Math.random, others);
      o.hp = clamp(o.hp - Math.max(1, Math.round(dmg * 0.4)), 0, o.maxHp);
    }
  }
  if(role==='echo_hit'){
    target.hp = clamp(target.hp - Math.max(1, Math.round(dmg * 0.35)), 0, target.maxHp);
  }
  if(role==='atk_link' && boss){ boss.atk = Math.round(num(boss.atk,1) * 1.02); }
  if(role==='def_link' && boss){ boss.def = Math.round(num(boss.def,1) + 1); }
  if(role==='leech_cc' && target.skipTurn && boss){
    boss.hp = clamp(boss.hp + Math.max(1, Math.round(dmg * 0.35)), 0, boss.maxHp);
  }
  if(boss && (target._bleed||0) > 0) boss._vsBleed = true;
  if(boss && (target._starMark||0) > 0){
    target.hp = clamp(target.hp - Math.max(1, Math.round(dmg * 0.1 * Math.min(3, target._starMark))), 0, target.maxHp);
  }
  // 過載：無結界時自傷換高傷已在傷害算出前難處理；命中後小幅自傷
  if(role==='shield_dps' && boss && !(boss.shieldCharges > 0)){
    mon.hp = clamp(mon.hp - Math.max(1, Math.round(mon.maxHp * 0.05)), 0, mon.maxHp);
  }
}

/** 玩家打 Boss／眷屬時：護衛、反傷、甲殼等 */
function applyBossMinionDefenseHooks(attacker, mon, dmg, isMagic, b){
  if(!b || !mon || dmg <= 0) return dmg;
  let out = dmg;
  const boss = getBattleBoss(b);
  const guards = b.monsters.filter(m=>m.isBossMinion && m.hp>0 && (m.minionRole==='boss_guard' || m.minionRole==='bodyguard_low'));
  // 打 Boss 時可被影侍／親衛分擔
  if(mon.boss && guards.length){
    const g = guards[0];
    const share = Math.round(out * 0.4);
    if(share > 0){
      g.hp = clamp(g.hp - share, 0, g.maxHp);
      out = Math.max(1, out - share);
      b.turnLog.unshift(g.name+' 替 '+mon.name+' 擋下 '+share+' 點傷害！');
      if(g.hp <= 0 && !g.rewarded) checkKillReward(g, b);
    }
  }
  // 互傷旗
  if(b._mutualVuln){ out = Math.round(out * 1.1); }
  // 抗暴：簡化為對玩家高傷砍一點（近似）
  if(mon.boss && b.monsters.some(m=>m.isBossMinion && m.hp>0 && m.minionRole==='anti_crit') && out > mon.maxHp * 0.12){
    out = Math.round(out * 0.85);
  }
  // 膿皰反毒
  if(mon.isBossMinion && mon.minionRole==='poison_thorns' && attacker){
    attacker.status = 'poison';
    attacker.statusTurns = Math.max(num(attacker.statusTurns,0), 2);
  }
  // 荊莠：打花相關
  if(mon.isBossMinion && (mon.minionRole==='flower' || mon.flower) && attacker){
    attacker.status = 'poison';
    attacker.statusTurns = Math.max(num(attacker.statusTurns,0), 2);
  }
  // 反魔
  if(mon.boss && isMagic && b.monsters.some(m=>m.isBossMinion && m.hp>0 && m.minionRole==='reflect_magic')){
    const ref = Math.max(1, Math.round(out * 0.15));
    if(attacker) attacker.hp = clamp(attacker.hp - ref, 0, attacker.maxHp);
    b.turnLog.unshift('軌道鏡反射了 '+ref+' 點魔法傷害！');
  }
  // 鮮血鏡：打 Boss 反流血
  if(mon.boss && b.monsters.some(m=>m.isBossMinion && m.hp>0 && m.minionRole==='reflect_bleed') && attacker){
    attacker._bleed = (attacker._bleed||0) + 1;
  }
  // 分攤：漩渦盾衛
  if(mon.boss){
    const sharers = b.monsters.filter(m=>m.isBossMinion && m.hp>0 && m.minionRole==='share_dmg');
    if(sharers.length){
      const each = Math.round(out * 0.2 / sharers.length);
      sharers.forEach(s=>{
        s.hp = clamp(s.hp - each, 0, s.maxHp);
        if(s.hp <= 0) checkKillReward(s, b);
      });
      out = Math.max(1, out - each * sharers.length);
    }
  }
  // 巨瘤：保護花，減傷
  if(mon.isBossMinion && (mon.flower || mon.minionRole==='flower') && b.monsters.some(m=>m.isBossMinion && m.hp>0 && m.minionRole==='tumor')){
    out = Math.round(out * 0.7);
  }
  // 技能壓制
  if(isMagic && b._skillDampen){ out = Math.round(out * (1 - b._skillDampen)); }
  return Math.max(1, out);
}

function getBattleBoss(b){
  if(!b || !b.monsters) return null;
  return b.monsters.find(m=>m.boss && m.hp>0) || b.monsters.find(m=>m.boss) || null;
}

/** 補滿 Boss 眷屬至目標數量（僅 Boss 仍存活時） */
function refillBossMinions(b, force){
  if(!b || b.over) return;
  const boss = getBattleBoss(b);
  if(!boss || boss.hp<=0) return;
  const targetCount = b.bossMinionCount || 2;
  const aliveMinions = b.monsters.filter(m=>m.isBossMinion && m.hp>0);
  const need = targetCount - aliveMinions.length;
  if(need <= 0 && !force) return;
  // 移除已死眷屬欄位，再補新的
  b.monsters = b.monsters.filter(m=> !(m.isBossMinion && m.hp<=0));
  const stillAlive = b.monsters.filter(m=>m.isBossMinion && m.hp>0).length;
  const toAdd = Math.max(0, targetCount - stillAlive);
  if(toAdd <= 0) return;
  const rng = Math.random;
  const pl = avgPartyLevel();
  const roster = getBossMinionRoster(boss);
  const aliveIds = new Set(b.monsters.filter(m=>m.isBossMinion && m.hp>0).map(m=>m.minionId));
  let addIdx = 0;
  for(let i=0;i<roster.length && addIdx<toAdd;i++){
    if(aliveIds.has(roster[i].id)) continue;
    b.monsters.push(makeBossMinion(boss, pl, rng, i));
    aliveIds.add(roster[i].id);
    addIdx++;
  }
  while(addIdx < toAdd){
    b.monsters.push(makeBossMinion(boss, pl, rng, addIdx));
    addIdx++;
  }
  // 補完後重建回合順序，讓新眷屬盡快插入行動
  if(typeof buildTurnOrder==='function'){
    const prevRef = b.order && b.order[b.turnIndex] ? b.order[b.turnIndex].ref : null;
    b.order = buildTurnOrder(b.monsters);
    if(prevRef){
      const idx = b.order.findIndex(c=>c.ref===prevRef);
      if(idx>=0) b.turnIndex = idx;
    }
  }
  b.turnLog.unshift('⚠ '+boss.name+' 召喚眷屬補滿戰場！（'+toAdd+' 隻）');
}

];
const EQUIP_SLOT_IDS = EQUIP_SLOT_DEFS.map(s=>s.id);
function emptyEquip(){
  const e = {};
  EQUIP_SLOT_IDS.forEach(id=> e[id]=null);
  return e;
}
function ensureMemberEquip(m){
  if(!m) return;
  if(!m.equip) m.equip = emptyEquip();
  EQUIP_SLOT_IDS.forEach(id=>{ if(m.equip[id]===undefined) m.equip[id]=null; });
  // 舊 accessory2 → 若飾品空則挪入，否則退回背包／倉庫
  if(m.equip.accessory2){
    const extra = m.equip.accessory2;
    if(!m.equip.accessory) m.equip.accessory = extra;
    else if(typeof S!=='undefined' && S){
      if(typeof backpackHasSpace==='function' && backpackHasSpace(1)) S.inventory.push(extra);
      else if(typeof overflowDispose==='function') overflowDispose(extra, true);
      else if(S.inventory) S.inventory.push(extra);
    }
    m.equip.accessory2 = null;
    delete m.equip.accessory2;
  }
}

function getUniqueSkill(item){
  if(!item || !(item.isUnique || item.rarity==='unique')) return null;
  const key = String(item.baseName || item.name || '').replace(/^【唯一】/, '');
  const sk = item.uniqueSkill || UNIQUE_SKILLS[key] || ROLE_UNIQUE_SKILL_FALLBACK[item.role] || ROLE_UNIQUE_SKILL_FALLBACK.warrior;
  if(!sk) return null;
  // 回傳副本並標記來源，避免共用物件被改／舊存檔缺 fromUnique
  return Object.assign({}, sk, {fromUnique:true, uniqueName: key});
}
/** 角色已裝備的唯一專屬技能列表 */
function equippedUniqueSkills(member){
  if(!member || !member.equip) return [];
  const out = [];
  const seen = new Set();
  Object.values(member.equip).forEach(eq=>{
    if(!eq) return;
    const sk = getUniqueSkill(eq);
    if(!sk) return;
    const id = sk.name + '|' + (eq.baseName||eq.name);
    if(seen.has(id)) return;
    seen.add(id);
    out.push(Object.assign({}, sk, {fromUnique:true, sourceItem: eq.baseName||eq.name}));
  });
  return out;
}

function getUniqueEffect(item){
  if(!item || !(item.isUnique || item.rarity==='unique')) return null;
  if(item.effect && item.effect.type) return item.effect;
  const key = String(item.baseName || item.name || '').replace(/^【唯一】/, '');
  if(UNIQUE_EFFECTS[key]) return UNIQUE_EFFECTS[key];
  return ROLE_UNIQUE_FALLBACK[item.role] || ROLE_UNIQUE_FALLBACK.warrior;
}
/** 角色已裝備唯一效果列表 */
function equippedUniqueEffects(member){
  if(!member || !member.equip) return [];
  const out = [];
  Object.values(member.equip).forEach(eq=>{
    if(!eq) return;
    const eff = getUniqueEffect(eq);
    if(eff) out.push({item:eq, effect:eff});
  });
  return out;
}
function sumUniqueEffect(member, type){
  let s = 0;
  equippedUniqueEffects(member).forEach(({effect})=>{
    if(effect.type===type) s += num(effect.v, 0);
  });
  return s;
}
function uniqueEffectDesc(item){
  const eff = getUniqueEffect(item);
  return eff ? eff.desc : '';
}
