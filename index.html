<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>弒魔的旅途 - 像素文字RPG</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0a09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
:root{
  --bg-deep:#0c0a09;
  --bg-panel:#1b1512;
  --bg-panel-2:#271f19;
  --line:#4a2f1f;
  --gold:#ff6a35;
  --gold-dim:#8a3a1a;
  --hp:#d4453f;
  --mp:#5b93a8;
  --xp:#8fae52;
  --text:#ece2cc;
  --text-dim:#9c8f7c;
  --common:#9c8f7c;
  --rare:#5b93a8;
  --epic:#a565d6;
  --legend:#ff6a35;
  --mythic:#ff4fa3;
  /* 裝備稀有度色 */
  --r-crude:#6b6358;
  --r-normal:#9c8f7c;
  --r-handy:#a8a090;
  --r-common:#b7c49a;
  --r-uncommon:#5b93a8;
  --r-rare:#4a9fd8;
  --r-scarce:#6b8cff;
  --r-epic:#a565d6;
  --r-legend:#ff6a35;
  --r-mythic:#ff4fa3;
  --r-ancient:#ffd24a;
  --r-unique:#ff3b3b;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
  --touch-min: 44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{background:var(--bg-deep);-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:radial-gradient(ellipse at 50% -10%, #241a13 0%, #0c0a09 62%);
  color:var(--text);
  font-family:'Noto Serif TC',serif;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  padding:18px 10px;
  padding-top:calc(12px + var(--safe-top));
  padding-bottom:calc(18px + var(--safe-bottom));
  position:relative;
  overflow-x:hidden;
}
/* --- 信物：飄升餘燼（Ashfall 的視覺主題） --- */
#embers{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.ember-particle{
  position:absolute; bottom:-5%; width:3px; height:3px; border-radius:50%;
  background:var(--gold); box-shadow:0 0 6px 1px rgba(255,106,53,.8);
  opacity:0; animation:emberRise linear infinite;
}
@keyframes emberRise{
  0%{ transform:translate(0,0) scale(1); opacity:0; }
  8%{ opacity:.55; }
  92%{ opacity:.25; }
  100%{ transform:translate(var(--drift,20px), -108vh) scale(.4); opacity:0; }
}
#app{width:100%;max-width:900px;position:relative;z-index:1;}
.pixel-font{font-family:'Silkscreen',monospace;}
.title-bar{
  text-align:center;margin-bottom:14px;
}
.title-bar h1{
  font-size:16px;letter-spacing:3px;color:var(--gold);
  text-shadow:0 0 10px rgba(255,106,53,.5), 0 0 2px rgba(255,106,53,.8);
  margin:0 0 4px;
  animation:emberGlow 3.2s ease-in-out infinite;
}
@keyframes emberGlow{
  0%,100%{ text-shadow:0 0 10px rgba(255,106,53,.5), 0 0 2px rgba(255,106,53,.8); }
  50%{ text-shadow:0 0 16px rgba(255,106,53,.75), 0 0 3px rgba(255,106,53,1); }
}
.title-bar p{font-size:11px;color:var(--text-dim);margin:0;letter-spacing:1px;}
#game-version-label,.version-tag{color:var(--gold);letter-spacing:0.5px;font-size:10px;}
.panel{
  background:var(--bg-panel);
  border:1px solid var(--line);
  border-top:2px solid var(--gold-dim);
  box-shadow:0 10px 24px -12px rgba(0,0,0,.6);
  padding:14px;
  margin-bottom:12px;
  border-radius:4px;
}
.btn{
  font-family:'Noto Serif TC',serif;
  font-weight:700;
  background:var(--bg-panel-2);
  border:1px solid var(--line);
  color:var(--text);
  padding:10px 14px;
  min-height:var(--touch-min);
  cursor:pointer;
  font-size:14px;
  transition:transform .08s, background .15s, box-shadow .1s;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.06),
    inset 0 -2px 0 rgba(0,0,0,.35),
    0 1px 0 rgba(0,0,0,.4);
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
  border-radius:4px;
}
.btn:hover{background:#33291f;transform:translateY(-1px);}
.btn:active{transform:translateY(1px);box-shadow:inset 0 2px 0 rgba(0,0,0,.4);}
.btn.gold{border-color:var(--gold-dim);color:var(--gold);}
.btn.danger{border-color:#7a2c34;color:#e0655f;}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.grid{display:grid;gap:10px;}
.party-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));}

/* 主畫面隊伍卡：預設更緊湊，減少需滑動才能按到的按鈕 */

/* 酒館：8 人兩排 */

/* 商店：酒館風格卡片格 */
.shop-grid{
  display:grid;
  grid-template-columns:repeat(4, minmax(0,1fr));
  gap:6px;
  margin:6px 0;
}
.shop-card{
  background:var(--bg-panel-2);
  border:1px solid var(--line);
  border-radius:6px;
  padding:6px 4px;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  min-width:0;
}
.shop-card.sold{opacity:.4;}
.shop-card canvas.sprite{width:36px!important;height:36px!important;}
.shop-icon{font-size:22px;line-height:1.2;}
.shop-name{font-size:11px;font-weight:bold;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.shop-stats{font-size:9px;color:var(--text-dim);line-height:1.25;max-width:100%;max-height:2.6em;overflow:hidden;word-break:break-all;}
.shop-card .btn-compact{padding:4px 6px;min-height:28px;font-size:11px;width:100%;}

.tavern-grid{
  display:grid;
  grid-template-columns:repeat(4, minmax(0,1fr));
  gap:6px;
  margin:6px 0;
}
.tavern-card{
  background:var(--bg-panel-2);
  border:1px solid var(--line);
  border-radius:6px;
  padding:6px 4px;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  min-width:0;
}
.tavern-card.recruited{opacity:.45;}
.tavern-card canvas.sprite{width:36px!important;height:36px!important;}
.tavern-name{font-size:11px;font-weight:bold;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tavern-tend{font-size:9px;color:var(--gold);line-height:1.2;}
.tavern-card .btn-compact{padding:4px 6px;min-height:28px;font-size:11px;width:100%;}

/* 過肩對話場景 */
.talk-scene{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  align-items:end;
  min-height:160px;
  margin:8px 0;
  padding:10px;
  background:linear-gradient(180deg, rgba(20,30,40,.9), rgba(10,14,20,.95));
  border:1px solid var(--line);
  border-radius:8px;
  position:relative;
  overflow:hidden;
}
.talk-scene .talk-hero{
  display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;
}
.talk-scene .talk-partner{
  display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;
}
.talk-scene canvas.sprite{width:72px!important;height:72px!important;image-rendering:pixelated;}
.talk-scene .talk-hero canvas{transform:scaleX(-1);opacity:.92;} /* 背影感：水平翻轉 */
.talk-label{font-size:10px;color:var(--text-dim);margin-top:4px;}
.talk-dialog{
  background:var(--bg-panel-2);
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 12px;
  margin-top:8px;
}
.talk-dialog .line{margin:6px 0;line-height:1.45;}
.talk-dialog .speaker{color:var(--gold);font-weight:bold;}
.talk-choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:center;}
.complicity-bar{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-top:3px;}
.complicity-bar > i{display:block;height:100%;background:linear-gradient(90deg,#6af,#d6f);width:0%;}

.hub-party-grid{
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:6px;
  margin:4px 0 2px;
}
.hub-party-grid .member-card-compact{
  padding:4px 6px;
  gap:6px;
  border-left-width:2px;
}
.hub-party-grid .member-card-compact canvas.sprite{
  width:28px !important;
  height:28px !important;
}
.hub-party-grid .member-card-compact .member-name{
  font-size:11px;
  line-height:1.2;
}
.hub-party-grid .member-card-compact .compact-stats{
  font-size:9px;
}
.hub-party-grid .member-card-compact .bar-wrap{height:5px;margin:1px 0;}
.hub-party-grid .member-card-compact .bar-wrap-mp{height:3px;}
.hub-panel .btn-primary{margin-bottom:6px;}
.hub-panel .nav-grid{margin-top:6px;}
.hub-panel + .panel .log-box{height:88px;}

.class-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));}
.class-card{
  background:var(--bg-panel-2);border:1px solid var(--line);border-top:2px solid transparent;
  padding:12px;text-align:center;cursor:pointer;transition:border-color .12s, background .12s;
  border-radius:4px;touch-action:manipulation;
}
.class-card:hover{border-top-color:var(--gold-dim);}
.class-card:active{background:#33291f;}
.class-card.selected{border-top-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
.class-card h3{margin:6px 0 2px;font-size:14px;color:var(--gold);font-weight:700;}
.class-card p{margin:0;font-size:11px;color:var(--text-dim);line-height:1.5;}
canvas.sprite{image-rendering:pixelated;background:#0a0807;border:1px solid var(--line);flex-shrink:0;}
.statline{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 8px;font-size:11px;color:var(--text-dim);margin-top:6px;font-family:'Space Mono','Noto Serif TC',serif;}
.bar-wrap{background:#0a0807;border:1px solid var(--line);height:9px;overflow:hidden;margin:3px 0;border-radius:2px;}
.bar{height:100%;}
.topbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:10px;}
.member-card{
  background:var(--bg-panel-2);border:1px solid var(--line);border-left:3px solid var(--line);
  padding:10px;display:flex;gap:10px;align-items:center;transition:border-color .12s;
  border-radius:4px;
}
.member-card.active-turn{border-left-color:var(--gold);box-shadow:0 0 8px rgba(255,106,53,.15);}
.member-card.dead{opacity:.55;filter:grayscale(.3);}
.member-info{flex:1;min-width:0;}
.member-name{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;}
/* 戰鬥精簡角色卡 — 縮小佔位，留給技能與怪物 */
.member-card-compact{
  padding:5px 8px;gap:6px;border-left-width:2px;
}
.member-card-compact .member-name{font-size:11px;line-height:1.25;margin-bottom:1px;}
.member-card-compact .bar-wrap{height:6px;margin:2px 0;}
.member-card-compact .bar-wrap-mp{height:4px;}
.member-card-compact .compact-stats{
  display:flex;justify-content:space-between;gap:6px;
  font-size:10px;color:var(--text-dim);font-family:'Space Mono','Noto Serif TC',serif;
  line-height:1.2;
}
.member-card-compact canvas.sprite{width:32px;height:32px;}
.battle-party-grid{
  grid-template-columns:repeat(4, minmax(0, 1fr));
  gap:6px;margin:6px 0 2px;
}
.member-card-compact{padding:4px 6px;gap:6px;}
.member-card-compact canvas.sprite{width:28px;height:28px;}
.member-card-compact .member-name{font-size:11px;}
.member-card-compact .compact-stats{font-size:9px;}
.battle-log-box{height:96px;}
.rarity-crude{color:var(--r-crude);}
.rarity-normal{color:var(--r-normal);}
.rarity-handy{color:var(--r-handy);}
.rarity-common{color:var(--r-common);}
.rarity-uncommon{color:var(--r-uncommon);}
.rarity-rare{color:var(--r-rare);}
.rarity-scarce{color:var(--r-scarce);}
.rarity-epic{color:var(--r-epic);}
.rarity-legend{color:var(--r-legend);}
.rarity-mythic{color:var(--r-mythic);text-shadow:0 0 4px rgba(255,79,163,.6);}
.rarity-ancient{color:var(--r-ancient);text-shadow:0 0 6px rgba(255,210,74,.5);}
.rarity-unique{color:var(--r-unique);text-shadow:0 0 8px rgba(255,59,59,.7);font-weight:900;}
.log-box{
  background:#0a0807;border:1px solid var(--line);
  padding:10px;font-size:12px;height:130px;overflow-y:auto;line-height:1.7;
  font-family:'Space Mono','Noto Serif TC',serif;
  border-radius:4px;-webkit-overflow-scrolling:touch;
}
.log-box div{border-bottom:1px dashed #2a2119;padding-bottom:3px;margin-bottom:3px;}
.monster-row{
  display:grid;
  grid-template-columns:repeat(6, minmax(0, 1fr));
  gap:6px;justify-content:center;margin:8px 0;
}
.monster-box{
  text-align:center;cursor:pointer;padding:4px 2px;border:2px solid transparent;
  border-radius:6px;touch-action:manipulation;min-width:0;
  transition:border-color .12s, background .12s;
}
.monster-box canvas.sprite{
  width:40px !important;height:40px !important;
  display:block;margin:0 auto;
}
.monster-box .small{font-size:9px;line-height:1.2;}
.monster-box .bar-wrap{width:48px !important;margin:2px auto !important;}
.monster-box.target-selectable:hover,
.monster-box.target-selectable:active{border-color:var(--hp);background:rgba(212,69,63,.08);}
.monster-box.dead{opacity:.25;pointer-events:none;}
.monster-name{font-size:10px;margin-top:2px;font-weight:600;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
/* --- 按鍵層級系統 --- */
.btn-primary{width:100%;padding:16px;font-size:16px;letter-spacing:1px;margin-bottom:2px;min-height:52px;}
.nav-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
.nav-grid-4{grid-template-columns:repeat(4,1fr);}
.btn-nav{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;padding:14px 6px;font-size:12px;white-space:nowrap;min-height:64px;
}
.btn-nav .nav-icon{font-size:22px;line-height:1;}
.btn-compact{padding:10px 12px;font-size:13px;min-height:var(--touch-min);}
.segmented{display:flex;border:1px solid var(--line);width:fit-content;max-width:100%;margin-bottom:10px;border-radius:4px;overflow:hidden;}
.segmented .btn{border:none;box-shadow:none;padding:10px 18px;font-size:13px;background:transparent;border-radius:0;min-height:var(--touch-min);}
.segmented .btn+.btn{border-left:1px solid var(--line);}
.segmented .btn.active{background:var(--gold-dim);color:var(--bg-deep);}
.action-label{font-family:'Silkscreen',monospace;font-size:9px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase;margin:12px 0 6px;border-bottom:1px dashed var(--line);padding-bottom:4px;}
.skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;}
.skill-btn{display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;padding:10px 12px;white-space:normal;min-height:var(--touch-min);}
.skill-btn-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:8px;}
.skill-unique{border-color:var(--r-unique)!important;box-shadow:0 0 0 1px rgba(255,59,59,.35);}
.skill-btn-desc{color:var(--text-dim);line-height:1.4;font-size:12px;}
.skill-btn-est{color:var(--gold);font-size:12px;}
.skill-btn .mp-cost{font-family:'Space Mono','Noto Serif TC',serif;color:var(--mp);font-size:11px;white-space:nowrap;}
.utility-row{display:flex;gap:8px;flex-wrap:wrap;}
.utility-row .btn{flex:1;min-width:0;}
.flee-link{background:none;border:none;box-shadow:none;color:var(--text-dim);font-size:13px;text-decoration:underline;cursor:pointer;padding:12px 8px;margin:8px 0 0 auto;display:block;min-height:var(--touch-min);touch-action:manipulation;}
.flee-link:hover,.flee-link:active{color:var(--hp);}
.choice-list{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
.choice-list .btn{text-align:left;width:100%;padding:14px 16px;font-size:15px;}
.item-row{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--bg-panel-2);border:1px solid var(--line);padding:10px;margin-bottom:8px;
  border-radius:4px;
}
.item-row .meta{font-size:11px;color:var(--text-dim);font-family:'Space Mono','Noto Serif TC',serif;}
.item-row .btn{flex-shrink:0;white-space:nowrap;}
/* 背包重做 v3：參考經典 RPG 版面 */
.bp-wrap{display:flex;flex-direction:column;gap:10px;}
.bp-main{display:grid;grid-template-columns:1fr;gap:10px;}
@media (min-width:720px){
  .bp-main{grid-template-columns:minmax(240px,0.95fr) minmax(260px,1.15fr);}
}
.bp-left,.bp-right{
  background:linear-gradient(180deg,var(--bg-panel) 0%,var(--bg-panel-2) 100%);
  border:1px solid var(--line);border-radius:8px;padding:10px;
}
.bp-char{
  display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;
  margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line);
}
.bp-char-meta{font-size:12px;line-height:1.55;}
.bp-char-meta .nm{font-family:'Silkscreen',monospace;color:var(--gold);font-size:13px;}
.bp-bars{margin-top:4px;}
.bp-bar-row{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:11px;color:var(--text-dim);}
.bp-bar-row b{color:var(--text);min-width:64px;font-weight:600;}
.bp-bar{flex:1;height:8px;background:#1a1510;border:1px solid var(--line);border-radius:3px;overflow:hidden;}
.bp-bar > i{display:block;height:100%;}
.bp-bar.hp > i{background:linear-gradient(90deg,#8b2e2e,#e74c3c);}
.bp-bar.mp > i{background:linear-gradient(90deg,#1a4a6e,#3b9eff);}
.bp-gold-exp{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--text-dim);margin-top:6px;}
.bp-gold-exp b{color:var(--gold);}

/* 裝備紙娃娃 */
.bp-equip-title{font-family:'Silkscreen',monospace;font-size:11px;color:var(--gold);letter-spacing:1px;margin:0 0 8px;}
.bp-doll{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  grid-template-areas:
    ". head ."
    "weapon chest offhand"
    "hands armor cape"
    "acc feet .";
  gap:6px;justify-items:center;
}
.bp-slot{width:100%;max-width:88px;min-height:64px;background:var(--bg-deep);border:1px solid var(--line);border-radius:6px;padding:5px 4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;cursor:pointer;transition:border-color .15s,box-shadow .15s;overflow:hidden;box-sizing:border-box;}
.bp-slot:hover,.bp-slot.selected{border-color:var(--gold);box-shadow:0 0 0 1px rgba(255,210,74,.3);}
.bp-slot.empty{border-style:dashed;opacity:.9;}
.bp-slot.empty-can{border-color:var(--gold-dim);}
.bp-slot .sl{font-size:9px;color:var(--gold);font-family:'Silkscreen',monospace;letter-spacing:.5px;flex-shrink:0;}
.bp-slot .sn{font-size:10px;color:var(--text);text-align:center;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;}
.bp-slot .sm{font-size:9px;color:var(--text-dim);text-align:center;line-height:1.2;}
/* 紙娃娃／背包格內的裝備圖示：強制塞進格子，不撐開版面 */
.bp-slot canvas,
.bp-slot canvas.sprite{
  width:36px !important;
  height:36px !important;
  max-width:70% !important;
  max-height:36px !important;
  object-fit:contain;
  image-rendering:pixelated;
  flex-shrink:0;
  display:block;
}
.bp-cell canvas,
.bp-cell canvas.sprite{
  width:70% !important;
  height:70% !important;
  max-width:40px !important;
  max-height:40px !important;
  object-fit:contain;
  image-rendering:pixelated;
