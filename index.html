/* ============ 敵對冒險家 ============ */
const RIVAL_TIERS = [
  {id:'nobody',  name:'無名',     mult:1.00, w:50, minLv:5},
  {id:'known',   name:'聞名',     mult:1.22, w:28, minLv:12},
  {id:'infamous',name:'惡名',     mult:1.48, w:15, minLv:22},
  {id:'legend',  name:'傳奇浪人', mult:1.75, w:7,  minLv:35}
];
const RIVAL_TEAM_PREFIX = ['灰燼','斷橋','夜行','鏽牙','北風','黑沼','赤刃','沉鷗','棄誓','流灰','刺骨','薄暮'];
const RIVAL_TEAM_SUFFIX = ['刃','商隊','遊俠','傭兵','獵手','浪客','兄弟','結社','之牙','殘黨','旅團','影'];
const RIVAL_FIRST = ['凱','羅','艾','瑪','雷','蘇','喬','莉','蓋','安','菲','德','娜','克','露','塔'];
const RIVAL_SECOND = ['恩','克','拉','莎','德','莉','森','特','爾','娜','克','芙','恩','托','絲','文'];

function rollRivalTier(avgLevel, rng){
  rng = rng || Math.random;
  const lv = num(avgLevel, 1);
  const pool = RIVAL_TIERS.filter(x=> lv >= x.minLv).map(x=>({item:x, w:x.w}));
  if(!pool.length) return RIVAL_TIERS[0];
  return weightedChoice(rng, pool);
}
function rivalTeamSize(avgLevel, rng){
  rng = rng || Math.random;
  const lv = num(avgLevel, 1);
  if(lv < 15) return 2;
  if(lv < 30) return rng() < 0.55 ? 2 : 3;
  if(lv < 45) return rng() < 0.40 ? 3 : 4;
  return rng() < 0.30 ? 3 : 4;
}
function makeRivalName(rng){
  // 與酒館相同：男女雙池，回傳名字（gender 由呼叫端寫入）
  const picked = pickNpcNameAndGender(rng || Math.random);
  return picked.name;
}
function makeRivalNameWithGender(rng){
  return pickNpcNameAndGender(rng || Math.random);
}
function makeRivalTeamName(rng){
  return choice(rng, RIVAL_TEAM_PREFIX) + choice(rng, RIVAL_TEAM_SUFFIX);
}
function makeRivalAdventurer(avgLevel, rng, tier, teamName, forcedRole){
  rng = rng || Math.random;
  tier = tier || RIVAL_TIERS[0];
  const lv = clamp(num(avgLevel, 1) + rint(rng, -1, 1), 1, MAX_PLAYER_LEVEL);
  const mult = num(tier.mult, 1);
  let maxHp = (90 + lv * 20 + lv * lv * 0.04) * mult;
  let atk   = (12 + lv * 1.60 + 3) * mult;
  let def   = (6 + lv * 0.90 + 2) * mult;
  let spd   = Math.round((8 + lv * 0.25) * (0.95 + rng() * 0.12));
  let exp   = (40 + lv * 7) * mult * 1.35;
  let gold  = (28 + lv * 4.5) * mult * 1.50;
  const picked = (typeof makeRivalNameWithGender === 'function')
    ? makeRivalNameWithGender(rng)
    : { name: makeRivalName(rng), gender: 'male' };
  const name = picked.name;
  const gender = picked.gender || guessGenderFromName(name);
  const roles = ['戰士','盜賊','法師','祭司','弓手','騎士'];
  const role = forcedRole && roles.includes(forcedRole) ? forcedRole : choice(rng, roles);
  if(role==='戰士' || role==='騎士'){ maxHp*=1.15; def*=1.12; atk*=1.05; }
  if(role==='盜賊' || role==='弓手'){ spd=Math.round(spd*1.15); atk*=1.10; maxHp*=0.90; }
  if(role==='法師'){ atk*=1.12; def*=0.88; maxHp*=0.92; }
  if(role==='祭司'){ maxHp*=1.08; def*=1.05; atk*=0.90; }
  const mon = {
    name: name, baseName: name, type:'beast', tier:1, boss:false, elite:false, rank:'normal',
    uid: 'rival_'+Math.floor(rng()*1e9),
    isRival:true, gender:gender, rivalTier:tier.id, rivalTierName:tier.name, rivalRole:role, rivalTeam:teamName||'',
    level:lv, hp:0, maxHp:0, atk:0, def:0, spd:0, exp:0, gold:0,
    seed:'rival_'+name+'_'+Math.floor(rng()*9999),
    status:null, statusTurns:0, rewarded:false,
    hasRegen: role==='祭司' && rng()<0.5, regenRate:0.04,
    affixes:[], affixNames:[tier.name, role], mech:null, bossTurns:0
  };
  mon.maxHp = Math.max(30, Math.round(maxHp));
  mon.hp = mon.maxHp;
  mon.atk = Math.max(1, Math.round(atk));
  mon.def = Math.max(0, Math.round(def));
  mon.spd = Math.max(1, spd);
  mon.exp = Math.max(1, Math.round(exp));
  mon.gold = Math.max(0, Math.round(gold));
  return mon;
}

/** 職角編成：至少 1 輸出、至多 1 祭司；隊長偏坦/輸出 */
function rollRivalRoles(n, rng){
  rng = rng || Math.random;
  n = clamp(num(n, 2), 1, 4);
  const dps = ['戰士','盜賊','法師','弓手','騎士'];
  const roles = [];
  // 第 1 人（隊長）：70% 坦克系，30% 輸出
  roles.push(rng() < 0.70 ? (rng() < 0.5 ? '騎士' : '戰士') : choice(rng, dps));
  let priestUsed = false;
  for(let i=1;i<n;i++){
    if(!priestUsed && rng() < 0.28){
      roles.push('祭司');
      priestUsed = true;
    } else {
      roles.push(choice(rng, dps));
    }
  }
  // 保證至少一個純輸出（法師/盜賊/弓手）若全是坦則改一人
  const hasGlass = roles.some(r=> r==='法師'||r==='盜賊'||r==='弓手'||r==='戰士');
  if(!hasGlass && roles.length){
    roles[roles.length-1] = choice(rng, ['法師','盜賊','弓手']);
  }
  // 至多一名祭司（已保證）
  return roles;
}

function startRivalBattle(){
  const rng = Math.random;
  const avgLevel = avgPartyLevel();
  if(avgLevel < 5){ startBattle(); return; }
  const tier = rollRivalTier(avgLevel, rng);
  const n = rivalTeamSize(avgLevel, rng);
  const teamName = makeRivalTeamName(rng);
  const roleList = rollRivalRoles(n, rng);
  const monsters = [];
  for(let i=0;i<n;i++) monsters.push(makeRivalAdventurer(avgLevel, rng, tier, teamName, roleList[i]));
  if(monsters[0]) monsters[0].name = monsters[0].name + '·長';
  S.battle = {
    monsters,
    turnLog: ['遭遇敵對冒險家「'+teamName+'」（'+tier.name+'）！共 '+n+' 人。'],
    selectedActor:null, selectedAction:null, over:false, win:null,
    order: buildTurnOrder(monsters), turnIndex:0, roundNum:1,
    bossMinionCount:0, lastMinionRefillRound:0,
    isRivalBattle:true, rivalTeamName:teamName, rivalTierName:tier.name,
    bb: { channels: {}, version: 1 }
  };
  if(typeof bbInit === 'function') bbInit(S.battle);
  S.screen = 'battle';
  S.log.unshift('⚔️ 與敵對冒險家「'+teamName+'」爆發衝突！');
  const first = S.battle.order[0];
  if(first && first.type==='monster'){
    setTimeout(()=>{ if(S.battle && !S.battle.over){ advanceBattleTurn(true); render(); } }, 400);
  }
  render();
}

function startBattle(){
  const rng = Math.random;
  const avgLevel = avgPartyLevel();
  // 解鎖階級：偏「當前可打」而非一次全開
  const availableTiers = [1];
  if(avgLevel>=5) availableTiers.push(2);
  if(avgLevel>=12) availableTiers.push(3);
  if(avgLevel>=22) availableTiers.push(4);
  // Boss 僅 50 等後、較低機率
  const bossRoll = avgLevel>=50 && rng()<0.08;
  let pool = bossRoll
    ? MONSTER_TYPES.filter(m=>m.boss)
    : MONSTER_TYPES.filter(m=>!m.boss && availableTiers.includes(m.tier));
  if(pool.length===0) pool = MONSTER_TYPES.filter(m=>m.tier===1 && !m.boss);

  function pickTier(){
    if(availableTiers.length===1) return availableTiers[0];
    const top = availableTiers[availableTiers.length-1];
    const wmap = availableTiers.map(ti=>{
      let w = 10;
      if(ti===top) w = 40;
      else if(ti===top-1) w = 30;
      else w = 12;
      return {item:ti, w};
    });
    return weightedChoice(rng, wmap);
  }

  const monsters=[];
  if(bossRoll){
    const tmpl = choice(rng, pool);
    monsters.push(makeMonster(tmpl, avgLevel, rng, {}));
  } else {
    const leadRank = rollMonsterRank(avgLevel, rng);
    const tPick = pickTier();
    const sub = pool.filter(m=> m.tier===tPick);
    const leadTmpl = choice(rng, sub.length ? sub : pool);

    if(leadRank === 'king'){
      monsters.push(makeMonster(leadTmpl, avgLevel, rng, { rank:'king' }));
      for(let i=0;i<5;i++){
        const r = rng() < 0.45 ? 'refined' : 'veteran';
        monsters.push(makeMonster(leadTmpl, avgLevel, rng, { rank:r }));
      }
    } else if(leadRank === 'emperor'){
      monsters.push(makeMonster(leadTmpl, avgLevel, rng, { rank:'emperor' }));
      for(let i=0;i<5;i++){
        const t2 = pickTier();
        const sub2 = pool.filter(m=> m.tier===t2);
        const tm = choice(rng, sub2.length ? sub2 : pool);
        monsters.push(makeMonster(tm, avgLevel, rng, { rank:'king' }));
      }
    } else {
      // 每場最多隻數：1-7→3、8-21→4、22-31→5、32-41→6、42+→上限
      let maxC = 3;
      if(avgLevel>=8) maxC = 4;
      if(avgLevel>=22) maxC = 5;
      if(avgLevel>=32) maxC = 6;
      if(avgLevel>=42) maxC = Math.max(6, (typeof MAX_MONSTER_PARTY!=='undefined'?MAX_MONSTER_PARTY:6));
      const weights = [];
      // 至少 1 隻；偏少到中等，不全滿編
      for(let c=1;c<=maxC;c++) weights.push({item:c, w: Math.max(1, (maxC-c+2)*2)});
      if(maxC>=3){
        weights.forEach(w=>{ if(w.item===maxC) w.w *= 0.85; if(w.item===2||w.item===3) w.w *= 1.15; });
      }
      let count = weightedChoice(rng, weights);
      monsters.push(makeMonster(leadTmpl, avgLevel, rng, { rank: leadRank }));
      for(let i=1;i<count;i++){
        const t2 = pickTier();
        const sub2 = pool.filter(m=> m.tier===t2);
        const tm = choice(rng, sub2.length ? sub2 : pool);
        let r = rollMonsterRank(avgLevel, rng);
        if(r==='king'||r==='emperor') r = (rng()<0.5?'veteran':'elite');
        monsters.push(makeMonster(tm, avgLevel, rng, { rank: r }));
      }
    }
  }
  S.party.forEach(m=>{
    m.usedGuardianAngel=false;
    m.taunting=false; m.buffDef=0; m.buffTurns=0;
    m.skipTurn=false; m.atkDebuff=0; m.spdDebuff=0;
  });
  S.battle = {
    monsters, turnLog:[], selectedActor:null, selectedAction:null, over:false, win:null,
    order: buildTurnOrder(monsters), turnIndex:0, roundNum:1,
    bossMinionCount: 5, lastMinionRefillRound: 0
  };
  if(bossRoll){
    const boss = monsters.find(m=>m.boss) || monsters[0];
    if(boss){
      boss.boss = true;
      if(!boss.mech && boss.baseName){
        const tmpl = MONSTER_TYPES.find(m=>m.boss && m.n===boss.baseName);
        if(tmpl) boss.mech = tmpl.mech;
      }
      // 再保險：魔王血量地板
      if(num(boss.maxHp,0) < 30000){
        boss.maxHp = Math.max(30000, num(boss.maxHp,30000));
        boss.hp = boss.maxHp;
      }
    }
    S.battle.bossMinionCount = 5;
    const before = S.battle.monsters.length;
    for(let i=0;i<5;i++){
      try{
        const minion = makeBossMinion(boss, avgLevel, rng, i);
        if(minion){
          minion.isBossMinion = true;
          minion.boss = false;
          S.battle.monsters.push(minion);
        }
      }catch(err){
        // 建立失敗時用保底眷屬，避免整場沒人
        const fallback = makeMonster({n:'魔王親衛',type:(boss&&boss.type)||'beast',tier:2}, avgLevel, rng, {rank:'elite'});
        fallback.name = '魔王親衛'+(i+1);
        fallback.isBossMinion = true;
        fallback.boss = false;
        fallback.maxHp = Math.max(800, Math.round(num(boss.maxHp,30000)*0.1));
        fallback.hp = fallback.maxHp;
        fallback.minionRole = 'taunt';
        S.battle.monsters.push(fallback);
      }
    }
    const added = S.battle.monsters.length - before;
    S.battle.order = buildTurnOrder(S.battle.monsters);
    S.battle.turnLog.unshift('⚠ 強大的 Boss「'+boss.name+'」率 '+added+' 名專屬眷屬擋在前方！（HP '+boss.maxHp+'）');
    S.battle.turnLog.unshift('（每隻眷屬有獨特光環／技能；攻擊可輸送生命給 Boss；每 2 回合嘗試補齊編成）');
  }
  S.screen='battle';
  advanceBattleTurn(true);
  render();
}
function buildTurnOrder(monsters){
  const combatants = [...S.party.filter(m=>m.hp>0).map(m=>({type:'party',ref:m})), ...monsters.filter(m=>m.hp>0).map(m=>({type:'monster',ref:m}))];
  combatants.sort((a,b)=> statTotal2(b)-statTotal2(a));
  return combatants;
}
function statTotal2(c){ return c.type==='party'? statTotal(c.ref,'spd') : c.ref.spd; }
function advanceBattleTurn(first){
  const b = S.battle;
  if(!b || b.over) return;
  // rebuild order excluding dead
  b.order = buildTurnOrder(b.monsters);
  if(b.order.length===0){
    checkBattleEnd();
    return;
  }
  if(!first) b.turnIndex++;
  if(b.turnIndex >= b.order.length){
    b.turnIndex=0; b.roundNum++;
    if(typeof bbTick === 'function') bbTick(b);
    // Boss 戰：每 2 回合補滿眷屬
    if(b.roundNum > 1 && b.roundNum % 2 === 1){
      const boss = getBattleBoss(b);
      if(boss && boss.hp>0){
        refillBossMinions(b, false);
      }
    }
    // 每回合：眷屬光環／盤根／焦土等
    if(typeof tickBossMinionAuras === 'function'){
      b._antiHeal = 0; b._missAura = 0; b._skillDampen = 0; b._mutualVuln = false;
      tickBossMinionAuras(b);
    }
    S.party.forEach(m=>{
      if(m.buffTurns>0){
        m.buffTurns--;
        if(m.buffTurns<=0){ m.buffTurns=0; m.buffDef=0; m.taunting=false; }
      }
      // 玩家中毒結算（怪物毒觸／Boss 瘟疫等）
      if(m.hp>0 && m.status==='poison' && m.statusTurns>0){
        const dmg = Math.max(1, Math.round(m.maxHp * 0.05));
        m.hp = clamp(m.hp - dmg, 0, m.maxHp);
        b.turnLog.unshift(m.name+' 受到中毒侵蝕，損失 '+dmg+' HP。');
        m.statusTurns--;
        if(m.statusTurns<=0) m.status=null;
        if(m.hp===0){
          const guardian = S.party.find(p=>p.hp>0 && hasPassive(p,'guardianAngel') && !p.usedGuardianAngel);
          if(guardian){
            m.hp=1; guardian.usedGuardianAngel=true;
            b.turnLog.unshift('⚜️ '+guardian.name+' 的守護天使發動，'+m.name+' 保住 1 HP！');
          } else {
            b.turnLog.unshift(m.name+' 中毒倒下了！');
          }
        }
      }
      if(m.hp>0 && m.maxMp>0 && m.mp < m.maxMp){
        const baseRegen = Math.max(1, Math.round(m.maxMp*0.04));
        const bonusRegen = hasPassive(m,'manaRegen') ? Math.max(1, Math.round(m.maxMp*0.06)) : 0;
        const anthemBonus = (typeof hasPassive==='function' && S.party.some(p=>p.hp>0 && hasPassive(p,'anthem'))) ? Math.max(1, Math.round(m.maxMp*0.03)) : 0;
        const regen = baseRegen + bonusRegen + anthemBonus;
        m.mp = clamp(m.mp+regen, 0, m.maxMp);
        if(bonusRegen>0) b.turnLog.unshift(m.name+' 的魔力自然涌動，回復 '+regen+' MP。');
      }
    });
  }
  const current = b.order[b.turnIndex];
  if(!current || (current.type==='party'&&current.ref.hp<=0) || (current.type==='monster'&&current.ref.hp<=0)){
    return advanceBattleTurn(false);
  }
  if(current.type==='monster'){
    tickMonsterStatus(current.ref);
    checkBattleEnd();
    if(!b.over && current.ref.hp>0){
      const mon = current.ref;
      if(num(mon.stunnedTurns, 0) > 0){
        mon.stunnedTurns--;
        b.turnLog.unshift(mon.name+' 處於暈眩，本回合無法行動！');
      } else {
        monsterAct(mon);
      }
      checkBattleEnd();
    }
    if(!b.over) setTimeout(()=>{ advanceBattleTurn(false); render(); }, 550);
  }
}
function tickMonsterStatus(mon){
  const b=S.battle;
  if(mon.hasRegen && mon.hp>0 && mon.hp<mon.maxHp){
    const rate = mon.regenRate || 0.05;
    const heal = Math.max(1, Math.round(mon.maxHp*rate));
    mon.hp = clamp(mon.hp+heal, 0, mon.maxHp);
    b.turnLog.unshift(mon.name+' 再生，恢復 '+heal+' HP。');
  }
  if(mon.auraBurn && mon.hp>0){
    S.party.forEach(p=>{
      if(p.hp<=0) return;
      const bd = Math.max(1, Math.round(p.maxHp * mon.auraBurn));
      p.hp = clamp(p.hp-bd, 0, p.maxHp);
      b.turnLog.unshift(mon.name+' 的燃燒光環灼傷了 '+p.name+'（'+bd+'）。');
    });
  }
  if(mon.status==='poison' && mon.statusTurns>0){
    const dmg = Math.max(1, Math.round(mon.maxHp*(mon.poisonHeavy?0.09:0.06)));
    mon.hp = clamp(mon.hp-dmg,0,mon.maxHp);
    b.turnLog.unshift(mon.name+' 受到中毒侵蝕，損失 '+dmg+' HP。');
    mon.statusTurns--;
    if(mon.statusTurns<=0) mon.status=null;
    checkKillReward(mon, b);
    if(mon.hp===0) b.turnLog.unshift(mon.name+' 被毒素侵蝕殆盡而倒下了！');
  }
  if(mon.marked && mon.markTurns>0){
    mon.markTurns--;
    if(mon.markTurns<=0){
      mon.marked=false; mon.markMult=1; mon.markTurns=0;
      b.turnLog.unshift(mon.name+' 身上的追蹤標記消散了。');
    }
  }
}
/** 對怪物結算傷害（閃避／抗性／護盾／荊棘／不死／死亡爆炸） */

/** 戰鬥畫面回饋佇列 */
function ensureBattleFx(b){
  if(!b) return [];
  if(!b.fx) b.fx = [];
  return b.fx;
}
function pushBattleFx(kind, opts, battle){
  const b = battle || ((typeof S!=='undefined' && S) ? S.battle : null);
  if(!b) return;
  const fx = ensureBattleFx(b);
  fx.push(Object.assign({ kind: kind, t: Date.now() }, opts||{}));
  if(fx.length > 24) fx.splice(0, fx.length-24);
}
function impactLabel(dmg, crit){
  if(crit) return '會心一擊！';
  if(dmg >= 80) return '重擊！';
  if(dmg >= 40) return '削砍！';
  return null;
}
function playHitBeep(crit, kill){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!window._combatAC) window._combatAC = new AC();
    const ctx = window._combatAC;
    if(ctx.state==='suspended') ctx.resume();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = kill ? 'sawtooth' : (crit ? 'square' : 'triangle');
    o.frequency.value = kill ? 180 : (crit ? 520 : 320);
    g.gain.value = 0.03;
    o.connect(g); g.connect(ctx.destination);
    const now = ctx.currentTime;
    g.gain.setValueAtTime(0.04, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + (kill?0.18:0.09));
    o.frequency.exponentialRampToValueAtTime(kill?90:(crit?280:200), now+(kill?0.16:0.08));
    o.start(now); o.stop(now+(kill?0.2:0.1));
  }catch(e){}
}


function applyPlayerHitToMonster(actor, mon, hit, b, isMagic){
  hit = hit || { dmg:0, crit:false };
  if(b) b._lastHitCrit = !!hit.crit;
  const dmg = applyDamageToMonster(actor, mon, num(hit.dmg,0), !!isMagic, b);
  return dmg;
}
function applyDamageToMonster(actor, mon, rawDmg, isMagic, b){
  if(!mon || mon.hp<=0) return 0;
  // 防禦：任何上游 NaN 傷害在此截斷
  mon.maxHp = Math.max(1, num(mon.maxHp, 1));
  mon.hp = clamp(num(mon.hp, mon.maxHp), 0, mon.maxHp);
  let dmg = Math.max(0, num(rawDmg, 0));
  if(!Number.isFinite(dmg) || dmg < 0) dmg = 0;
  if(!isMagic && mon.evade && Math.random() < mon.evade){
    if(b&&b.turnLog) b.turnLog.unshift(mon.name+' 閃避了攻擊！');
    return 0;
  }
  if(b._missAura && Math.random() < b._missAura){
    b.turnLog.unshift('命中被干擾，攻擊落空！');
    return 0;
  }
  if(!isMagic && mon.physResist) dmg = Math.max(1, Math.round(dmg * (1 - num(mon.physResist, 0))));
  if(isMagic && mon.magResist) dmg = Math.max(1, Math.round(dmg * (1 - num(mon.magResist, 0))));
  if(mon.shieldCharges > 0){
    const red = mon.shieldReduce != null ? num(mon.shieldReduce, 0.5) : 0.5;
    dmg = Math.max(1, Math.round(dmg * (1 - red)));
    mon.shieldCharges--;
    b.turnLog.unshift(mon.name+' 的護盾抵銷了部分傷害（剩餘 '+mon.shieldCharges+'）。');
  }
  // Boss 眷屬防禦鉤子（替傷／分攤／反魔／抗暴等）
  if(dmg > 0 && typeof applyBossMinionDefenseHooks === 'function'){
    dmg = applyBossMinionDefenseHooks(actor, mon, dmg, isMagic, b);
  }
  // 星印：Boss 技能打有印記的人在 runBossMechanic；此處玩家打被印記的？跳過
  if(dmg > 0) mon.hp = clamp(mon.hp - dmg, 0, mon.maxHp);
  // 荊棘／反傷（帝王詞等）
  if(dmg > 0 && mon._thorns && actor && actor.hp>0){
    const ref=Math.max(1, Math.round(dmg * num(mon._thorns,0.1)));
    actor.hp=clamp(actor.hp-ref,0,actor.maxHp);
    b.turnLog.unshift(mon.name+' 反刺造成 '+ref+' 傷害！');
  }
  // 唯一裝備：吸血／回魔／擊暈
  if(dmg > 0 && actor && actor.hp > 0 && typeof equippedUniqueEffects === 'function'){
    const ls = sumEquipSpecial(actor, 'lifesteal');
    if(ls > 0){
      const heal = Math.max(1, Math.round(dmg * ls));
      actor.hp = clamp(actor.hp + heal, 0, actor.maxHp);
      b.turnLog.unshift(actor.name+' 的唯一裝備吸血恢復了 '+heal+' HP。');
    }
    const mpHit = sumEquipSpecial(actor, 'mpOnHit');
    if(mpHit > 0){
      actor.mp = clamp(actor.mp + Math.round(mpHit), 0, actor.maxMp);
    }
    const stun = sumEquipSpecial(actor, 'stunChance');
    if(stun > 0 && Math.random() < stun){
      mon.stunnedTurns = Math.max(num(mon.stunnedTurns, 0), 1);
      b.turnLog.unshift(actor.name+' 的唯一裝備使 '+mon.name+' 暈眩！');
    }
  }
  if(mon.thorns && actor && actor.hp > 0){
    const ref = Math.max(1, Math.round(dmg * mon.thorns));
    actor.hp = clamp(actor.hp - ref, 0, actor.maxHp);
    b.turnLog.unshift(mon.name+' 反彈了 '+ref+' 點傷害！');
  }
  // 唯一反傷（穿在身上時，被打才觸發 — 見 monsterAct）
  if(mon.hp <= 0 && mon.undying){
    mon.undying = false;
    mon.hp = Math.max(1, Math.round(mon.maxHp * 0.2));
    b.turnLog.unshift(mon.name+' 的不死之力發動，以殘血重生！');
  }
  if(mon.hp <= 0 && mon.deathBurst){
    S.party.forEach(p=>{
      if(p.hp<=0) return;
      const bd = Math.max(1, Math.round(p.maxHp * mon.deathBurst));
      p.hp = clamp(p.hp - bd, 0, p.maxHp);
    });
    b.turnLog.unshift(mon.name+' 死亡時發生爆炸，波及全隊！');
  }
  // 打擊回饋
  if(dmg > 0){
    const midx = (b.monsters||[]).indexOf(mon);
    const crit = !!(b._lastHitCrit);
    const killed = mon.hp <= 0;
    pushBattleFx('hit', { target:'monster', idx:midx, dmg:dmg, crit:crit, magic:!!isMagic, kill:killed }, b);
    const lab = impactLabel(dmg, crit);
    if(lab) b.turnLog.unshift(lab);
    if(killed) b.turnLog.unshift('💥 '+mon.name+' 被擊倒！');
    playHitBeep(crit, killed);
    b._hitstopMs = Math.max(num(b._hitstopMs,0), killed ? 90 : (crit ? 70 : 45));
  }
  b._lastHitCrit = false;
  return dmg;
}
function effectiveMonAtk(mon){
  let atk = mon.atk;
  if(mon.enrageAt && mon.hp <= mon.maxHp * mon.enrageAt){
    atk = Math.round(atk * (mon.enrageMult || 1.5));
  }
  return atk;
}
function runBossMechanic(mon, b){
  if(!mon.boss || !mon.mech) return;
  mon.bossTurns = (mon.bossTurns || 0) + 1;
  const t = mon.bossTurns;
  const party = S.party.filter(p=>p.hp>0);
  if(!party.length) return;
  switch(mon.mech){
    case 'inferno':
      if(t % 3 === 0){
        const bonus = 1 + num(mon._breathBonus, 0);
        party.forEach(p=>{ const d=Math.max(1,Math.round(mon.atk*0.7*bonus)); p.hp=clamp(p.hp-d,0,p.maxHp); });
        b.turnLog.unshift(mon.name+' 釋放【煉獄吐息】'+(bonus>1?'（焰心強化）':'')+'，全隊受到火焰傷害！');
      }
      break;
    case 'void':
      if(t % 4 === 0){
        const p = choice(Math.random, party);
        p.mp = clamp(p.mp - Math.round(p.maxMp*0.25), 0, p.maxMp);
        b.turnLog.unshift(mon.name+' 的【虛空汲取】抽走了 '+p.name+' 的魔力！');
      }
      if(mon._entropyBonus){
        if(mon.baseAtk == null) mon.baseAtk = num(mon.atk, 1);
        mon.atk = Math.round(num(mon.baseAtk, mon.atk) * (1 + mon._entropyBonus));
      }
      break;
    case 'reaper':
      if(mon.hp < mon.maxHp*0.4 && !mon._reaperBuff){
        mon._reaperBuff=true; mon.atk=Math.round(mon.atk*1.35);
        b.turnLog.unshift(mon.name+' 進入【收割】狀態，攻擊大幅提升！');
      }
      break;
    case 'tide':
      if(t % 3 === 0){
        const amp = 1 + num(mon._tideAmp, 0);
        const heal = Math.round(mon.maxHp*0.06*amp);
        mon.hp = clamp(mon.hp + heal, 0, mon.maxHp);
        // 侍女連攜：其他眷屬也回一點
        b.monsters.filter(m=>m.isBossMinion && m.hp>0).forEach(m=>{
          m.hp = clamp(m.hp + Math.max(1, Math.round(m.maxHp*0.04)), 0, m.maxHp);
        });
        b.turnLog.unshift(mon.name+' 藉【潮汐】恢復了 '+heal+' 生命！眷屬也沐浴潮水。');
      }
      break;
    case 'roots':
      if(t % 3 === 0){
        const p = choice(Math.random, party);
        p.skipTurn = true;
        b.turnLog.unshift(mon.name+' 的【纏繞根須】困住了 '+p.name+'！');
      }
      break;
    case 'colossus':
      if(t === 1){ mon.shieldCharges = (mon.shieldCharges||0)+3; mon.shieldReduce=0.4; b.turnLog.unshift(mon.name+' 展開【鋼鐵結界】！'); }
      break;
    case 'bloodmoon':
      if(t % 2 === 0){
        const p = choice(Math.random, party);
        let d = Math.max(1, Math.round(mon.atk*0.9));
        if((p._bleed||0)>0) d = Math.round(d * 1.25);
        p.hp = clamp(p.hp-d,0,p.maxHp);
        const suck = Math.round(d * ((p._bleed||0)>0 ? 0.7 : 0.5));
        mon.hp = clamp(mon.hp+suck,0,mon.maxHp);
        b.turnLog.unshift(mon.name+' 【血月噬咬】造成 '+d+' 傷害並吸血 '+suck+'！');
      }
      break;
    case 'frost':
      if(t % 3 === 0){
        party.forEach(p=>{ p.spdDebuff = (p.spdDebuff||0)+2; });
        b.turnLog.unshift(mon.name+' 的【永凍】減慢了全隊速度！');
      }
      break;
    case 'plague':
      if(t % 2 === 0){
        const p = choice(Math.random, party);
        p.status = 'poison'; p.statusTurns = 3;
        b.turnLog.unshift(mon.name+' 散播【瘟疫】，'+p.name+' 中毒了！');
      }
      if(mon._plagueBurst || (b && b.monsters.some(m=>m.isBossMinion && m.hp>0 && m.minionRole==='plague_flag') && party.filter(p=>p.status==='poison').length>=2)){
        if(t % 3 === 0){
          party.forEach(p=>{ p.hp = clamp(p.hp - Math.max(1, Math.round(mon.atk*0.4)), 0, p.maxHp); });
          b.turnLog.unshift(mon.name+' 引爆【疫爆】！');
          mon._plagueBurst = false;
        }
      }
      break;
    case 'shadowcourt':
      if(t % 4 === 0){ mon.evade = Math.min(0.5, (mon.evade||0)+0.15); b.turnLog.unshift(mon.name+' 隱入【影殿】，閃避提升！'); }
      break;
    case 'titan':
      if(t % 3 === 0){
        party.forEach(p=>{ const d=Math.max(1,Math.round(mon.atk*0.55)); p.hp=clamp(p.hp-d,0,p.maxHp); });
        b.turnLog.unshift(mon.name+' 【熔核重踏】震擊全隊！');
      }
      break;
    case 'kraken':
      if(t % 3 === 0){
        party.forEach(p=>{ p.hp=clamp(p.hp-Math.max(1,Math.round(mon.atk*0.4)),0,p.maxHp); });
        b.turnLog.unshift(mon.name+' 的【觸手拍擊】掃過全隊！');
      }
      break;
    case 'boneking':
      if(t % 4 === 0){
        mon.def = Math.round(mon.def*1.15);
        b.turnLog.unshift(mon.name+' 召喚骨牆，防禦上升！');
      }
      break;
    case 'berserk':
      if(mon.hp < mon.maxHp*0.5 && !mon._berserk){
        mon._berserk=true; mon.atk=Math.round(mon.atk*1.5); mon.def=Math.round(mon.def*0.8);
        b.turnLog.unshift(mon.name+' 陷入【狂戰】！');
      }
      break;
    case 'starseal':
      if(t % 5 === 0){
        party.forEach(p=>{ p.mp = clamp(p.mp - 15, 0, p.maxMp); });
        b.turnLog.unshift(mon.name+' 【星隕封印】壓制全隊魔力！');
      }
      if((mon._starCharge||0) >= 4){
        mon._starCharge = 0;
        const p = choice(Math.random, party);
        const d = Math.max(1, Math.round(mon.atk * 1.4 * (1 + 0.15 * num(p._starMark,0))));
        p.hp = clamp(p.hp - d, 0, p.maxHp);
        b.turnLog.unshift(mon.name+' 釋出星屑轟擊 '+p.name+'（'+d+'）！');
      }
      break;
    case 'nightmare':
      if(t % 3 === 0){
        const p = choice(Math.random, party);
        p.skipTurn = true;
        b.turnLog.unshift(mon.name+' 織出【夢魘】，'+p.name+' 無法行動！');
      }
      break;
    case 'judgment':
      if(t % 3 === 0){
        const p = party.slice().sort((a,b)=>b.hp-a.hp)[0];
        const d = Math.max(1, Math.round(mon.atk*1.1));
        p.hp = clamp(p.hp-d,0,p.maxHp);
        b.turnLog.unshift(mon.name+' 【聖焰審判】點名了 '+p.name+'（'+d+'）！');
      }
      break;
    case 'garden':
      if(t % 3 === 0){
        mon.hp = clamp(mon.hp + Math.round(mon.maxHp*0.08), 0, mon.maxHp);
        party.forEach(p=>{ if(Math.random()<0.4){ p.status='poison'; p.statusTurns=2; } });
        b.turnLog.unshift(mon.name+' 的【腐朽花園】蔓延，回復並散播毒素！');
      }
      break;
  }
}
/* ============================================================
 * 戰鬥公式（J 技能重做核心）
 * ------------------------------------------------------------
 * 物理：max(1, round( 物攻 × 倍率 − 敵防 × 0.50 × (1−穿甲比例) ))
 * 魔法：max(1, round( 魔攻 × 倍率 − 敵防 × 0.25 ))
 * 治療：round( 魔攻 × 係數 + 智力 × 0.6 + 等級 × 2 )
 * 自癒：round( 自身最大HP × 係數 )，可附帶回 MP
 * 暴擊率：基礎 8% + 敏捷 × 0.4%（技能可覆寫），暴擊傷害 ×1.6
 * 標記：結算後再 × markMult
 * 聖光：對 undead / shadow 額外 ×1.25
 * 普通攻擊：物攻 × (0.9~1.2 隨機)
 * ============================================================ */
const CF = {
  PHYS_DEF: 0.42,
  MAG_DEF: 0.26,
  PHYS_FLOOR: 0.20,
  MAG_FLOOR: 0.22,
  CRIT_MULT: 1.45,
  BASE_CRIT: 0.06,
  AGI_CRIT: 0.003,
  HOLY_BONUS: 1.18,
  PIERCE_RATIO: 0.22,
  ATK_VAR_MIN: 0.88,
  ATK_VAR_MAX: 1.12
};
const EVIL_TYPES = ['undead','shadow'];
function isEvilMon(mon){ return !!(mon && EVIL_TYPES.indexOf(mon.type)>=0); }
function critChance(actor, sk){
  if(sk && sk.crit != null) return clamp(sk.crit, 0, 0.95);
  let c = CF.BASE_CRIT + (actor.agi||0) * CF.AGI_CRIT;
  if(typeof sumEquipSpecial === 'function') c += sumEquipSpecial(actor, 'critBonus');
  return clamp(c, 0, 0.85);
}
function rollCrit(actor, sk){ return Math.random() < critChance(actor, sk); }
function pierceIgnore(actor, targetDef){
  let ratio = hasPassive(actor,'pierce') ? CF.PIERCE_RATIO : 0;
  if(typeof sumEquipSpecial === 'function') ratio += sumEquipSpecial(actor, 'pierceBonus');
  return targetDef * Math.min(0.6, ratio);
}
function markMultOf(target){
  let m = (target && target.marked && target.markMult) ? target.markMult : 1;
  if(target && target.markVulnerable && m > 1) m *= target.markVulnerable;
  return m;
}
/** 物理傷害。opts: {mult, variance, canCrit, sk, forceCrit} */
function calcPhysDmg(actor, target, opts){
  opts = opts || {};
  const mult = num(opts.mult != null ? opts.mult : 1, 1);
  const atk = Math.max(1, num(statTotal(actor,'atk'), 1));
  const def = Math.max(0, num(target && target.def, 0));
  const ignore = num(pierceIgnore(actor, def), 0);
  let variance = 1;
  if(opts.variance){
    variance = CF.ATK_VAR_MIN + Math.random() * (CF.ATK_VAR_MAX - CF.ATK_VAR_MIN);
  }
  let raw = atk * mult * variance;
  if(typeof hasPassive==='function' && hasPassive(actor,'leap') && target && target.hp>target.maxHp*0.5) raw *= 1.18;
  const mitigated = raw - (def - ignore) * CF.PHYS_DEF;
  const floor = raw * (CF.PHYS_FLOOR != null ? CF.PHYS_FLOOR : 0.28);
  let dmg = Math.max(1, Math.round(Math.max(floor, mitigated)));
  const didCrit = opts.forceCrit || (opts.canCrit && rollCrit(actor, opts.sk));
  if(didCrit) dmg = Math.round(dmg * CF.CRIT_MULT);
  dmg = Math.round(dmg * num(markMultOf(target), 1));
  return { dmg: Math.max(1, num(dmg, 1)), crit: !!didCrit, marked: markMultOf(target) > 1 };
}
/** 魔法傷害。opts: {mult, holy, sk} */
function calcMagicDmg(actor, target, opts){
  opts = opts || {};
  const mult = num(opts.mult != null ? opts.mult : 1, 1);
  const matk = Math.max(1, num(statTotal(actor,'matk'), 1));
  const def = Math.max(0, num(target && target.def, 0));
  let raw = matk * mult;
  if(typeof hasPassive==='function' && hasPassive(actor,'contract')) raw *= 1.12;
  if(typeof hasPassive==='function' && hasPassive(actor,'catalyst') && Math.random()<0.20) raw *= 1.25;
  if(typeof sumUniqueEffect === 'function'){
    const burn = sumEquipSpecial(actor, 'burnBonus');
    if(burn > 0) raw *= (1 + burn);
  }
  const mitigated = raw - def * CF.MAG_DEF;
  const floor = raw * (CF.MAG_FLOOR != null ? CF.MAG_FLOOR : 0.30);
  let dmg = Math.max(1, Math.round(Math.max(floor, mitigated)));
  if(opts.holy && isEvilMon(target)) dmg = Math.round(dmg * CF.HOLY_BONUS);
  dmg = Math.round(dmg * num(markMultOf(target), 1));
  return { dmg: Math.max(1, num(dmg, 1)), crit: false, marked: markMultOf(target) > 1, holy: !!(opts.holy && isEvilMon(target)) };
}
/** 治療量（單體／群體共用係數） */
function calcHealAmt(actor, healCoef){
  const matk = statTotal(actor,'matk');
  const intel = actor.int || 0;
  let amt = matk * (healCoef||1) + intel * 0.6 + actor.level * 2;
  if(typeof sumEquipSpecial === 'function') amt *= (1 + sumEquipSpecial(actor, 'healBonus'));
  if(S && S.battle && S.battle._antiHeal) amt *= (1 - Math.min(0.5, S.battle._antiHeal));
  return Math.max(1, Math.round(amt));
}
function dmgTag(r){
  let t = '';
  if(r.crit) t += '（會心一擊！）';
  if(r.holy) t += '（聖光克邪）';
  if(r.marked) t += '（標記加成）';
  return t;
}



/* ============ 黑板通訊協定（Blackboard Protocol） ============
 * 用途：敵對冒險家（及可擴充單位）之間的戰術通訊。
 * 掛在 S.battle.bb 上，勿直接改 _rival* 私貨欄位。
 *
 * 頻道（channel）約定：
 *   focus   { uid, name, by, untilRound }  集火目標
 *   shout   { power, by, untilRound }      戰吼／全局攻擊加成
 *   guard   { uid, by, untilRound }        誰在嘲諷守護
 *   help    { uid, hpRatio, by, untilRound } 求救（殘血）
 *   avoid   { uid, by, untilRound }        暫時不要打誰（預留）
 *   order   { type, payload, by, untilRound } 通用指令
 *
 * API：
 *   bbInit(b) / bbGet(b,ch) / bbSet(b,ch,data,ttlRounds) / bbClear(b,ch)
 *   bbTick(b) 每回合開始清除過期訊息
 *   bbHas(b,ch) / bbFocusTarget(b, aliveParty)
 */
function bbInit(b){
  if(!b) return null;
  if(!b.bb || typeof b.bb !== 'object') b.bb = { channels: {}, version: 1 };
  if(!b.bb.channels) b.bb.channels = {};
  return b.bb;
}
function bbGet(b, channel){
  if(!b) return null;
  bbInit(b);
  const msg = b.bb.channels[channel];
  if(!msg) return null;
  if(msg.untilRound != null && num(b.roundNum,1) > num(msg.untilRound,0)){
    delete b.bb.channels[channel];
    return null;
  }
  return msg;
}
function bbHas(b, channel){ return !!bbGet(b, channel); }
function bbSet(b, channel, data, ttlRounds){
  if(!b) return;
  bbInit(b);
  const ttl = ttlRounds == null ? 2 : ttlRounds;
  const until = num(b.roundNum,1) + Math.max(0, ttl);
  b.bb.channels[channel] = Object.assign({}, data||{}, {
    channel: channel,
    untilRound: until,
    setRound: num(b.roundNum,1)
  });
  return b.bb.channels[channel];
}
function bbClear(b, channel){
  if(!b || !b.bb || !b.bb.channels) return;
  if(channel) delete b.bb.channels[channel];
  else b.bb.channels = {};
}
function bbTick(b){
  if(!b) return;
  bbInit(b);
  const rnd = num(b.roundNum,1);
  Object.keys(b.bb.channels).forEach(ch=>{
    const msg = b.bb.channels[ch];
    if(msg && msg.untilRound != null && rnd > num(msg.untilRound,0)){
      delete b.bb.channels[ch];
    }
  });
  // 相容舊欄位：同步清理過期時一併清 legacy
  if(!bbGet(b,'focus')) b._rivalFocusUid = null;
  if(!bbGet(b,'shout')) b._rivalShout = false;
}
function bbFocusTarget(b, aliveParty){
  const msg = bbGet(b, 'focus');
  if(!msg || !aliveParty || !aliveParty.length) return null;
  return aliveParty.find(p=>p.uid===msg.uid) || null;
}
function bbRequestHelp(b, mon){
  if(!b || !mon) return;
  const ratio = mon.hp / Math.max(1, mon.maxHp);
  bbSet(b, 'help', { uid: mon.uid, name: mon.name, hpRatio: ratio, by: mon.name }, 2);
}
function bbCallFocus(b, target, byMon){
  if(!b || !target) return;
  bbSet(b, 'focus', {
    uid: target.uid,
    name: target.name,
    by: byMon ? byMon.name : '?'
  }, 3);
  b._rivalFocusUid = target.uid; // legacy sync
}
function bbWarShout(b, byMon, power){
  if(!b) return;
  const p = power == null ? 1.10 : power;
  bbSet(b, 'shout', { power: p, by: byMon ? byMon.name : '?' }, 2);
  b._rivalShout = true;
}
function bbDeclareGuard(b, mon){
  if(!b || !mon) return;
  bbSet(b, 'guard', { uid: mon.uid || mon.seed || mon.name, name: mon.name, by: mon.name }, 2);
}

/* ============ 敵對冒險家 AI 行為樹（擴充版） ============
 * 優先序由上到下；命中葉節點即結束本回合。
 * 共用黑板：b._rivalFocusUid（集火標記）、mon._usedPotion、mon._guardTurns、mon._enraged
 */
function rivalPotionThreshold(mon){
  if(mon.rivalTier==='legend' || mon.rivalTier==='infamous') return 0.30;
  return 0.25;
}
function rivalExecuteThreshold(mon){
  if(mon.rivalTier==='legend' || mon.rivalTier==='infamous') return 0.35;
  return 0.30;
}
function rivalPickFocusTarget(alive, b){
  const marked = typeof bbFocusTarget === 'function' ? bbFocusTarget(b, alive) : null;
  if(marked) return marked;
  if(b && b._rivalFocusUid){
    const legacy = alive.find(p=>p.uid===b._rivalFocusUid);
    if(legacy) return legacy;
  }
  return alive.slice().sort((a,c)=>{
    const pa=a.hp/Math.max(1,a.maxHp), pc=c.hp/Math.max(1,c.maxHp);
    if(pa!==pc) return pa-pc;
    return a.hp-c.hp;
  })[0];
}
function rivalPickHealerTarget(alive){
  // 優先打玩家方「像治療／高智」者
  return alive.slice().sort((a,c)=>{
    const sa = num(statTotal(a,'int'),0)*2 + num(statTotal(a,'matk'),0) + (a.classId?1:0)*5;
    const sc = num(statTotal(c,'int'),0)*2 + num(statTotal(c,'matk'),0) + (c.classId?1:0)*5;
    return sc-sa;
  })[0];
}
function rivalPickThreatTarget(alive){
  return alive.slice().sort((a,c)=>{
    const ta=num(statTotal(a,'atk'),0)+num(statTotal(a,'matk'),0);
    const tc=num(statTotal(c,'atk'),0)+num(statTotal(c,'matk'),0);
    return tc-ta;
  })[0];
}
function rivalPickSoftTarget(alive){
  return alive.slice().sort((a,c)=> num(statTotal(a,'def'),0)-num(statTotal(c,'def'),0))[0];
}

function rivalAIDecide(mon, aliveParty){
  const b = S.battle;
  const hpRatio = mon.hp / Math.max(1, mon.maxHp);
  const role = mon.rivalRole || '';
  const tier = mon.rivalTier || 'nobody';
  const allies = (b.monsters||[]).filter(m=>m.isRival && m.hp>0);
  const execLine = rivalExecuteThreshold(mon);
  const lowAllies = allies.filter(a=> (a.hp/a.maxHp)<=0.35);

  // ── 0. 逃脫（僅剩一人且殘血）
  if(allies.length===1 && hpRatio<=0.20){
    const fleeChance = tier==='legend'?0.12 : tier==='infamous'?0.22 : 0.40;
    if(Math.random() < fleeChance) return {action:'flee'};
  }

  // ── 1. 傳奇／惡名：殘血狂暴（一次）
  if((tier==='legend'||tier==='infamous') && hpRatio<=0.30 && !mon._enraged){
    return {action:'enrage'};
  }

  // ── 1.5 求救訊號（寫入黑板，供祭司讀取）
  if(hpRatio <= 0.35 && typeof bbRequestHelp === 'function'){
    bbRequestHelp(b, mon);
  }

  // ── 2. 自我喝藥
  if(hpRatio <= rivalPotionThreshold(mon) && !mon._usedPotion){
    return {action:'potion'};
  }

  // ── 3. 把藥讓給更殘的隊友（自己>50%、隊友≤25%、自己還有藥）
  if(!mon._usedPotion && hpRatio>0.50 && lowAllies.length){
    const ally = lowAllies.slice().sort((a,c)=> (a.hp/a.maxHp)-(c.hp/c.maxHp))[0];
    if(ally && ally!==mon && Math.random()<0.35){
      return {action:'potion_ally', target:ally};
    }
  }

  // ── 4. 祭司：先讀黑板求救，再治療 / 淨化 / 鼓舞
  if(role==='祭司'){
    const help = typeof bbGet === 'function' ? bbGet(b, 'help') : null;
    if(help){
      const helpTarget = allies.find(a=> (help.uid && a.uid===help.uid) || a.name===help.name);
      if(helpTarget && helpTarget.hp>0 && (helpTarget.hp/helpTarget.maxHp)<=0.50){
        return {action:'heal_ally', target:helpTarget};
      }
    }
    const needy = allies.slice().sort((a,c)=> (a.hp/a.maxHp)-(c.hp/c.maxHp))[0];
    if(needy && (needy.hp/needy.maxHp)<=0.40){
      return {action:'heal_ally', target:needy};
    }
    // 淨化：隊友被毒／暈
    const debuffed = allies.find(a=> a.status==='poison' || num(a.stunnedTurns,0)>0 || a.skipTurn);
    if(debuffed && Math.random()<0.40){
      return {action:'cleanse', target:debuffed};
    }
    if(Math.random()<0.25){
      const buffTarget = allies.slice().sort((a,c)=> num(c.atk,0)-num(a.atk,0))[0] || mon;
      return {action:'buff_atk', target:buffTarget};
    }
  }

  // ── 5. 騎士：嘲諷守護（隊友殘血時）
  if(role==='騎士' && lowAllies.length && Math.random()<0.45){
    return {action:'guard'};
  }

  // ── 6. 戰士：戰吼破防標記（開場或隨機）
  if(role==='戰士' && !(typeof bbHas==='function' ? bbHas(b,'shout') : b._rivalShout) && Math.random()<0.30){
    return {action:'war_shout'};
  }

  // ── 7. 法師：AOE / 點名弱化
  if(role==='法師'){
    if(aliveParty.length>=2 && Math.random()<0.32){
      return {action:'aoe'};
    }
    if(Math.random()<0.22){
      const t = rivalPickHealerTarget(aliveParty) || rivalPickFocusTarget(aliveParty, b);
      return {action:'hex', target:t}; // 降攻一回合感（skipTurn 低機率或 atk debuff 用 skip）
    }
  }

  // ── 8. 盜賊：偷金 / 上毒刺
  // ── 9. 弓手：狙殺治療 / 低防
  // 先選定基礎集火目標
  let target = rivalPickFocusTarget(aliveParty, b);
  const low = aliveParty.filter(p=> (p.hp/Math.max(1,p.maxHp)) <= execLine);
  if(low.length){
    target = low.slice().sort((a,c)=>a.hp-c.hp)[0];
    // 呼叫集火
    if(!b._rivalFocusUid && Math.random()<0.50){
      return {action:'call_focus', target};
    }
  }

  if(role==='盜賊'){
    if(target && (target.hp/target.maxHp)>0.50 && Math.random()<0.18){
      return {action:'steal', target};
    }
    if(target && Math.random()<0.28){
      return {action:'poison_stab', target};
    }
    if(Math.random()<0.20){
      return {action:'double_strike', target};
    }
  }

  if(role==='弓手'){
    if(!low.length && Math.random()<0.40){
      target = rivalPickHealerTarget(aliveParty) || rivalPickSoftTarget(aliveParty) || target;
    } else if(!low.length && Math.random()<0.35){
      target = rivalPickSoftTarget(aliveParty) || target;
    }
    if(target && Math.random()<0.25){
      return {action:'aimed_shot', target}; // 高傷害單體
    }
  }

  if((role==='騎士'||role==='戰士') && !low.length && Math.random()<0.40){
    target = rivalPickThreatTarget(aliveParty) || target;
  }

  if(role==='戰士' && target && Math.random()<0.22){
    return {action:'double_strike', target};
  }

  // ── 10. 惡名以上：機率壓制殘血（處決一擊）
  if(target && (tier==='infamous'||tier==='legend') && (target.hp/target.maxHp)<=0.20 && Math.random()<0.35){
    return {action:'execute', target};
  }

  return {action:'attack', target};
}

function rivalAIExecute(mon, decision, aliveParty){
  const b = S.battle;
  if(!decision) return false;
  const atkOf = ()=> Math.max(1, num(typeof effectiveMonAtk==='function' ? effectiveMonAtk(mon) : mon.atk, 1));
  const hit = (target, coeff, tag)=>{
    if(!target || target.hp<=0) return 0;
    const rawM = atkOf() * coeff * (1.00 + Math.random()*0.20);
    const mitM = rawM - num(statTotal(target,'def'),0)*0.18;
    let dmg = Math.max(1, Math.round(Math.max(rawM*0.40, mitM)));
    if(mon._enraged) dmg = Math.round(dmg * 1.25);
    const shoutMsg = typeof bbGet === 'function' ? bbGet(b, 'shout') : null;
    if(shoutMsg) dmg = Math.round(dmg * num(shoutMsg.power, 1.10));
    else if(b._rivalShout) dmg = Math.round(dmg * 1.10);
    // 玩家守護減傷略過（簡化）
    target.hp = clamp(target.hp - dmg, 0, target.maxHp);
    b.turnLog.unshift(mon.name+(tag?(' 的'+tag):'')+' 擊中 '+target.name+'（'+dmg+'）');
    return dmg;
  };

  if(decision.action==='flee'){
    mon.hp = 0; mon.rewarded = true; mon._fled = true;
    b.turnLog.unshift(mon.name+' 丟下煙霧逃脫了！');
    return true;
  }
  if(decision.action==='enrage'){
    mon._enraged = true;
    mon.atk = Math.round(num(mon.atk,1) * 1.30);
    b.turnLog.unshift('💢 '+mon.name+' 進入狂暴！攻擊大幅提升！');
    return true;
  }
  if(decision.action==='potion'){
    const heal = Math.max(1, Math.round(mon.maxHp * 0.35));
    mon.hp = clamp(mon.hp + heal, 0, mon.maxHp);
    mon._usedPotion = true;
    b.turnLog.unshift(mon.name+' 使用繃帶，恢復 '+heal+' HP！');
    return true;
  }
  if(decision.action==='potion_ally' && decision.target){
    const ally = decision.target;
    const heal = Math.max(1, Math.round(ally.maxHp * 0.30));
    ally.hp = clamp(ally.hp + heal, 0, ally.maxHp);
    mon._usedPotion = true;
    b.turnLog.unshift(mon.name+' 把繃帶丟給 '+ally.name+'，恢復 '+heal+' HP！');
    return true;
  }
  if(decision.action==='heal_ally' && decision.target){
    const ally = decision.target;
    const heal = Math.max(1, Math.round(ally.maxHp * 0.22));
    ally.hp = clamp(ally.hp + heal, 0, ally.maxHp);
    b.turnLog.unshift(mon.name+' 為 '+ally.name+' 治療了 '+heal+' HP！');
    return true;
  }
  if(decision.action==='cleanse' && decision.target){
    const ally = decision.target;
    ally.status = null; ally.statusTurns = 0;
    ally.stunnedTurns = 0; ally.skipTurn = false;
    b.turnLog.unshift(mon.name+' 淨化了 '+ally.name+' 的異常！');
    return true;
  }
  if(decision.action==='buff_atk' && decision.target){
    const ally = decision.target;
    ally.atk = Math.round(num(ally.atk,1) * 1.15);
    b.turnLog.unshift(mon.name+' 鼓舞了 '+ally.name+'！（攻擊提升）');
    return true;
  }
  if(decision.action==='guard'){
    mon._guardTurns = 2;
    mon.def = Math.round(num(mon.def,0) * 1.25);
    mon.taunting = true;
    if(typeof bbDeclareGuard === 'function') bbDeclareGuard(b, mon);
    b.turnLog.unshift('🛡️ '+mon.name+' 舉起盾牌，嘲諷並守護隊友！');
    return true;
  }
  if(decision.action==='war_shout'){
    if(typeof bbWarShout === 'function') bbWarShout(b, mon, 1.10);
    else b._rivalShout = true;
    b.turnLog.unshift('📣 '+mon.name+' 發出戰吼！敵隊攻擊暫時強化！');
    return true;
  }
  if(decision.action==='aoe'){
    b.turnLog.unshift(mon.name+' 施放範圍術！');
    aliveParty.forEach(tg=> hit(tg, 0.70, '範圍術'));
    return true;
  }
  if(decision.action==='hex' && decision.target){
    const tg = decision.target;
    hit(tg, 0.55, '咒術');
    if(Math.random()<0.40){
      tg.skipTurn = true;
      b.turnLog.unshift(tg.name+' 被咒術干擾，下回合行動不穩！');
    }
    return true;
  }
  if(decision.action==='steal' && decision.target){
    const g = Math.min(num(S.hero.gold,0), rint(Math.random, 8, 22));
    if(g>0){ S.hero.gold -= g; b.turnLog.unshift(mon.name+' 偷走了 '+g+' 金幣！'); }
    else b.turnLog.unshift(mon.name+' 想偷金，但你身無分文。');
    hit(decision.target, 0.50, '順手刺');
    return true;
  }
  if(decision.action==='poison_stab' && decision.target){
    hit(decision.target, 0.85, '毒刃');
    decision.target.status = 'poison';
    decision.target.statusTurns = Math.max(num(decision.target.statusTurns,0), 3);
    b.turnLog.unshift(decision.target.name+' 中毒了！');
    return true;
  }
  if(decision.action==='double_strike' && decision.target){
    b.turnLog.unshift(mon.name+' 使出連擊！');
    hit(decision.target, 0.70, '連擊');
    if(decision.target.hp>0) hit(decision.target, 0.55, '追擊');
    return true;
  }
  if(decision.action==='aimed_shot' && decision.target){
    hit(decision.target, 1.25, '瞄準射擊');
    return true;
  }
  if(decision.action==='execute' && decision.target){
    hit(decision.target, 1.60, '處決');
    return true;
  }
  if(decision.action==='call_focus' && decision.target){
    if(typeof bbCallFocus === 'function') bbCallFocus(b, decision.target, mon);
    else b._rivalFocusUid = decision.target.uid;
    b.turnLog.unshift('🎯 '+mon.name+' 示意集火 → '+decision.target.name+'！');
    hit(decision.target, 0.90, '起手');
    return true;
  }
  return false; // attack 落到預設普攻
}

function monsterAct(mon){
  const b=S.battle;
  runBossMechanic(mon, b);
  const aliveParty = S.party.filter(m=>m.hp>0);
  if(aliveParty.length===0) return;

  if(mon.isRival && typeof rivalAIDecide === 'function'){
    const decision = rivalAIDecide(mon, aliveParty);
    if(rivalAIExecute(mon, decision, aliveParty)){
      if(typeof checkBattleEnd==='function') checkBattleEnd();
      return;
    }
    if(decision && decision.target) mon._aiTarget = decision.target;
  }

  const attackOnce = (target)=>{
    let atk = Math.max(1, num(effectiveMonAtk(mon), 1));
    if(mon.execute && target.hp < target.maxHp * 0.5) atk = Math.round(atk * num(mon.execute, 1));
    // 怪物打人：同級要有痛感（保底提高、防禦折算再降）
    const rawM = atk * (1.00 + Math.random()*0.28);
    const mitM = rawM - num(statTotal(target,'def'),0)*0.18;
    let dmg = Math.max(1, Math.round(Math.max(rawM*0.48, mitM)));
    if(mon.arcBonus) dmg = Math.round(dmg * (1 + mon.arcBonus * 0.5));
    let blocked = false;
    if(hasPassive(target,'block') && Math.random()<0.18){
      dmg = Math.max(1, Math.round(dmg*0.65));
      blocked = true;
    }
    // 唯一：受傷減免
    if(typeof sumUniqueEffect === 'function'){
      // 重騎士：重裝減傷
    if(typeof hasPassive==='function' && hasPassive(target,'armored')){
      dmg = Math.max(1, Math.round(dmg * 0.88));
    }
    const dr = sumEquipSpecial(target, 'dmgReduce');
      if(dr > 0) dmg = Math.max(1, Math.round(dmg * (1 - Math.min(0.4, dr))));
    }
    target.hp = clamp(target.hp-dmg,0,target.maxHp);
    b.turnLog.unshift(mon.name+' 攻擊了 '+target.name+'，造成 '+dmg+' 點傷害。'+(blocked?'（格擋減傷！）':''));
    const pidx = S.party.indexOf(target);
    pushBattleFx('hit', { target:'party', idx:pidx, dmg:dmg, crit:false, magic:false, kill: target.hp<=0 }, b);
    playHitBeep(false, target.hp<=0);
    b._hitstopMs = Math.max(num(b._hitstopMs,0), target.hp<=0 ? 80 : 40);
    if(target.hp<=0){
      const boss = getBattleBoss(b);
      if(boss && boss.hp>0 && b.monsters.some(m=>m.isBossMinion && m.hp>0 && m.minionRole==='on_ko_buff')){
        boss.atk = Math.round(num(boss.atk,1) * 1.12);
        b.turnLog.unshift('終末鴉振翅：'+boss.name+' 因敵人倒下而攻擊暴衝！');
      }
    }
    // 唯一：反傷
    if(typeof sumUniqueEffect === 'function' && dmg > 0 && mon.hp > 0){
      const th = sumEquipSpecial(target, 'thorns');
      if(th > 0){
        const ref = Math.max(1, Math.round(dmg * th));
        mon.hp = clamp(mon.hp - ref, 0, mon.maxHp);
        b.turnLog.unshift(target.name+' 的唯一裝備反彈了 '+ref+' 點傷害！');
      }
    }
    // Boss 眷屬：攻擊傷害的 25% 轉為 Boss 回血 + 專屬命中效果
    if(mon.isBossMinion && dmg > 0){
      const boss = getBattleBoss(b);
      if(boss && boss.hp > 0){
        let ratio = 0.25;
        if(mon.minionRole==='tide_echo') ratio = 0.15;
        if(mon.minionRole==='leech_cc' && target.skipTurn) ratio = 0.4;
        const heal = Math.max(1, Math.round(dmg * ratio));
        boss.hp = clamp(boss.hp + heal, 0, boss.maxHp);
        b.turnLog.unshift('🩸 '+mon.name+' 為 '+boss.name+' 輸送生命 +'+heal+'！');
      }
      if(typeof applyMinionOnHit === 'function') applyMinionOnHit(mon, target, dmg, b);
    }
    if(mon.vampiric || mon._vampRate){
      const rate = num(mon._vampRate, (typeof mon.vampiric==='number' ? mon.vampiric : 0.25));
      const heal = Math.max(1, Math.round(dmg * rate));
      mon.hp = clamp(mon.hp+heal, 0, mon.maxHp);
      b.turnLog.unshift(mon.name+' 吸血恢復了 '+heal+' HP。');
    }
    // 帝王／詞條命中效果
    if(dmg>0 && mon._poisonOnHit){
      target.status='poison'; target.statusTurns=Math.max(num(target.statusTurns,0), 2);
    }
    if(dmg>0 && mon._rootOnHit && Math.random()<0.2){
      target.skipTurn=true;
      b.turnLog.unshift(mon.name+' 纏住了 '+target.name+'！');
    }
    if(dmg>0 && mon._lifeTap){
      mon.hp=clamp(mon.hp+Math.max(1,Math.round(dmg*0.2)),0,mon.maxHp);
    }
    if(dmg>0 && mon._goldSteal && S.hero){
      const g=Math.min(S.hero.gold||0, rint(Math.random,1,5));
      if(g>0){ S.hero.gold-=g; b.turnLog.unshift(mon.name+' 偷走了 '+g+' 金幣！'); }
    }
    if(mon.poisonTouch){
      target.status = 'poison';
      target.statusTurns = mon.poisonHeavy ? 4 : 3;
      b.turnLog.unshift(target.name+' 中毒了！');
    }
    if(mon.manaBurn){
      const burn = Math.max(3, Math.round(target.maxMp * 0.08));
      target.mp = clamp(target.mp - burn, 0, target.maxMp);
      b.turnLog.unshift(mon.name+' 灼燒了 '+target.name+' 的魔力（-'+burn+' MP）！');
    }
    if(mon.chillTouch){
      target.spdDebuff = (target.spdDebuff||0) + 3;
      b.turnLog.unshift(target.name+' 被寒氣侵襲，速度下降！');
    }
    if(mon.crippleTouch){
      target.atkDebuff = (target.atkDebuff||0) + Math.max(1, Math.round(statTotal(target,'atk')*0.08));
      b.turnLog.unshift(target.name+' 被致殘，攻擊力下降！');
    }
    if(mon.stunChance && Math.random() < mon.stunChance){
      target.skipTurn = true;
      b.turnLog.unshift(target.name+' 被震暈，下回合無法行動！');
    }
    if(target.hp===0){
      const guardian = S.party.find(p=>(p.hp>0 || p.uid===target.uid) && hasPassive(p,'guardianAngel') && !p.usedGuardianAngel);
      if(guardian){
        target.hp = 1;
        guardian.usedGuardianAngel = true;
        b.turnLog.unshift('⚜️ '+guardian.name+' 的守護天使發動，'+target.name+' 奇蹟般保住了 1 點HP！');
      } else {
        b.turnLog.unshift(target.name+' 倒下了！');
      }
    }
  };

  // 選目標：AI 指定 > 嘲諷（鐵志可無視）> 隨機
  let tauntTarget = aliveParty.find(m=>m.taunting);
  if(tauntTarget && mon.ignoreTaunt && Math.random() < mon.ignoreTaunt) tauntTarget = null;
  let aiTarget = mon._aiTarget && mon._aiTarget.hp>0 ? mon._aiTarget : null;
  mon._aiTarget = null;
  const mainTarget = aiTarget || tauntTarget || choice(Math.random, aliveParty);

  if(mon.aoeAtk && Math.random() < mon.aoeAtk){
    b.turnLog.unshift(mon.name+' 使出橫掃！');
    S.party.filter(m=>m.hp>0).forEach(p=> attackOnce(p));
  } else {
    attackOnce(mainTarget);
    if(mon.doubleAtk && Math.random() < mon.doubleAtk && mainTarget.hp > 0){
      b.turnLog.unshift(mon.name+' 追加連擊！');
      attackOnce(mainTarget);
    }
  }
}
function playerAction(actorUid, action, targetIdx, skillIdx, potionUid){
  const b=S.battle;
  if(!b || b.over) return;
  const actor = S.party.find(m=>m.uid===actorUid);
  if(!actor || actor.hp<=0) return;
  actor.taunting=false;
  if(actor.skipTurn){
    actor.skipTurn=false;
    b.turnLog.unshift(actor.name+' 仍受控無法行動！');
    checkBattleEnd();
    if(!b.over) advanceBattleTurn(false);
    render();
    return;
  }
  if(action==='attack'){
    const target = b.monsters[targetIdx];
    if(!target||target.hp<=0) return;
    const r = calcPhysDmg(actor, target, { mult:1, variance:true, canCrit:true, sk:null });
    const dealt = (b._lastHitCrit=!!(r).crit, applyDamageToMonster(actor, target, r.dmg, false, b));
    if(dealt>0) b.turnLog.unshift(actor.name+' 攻擊了 '+target.name+'，造成 '+dealt+' 點傷害'+dmgTag(r)+'。');
    if(hasPassive(actor,'doubleStrike') && target.hp>0 && Math.random()<0.22){
      const r2 = calcPhysDmg(actor, target, { mult:0.55, canCrit:false });
      const d2 = (b._lastHitCrit=!!(r2).crit, applyDamageToMonster(actor, target, r2.dmg, false, b));
      if(d2>0) b.turnLog.unshift(actor.name+' 觸發追加攻擊，額外造成 '+d2+' 點傷害！');
    }
    if(hasPassive(actor,'virulence') && target.hp>0 && !target.status && Math.random()<0.25){
      target.status='poison'; target.statusTurns=3;
      b.turnLog.unshift(target.name+' 被腐蝕氣息感染，陷入中毒狀態！');
    }
    if(hasPassive(actor,'combatFlow')){
      actor.mp = clamp(actor.mp+4,0,actor.maxMp);
    }
    checkKillReward(target, b);
    if(target.hp===0) b.turnLog.unshift(target.name+' 被擊敗了！');
  } else if(action==='skill'){
    const sk = getSkills(actor)[skillIdx];
    if(!sk){ render(); return; }
    if(actor._skillJam){
      actor._skillJam = 0;
      b.turnLog.unshift(actor.name+' 遭到干擾，技能施放失敗！');
      checkBattleEnd();
      if(!b.over) advanceBattleTurn(false);
      render(); return;
    }
    const needMp = num(sk.mp, 0);
    if(actor.mp < needMp){ b.turnLog.unshift(actor.name+' 的MP不足以使用 '+sk.name+'！'); render(); return; }
    actor.mp -= needMp;
    applySkill(actor, sk, targetIdx, b);
  } else if(action==='item'){
    const item = potionUid ? S.inventory.find(i=>i.uid===potionUid) : S.inventory.find(i=>i.slot==='potion');
    if(!item){ render(); return; }
    const potName = item.name;
    const potVal = item.value;
    const potKind = item.kind;
    if(!consumePotion(item)){ render(); return; }
    if(potKind==='mp'){
      actor.mp = clamp(actor.mp+potVal,0,actor.maxMp);
      b.turnLog.unshift(actor.name+' 使用了 '+potName+'，恢復 '+potVal+' MP。');
    } else {
      actor.hp = clamp(actor.hp+potVal,0,actor.maxHp);
      b.turnLog.unshift(actor.name+' 使用了 '+potName+'，恢復 '+potVal+' HP。');
    }
  } else if(action==='defend'){
    actor.buffDef = Math.round(statTotal(actor,'def')*0.5); actor.buffTurns=1;
    b.turnLog.unshift(actor.name+' 擺出防禦姿態。');
  } else if(action==='flee'){
    const chance = 0.4 + statTotal(actor,'spd')*0.01;
    if(Math.random()<chance){
      b.turnLog.unshift('隊伍成功逃離了戰鬥！');
      b.over=true; b.win='flee';
      routeHome();
      render(); return;
    } else {
      b.turnLog.unshift(actor.name+' 試圖逃跑，但失敗了！');
    }
  }
  checkBattleEnd();
  if(!b.over) advanceBattleTurn(false);
  render();
}
function applySkill(actor, sk, targetIdx, b){
  const type = sk.type;
  if(type==='mark'){
    const target = b.monsters[targetIdx];
    if(!target||target.hp<=0) return;
    target.marked = true;
    target.markTurns = sk.markTurns||3;
    target.markMult = sk.markMult||1.35;
    b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」標記了 '+target.name+'！'+target.markTurns+' 回合內受傷提升 '+Math.round((target.markMult-1)*100)+'%。');
  } else if(type==='phys' || type==='phys_crit'){
    const target = b.monsters[targetIdx];
    if(!target||target.hp<=0) return;
    const skCrit = Object.assign({}, sk, { crit: sk.crit != null ? sk.crit : (type==='phys_crit' ? 0.45 : undefined) });
    const r = calcPhysDmg(actor, target, { mult: sk.mult||1, canCrit:true, sk: skCrit });
    const dealt = (b._lastHitCrit=!!(r).crit, applyDamageToMonster(actor, target, r.dmg, false, b));
    if(dealt>0) b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」對 '+target.name+' 造成 '+dealt+' 點傷害'+dmgTag(r)+'。');
    if(sk.poison && target.hp>0){ target.status='poison'; target.statusTurns=sk.poisonTurns||3; b.turnLog.unshift(target.name+' 中毒了！'); }
    checkKillReward(target, b);
    if(target.hp===0) b.turnLog.unshift(target.name+' 被擊敗了！');
  } else if(type==='magic'){
    const target = b.monsters[targetIdx];
    if(!target||target.hp<=0) return;
    const r = calcMagicDmg(actor, target, { mult: sk.mult||1, holy: !!sk.holy });
    const dealt = (b._lastHitCrit=!!(r).crit, applyDamageToMonster(actor, target, r.dmg, true, b));
    if(dealt>0) b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」對 '+target.name+' 造成 '+dealt+' 點傷害'+dmgTag(r)+'。');
    checkKillReward(target, b);
    if(target.hp===0) b.turnLog.unshift(target.name+' 被擊敗了！');
  } else if(type==='phys_multi' || type==='phys_multi2'){
    const target = b.monsters[targetIdx];
    if(!target||target.hp<=0) return;
    const hits = sk.hits || (type==='phys_multi' ? 3 : 2);
    let total=0, anyMark=false;
    for(let i=0;i<hits;i++){
      if(target.hp<=0) break;
      const r = calcPhysDmg(actor, target, { mult: sk.mult||1, canCrit: !!sk.canCrit, sk });
      total += (b._lastHitCrit=!!(r).crit, applyDamageToMonster(actor, target, r.dmg, false, b));
      if(r.marked) anyMark=true;
    }
    b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」共 '+hits+' 擊，造成 '+total+' 點傷害'+(anyMark?'（標記加成）':'')+'。');
    if(sk.poison && target.hp>0){ target.status='poison'; target.statusTurns=sk.poisonTurns||3; }
    checkKillReward(target, b);
    if(target.hp===0) b.turnLog.unshift(target.name+' 被擊敗了！');
  } else if(type==='magic_aoe' || type==='magic_dot'){
    let total=0;
    b.monsters.forEach(mo=>{
      if(mo.hp<=0) return;
      const r = calcMagicDmg(actor, mo, { mult: sk.mult||1, holy: !!sk.holy });
      total += (b._lastHitCrit=!!(r).crit, applyDamageToMonster(actor, mo, r.dmg, true, b));
      if(type==='magic_dot' || sk.poison){ mo.status='poison'; mo.statusTurns=sk.poisonTurns||3; }
      checkKillReward(mo, b);
    });
    b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」對全體造成共 '+total+' 點傷害'+(type==='magic_dot'||sk.poison?'，並附加中毒':'')+'。');
  } else if(type==='heal'){
    const target = S.party[targetIdx];
    if(!target) return;
    let amt = calcHealAmt(actor, sk.heal||1);
    if(hasPassive(actor,'mercyHeal') && target.hp > 0 && target.hp < target.maxHp*0.3) amt = Math.round(amt*1.25);
    const r = applyHealToMember(target, amt, {canRevive:true, reviveRatio:0.25});
    if(r.revived){
      b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」救起了 '+target.name+'（回復 '+r.healed+' HP，為治療量的 25%）！');
    } else {
      b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」為 '+target.name+' 恢復 '+r.healed+' HP。');
    }
  } else if(type==='heal_aoe'){
    const amt = calcHealAmt(actor, sk.heal||0.8);
    const revived = [];
    S.party.forEach(m=>{
      const r = applyHealToMember(m, amt, {canRevive:true, reviveRatio:0.25});
      if(r.revived) revived.push(m.name);
    });
    let msg = actor.name+' 使用了「'+sk.name+'」為全隊恢復 '+amt+' HP。';
    if(revived.length) msg += ' '+revived.join('、')+' 被救起（回復治療量的 25%）！';
    b.turnLog.unshift(msg);
  } else if(type==='buff'){
    const turns = sk.buffTurns||2;
    const ratio = sk.buffDefRatio != null ? sk.buffDefRatio : 0.20;
    S.party.forEach(m=>{
      if(m.hp>0){ m.buffDef = Math.round(statTotal(m,'def')*ratio); m.buffTurns=turns; }
    });
    b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」，全隊防禦提升 '+Math.round(ratio*100)+'%（'+turns+' 回合）！');
  } else if(type==='guard'){
    const turns = sk.buffTurns||2;
    const ratio = sk.buffDefRatio != null ? sk.buffDefRatio : 0.60;
    actor.taunting=true;
    actor.buffDef=Math.round(statTotal(actor,'def')*ratio);
    actor.buffTurns=turns;
    b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」，嘲諷敵人並提升防禦 '+Math.round(ratio*100)+'%（'+turns+' 回合）！');
  } else if(type==='steal'){
    const target = b.monsters[targetIdx];
    if(!target||target.hp<=0) return;
    const r = calcPhysDmg(actor, target, { mult: sk.mult||1.1, canCrit:false });
    const dealt = (b._lastHitCrit=!!(r).crit, applyDamageToMonster(actor, target, r.dmg, false, b));
    const stolen = rint(Math.random, sk.stealMin||5, sk.stealMax||15);
    S.hero.gold += stolen;
    b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」，造成 '+dealt+' 傷害並偷得 '+stolen+' 金幣。');
    checkKillReward(target, b);
    if(target.hp===0) b.turnLog.unshift(target.name+' 被擊敗了！');
  } else if(type==='self_heal'){
    const amt = Math.max(1, Math.round(actor.maxHp * (sk.heal||0.2)));
    const mpGain = sk.mpGain != null ? sk.mpGain : 10;
    actor.hp = clamp(actor.hp+amt,0,actor.maxHp);
    actor.mp = clamp(actor.mp+mpGain,0,actor.maxMp);
    b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」，恢復 '+amt+' HP 與 '+mpGain+' MP。');
  }
  if(hasPassive(actor,'combatFlow') && ['phys','phys_crit','phys_multi','phys_multi2'].includes(type)){
    actor.mp = clamp(actor.mp+5,0,actor.maxMp);
  }
}
function checkKillReward(mon, b){
  if(mon.hp>0 || mon.rewarded) return;
  // 眷屬死亡特效（可能再起則暫不標 rewarded）
  if(mon.isBossMinion && typeof onBossMinionDeath === 'function'){
    const hpBefore = mon.hp;
    onBossMinionDeath(mon, b);
    if(mon.hp > 0){ return; } // 再起
  }
  if(mon.rewarded) return;
  mon.rewarded = true;
  const affixCount = mon.affixes ? mon.affixes.length : 0;
  const mult = 1 + affixCount*0.2;
  const exp = Math.max(0, Math.round(num(mon.exp, 0)*mult));
  const gold = Math.max(0, Math.round(num(mon.gold, 0)*mult));
  const log=[];
  // 倒地隊友也拿經驗（避免落後等級／卡成長）
  S.party.forEach(m=> gainExp(m, exp, log));
  S.hero.gold = num(S.hero.gold, 0) + gold;
  b.turnLog.unshift('獲得 '+exp+' 經驗值與 '+gold+' 金幣。'+(affixCount>0?'（詞綴加成 x'+mult.toFixed(1)+'）':''));
  log.forEach(l=> b.turnLog.unshift(l));
}
function checkBattleEnd(){
  const b=S.battle;
  if(b.monsters.every(m=>m.hp<=0)){
    if(!b.over){
      b.over=true; b.win=true;
      b.turnLog.unshift('=== 戰鬥勝利！ ===');
      if(typeof gainComplicity==='function') gainComplicity(COMPLICITY_GAIN_BATTLE, b.turnLog);
      let dropped=[];
      b.monsters.forEach(m=>{
        if(m._fled) return; // 逃脫不掉落
        const affixCount = m.affixes ? m.affixes.length : 0;
        let dropChance = m.boss?1:(m.elite?0.55:(m.tier>=3?0.5:0.28)) + affixCount*0.08;
        if(m.isRival){
          // 敵對冒險家：每人 35% 掉裝備；檔位越高越高
          dropChance = 0.35;
          if(m.rivalTier==='known') dropChance=0.42;
          if(m.rivalTier==='infamous') dropChance=0.50;
          if(m.rivalTier==='legend') dropChance=0.60;
        }
        if(Math.random()<dropChance){
          let floor = m.boss ? 'epic' : (m.elite ? 'rare' : null);
          if(m.isRival){
            floor = m.rivalTier==='legend' ? 'epic' : (m.rivalTier==='infamous' ? 'rare' : (m.rivalTier==='known' ? 'uncommon' : null));
          }
          if(affixCount>=3) floor='legend';
          else if(affixCount>=2) floor= floor || 'epic';
          else if(affixCount>=1 && !floor) floor='rare';
          const item = rollEquip(Math.random, floor, m.level);
          // 敵對冒險家不掉唯一（避免撞唯一規則）
          if(item && (item.isUnique || item.rarity==='unique')){
            /* skip unique, re-roll once as non-unique floor */
          } else if(item && addToInventory(item)){
            dropped.push(item.name + (m.isRival ? '（繳獲）' : ''));
          }
        }
      });
      if(dropped.length) b.turnLog.unshift('掉落裝備：'+dropped.join('、'));
    }
  } else if(S.party.every(m=>m.hp<=0)){
    b.over=true; b.win=false;
    b.turnLog.unshift('=== 隊伍全滅……你們狼狽地撤退了 ===');
    S.party.forEach(m=> m.hp = Math.max(m.hp, Math.round(m.maxHp*0.15)));
    S.hero.gold = Math.round(S.hero.gold*0.7);
    S.shopStock = null; // 復活後商店自動免費刷新一批新商品
  }
}

/* ============ 探索 / 事件 ============ */
function explore(){
  S.daysSurvived++;
  if(typeof gainComplicity==='function') gainComplicity(COMPLICITY_GAIN_EXPLORE, S.log);
  const rng=Math.random;
  const roll = rng();
  const avgLv = avgPartyLevel();
  // 遇敵 48%／敵對冒險家 7%（需≥5等）／事件 32%／平靜 13%
  if(roll < 0.48){
    startBattle();
  } else if(roll < 0.55 && avgLv >= 5){
    startRivalBattle();
  } else if(roll < 0.87){
    const pool = S.party.length>=4 ? EVENTS.filter(e=>e.id!=='wanderer') : EVENTS;
    const ev = choice(rng, pool);
    S.event = ev;
    S.screen='event';
  } else {
    const gold = rint(Math.random,12,36);
    S.hero.gold += gold;
    S.log.unshift('平靜的旅途中，你撿到了 '+gold+' 金幣。');
    routeHome();
  }
  render();
}
function resolveEvent(choiceIdx){
  const ev = S.event;
  const result = ev.choices[choiceIdx].act(S);
  S.log.unshift('【'+ev.title+'】'+result);
  S.event=null;
  routeHome();
  render();
}

/* ============ 背包容量 / 倉庫 / 鎖定 ============ */
/** 背包裝備格硬上限（藥水可堆疊，不占此上限）；超出自動進倉庫 */
const BACKPACK_CAP = 30;
const WAREHOUSE_CAP = 80;
const WAREHOUSE_PAGE_SIZE = 20;
function ensureWarehouse(){
  if(!S) return;
  if(!Array.isArray(S.warehouse)) S.warehouse = [];
}
function backpackGearCount(){
  if(!S || !S.inventory) return 0;
  return S.inventory.filter(i=>i && i.slot!=='potion').length;
}
function backpackHasSpace(n){
  n = n==null ? 1 : n;
  return backpackGearCount() + n <= BACKPACK_CAP;
}
function toggleItemLock(item){
  if(!item || item.slot==='potion') return;
  item.locked = !item.locked;
  if(S && S.log) S.log.unshift((item.locked?'🔒 已鎖定：':'🔓 已解鎖：') + item.name);
}
/** 背包滿時：進倉庫；倉庫也滿：折價金幣（鎖定物不自動賣） */
function overflowDispose(item, silent){
  ensureWarehouse();
  if(!item || item.slot==='potion') return 'potion';
  if(S.warehouse.length < WAREHOUSE_CAP){
    S.warehouse.push(item);
    if(!silent && S.log) S.log.unshift('📦 背包已滿（'+BACKPACK_CAP+'），'+item.name+' 已自動存入倉庫。');
    return 'warehouse';
  }
  // 倉庫滿 → 折價（鎖定則無法取得）
  if(item.locked){
    if(!silent && S.log) S.log.unshift('倉庫與背包皆滿，且 '+item.name+' 已鎖定，無法收納。');
    return 'reject';
  }
  const gold = Math.max(1, Math.floor(equipPrice(item) * 0.35));
  if(S.hero) S.hero.gold = (S.hero.gold||0) + gold;
  if(!silent && S.log) S.log.unshift('📦 背包與倉庫皆滿，'+item.name+' 已折價出售 +'+gold+' 金。');
  return 'sold';
}
function depositToWarehouse(uid){
  ensureWarehouse();
  const item = S.inventory.find(i=>i.uid===uid);
  if(!item || item.slot==='potion') return false;
  if(S.warehouse.length >= WAREHOUSE_CAP){
    if(S.log) S.log.unshift('倉庫已滿（'+WAREHOUSE_CAP+'），無法存入。');
    return false;
  }
  S.inventory = S.inventory.filter(i=>i.uid!==uid);
  S.warehouse.push(item);
  if(S.log) S.log.unshift('已將 '+item.name+' 存入倉庫。');
  return true;
}
function withdrawFromWarehouse(uid){
  ensureWarehouse();
  const item = S.warehouse.find(i=>i.uid===uid);
  if(!item) return false;
  if(!backpackHasSpace(1)){
    if(S.log) S.log.unshift('背包已滿（'+BACKPACK_CAP+'），請先整理或存倉後再取出。');
    return false;
  }
  S.warehouse = S.warehouse.filter(i=>i.uid!==uid);
  S.inventory.push(item);
  S.invSelectedItemUid = null;
  S.itemModalUid = null;
  if(S.log) S.log.unshift('已從倉庫取出：'+item.name+'。');
  return true;
}
/** 一鍵取出：能裝多少拿多少，直到背包滿或倉庫空 */
function withdrawAllFromWarehouse(){
  ensureWarehouse();
  if(!S.warehouse.length){
    if(S.log) S.log.unshift('倉庫是空的。');
    return 0;
  }
  let n = 0;
  // 從頭依序取出，背包滿則停
  while(S.warehouse.length > 0 && backpackHasSpace(1)){
    const item = S.warehouse[0];
    S.warehouse.shift();
    S.inventory.push(item);
    n++;
  }
  S.invSelectedItemUid = null;
  S.itemModalUid = null;
  if(n === 0){
    if(S.log) S.log.unshift('背包已滿（'+BACKPACK_CAP+'），無法取出。');
  } else if(S.warehouse.length > 0){
    if(S.log) S.log.unshift('一鍵取出 '+n+' 件；背包已滿，倉庫尚餘 '+S.warehouse.length+' 件。');
  } else {
    if(S.log) S.log.unshift('一鍵取出全部 '+n+' 件裝備。');
  }
  return n;
}

/* ============ 裝備 / 背包 ============ */

function equipItem(item, memberUid){
  const m = S.party.find(p=>p.uid===(memberUid||S.invSelectedUid)) || S.hero;
  if(!m || !item || item.slot==='potion') return;
  normalizeItem(item);
  ensureMemberEquip(m);

  if(item.isUnique || item.rarity==='unique'){
    if(uniqueAlreadyHeld(item, item.uid)){
      if(S.log) S.log.unshift('【唯一】「'+(item.baseName||item.name)+'」全隊僅能裝備一件（其他可收進倉庫）。');
      render();
      return;
    }
  }

  // 僅允許已知裝備欄；未知 slot 進不去紙娃娃
  let targetSlot = item.slot;
  if(!EQUIP_SLOT_IDS.includes(targetSlot)){
    if(S.log) S.log.unshift('此物品目前無法裝備。');
    render();
    return;
  }
  const cur = m.equip[targetSlot];
  // 先從背包移除要穿的，再放回舊裝備（避免暫時超過格數）
  S.inventory = S.inventory.filter(i=>i.uid!==item.uid);
  m.equip[targetSlot] = item;
  if(cur){
    if(backpackHasSpace(1)) S.inventory.push(cur);
    else overflowDispose(cur, false);
  }
  applyComputedStats(m);
  if(S.log) S.log.unshift(m.name+' 裝備了 '+item.name+'（'+equipAffixText(item)+'）');
  S.invSelectedItemUid = null;
  S.itemModalUid = null;
  render();
}
function unequipItem(slot, memberUid){
  const m = S.party.find(p=>p.uid===(memberUid||S.invSelectedUid)) || S.hero;
  const cur = m.equip[slot];
  if(cur){
    m.equip[slot]=null;
    if(backpackHasSpace(1)) S.inventory.push(cur);
    else {
      const fate = overflowDispose(cur, false);
      if(fate==='reject'){
        // 放不回去就重新穿上
        m.equip[slot]=cur;
        if(S.log) S.log.unshift('無法卸下：背包與倉庫皆滿。');
      }
    }
  }
  applyComputedStats(m);
  render();
}
function addPotion(kind, value, name){
  const existing = S.inventory.find(i=>i.slot==='potion' && i.kind===kind && i.value===value);
  if(existing){
    existing.count = (existing.count||1) + 1;
    return existing;
  }
  const pot = {
    uid:'pot_'+Math.floor(Math.random()*1e9),
    slot:'potion', kind, value,
    name: name || (kind==='mp' ? '魔力藥水' : '治療藥水'),
    count:1
  };
  S.inventory.push(pot);
  return pot;
}
function consumePotion(item){
  if(!item || item.slot!=='potion') return false;
  const c = item.count||1;
  if(c<=1){
    S.inventory = S.inventory.filter(i=>i.uid!==item.uid);
  } else {
    item.count = c - 1;
  }
  return true;
}
function usePotionOutOfBattle(item, memberUid){
  const m = S.party.find(p=>p.uid===(memberUid||S.invSelectedUid)) || S.hero;
  if(item.slot!=='potion') return;
  if(item.kind==='mp'){ m.mp = clamp(m.mp+item.value,0,m.maxMp); }
  else { m.hp = clamp(m.hp+item.value,0,m.maxHp); }
  consumePotion(item);
  render();
}
/** 合併舊存檔中散落的同款藥水 */
function stackExistingPotions(){
  if(!S || !S.inventory) return;
  const pots = S.inventory.filter(i=>i.slot==='potion');
  const others = S.inventory.filter(i=>i.slot!=='potion');
  const map = {};
  pots.forEach(p=>{
    const key = p.kind+'_'+p.value;
    if(!map[key]){
      map[key] = Object.assign({}, p, {count: p.count||1});
    } else {
      map[key].count += (p.count||1);
    }
  });
  S.inventory = others.concat(Object.values(map));
}

let uiTab = 'inv';
/* ============ 存檔系統（localStorage） ============ */
const SAVE_KEY = 'ashfall_era_save_v1';
/** 遊戲顯示版本號（給玩家看） */
const GAME_VERSION = '1.7.4';
const SAVE_VERSION = 2;
function saveGame(manual){
  if(!S) return false;
  try{
    S.saveVersion = SAVE_VERSION;
    S.savedAt = Date.now();
    // 戰鬥／事件中不寫入（避免 ref／函式問題）；手動存檔除外且僅在安全畫面
    const payload = JSON.stringify(S);
    localStorage.setItem(SAVE_KEY, payload);
    if(manual && S.log) S.log.unshift('💾 進度已手動存檔。');
    return true;
  }catch(e){
    if(manual && S.log) S.log.unshift('存檔失敗：儲存空間不足或瀏覽器限制。');
    return false;
  }
}
function exportSave(){
  if(!S) return;
  try{
    S.saveVersion = SAVE_VERSION;
    S.savedAt = Date.now();
    const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ashfall_save_'+new Date().toISOString().slice(0,10)+'.json';
    a.click();
    URL.revokeObjectURL(a.href);
    if(S.log) S.log.unshift('📤 存檔已匯出為檔案。');
  }catch(e){
    alert('匯出失敗');
  }
}
function importSaveFromText(text){
  try{
    const data = JSON.parse(text);
    if(!data || !data.party || !data.party.length) throw new Error('格式錯誤');
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    if(loadGame()){
      if(S.screen==='battle' || S.screen==='event'){
        S.battle = null; S.event = null; S.screen = 'hub';
      }
      if(S.log) S.log.unshift('📥 存檔已匯入。');
      saveGame(); // 寫回正規化後狀態
      render();
      return true;
    }
    throw new Error('讀取失敗');
  }catch(e){
    alert('匯入失敗：'+ (e.message||'未知錯誤'));
    return false;
  }
}
function formatSavedAt(ts){
  if(!ts) return '尚無';
  try{
    const d = new Date(ts);
    return d.toLocaleString('zh-TW', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
  }catch(e){ return '—'; }
}
function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    S = JSON.parse(raw);
    if(!S || !S.party || !S.party.length){ S=null; return false; }
    // 致命修復：JSON.parse 後 S.hero 與 party[] 變成兩個獨立物件
    // 戰鬥升等改 party，花金幣改 S.hero → 必須合併後綁回同一參考
    const parsedHero = S.hero;
    let hero = S.party.find(m=>m.isHero)
      || (parsedHero && S.party.find(m=>m.uid===parsedHero.uid))
      || S.party[0];
    if(parsedHero && hero){
      if(typeof parsedHero.gold === 'number') hero.gold = parsedHero.gold;
      if(parsedHero.professionId && !hero.professionId){
        hero.professionId = parsedHero.professionId;
        hero.professionLevel = parsedHero.professionLevel;
      }
      if(parsedHero.classId && !hero.classId){
        hero.classId = parsedHero.classId;
        hero.classLevel = parsedHero.classLevel;
      }
      if(parsedHero.advId && !hero.advId){
        hero.advId = parsedHero.advId;
        hero.advLevel = parsedHero.advLevel;
      }
      if((parsedHero.level||0) > (hero.level||0)){
        hero.level = parsedHero.level;
        hero.exp = parsedHero.exp;
        hero.nextExp = parsedHero.nextExp;
        hero.maxHp = parsedHero.maxHp; hero.hp = parsedHero.hp;
        hero.maxMp = parsedHero.maxMp; hero.mp = parsedHero.mp;
        hero.atk = parsedHero.atk; hero.def = parsedHero.def; hero.spd = parsedHero.spd;
        if(parsedHero.equip) hero.equip = parsedHero.equip;
      }
    }
    hero.isHero = true;
    if(typeof hero.gold !== 'number') hero.gold = 0;
    S.hero = hero;
    const idx = S.party.findIndex(m=>m.uid===hero.uid);
    if(idx>=0) S.party[idx] = hero; else S.party.unshift(hero);
    if(!S.inventory) S.inventory = [];
    if(!Array.isArray(S.warehouse)) S.warehouse = [];
    if(!S.log) S.log = [];
    if(S.pendingStage==null) S.pendingStage = null;
    // 合併舊存檔散落藥水 + 正規化裝備 + 重算屬性
    stackExistingPotions();
    S.inventory.forEach(normalizeItem);
    S.warehouse.forEach(normalizeItem);
    // 舊存檔若背包裝備超過上限 → 溢出進倉庫
    ensureWarehouse();
    const gear = S.inventory.filter(i=>i.slot!=='potion');
    const pots = S.inventory.filter(i=>i.slot==='potion');
    if(gear.length > BACKPACK_CAP){
      const keep = gear.slice(0, BACKPACK_CAP);
      const overflow = gear.slice(BACKPACK_CAP);
      overflow.forEach(it=>{
        if(S.warehouse.length < WAREHOUSE_CAP) S.warehouse.push(it);
        else {
          const g = Math.max(1, Math.floor(equipPrice(it)*0.35));
          S.hero.gold = (S.hero.gold||0)+g;
        }
      });
      S.inventory = keep.concat(pots);
      S.log.unshift('讀檔整理：多餘裝備已移入倉庫（背包上限 '+BACKPACK_CAP+' 格）。');
    }

    S.party.forEach(m=>{
      ensureMemberEquip(m);
      Object.keys(m.equip).forEach(k=>{ if(m.equip[k]) normalizeItem(m.equip[k]); });
      applyComputedStats(m);
    });
    // 戰鬥／事件畫面讀檔不安全 → 強制回營地
    if(S.screen==='battle' || S.screen==='event' || !S.screen){
      S.battle = null;
      S.event = null;
      S.screen = 'hub';
    }
    // 淨化隊伍數值，避免舊存檔 level/hp 異常導致戰鬥 NaN
    S.party.forEach(m=>{
      m.level = Math.max(1, Number.isFinite(Number(m.level)) ? Math.floor(Number(m.level)) : 1);
      if(typeof applyComputedStats === 'function') applyComputedStats(m);
      m.maxHp = Math.max(1, Number(m.maxHp)||1);
      m.hp = Math.max(0, Math.min(Number(m.hp)||0, m.maxHp));
      m.maxMp = Math.max(0, Number(m.maxMp)||0);
      m.mp = Math.max(0, Math.min(Number(m.mp)||0, m.maxMp));
      m.atk = Math.max(1, Number(m.atk)||1);
      m.def = Math.max(0, Number(m.def)||0);
      m.spd = Math.max(1, Number(m.spd)||1);
      if(m.matk != null) m.matk = Math.max(1, Number(m.matk)||1);
    });

    (S.party||[]).forEach(m=>{
      if(m.complicity==null) m.complicity=0;
      if(!m.jobBias||typeof m.jobBias!=='object') m.jobBias={};
    });
    evaluateEvolution(S.hero);
    if(S.pendingStage==='profession') S.screen='evolve-profession';
    else if(S.pendingStage==='class') S.screen='evolve-class';
    else if(S.pendingStage==='branch') S.screen='evolve-branch';
    else if(S.pendingStage==='legend') S.screen='evolve-legend';
    return true;
  }catch(e){ S=null; return false; }
}
function hasSaveGame(){
  try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; }
}
function deleteSaveGame(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){ /* 忽略 */ }
}

  if(!confirm('確定要放棄目前的進度，重新開始一輪新的冒險嗎？此動作無法復原。')) return;
  deleteSaveGame();

function render(){
  const verEl = document.getElementById('game-version-label');
  if(verEl && typeof GAME_VERSION!=='undefined') verEl.textContent = 'v'+GAME_VERSION;
  const root = document.getElementById('screens');
  if(!root) return;
  if(!S){ root.innerHTML = renderCharCreate(); bindCharCreate(); return; }
  if(S.screen==='hub') { root.innerHTML = renderHub(); bindHub(); }
  else if(S.screen==='battle') { root.innerHTML = renderBattle(); bindBattle(); }
  else if(S.screen==='event') { root.innerHTML = renderEvent(); bindEvent(); }
  else if(S.screen==='inventory') { root.innerHTML = renderInventory(); bindInventory(); }
  else if(S.screen==='warehouse') { root.innerHTML = renderWarehouse(); bindWarehouse(); }
  else if(S.screen==='shop') { root.innerHTML = renderShop(); bindShop(); }
  else if(S.screen==='tavern') { root.innerHTML = renderTavern(); bindTavern(); }
  else if(S.screen==='party') { root.innerHTML = renderParty(); bindParty(); }
  else if(S.screen==='ally-talk') { root.innerHTML = renderAllyTalk(); bindAllyTalk(); }
  else if(S.screen==='evolve-profession') { root.innerHTML = renderEvolveProfession(); bindEvolveProfession(); }
  else if(S.screen==='evolve-class') { root.innerHTML = renderEvolveClass(); bindEvolveClass(); }
  else if(S.screen==='evolve-branch') { root.innerHTML = renderEvolveBranch(); bindEvolveBranch(); }
  else if(S.screen==='evolve-legend') { root.innerHTML = renderEvolveMaster(); bindEvolveMaster(); }
  requestAnimationFrame(paintSprites);
  // 存檔安全範圍：除了「戰鬥中」(battle.order[].ref 需要維持物件參照一致性)
  // 跟「事件選擇中」(event.choices[].act 是函式，無法被JSON序列化)以外，
  // 其他畫面（包含職業覺醒畫面）都是安全的存檔時機。
  if(S.screen!=='battle' && S.screen!=='event') saveGame();
}
let pendingSprites = [];
function queueSprite(id, seed, palette, size, opts){
  pendingSprites.push({id, seed, palette, size, opts: opts||{}});
}

function formatMonsterAffixDisplay(m){
  const names = (m.affixNames && m.affixNames.length)
    ? m.affixNames.slice()
    : ((m.affixes||[]).map(id=>{ const a=(typeof MONSTER_AFFIXES!=='undefined')&&MONSTER_AFFIXES.find(x=>x.id===id); return a?a.name:id; }));
  const emp = m.emperorTrait || null;
  const rest = names.filter(n=>n && n!==emp);
  const visible = [];
  if(emp) visible.push(emp);
  const take = emp ? 1 : 2;
  const others = rest.slice(0, take);
  others.forEach(n=> visible.push(n));
  const hidden = Math.max(0, rest.length - others.length);
  const line = visible.join(' · ') + (hidden>0 ? ' · +'+hidden : '');
  const full = (emp ? [emp] : []).concat(rest).join(' · ');
  return { line, full, count: (emp?1:0)+rest.length };
}
function formatMonsterRankTag(m){
  if(m.isRival) return (m.rivalTierName || '敵對') + '冒險家';
  if(m.boss) return 'Boss';
  if(m.isBossMinion) return '眷屬';
  const r = m.rank || (m.elite ? 'elite' : 'normal');
  const map = {elite:'精英',veteran:'百戰',refined:'千煉',king:'王者',emperor:'帝王'};
  return map[r] || '';
}

function processBattleFx(){
  const b = S.battle;
  if(!b || !b.fx || !b.fx.length) return;
  const list = b.fx.splice(0, b.fx.length);
  list.forEach(fx=>{
    if(fx.kind!=='hit') return;
    let el = null;
    if(fx.target==='monster') el = document.querySelector('.monster-box[data-tidx="'+fx.idx+'"]');
    else if(fx.target==='party'){
      el = document.querySelector('.battle-party-grid [data-pidx="'+fx.idx+'"]')
        || document.querySelector('.member-card[data-pidx="'+fx.idx+'"]');
      if(!el){
        const cv = document.getElementById('bp-'+fx.idx);
        if(cv) el = cv.closest('.member-card') || cv.parentElement;
      }
      if(!el){
        const cards = document.querySelectorAll('.battle-party-grid .member-card');
        el = cards[fx.idx] || null;
      }
    }
    if(!el) return;
    el.classList.remove('hit-shake','hit-flash','kill-pulse');
    void el.offsetWidth;
    el.classList.add('hit-shake','hit-flash');
    if(fx.kill) el.classList.add('kill-pulse');
    // 跳字
    const tag = document.createElement('div');
    tag.className = 'combat-float-dmg ' + (fx.miss?'miss':(fx.crit?'crit':(fx.magic?'magic':'normal')));
    if(fx.miss) tag.textContent = 'MISS';
    else tag.textContent = (fx.crit?'✦ ':'') + (-Math.abs(num(fx.dmg,0)));
    el.appendChild(tag);
    setTimeout(()=>{ try{ tag.remove(); }catch(e){} }, 750);
    setTimeout(()=>{ try{ el.classList.remove('hit-shake','hit-flash','kill-pulse'); }catch(e){} }, 280);
  });
  // hit-stop：短暫凍結互動
  const ms = num(b._hitstopMs, 0);
  b._hitstopMs = 0;
  if(ms > 0){
    const root = document.getElementById('screens') || document.body;
    root.classList.add('battle-hitstop');
    setTimeout(()=> root.classList.remove('battle-hitstop'), ms);
  }
}
