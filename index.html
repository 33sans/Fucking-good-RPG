<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>灰燼紀元 - 像素文字RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Noto+Serif+TC:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#0c0a09;
  --bg-panel:#1b1512;
  --bg-panel-2:#271f19;
  --line:#4a2f1f;
  --gold:#ff6a35;
  --gold-dim:#8a3a1a;
  --hp:#d4453f;
  --mp:#5b93a8;
  --xp:#8fae52;
  --text:#ece2cc;
  --text-dim:#9c8f7c;
  --common:#9c8f7c;
  --rare:#5b93a8;
  --epic:#a565d6;
  --legend:#ff6a35;
  --mythic:#ff4fa3;
}
*{box-sizing:border-box;}
html{background:var(--bg-deep);}
body{
  margin:0;
  background:radial-gradient(ellipse at 50% -10%, #241a13 0%, #0c0a09 62%);
  color:var(--text);
  font-family:'Noto Serif TC',serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:18px 10px;
  position:relative;
  overflow-x:hidden;
}
/* --- 信物：飄升餘燼（Ashfall 的視覺主題） --- */
#embers{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.ember-particle{
  position:absolute; bottom:-5%; width:3px; height:3px; border-radius:50%;
  background:var(--gold); box-shadow:0 0 6px 1px rgba(255,106,53,.8);
  opacity:0; animation:emberRise linear infinite;
}
@keyframes emberRise{
  0%{ transform:translate(0,0) scale(1); opacity:0; }
  8%{ opacity:.55; }
  92%{ opacity:.25; }
  100%{ transform:translate(var(--drift,20px), -108vh) scale(.4); opacity:0; }
}
#app{width:100%;max-width:900px;position:relative;z-index:1;}
.pixel-font{font-family:'Silkscreen',monospace;}
.title-bar{
  text-align:center;margin-bottom:14px;
}
.title-bar h1{
  font-size:16px;letter-spacing:3px;color:var(--gold);
  text-shadow:0 0 10px rgba(255,106,53,.5), 0 0 2px rgba(255,106,53,.8);
  margin:0 0 4px;
  animation:emberGlow 3.2s ease-in-out infinite;
}
@keyframes emberGlow{
  0%,100%{ text-shadow:0 0 10px rgba(255,106,53,.5), 0 0 2px rgba(255,106,53,.8); }
  50%{ text-shadow:0 0 16px rgba(255,106,53,.75), 0 0 3px rgba(255,106,53,1); }
}
.title-bar p{font-size:11px;color:var(--text-dim);margin:0;letter-spacing:1px;}
.panel{
  background:var(--bg-panel);
  border:1px solid var(--line);
  border-top:2px solid var(--gold-dim);
  box-shadow:0 10px 24px -12px rgba(0,0,0,.6);
  padding:14px;
  margin-bottom:12px;
}
.btn{
  font-family:'Noto Serif TC',serif;
  font-weight:700;
  background:var(--bg-panel-2);
  border:1px solid var(--line);
  color:var(--text);
  padding:10px 14px;
  cursor:pointer;
  font-size:14px;
  transition:transform .08s, background .15s, box-shadow .1s;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.06),
    inset 0 -2px 0 rgba(0,0,0,.35),
    0 1px 0 rgba(0,0,0,.4);
}
.btn:hover{background:#33291f;transform:translateY(-1px);}
.btn:active{transform:translateY(1px);box-shadow:inset 0 2px 0 rgba(0,0,0,.4);}
.btn.gold{border-color:var(--gold-dim);color:var(--gold);}
.btn.danger{border-color:#7a2c34;color:#e0655f;}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.grid{display:grid;gap:10px;}
.class-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));}
.class-card{
  background:var(--bg-panel-2);border:1px solid var(--line);border-top:2px solid transparent;
  padding:10px;text-align:center;cursor:pointer;transition:border-color .12s;
}
.class-card:hover{border-top-color:var(--gold-dim);}
.class-card.selected{border-top-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
.class-card h3{margin:6px 0 2px;font-size:14px;color:var(--gold);font-weight:700;}
.class-card p{margin:0;font-size:11px;color:var(--text-dim);line-height:1.5;}
canvas.sprite{image-rendering:pixelated;background:#0a0807;border:1px solid var(--line);}
.statline{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);margin-top:6px;font-family:'Space Mono','Noto Serif TC',serif;}
.bar-wrap{background:#0a0807;border:1px solid var(--line);height:9px;overflow:hidden;margin:3px 0;}
.bar{height:100%;}
.topbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:10px;}
.member-card{
  background:var(--bg-panel-2);border:1px solid var(--line);border-left:3px solid var(--line);
  padding:8px;display:flex;gap:8px;align-items:center;transition:border-color .12s;
}
.member-card.active-turn{border-left-color:var(--gold);}
.member-card.dead{opacity:.4;}
.member-info{flex:1;min-width:0;}
.member-name{font-size:12px;font-weight:700;display:flex;justify-content:space-between;}
.rarity-common{color:var(--common);}
.rarity-rare{color:var(--rare);}
.rarity-epic{color:var(--epic);}
.rarity-legend{color:var(--legend);}
.rarity-mythic{color:var(--mythic);text-shadow:0 0 4px rgba(255,79,163,.6);}
.log-box{
  background:#0a0807;border:1px solid var(--line);
  padding:10px;font-size:12px;height:130px;overflow-y:auto;line-height:1.7;
  font-family:'Space Mono','Noto Serif TC',serif;
}
.log-box div{border-bottom:1px dashed #2a2119;padding-bottom:3px;margin-bottom:3px;}
.monster-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:10px 0;}
.monster-box{text-align:center;cursor:pointer;padding:6px;border:1px solid transparent;}
.monster-box.target-selectable:hover{border-color:var(--hp);}
.monster-box.dead{opacity:.25;pointer-events:none;}
.monster-name{font-size:11px;margin-top:4px;}
.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
/* --- 按鍵層級系統 --- */
.btn-primary{width:100%;padding:14px;font-size:15px;letter-spacing:1px;margin-bottom:2px;}
.nav-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
.btn-nav{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 4px;font-size:11px;white-space:nowrap;}
.btn-nav .nav-icon{font-size:20px;line-height:1;}
.btn-compact{padding:8px 10px;font-size:12px;}
.segmented{display:flex;border:1px solid var(--line);width:fit-content;margin-bottom:10px;}
.segmented .btn{border:none;box-shadow:none;padding:8px 18px;font-size:12px;background:transparent;}
.segmented .btn+.btn{border-left:1px solid var(--line);}
.segmented .btn.active{background:var(--gold-dim);color:var(--bg-deep);}
.action-label{font-family:'Silkscreen',monospace;font-size:9px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase;margin:12px 0 6px;border-bottom:1px dashed var(--line);padding-bottom:4px;}
.skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;}
.skill-btn{display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;padding:8px 10px;white-space:normal;}
.skill-btn-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;}
.skill-btn-desc{color:var(--text-dim);line-height:1.4;}
.skill-btn-est{color:var(--gold);}
.skill-btn .mp-cost{font-family:'Space Mono','Noto Serif TC',serif;color:var(--mp);font-size:10px;white-space:nowrap;}
.utility-row{display:flex;gap:8px;}
.flee-link{background:none;border:none;box-shadow:none;color:var(--text-dim);font-size:11px;text-decoration:underline;cursor:pointer;padding:6px 2px;margin:8px 0 0 auto;display:block;}
.flee-link:hover{color:var(--hp);}
.choice-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.choice-list .btn{text-align:left;}
.item-row{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--bg-panel-2);border:1px solid var(--line);padding:8px;margin-bottom:6px;
}
.item-row .meta{font-size:11px;color:var(--text-dim);font-family:'Space Mono','Noto Serif TC',serif;}
.small{font-size:11px;color:var(--text-dim);font-family:'Space Mono','Noto Serif TC',serif;}
.event-text{font-size:13px;line-height:1.8;margin:10px 0;}
.hidden{display:none !important;}
.hero-slot{display:flex;align-items:center;gap:10px;background:var(--bg-panel-2);border:1px solid var(--line);padding:8px;margin-bottom:6px;}
.section-title{font-family:'Silkscreen',monospace;font-size:11px;color:var(--gold);letter-spacing:1px;margin:0 0 8px;}
.divider{border:none;border-top:1px dashed var(--line);margin:10px 0;}
@media (max-width:640px){
  .title-bar h1{font-size:13px;}
  canvas.sprite{width:56px;height:56px;}
}
</style>
</head>

<script>
/* ============ 工具 / PRNG ============ */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(str){
  let h = 0x811c9dc5;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rint(rng,min,max){ return Math.floor(rng()*(max-min+1))+min; }
function choice(rng, arr){ return arr[Math.floor(rng()*arr.length)]; }
function weightedChoice(rng, entries){ // entries: [{item,w}]
  const total = entries.reduce((s,e)=>s+e.w,0);
  let r = rng()*total;
  for(const e of entries){ if(r < e.w) return e.item; r -= e.w; }
  return entries[entries.length-1].item;
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function esc(s){ return (s+'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* ============ 像素精靈產生器 ============ */
// 產生對稱的怪物/角色/裝備像素圖，以 seed 決定圖案，palette 決定配色
function drawSprite(canvas, seed, palette, size){
  size = size || 16;
  const rng = mulberry32(hashStr(seed));
  const cell = Math.floor(160/size);
  canvas.width = size*cell; canvas.height = size*cell;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const half = Math.ceil(size/2);
  const grid = [];
  for(let y=0;y<size;y++){
    grid.push([]);
    for(let x=0;x<half;x++){
      const edgeBias = (x < half*0.3 || y < size*0.15 || y > size*0.85) ? 0.32 : 0.58;
      grid[y].push(rng() < edgeBias ? weightedChoice(rng,[{item:0,w:6},{item:1,w:3},{item:2,w:2},{item:3,w:1}]) : 0);
    }
  }
  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){
      const srcX = x < half ? x : size-1-x;
      const v = grid[y][srcX];
      if(v===0) continue;
      const color = palette[v-1] || palette[0];
      ctx.fillStyle = color;
      ctx.fillRect(x*cell,y*cell,cell,cell);
    }
  }
}
function drawEquipIcon(canvas, seed, kind, rarityColor){
  const size=12, cell=Math.floor(120/size);
  canvas.width=size*cell; canvas.height=size*cell;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const rng = mulberry32(hashStr(seed));
  const base = ['#8b7355','#c9c2b0','#5a5470'];
  const shapes = {
    weapon: [[5,1],[6,1],[5,2],[6,2],[4,3],[5,3],[6,3],[7,3],[3,4],[4,4],[5,4],[6,4],[7,4],[8,4],[5,5],[6,5],[5,6],[6,6],[5,7],[6,7],[4,8],[5,8],[6,8],[7,8],[4,9],[7,9]],
    armor: [[3,2],[4,2],[7,2],[8,2],[3,3],[4,3],[5,3],[6,3],[7,3],[8,3],[3,4],[4,4],[5,4],[6,4],[7,4],[8,4],[4,5],[5,5],[6,5],[7,5],[4,6],[5,6],[6,6],[7,6],[4,7],[7,7]],
    accessory: [[5,2],[6,2],[4,3],[7,3],[4,4],[7,4],[5,5],[6,5],[5,6],[6,6],[4,7],[7,7],[5,8],[6,8]]
  };
  const pts = shapes[kind]||shapes.weapon;
  pts.forEach(([x,y])=>{
    ctx.fillStyle = rng()<0.25 ? rarityColor : choice(rng, base);
    ctx.fillRect(x*cell,y*cell,cell,cell);
  });
}

/* ============ 資料：職業 ============ */

/* 第2階（Lv.10）：8大職業，各自擁有獨特被動能力 + 專屬技能 */
const CLASSES = [
  {id:'warrior', name:'戰士', tag:'前排肉盾，穩定物理輸出', palette:PALETTES.metal,
    statBonus:{hp:48,mp:5,atk:8,def:14,spd:0}, growBonus:{hp:10,mp:1,atk:1.6,def:2.2,spd:0.6},
    passive:{id:'block', name:'格擋', desc:'受到攻擊時有機率格擋，減少35%傷害'},
    skills:[{name:'猛力斬',mp:8,mult:1.8,type:'phys',desc:'單體高倍物理傷害'},{name:'守護怒吼',mp:12,type:'buff',desc:'全隊防禦+20% 兩回合'},{name:'嘲諷怒吼',mp:10,type:'guard',desc:'嘲諷全體敵人，吸引攻擊並提升自身防禦'}],
    advancements:[
      {id:'berserker', name:'狂戰士', desc:'捨棄防禦換取毀滅性輸出，越戰越狂暴。',
        statBonus:{hp:15,mp:0,atk:10,def:-3,spd:3}, growBonus:{hp:3,mp:0,atk:1.8,def:0.5,spd:0.3},
        skill:{name:'血怒連斬',mp:12,mult:2.3,type:'phys_multi',desc:'狂暴狀態下連續揮砍兩次'}},
      {id:'guardian', name:'守護者', desc:'化身移動堡壘，替隊友承受所有傷害。',
        statBonus:{hp:30,mp:5,atk:2,def:12,spd:-2}, growBonus:{hp:5,mp:0.5,atk:0.8,def:1.6,spd:0.2},
        skill:{name:'不動堡壘',mp:14,type:'guard',desc:'嘲諷全體敵人並大幅提升自身防禦'}},
      {id:'holyblade', name:'聖鋒騎士', desc:'劍與信仰並重，攻防兼具的聖光戰士。',
        statBonus:{hp:18,mp:10,atk:8,def:6,spd:2}, growBonus:{hp:3,mp:1,atk:1.3,def:1,spd:0.3},
        skill:{name:'聖輝斬',mp:16,mult:1.9,type:'magic',desc:'聖屬性魔法傷害，對邪惡系怪物有加成'}}
    ]},

function makeMonster(tmpl, playerLevel, rng){
  const tier = tmpl.tier;
  const lvl = clamp(playerLevel + rint(rng,-1,1), 1, 60);
  const scale = (1 + (tier-1)*0.5) * (1 + lvl*0.09 + lvl*lvl*0.0028);
  const boss = !!tmpl.boss;
  return {
    name: tmpl.n,
    type: tmpl.type,
    tier, boss,
    level: lvl,
    hp: Math.round((boss?300:42) * scale),
    maxHp: Math.round((boss?300:42) * scale),
    atk: Math.round((boss?18:9) * (1+(tier-1)*0.4) * (1+lvl*0.08)),
    def: Math.round((boss?10:4) * (1+(tier-1)*0.3) * (1+lvl*0.06)),
    spd: rint(rng, 6+tier, 12+tier),
    exp: Math.round((boss?400:40) * scale),
    gold: Math.round((boss?300:25) * scale * (0.7+rng()*0.6)),
    seed: tmpl.n + '_' + lvl + '_' + Math.floor(rng()*9999),
    status:null, statusTurns:0, rewarded:false
  };
}

function avgPartyLevel(s){
  s = s || S;
  return Math.round(s.party.reduce((a,m)=>a+m.level,0) / s.party.length);
}
const SECONDARY_STAT_BASE = {atk:4, def:4, spd:3, hp:15, mp:12};
function rollEquip(rng, minRarity, itemLevel){
  itemLevel = itemLevel || 1;
  const slot = choice(rng, ['weapon','armor','accessory']);
  const base = choice(rng, EQUIP_BASES[slot]);
  const minIdx = minRarity ? RARITIES.findIndex(r=>r.id===minRarity) : -1;
  const pool = RARITIES.filter(r=> minIdx<0 || RARITIES.indexOf(r)>=minIdx);
  const rarity = weightedChoice(rng, pool.map(r=>({item:r,w:r.w})));
  const lvlFactor = 1 + Math.max(0, itemLevel-1) * 0.06;
  const value = Math.round(base.v * rarity.mult * lvlFactor * (slot==='accessory'&&(base.stat==='hp'||base.stat==='mp')?1.5:1));
  let extraStat = null, extraValue = 0;
  if(rarity.id==='legend' || rarity.id==='mythic'){
    const otherStats = Object.keys(SECONDARY_STAT_BASE).filter(s=>s!==base.stat);
    extraStat = choice(rng, otherStats);
    extraValue = Math.round(SECONDARY_STAT_BASE[extraStat] * rarity.mult * lvlFactor * 0.55);
  }
  return {
    uid: 'eq_'+Math.floor(rng()*1e9),
    slot, name: rarity.name+base.n, stat: base.stat, value,
    extraStat, extraValue,
    rarity: rarity.id, rarityName: rarity.name, rarityHex: rarity.hex,
    itemLevel,
    seed: base.n+rarity.id+Math.floor(rng()*999)
  };
}
function equipPrice(item){
  const extra = item.extraValue ? item.extraValue*7 : 0;
  return Math.max(8, Math.round(item.value * 9 + extra + (item.itemLevel||1) * 2));
}

/* ============ 角色成員建構 / 升級 / 職業成長 ============ */
function computeStats(m){
  const lv = m.level;
  let maxHp = COMMONER.base.hp + COMMONER.grow.hp*(lv-1);
  let maxMp = COMMONER.base.mp + COMMONER.grow.mp*(lv-1);
  let atk = COMMONER.base.atk + COMMONER.grow.atk*(lv-1);
  let def = COMMONER.base.def + COMMONER.grow.def*(lv-1);
  let spd = COMMONER.base.spd + COMMONER.grow.spd*(lv-1);

  const layers = [];
  if(m.professionId) layers.push({def:PROFESSIONS.find(p=>p.id===m.professionId), atLevel:m.professionLevel});
  if(m.classId) layers.push({def:CLASSES.find(c=>c.id===m.classId), atLevel:m.classLevel});
  if(m.classId && m.advId){
    const cls = CLASSES.find(c=>c.id===m.classId);
    layers.push({def:cls.advancements.find(a=>a.id===m.advId), atLevel:m.advLevel});
  }
  layers.forEach(({def:d, atLevel})=>{
    const since = Math.max(0, lv-atLevel);
    maxHp += d.statBonus.hp + d.growBonus.hp*since;
    maxMp += d.statBonus.mp + d.growBonus.mp*since;
    atk += d.statBonus.atk + d.growBonus.atk*since;
    def += d.statBonus.def + d.growBonus.def*since;
    spd += d.statBonus.spd + d.growBonus.spd*since;
  });
  return {
    maxHp:Math.max(1,Math.round(maxHp)), maxMp:Math.max(0,Math.round(maxMp)),
    atk:Math.max(1,Math.round(atk)), def:Math.max(0,Math.round(def)), spd:Math.max(1,Math.round(spd))
  };
}
function applyComputedStats(m){
  const s = computeStats(m);
  const dHp = s.maxHp - (m.maxHp||0);
  const dMp = s.maxMp - (m.maxMp||0);
  m.maxHp=s.maxHp; m.maxMp=s.maxMp; m.atk=s.atk; m.def=s.def; m.spd=s.spd;
  m.hp = clamp((m.hp||0)+dHp, 0, m.maxHp);
  m.mp = clamp((m.mp||0)+dMp, 0, m.maxMp);
}
function setProfession(m, professionId){
  m.professionId = professionId;
  m.professionLevel = m.level;
  applyComputedStats(m);
}
function setClass(m, classId){
  m.classId = classId;
  m.classLevel = m.level;
  applyComputedStats(m);
}
function setAdvancement(m, advId){
  m.advId = advId;
  m.advLevel = m.level;
  applyComputedStats(m);
}
function classPassive(m){
  if(!m.classId) return null;
  const cls = CLASSES.find(c=>c.id===m.classId);
  return cls.passive || null;
}
function hasPassive(m, id){
  const p = classPassive(m);
  return !!(p && p.id===id);
}
function displayClassName(m){
  if(m.advId){
    const cls = CLASSES.find(c=>c.id===m.classId);
    const adv = cls.advancements.find(a=>a.id===m.advId);
    if(adv) return adv.name;
  }
  if(m.classId){
    const cls = CLASSES.find(c=>c.id===m.classId);
    if(cls) return cls.name;
  }
  if(m.professionId){
    const prof = PROFESSIONS.find(p=>p.id===m.professionId);
    if(prof) return prof.name;
  }
  return COMMONER.name;
}
function getSkills(m){
  let skills = COMMONER.skills.slice();
  if(m.professionId) skills.push(PROFESSIONS.find(p=>p.id===m.professionId).skill);
  if(m.classId) skills = skills.concat(CLASSES.find(c=>c.id===m.classId).skills);
  if(m.classId && m.advId){
    const cls = CLASSES.find(c=>c.id===m.classId);
    const adv = cls.advancements.find(a=>a.id===m.advId);
    if(adv) skills.push(adv.skill);
  }
  return skills;
}
function buildMember(name, level){
  const m = {
    uid:'m_'+Math.floor(Math.random()*1e9),
    name,
    professionId:null, professionLevel:null,
    classId:null, classLevel:null,
    advId:null, advLevel:null,
    level: level||1, exp:0, nextExp: expForLevel(level||1),
    maxHp:0, hp:0, maxMp:0, mp:0, atk:0, def:0, spd:0,
    equip:{weapon:null,armor:null,accessory:null,accessory2:null},
    buffDef:0, buffTurns:0, guarding:false, taunting:false,
    usedGuardianAngel:false
  };
  applyComputedStats(m);
  m.hp = m.maxHp; m.mp = m.maxMp;
  return m;
}
function memberPalette(m){
  if(m.classId) return CLASSES.find(c=>c.id===m.classId).palette;
  if(m.professionId) return PROFESSIONS.find(p=>p.id===m.professionId).palette;
  return COMMONER.palette;
}
function expForLevel(lv){ return Math.round(30 * Math.pow(lv,1.5)); }
function statTotal(m, stat){
  let v = m[stat];
  Object.values(m.equip).forEach(eq=>{
    if(!eq) return;
    if(eq.stat===stat) v += eq.value;
    if(eq.extraStat===stat) v += eq.extraValue;
  });
  if(stat==='def' && m.buffTurns>0) v += m.buffDef;
  return v;
}
function evaluateEvolution(m){
  if(m.level>=PROFESSION_LEVEL && !m.professionId){ S.pendingStage='profession'; return; }
  if(m.level>=CLASS_LEVEL && m.professionId && !m.classId){ S.pendingStage='class'; return; }
  if(m.level>=BRANCH_LEVEL && m.classId && !m.advId){ S.pendingStage='branch'; return; }
}
function autoEvolveAll(m, log){
  if(m.level>=PROFESSION_LEVEL && !m.professionId){
    const prof = choice(Math.random, PROFESSIONS);
    setProfession(m, prof.id);
    log.push(m.name+' 踏上了 ['+prof.name+'] 之路！');
  }
  if(m.level>=CLASS_LEVEL && m.professionId && !m.classId){
    const prof = PROFESSIONS.find(p=>p.id===m.professionId);
    const opts = CLASSES.filter(c=>prof.leadsTo.includes(c.id));
    const cls = choice(Math.random, opts);
    setClass(m, cls.id);
    log.push(m.name+' 覺醒為 ['+cls.name+']！');
  }
  if(m.level>=BRANCH_LEVEL && m.classId && !m.advId){
    const cls = CLASSES.find(c=>c.id===m.classId);
    const adv = choice(Math.random, cls.advancements);
    setAdvancement(m, adv.id);
    log.push(m.name+' 進一步覺醒為 ['+adv.name+']！');
  }
}
function gainExp(m, amt, log){
  m.exp += amt;
  while(m.exp >= m.nextExp){
    m.exp -= m.nextExp;
    m.level++;
    applyComputedStats(m);
    m.nextExp = expForLevel(m.level);
    log.push(m.name+' 升到了 Lv.'+m.level+'！');
    if(m.isHero){
      evaluateEvolution(m);
    } else {
      autoEvolveAll(m, log);
    }
  }
}

/* ============ 戰鬥系統 ============ */
function startBattle(){
  const rng = Math.random;
  const avgLevel = avgPartyLevel();
  const availableTiers = [1];
  if(avgLevel>=4) availableTiers.push(2);
  if(avgLevel>=9) availableTiers.push(3);
  if(avgLevel>=16) availableTiers.push(4);
  const bossRoll = avgLevel>=20 && rng()<0.06;
  let pool = bossRoll ? MONSTER_TYPES.filter(m=>m.tier===5) : MONSTER_TYPES.filter(m=>availableTiers.includes(m.tier));
  if(pool.length===0) pool = MONSTER_TYPES.filter(m=>m.tier===1);
  const count = bossRoll?1:rint(rng,1,3);
  const monsters=[];
  for(let i=0;i<count;i++) monsters.push(makeMonster(choice(rng,pool), avgLevel, rng));
  S.party.forEach(m=> m.usedGuardianAngel=false);
  S.battle = {
    monsters, turnLog:[], selectedActor:null, selectedAction:null, over:false, win:null,
    order: buildTurnOrder(monsters), turnIndex:0, roundNum:1
  };
  S.screen='battle';
  advanceBattleTurn(true);
  render();
}
function buildTurnOrder(monsters){
  const combatants = [...S.party.filter(m=>m.hp>0).map(m=>({type:'party',ref:m})), ...monsters.filter(m=>m.hp>0).map(m=>({type:'monster',ref:m}))];
  combatants.sort((a,b)=> statTotal2(b)-statTotal2(a));
  return combatants;
}
function statTotal2(c){ return c.type==='party'? statTotal(c.ref,'spd') : c.ref.spd; }
function advanceBattleTurn(first){
  const b = S.battle;
  if(!b || b.over) return;
  // rebuild order excluding dead
  b.order = buildTurnOrder(b.monsters);
  if(b.order.length===0){ return; }
  if(!first) b.turnIndex++;
  if(b.turnIndex >= b.order.length){
    b.turnIndex=0; b.roundNum++;
    S.party.forEach(m=>{
      if(m.buffTurns>0){
        m.buffTurns--;
        if(m.buffTurns<=0){ m.buffTurns=0; m.buffDef=0; m.taunting=false; }
      }
      if(m.hp>0 && m.maxMp>0 && m.mp < m.maxMp){
        const baseRegen = Math.max(1, Math.round(m.maxMp*0.04));
        const bonusRegen = hasPassive(m,'manaRegen') ? Math.max(1, Math.round(m.maxMp*0.06)) : 0;
        const regen = baseRegen + bonusRegen;
        m.mp = clamp(m.mp+regen, 0, m.maxMp);
        if(bonusRegen>0) b.turnLog.unshift(m.name+' 的魔力自然涌動，回復 '+regen+' MP。');
      }
    });
  }
  const current = b.order[b.turnIndex];
  if(!current || (current.type==='party'&&current.ref.hp<=0) || (current.type==='monster'&&current.ref.hp<=0)){
    return advanceBattleTurn(false);
  }
  if(current.type==='monster'){
    tickMonsterStatus(current.ref);
    checkBattleEnd();
    if(!b.over && current.ref.hp>0){
      monsterAct(current.ref);
      checkBattleEnd();
    }
    if(!b.over) setTimeout(()=>{ advanceBattleTurn(false); render(); }, 550);
  }
}
function tickMonsterStatus(mon){
  const b=S.battle;
  if(mon.status==='poison' && mon.statusTurns>0){
    const dmg = Math.max(1, Math.round(mon.maxHp*0.06));
    mon.hp = clamp(mon.hp-dmg,0,mon.maxHp);
    b.turnLog.unshift(mon.name+' 受到中毒侵蝕，損失 '+dmg+' HP。');
    mon.statusTurns--;
    if(mon.statusTurns<=0) mon.status=null;
    checkKillReward(mon, b);
    if(mon.hp===0) b.turnLog.unshift(mon.name+' 被毒素侵蝕殆盡而倒下了！');
  }
}
function monsterAct(mon){
  const b=S.battle;
  const aliveParty = S.party.filter(m=>m.hp>0);
  if(aliveParty.length===0) return;
  const tauntTarget = aliveParty.find(m=>m.taunting);
  const target = tauntTarget || choice(Math.random, aliveParty);
  let dmg = Math.max(1, Math.round(mon.atk * (0.85+Math.random()*0.3) - statTotal(target,'def')*0.55));
  let blocked = false;
  if(hasPassive(target,'block') && Math.random()<0.18){
    dmg = Math.max(1, Math.round(dmg*0.65));
    blocked = true;
  }
  target.hp = clamp(target.hp-dmg,0,target.maxHp);
  b.turnLog.unshift(mon.name+' 攻擊了 '+target.name+'，造成 '+dmg+' 點傷害。'+(blocked?'（格擋減傷！）':''));
  if(target.hp===0){
    const guardian = S.party.find(p=>(p.hp>0 || p.uid===target.uid) && hasPassive(p,'guardianAngel') && !p.usedGuardianAngel);
    if(guardian){
      target.hp = 1;
      guardian.usedGuardianAngel = true;
      b.turnLog.unshift('⚜️ '+guardian.name+' 的守護天使發動，'+target.name+' 奇蹟般保住了 1 點HP！');
    } else {
      b.turnLog.unshift(target.name+' 倒下了！');
    }
  }
}
function playerAction(actorUid, action, targetIdx, skillIdx, potionUid){
  const b=S.battle;
  if(!b || b.over) return;
  const actor = S.party.find(m=>m.uid===actorUid);
  if(!actor || actor.hp<=0) return;
  actor.taunting=false;
  if(action==='attack'){
    const target = b.monsters[targetIdx];
    if(!target||target.hp<=0) return;
    const defIgnore = hasPassive(actor,'pierce') ? target.def*0.3 : 0;
    const dmg = Math.max(1, Math.round(statTotal(actor,'atk') * (0.9+Math.random()*0.3) - (target.def-defIgnore)*0.5));
    target.hp = clamp(target.hp-dmg,0,target.maxHp);
    b.turnLog.unshift(actor.name+' 攻擊了 '+target.name+'，造成 '+dmg+' 點傷害。');
    if(hasPassive(actor,'doubleStrike') && target.hp>0 && Math.random()<0.22){
      const dmg2 = Math.max(1, Math.round(statTotal(actor,'atk')*0.5 - target.def*0.5));
      target.hp = clamp(target.hp-dmg2,0,target.maxHp);
      b.turnLog.unshift(actor.name+' 觸發追加攻擊，額外造成 '+dmg2+' 點傷害！');
    }
    if(hasPassive(actor,'virulence') && target.hp>0 && !target.status && Math.random()<0.25){
      target.status='poison'; target.statusTurns=3;
      b.turnLog.unshift(target.name+' 被腐蝕氣息感染，陷入中毒狀態！');
    }
    if(hasPassive(actor,'combatFlow')){
      actor.mp = clamp(actor.mp+4,0,actor.maxMp);
    }
    checkKillReward(target, b);
    if(target.hp===0) b.turnLog.unshift(target.name+' 被擊敗了！');
  } else if(action==='skill'){
    const sk = getSkills(actor)[skillIdx];
    if(actor.mp < sk.mp){ b.turnLog.unshift(actor.name+' 的MP不足以使用 '+sk.name+'！'); render(); return; }
    actor.mp -= sk.mp;
    applySkill(actor, sk, targetIdx, b);
  } else if(action==='item'){
    const item = potionUid ? S.inventory.find(i=>i.uid===potionUid) : S.inventory.find(i=>i.slot==='potion');
    if(!item){ render(); return; }
    S.inventory.splice(S.inventory.indexOf(item),1);
    if(item.kind==='mp'){
      actor.mp = clamp(actor.mp+item.value,0,actor.maxMp);
      b.turnLog.unshift(actor.name+' 使用了 '+item.name+'，恢復 '+item.value+' MP。');
    } else {
      actor.hp = clamp(actor.hp+item.value,0,actor.maxHp);
      b.turnLog.unshift(actor.name+' 使用了 '+item.name+'，恢復 '+item.value+' HP。');
    }
  } else if(action==='defend'){
    actor.buffDef = Math.round(statTotal(actor,'def')*0.5); actor.buffTurns=1;
    b.turnLog.unshift(actor.name+' 擺出防禦姿態。');
  } else if(action==='flee'){
    const chance = 0.4 + statTotal(actor,'spd')*0.01;
    if(Math.random()<chance){
      b.turnLog.unshift('隊伍成功逃離了戰鬥！');
      b.over=true; b.win='flee';
      routeHome();
      render(); return;
    } else {
      b.turnLog.unshift(actor.name+' 試圖逃跑，但失敗了！');
    }
  }
  checkBattleEnd();
  if(!b.over) advanceBattleTurn(false);
  render();
}
function applySkill(actor, sk, targetIdx, b){
  const type = sk.type;
  if(type==='phys' || type==='magic' || type==='phys_crit'){
    const target = b.monsters[targetIdx];
    if(!target||target.hp<=0) return;
    let crit = type==='phys_crit' && Math.random()<0.45;
    const baseStat = type==='magic'? statTotal(actor,'atk')*1.15 : statTotal(actor,'atk');
    const defIgnore = (type!=='magic' && hasPassive(actor,'pierce')) ? target.def*0.3 : 0;
    let dmg = Math.max(1, Math.round(baseStat*sk.mult - (target.def-defIgnore)*(type==='magic'?0.25:0.5)));
    if(crit) dmg = Math.round(dmg*1.6);
    target.hp = clamp(target.hp-dmg,0,target.maxHp);
    b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」對 '+target.name+' 造成 '+dmg+' 點傷害'+(crit?'（會心一擊！）':'')+'。');
    checkKillReward(target, b);
    if(target.hp===0) b.turnLog.unshift(target.name+' 被擊敗了！');
  } else if(type==='phys_multi' || type==='phys_multi2'){
    const target = b.monsters[targetIdx];
    if(!target||target.hp<=0) return;
    const hits = type==='phys_multi'?3:2;
    const defIgnore = hasPassive(actor,'pierce') ? target.def*0.3 : 0;
    let total=0;
    for(let i=0;i<hits;i++){
      if(target.hp<=0) break;
      const dmg = Math.max(1, Math.round(statTotal(actor,'atk')*sk.mult - (target.def-defIgnore)*0.5));
      target.hp = clamp(target.hp-dmg,0,target.maxHp);
      total+=dmg;
    }
    b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」共造成 '+total+' 點傷害。');
    checkKillReward(target, b);
    if(target.hp===0) b.turnLog.unshift(target.name+' 被擊敗了！');
  } else if(type==='magic_aoe' || type==='magic_dot'){
    let total=0;
    b.monsters.forEach(mo=>{
      if(mo.hp<=0) return;
      let dmg = Math.max(1, Math.round(statTotal(actor,'atk')*1.1*sk.mult - mo.def*0.25));
      mo.hp = clamp(mo.hp-dmg,0,mo.maxHp);
      total+=dmg;
      if(type==='magic_dot'){ mo.status='poison'; mo.statusTurns=3; }
      checkKillReward(mo, b);
    });
    b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」對全體敵人造成共 '+total+' 點傷害'+(type==='magic_dot'?'，並附加中毒效果':'')+'。');
  } else if(type==='heal'){
    const target = S.party[targetIdx];
    if(!target) return;
    let amt = Math.round(actor.maxMp*0.02 + statTotal(actor,'atk')*sk.heal + actor.level*3);
    if(hasPassive(actor,'mercyHeal') && target.hp < target.maxHp*0.3){ amt = Math.round(amt*1.25); }
    target.hp = clamp(target.hp+amt,0,target.maxHp);
    b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」為 '+target.name+' 恢復 '+amt+' HP。');
  } else if(type==='heal_aoe'){
    const amt = Math.round(actor.level*4 + statTotal(actor,'atk')*sk.heal);
    healParty(S, amt);
    b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」為全隊恢復 '+amt+' HP。');
  } else if(type==='buff'){
    S.party.forEach(m=>{ if(m.hp>0){ m.buffDef = Math.round(statTotal(m,'def')*0.2); m.buffTurns=2; } });
    b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」，全隊防禦提升！');
  } else if(type==='guard'){
    actor.taunting=true; actor.buffDef=Math.round(statTotal(actor,'def')*0.6); actor.buffTurns=2;
    b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」，吸引敵人攻擊並提升防禦！');
  } else if(type==='steal'){
    const target = b.monsters[targetIdx];
    if(!target||target.hp<=0) return;
    const dmg = Math.max(1, Math.round(statTotal(actor,'atk')*1.1 - target.def*0.5));
    target.hp = clamp(target.hp-dmg,0,target.maxHp);
    const stolen = rint(Math.random,5,15);
    S.hero.gold += stolen;
    b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」，造成 '+dmg+' 傷害並偷得 '+stolen+' 金幣。');
    checkKillReward(target, b);
    if(target.hp===0) b.turnLog.unshift(target.name+' 被擊敗了！');
  } else if(type==='self_heal'){
    const amt = Math.round(actor.maxHp*sk.heal);
    actor.hp = clamp(actor.hp+amt,0,actor.maxHp);
    actor.mp = clamp(actor.mp+10,0,actor.maxMp);
    b.turnLog.unshift(actor.name+' 使用了「'+sk.name+'」，恢復 '+amt+' HP 與部分MP。');
  }
  if(hasPassive(actor,'combatFlow') && ['phys','phys_crit','phys_multi','phys_multi2'].includes(type)){
    actor.mp = clamp(actor.mp+5,0,actor.maxMp);
  }
}
function checkKillReward(mon, b){
  if(mon.hp>0 || mon.rewarded) return;
  mon.rewarded = true;
  const log=[];
  S.party.filter(m=>m.hp>0).forEach(m=> gainExp(m, mon.exp, log));
  S.hero.gold += mon.gold;
  b.turnLog.unshift('獲得 '+mon.exp+' 經驗值與 '+mon.gold+' 金幣。');
  log.forEach(l=> b.turnLog.unshift(l));
}
function checkBattleEnd(){
  const b=S.battle;
  if(b.monsters.every(m=>m.hp<=0)){
    if(!b.over){
      b.over=true; b.win=true;
      b.turnLog.unshift('=== 戰鬥勝利！ ===');
      let dropped=[];
      b.monsters.forEach(m=>{
        const dropChance = m.boss?1:(m.tier>=3?0.5:0.28);
        if(Math.random()<dropChance){
          const item = rollEquip(Math.random, m.boss?'epic':null, m.level);
          S.inventory.push(item);
          dropped.push(item.name);
        }
      });
      if(dropped.length) b.turnLog.unshift('掉落裝備：'+dropped.join('、'));
    }
  } else if(S.party.every(m=>m.hp<=0)){
    b.over=true; b.win=false;
    b.turnLog.unshift('=== 隊伍全滅……你們狼狽地撤退了 ===');
    S.party.forEach(m=> m.hp = Math.max(m.hp, Math.round(m.maxHp*0.15)));
    S.hero.gold = Math.round(S.hero.gold*0.7);
    S.shopStock = null; // 復活後商店自動免費刷新一批新商品
  }
}

/* ============ 探索 / 事件 ============ */
function explore(){
  S.daysSurvived++;
  const rng=Math.random;
  const roll = rng();
  if(roll < 0.35){
    startBattle();
  } else if(roll < 0.8){
    const pool = S.party.length>=4 ? EVENTS.filter(e=>e.id!=='wanderer') : EVENTS;
    const ev = choice(rng, pool);
    S.event = ev;
    S.screen='event';
  } else {
    const gold = rint(Math.random,10,30);
    S.hero.gold += gold;
    S.log.unshift('平靜的旅途中，你撿到了 '+gold+' 金幣。');
    routeHome();
  }
  render();
}
function resolveEvent(choiceIdx){
  const ev = S.event;
  const result = ev.choices[choiceIdx].act(S);
  S.log.unshift('【'+ev.title+'】'+result);
  S.event=null;
  routeHome();
  render();
}

/* ============ 裝備 / 背包 ============ */
function equipItem(item, memberUid){
  const m = S.party.find(p=>p.uid===(memberUid||S.invSelectedUid)) || S.hero;
  let targetSlot = item.slot;
  if(item.slot==='accessory'){
    targetSlot = !m.equip.accessory ? 'accessory' : (!m.equip.accessory2 ? 'accessory2' : 'accessory');
  }
  const cur = m.equip[targetSlot];
  if(cur) S.inventory.push(cur);
  m.equip[targetSlot]=item;
  S.inventory = S.inventory.filter(i=>i.uid!==item.uid);
  render();
}
function unequipItem(slot, memberUid){
  const m = S.party.find(p=>p.uid===(memberUid||S.invSelectedUid)) || S.hero;
  const cur = m.equip[slot];
  if(cur){ S.inventory.push(cur); m.equip[slot]=null; }
  render();
}
function usePotionOutOfBattle(item, memberUid){
  const m = S.party.find(p=>p.uid===(memberUid||S.invSelectedUid)) || S.hero;
  if(item.slot!=='potion') return;
  if(item.kind==='mp'){ m.mp = clamp(m.mp+item.value,0,m.maxMp); }
  else { m.hp = clamp(m.hp+item.value,0,m.maxHp); }
  S.inventory = S.inventory.filter(i=>i.uid!==item.uid);
  render();
}

/* ============ 渲染 ============ */
let uiTab = 'inv';
/* ============ 存檔系統（localStorage） ============ */
const SAVE_KEY = 'ashfall_era_save_v1';
function saveGame(){
  if(!S) return;
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){ /* 儲存空間不可用時安靜失敗 */ }
}
function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    S = JSON.parse(raw);
    return true;
  }catch(e){ return false; }
}
function hasSaveGame(){
  try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; }
}
function deleteSaveGame(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){ /* 忽略 */ }
}
function restartGame(){
  if(!confirm('確定要放棄目前的進度，重新開始一輪新的冒險嗎？此動作無法復原。')) return;
  deleteSaveGame();
  S = null;
  render();
}

function render(){
  const root = document.getElementById('screens');
  if(!S){ root.innerHTML = renderCharCreate(); bindCharCreate(); return; }
  if(S.screen==='hub') { root.innerHTML = renderHub(); bindHub(); }
  else if(S.screen==='battle') { root.innerHTML = renderBattle(); bindBattle(); }
  else if(S.screen==='event') { root.innerHTML = renderEvent(); bindEvent(); }
  else if(S.screen==='inventory') { root.innerHTML = renderInventory(); bindInventory(); }
  else if(S.screen==='shop') { root.innerHTML = renderShop(); bindShop(); }
  else if(S.screen==='tavern') { root.innerHTML = renderTavern(); bindTavern(); }
  else if(S.screen==='party') { root.innerHTML = renderParty(); bindParty(); }
  else if(S.screen==='evolve-profession') { root.innerHTML = renderEvolveProfession(); bindEvolveProfession(); }
  else if(S.screen==='evolve-class') { root.innerHTML = renderEvolveClass(); bindEvolveClass(); }
  else if(S.screen==='evolve-branch') { root.innerHTML = renderEvolveBranch(); bindEvolveBranch(); }
  requestAnimationFrame(paintSprites);
  if(S.screen==='hub') saveGame();
}
let pendingSprites = [];
function queueSprite(id, seed, palette, size){ pendingSprites.push({id,seed,palette,size}); }
function queueEquipIcon(id, seed, kind, color){ pendingSprites.push({id,seed,kind,color,equip:true}); }
function paintSprites(){
  pendingSprites.forEach(p=>{
    const c = document.getElementById(p.id);
    if(!c) return;
    if(p.equip) drawEquipIcon(c, p.seed, p.kind, p.color);
    else drawSprite(c, p.seed, p.palette, p.size||14);
  });
  pendingSprites = [];
}

function renderCharCreate(){
  return `
  <div class="panel" style="text-align:center;">
    <canvas class="sprite" id="cc-commoner" width="72" height="72" style="margin:0 auto;display:block;"></canvas>
    <p class="section-title" style="margin-top:10px;">你是一介平凡的普通人</p>
    <p class="event-text">尚未踏上冒險之路，也還沒有任何專精。<br>
    隨著旅途的歷練，Lv.${PROFESSION_LEVEL} 時可以選擇一項<b style="color:var(--gold)">生活職業</b>（4選1），<br>
    Lv.${CLASS_LEVEL} 時將正式覺醒為<b style="color:var(--gold)">冒險職業</b>（該職業路線的2選1），<br>
    Lv.${BRANCH_LEVEL} 時再進行最終的<b style="color:var(--gold)">職業分支</b>（3選1）。<br>

function bindCharCreate(){
  queueSprite('cc-commoner', 'commoner_preview', COMMONER.palette, 14);
  document.getElementById('start-btn').addEventListener('click', ()=> newGame());
}

function memberCardHtml(m, idx, opts){
  opts=opts||{};
  const hpPct = Math.round(m.hp/m.maxHp*100);
  const mpPct = m.maxMp? Math.round(m.mp/m.maxMp*100):0;
  const expPct = Math.round(m.exp/m.nextExp*100);
  const spriteId = (opts.prefix||'pc')+'-'+idx;
  return `
  <div class="member-card ${m.hp<=0?'dead':''} ${opts.activeClass||''}" data-uid="${m.uid}">
    <canvas class="sprite" id="${spriteId}" width="48" height="48"></canvas>
    <div class="member-info">
      <div class="member-name"><span>${esc(m.name)}${m.isHero?' (你)':''} Lv.${m.level}</span><span class="small">${esc(displayClassName(m))}</span></div>
      <div class="bar-wrap"><div class="bar" style="width:${hpPct}%;background:var(--hp)"></div></div>
      <div class="small">HP ${m.hp}/${m.maxHp}</div>
      ${m.maxMp? `<div class="bar-wrap"><div class="bar" style="width:${mpPct}%;background:var(--mp)"></div></div><div class="small">MP ${m.mp}/${m.maxMp}</div>`:''}
      ${opts.showExp? `<div class="bar-wrap"><div class="bar" style="width:${expPct}%;background:var(--xp)"></div></div><div class="small">EXP ${m.exp}/${m.nextExp}</div>`:''}
    </div>
  </div>`;
}

function restCostHP(){ return 70 * Math.pow(2, S.party.length-1); }
function restCostMP(){ return 55 * Math.pow(2, S.party.length-1); }
function restHP(){
  const cost = restCostHP();
  if(S.hero.gold < cost){
    S.log.unshift('金幣不足，需要 '+cost+' 金幣才能讓全隊HP恢復（目前隊伍 '+S.party.length+' 人）。');
    render();
    return;
  }
  S.hero.gold -= cost;
  S.party.forEach(m=>{ m.hp=m.maxHp; });
  S.log.unshift('花費 '+cost+' 金幣，讓全隊HP完全恢復！');
  render();
}
function restMP(){
  const cost = restCostMP();
  if(S.hero.gold < cost){
    S.log.unshift('金幣不足，需要 '+cost+' 金幣才能讓全隊MP恢復（目前隊伍 '+S.party.length+' 人）。');
    render();
    return;
  }
  S.hero.gold -= cost;
  S.party.forEach(m=>{ m.mp=m.maxMp; });
  S.log.unshift('花費 '+cost+' 金幣，讓全隊MP完全恢復！');
  render();
}
function renderHub(){

  const costMP = restCostMP();
  const canAffordHP = hero.gold >= costHP;
  const canAffordMP = hero.gold >= costMP;
  return `

      <button class="btn btn-nav" id="tavern-btn"><span class="nav-icon">🍺</span>酒館</button>
      <button class="btn btn-nav" id="party-btn"><span class="nav-icon">👥</span>隊伍管理</button>
    </div>
    <div class="utility-row" style="margin-top:8px;">
      <button class="btn btn-compact ${canAffordHP?'gold':'danger'}" id="rest-hp-btn" style="flex:1;" ${canAffordHP?'':'disabled'}>💗 回HP（${costHP}）</button>
      <button class="btn btn-compact ${canAffordMP?'gold':'danger'}" id="rest-mp-btn" style="flex:1;" ${canAffordMP?'':'disabled'}>💧 回MP（${costMP}）</button>
    </div>
  </div>
  <div class="panel">
    <p class="section-title">冒險紀錄</p>

let pendingAction=null;
let actionToken=0;
function bindBattle(){
  const b=S.battle;
  b.monsters.forEach((m,i)=> queueSprite('mon-'+i, m.seed, PALETTES[m.type], 16));
  S.party.forEach((m,i)=> queueSprite('bp-'+i, (m.classId||m.professionId||'commoner')+'_'+m.uid, memberPalette(m), 12));
  const backBtn = document.getElementById('back-hub');
  if(backBtn) backBtn.addEventListener('click', ()=>{ routeHome(); render(); });

  const current = b.order[b.turnIndex];
  if(!current || current.type!=='party' || b.over) return;
  const actor = current.ref;
  pendingAction=null; // fresh turn's DOM: any earlier pending selection is now stale

  document.querySelectorAll('[data-act]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const act = btn.dataset.act;
      if(act==='attack'){ pendingAction={type:'attack', token:++actionToken}; promptTarget(actor, pendingAction.token); }
      else if(act==='defend'){ playerAction(actor.uid,'defend'); }
      else if(act==='flee'){ playerAction(actor.uid,'flee'); }
    });
  });
  document.querySelectorAll('[data-item-potion]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      playerAction(actor.uid,'item',null,null,btn.dataset.itemPotion);
    });
  });
  document.querySelectorAll('[data-skill]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const skillIdx = parseInt(btn.dataset.skill);
      const sk = getSkills(actor)[skillIdx];
      if(sk.type==='heal'){
        pendingAction={type:'skill', skillIdx, token:++actionToken};
        promptAllyTarget(actor, pendingAction.token);
      } else if(['heal_aoe','buff','guard','self_heal'].includes(sk.type)){
        playerAction(actor.uid,'skill',null,skillIdx);
      } else {
        pendingAction={type:'skill', skillIdx, token:++actionToken};
        promptTarget(actor, pendingAction.token);
      }
    });
  });
  // 直接點擊怪物 = 預設觸發普通攻擊（若沒有其他技能正在等待選擇目標）
  document.querySelectorAll('.monster-box.target-selectable').forEach(box=>{
    box.addEventListener('click', function defaultAttackHandler(){
      if(pendingAction) return;
      const idx = parseInt(box.dataset.tidx);
      playerAction(actor.uid,'attack',idx);
    });
  });
}
function promptTarget(actor, token){
  document.querySelectorAll('.monster-box.target-selectable').forEach(box=>{
    box.addEventListener('click', function handler(){
      if(!pendingAction || pendingAction.token!==token) return;
      const idx = parseInt(box.dataset.tidx);
      if(pendingAction.type==='attack') playerAction(actor.uid,'attack',idx);
      else playerAction(actor.uid,'skill',idx,pendingAction.skillIdx);
      pendingAction=null;
    }, {once:true});
  });
}
function promptAllyTarget(actor, token){
  document.querySelectorAll('.member-card').forEach((card,idx)=>{
    card.style.cursor='pointer';
    card.addEventListener('click', function handler(){
      if(!pendingAction || pendingAction.token!==token) return;
      if(S.party[idx].hp<=0) return;
      playerAction(actor.uid,'skill',idx,pendingAction.skillIdx);
      pendingAction=null;
    }, {once:true});
  });
}

function statLabel(s){ return {atk:'攻擊',def:'防禦',spd:'敏捷',hp:'生命',mp:'法力',heal:'治療'}[s]||s; }
function equipAffixText(item){
  let s = '+'+item.value+' '+statLabel(item.stat);
  if(item.extraStat) s += ' · 額外+'+item.extraValue+' '+statLabel(item.extraStat);
  return s;
}
function skillEstimate(actor, sk){
  const atk = statTotal(actor,'atk');
  switch(sk.type){
    case 'phys': return '預估傷害 ~'+Math.round(atk*sk.mult);
    case 'phys_crit': return '預估傷害 ~'+Math.round(atk*sk.mult)+'（機率爆擊x1.6）';
    case 'phys_multi': return '預估總傷害 ~'+Math.round(atk*sk.mult*3)+'（3連擊）';
    case 'phys_multi2': return '預估總傷害 ~'+Math.round(atk*sk.mult*2)+'（2連擊）';
    case 'magic': return '預估魔法傷害 ~'+Math.round(atk*1.15*sk.mult);
    case 'magic_aoe': return '預估群體傷害 ~'+Math.round(atk*1.1*sk.mult)+'/敵';
    case 'magic_dot': return '預估傷害 ~'+Math.round(atk*1.1*sk.mult)+'/敵 + 中毒3回合';
    case 'heal': return '預估治療 ~'+Math.round(actor.maxMp*0.02+atk*sk.heal+actor.level*3)+' HP';
    case 'heal_aoe': return '預估群體治療 ~'+Math.round(actor.level*4+atk*sk.heal)+' HP';
    case 'self_heal': return '恢復 ~'+Math.round(actor.maxHp*sk.heal)+' HP + 10 MP';
    case 'buff': return '全隊防禦+20%，持續2回合';
    case 'guard': return '嘲諷 + 防禦大幅提升，持續2回合';
    case 'steal': return '傷害 + 偷取5~15金幣';
    default: return '';
  }
}

/* ============ 商店系統 ============ */
const SHOP_SIZE = 6;
const SHOP_REROLL_COST = 25;
function potionPrice(kind){ return kind==='mp' ? 25 : 30; }
function generateShopStock(){
  const lvl = avgPartyLevel();
  const stock = [];
  for(let i=0;i<SHOP_SIZE;i++){
    if(Math.random() < 0.35){
      const kind = Math.random()<0.5 ? 'hp' : 'mp';
      const item = {
        uid:'pot_shop_'+Math.floor(Math.random()*1e9), slot:'potion', kind,
        name: kind==='mp' ? '魔力藥水' : '治療藥水', value: kind==='mp' ? 40 : 60
      };
      stock.push({item, price: potionPrice(kind), sold:false});
    } else {
      const item = rollEquip(Math.random, null, lvl);
      stock.push({item, price: equipPrice(item), sold:false});
    }
  }
  S.shopStock = stock;
}
function renderShop(){
  if(!S.shopStock) generateShopStock();
  const hero = S.hero;
  const tab = S.shopTab || 'buy';
  let body = '';
  if(tab==='buy'){
    const rows = S.shopStock.map((entry,i)=>{
      const it = entry.item;
      const isPotion = it.slot==='potion';
      if(entry.sold){
        return `<div class="item-row" style="opacity:.4;">
          <div><span class="${isPotion?'':'rarity-'+it.rarity}">${esc(it.name)}</span> <span class="meta">已售出</span></div>
        </div>`;
      }
      const canAfford = hero.gold >= entry.price;
      if(isPotion){
        const icon = it.kind==='mp' ? '💧' : '🧪';
        const statName = it.kind==='mp' ? 'MP' : 'HP';
        return `<div class="item-row">
          <div><span>${icon} ${esc(it.name)}</span> <span class="meta">恢復 ${it.value} ${statName}</span></div>
          <button class="btn ${canAfford?'gold':''}" data-buy="${i}" ${canAfford?'':'disabled'}>💰 ${entry.price}</button>
        </div>`;
      }
      const label = {weapon:'武器',armor:'防具',accessory:'飾品'}[it.slot];
      return `<div class="item-row">
        <div style="display:flex;align-items:center;gap:8px;">
          <canvas class="sprite" id="shop-${i}" width="40" height="40"></canvas>
          <div><div class="rarity-${it.rarity}">${esc(it.name)}</div><div class="meta">${label} ${equipAffixText(it)} · Lv.${it.itemLevel}</div></div>
        </div>
        <button class="btn ${canAfford?'gold':''}" data-buy="${i}" ${canAfford?'':'disabled'}>💰 ${entry.price}</button>
      </div>`;
    }).join('');
    body = rows;
  } else {
    const equipItems = S.inventory.filter(i=>i.slot!=='potion');
    body = equipItems.map(it=>{
      const label = {weapon:'武器',armor:'防具',accessory:'飾品'}[it.slot];
      const sellPrice = Math.round(equipPrice(it)*0.4);
      return `<div class="item-row">
        <div><div class="rarity-${it.rarity}">${esc(it.name)}</div><div class="meta">${label} ${equipAffixText(it)} · Lv.${it.itemLevel||1}</div></div>
        <button class="btn danger" data-sell="${it.uid}">賣出 💰${sellPrice}</button>
      </div>`;
    }).join('') || '<p class="small">背包裡沒有可以出售的裝備。</p>';
  }
  const rerollAfford = hero.gold >= SHOP_REROLL_COST;
  const sellCount = S.inventory.filter(i=>i.slot!=='potion').length;
  return `
  <div class="panel">
    <div class="topbar">
      <span class="pixel-font" style="font-size:11px;color:var(--gold);">💰 ${hero.gold} 金幣</span>
    </div>
    <div class="segmented">
      <button class="btn ${tab==='buy'?'active':''}" data-tab="buy">🛒 購買</button>
      <button class="btn ${tab==='sell'?'active':''}" data-tab="sell">💸 販賣</button>
    </div>
    ${body}
    <hr class="divider">
    <div class="action-row" style="justify-content:center;">
      ${tab==='buy'?`<button class="btn ${rerollAfford?'':'danger'}" id="reroll-btn" ${rerollAfford?'':'disabled'}>🔄 更新商品（${SHOP_REROLL_COST} 金幣）</button>`:''}
      ${tab==='sell' && sellCount>0?`<button class="btn danger" id="sell-all-btn">💸 一鍵賣出全部（${sellCount}件）</button>`:''}
      <button class="btn" id="back-hub4">返回營地</button>
    </div>
  </div>`;
}
function bindShop(){
  const tab = S.shopTab || 'buy';
  if(tab==='buy'){
    S.shopStock.forEach((entry,i)=>{ if(!entry.sold && entry.item.slot!=='potion') queueEquipIcon('shop-'+i, entry.item.seed, entry.item.slot, entry.item.rarityHex); });
  }
  document.querySelectorAll('[data-tab]').forEach(btn=> btn.addEventListener('click', ()=>{
    S.shopTab = btn.dataset.tab;
    render();
  }));
  document.querySelectorAll('[data-buy]').forEach(btn=> btn.addEventListener('click', ()=>{
    const idx = parseInt(btn.dataset.buy);
    const entry = S.shopStock[idx];
    if(!entry || entry.sold) return;
    if(S.hero.gold < entry.price) return;
    S.hero.gold -= entry.price;
    S.inventory.push(entry.item);
    entry.sold = true;
    S.log.unshift('花費 '+entry.price+' 金幣，從商店購入了 '+entry.item.name+'。');
    render();
  }));
  document.querySelectorAll('[data-sell]').forEach(btn=> btn.addEventListener('click', ()=>{
    const item = S.inventory.find(i=>i.uid===btn.dataset.sell);
    if(!item) return;
    const sellPrice = Math.round(equipPrice(item)*0.4);
    S.inventory = S.inventory.filter(i=>i.uid!==item.uid);
    S.hero.gold += sellPrice;
    S.log.unshift('賣出了 '+item.name+'，獲得 '+sellPrice+' 金幣。');
    render();
  }));
  const rerollBtn = document.getElementById('reroll-btn');
  if(rerollBtn) rerollBtn.addEventListener('click', ()=>{
    if(S.hero.gold < SHOP_REROLL_COST) return;
    S.hero.gold -= SHOP_REROLL_COST;
    generateShopStock();
    S.log.unshift('花費 '+SHOP_REROLL_COST+' 金幣，更新了商店的商品。');
    render();
  });
  const sellAllBtn = document.getElementById('sell-all-btn');
  if(sellAllBtn) sellAllBtn.addEventListener('click', ()=>{
    const items = S.inventory.filter(i=>i.slot!=='potion');
    if(items.length===0) return;
    let total = 0;
    items.forEach(it=> total += Math.round(equipPrice(it)*0.4));
    S.inventory = S.inventory.filter(i=>i.slot==='potion');
    S.hero.gold += total;
    S.log.unshift('一鍵賣出了 '+items.length+' 件裝備，獲得 '+total+' 金幣。');
    render();
  });
  const back = document.getElementById('back-hub4');
  if(back) back.addEventListener('click', ()=>{ routeHome(); render(); });
}

      </div>`;
    }
    const canAfford = hero.gold >= entry.price;
    const disabled = full || !canAfford;
    return `<div class="item-row">
      <div style="display:flex;align-items:center;gap:8px;">
        <canvas class="sprite" id="tavern-${i}" width="44" height="44"></canvas>
        <div><b>${esc(npc.name)}</b><div class="meta">普通人 · 待覺醒 · Lv.${npc.level}</div></div>
      </div>
      <button class="btn ${disabled?'':'gold'}" data-recruit="${i}" ${disabled?'disabled':''}>💰 ${entry.price}</button>
    </div>`;
  }).join('');
  const rerollAfford = hero.gold >= TAVERN_REROLL_COST;
  return `
  <div class="panel">
    <div class="topbar">
      <span class="pixel-font" style="font-size:11px;color:var(--gold);">💰 ${hero.gold} 金幣</span>
      <span class="small">隊伍 ${S.party.length}/4 人</span>
    </div>
    <p class="section-title">🍺 酒館 — 可招募的旅人</p>
    ${full ? '<p class="event-text">隊伍已經滿員了，無法再招募新的夥伴。</p>' : ''}
    ${rows}
    <hr class="divider">
    <div class="action-row" style="justify-content:center;">
      <button class="btn ${rerollAfford?'':'danger'}" id="tavern-reroll-btn" ${rerollAfford?'':'disabled'}>🔄 更換旅人（${TAVERN_REROLL_COST} 金幣）</button>
      <button class="btn" id="back-hub5">返回營地</button>
    </div>
  </div>`;
}
function bindTavern(){
  S.tavernStock.forEach((entry,i)=>{ if(!entry.recruited) queueSprite('tavern-'+i, 'commoner_'+entry.npc.uid, memberPalette(entry.npc), 12); });
  document.querySelectorAll('[data-recruit]').forEach(btn=> btn.addEventListener('click', ()=>{
    const idx = parseInt(btn.dataset.recruit);
    const entry = S.tavernStock[idx];
    if(!entry || entry.recruited) return;
    if(S.party.length>=4){ S.log.unshift('隊伍已滿員，無法招募更多夥伴。'); render(); return; }
    if(S.hero.gold < entry.price) return;
    S.hero.gold -= entry.price;
    S.party.push(entry.npc);
    entry.recruited = true;
    S.log.unshift('花費 '+entry.price+' 金幣，'+entry.npc.name+' 加入了你的隊伍！');
    render();
  }));
  const rerollBtn = document.getElementById('tavern-reroll-btn');
  if(rerollBtn) rerollBtn.addEventListener('click', ()=>{
    if(S.hero.gold < TAVERN_REROLL_COST) return;
    S.hero.gold -= TAVERN_REROLL_COST;
    generateTavernStock();
    S.log.unshift('花費 '+TAVERN_REROLL_COST+' 金幣，酒館換了一批新旅人。');
    render();
  });
  const back = document.getElementById('back-hub5');
  if(back) back.addEventListener('click', ()=>{ routeHome(); render(); });
}

function renderParty(){
  const cards = S.party.map((m,i)=>{
    const canDismiss = !m.isHero && S.party.length>1;
    return `<div class="hero-slot">
      <canvas class="sprite" id="pty-${i}" width="52" height="52"></canvas>
      <div style="flex:1;">
        <b>${esc(m.name)}${m.isHero?' (你)':''}</b> · ${esc(displayClassName(m))} · Lv.${m.level}
        <div class="small">HP ${m.hp}/${m.maxHp} ・ MP ${m.mp}/${m.maxMp} ・ EXP ${m.exp}/${m.nextExp}</div>
        <div class="small">ATK ${statTotal(m,'atk')} / DEF ${statTotal(m,'def')} / SPD ${statTotal(m,'spd')}</div>
      </div>
      ${canDismiss?`<button class="btn danger" data-dismiss="${m.uid}">遣散</button>`:''}
    </div>`;
  }).join('');
  return `
  <div class="panel">
    <p class="section-title">隊伍管理（最多4人）</p>
    ${cards}
    <div style="text-align:center;margin-top:10px;"><button class="btn" id="back-hub3">返回營地</button></div>
    <hr class="divider">
    <div style="text-align:center;"><button class="flee-link" id="restart-game-btn">🗑️ 放棄進度，重新開始遊戲</button></div>
  </div>`;
}
function bindParty(){
  S.party.forEach((m,i)=> queueSprite('pty-'+i, (m.classId||m.professionId||'commoner')+'_'+m.uid, memberPalette(m), 12));
  document.querySelectorAll('[data-dismiss]').forEach(btn=> btn.addEventListener('click', ()=>{
    S.party = S.party.filter(m=>m.uid!==btn.dataset.dismiss);
    render();
  }));
  const back = document.getElementById('back-hub3');
  if(back) back.addEventListener('click', ()=>{ routeHome(); render(); });
  const restartBtn = document.getElementById('restart-game-btn');
  if(restartBtn) restartBtn.addEventListener('click', restartGame);
}

function bonusSummary(b){
  const parts=[];
  if(b.hp) parts.push('HP'+(b.hp>0?'+':'')+b.hp);
  if(b.mp) parts.push('MP'+(b.mp>0?'+':'')+b.mp);
  if(b.atk) parts.push('ATK'+(b.atk>0?'+':'')+b.atk);
  if(b.def) parts.push('DEF'+(b.def>0?'+':'')+b.def);
  if(b.spd) parts.push('SPD'+(b.spd>0?'+':'')+b.spd);
  return parts.join(' · ');
}

/* --- 第1階：生活職業選擇 --- */
function renderEvolveProfession(){
  const hero = S.hero;
  const cards = PROFESSIONS.map((p,i)=>`
    <div class="class-card" data-prof="${p.id}">
      <canvas class="sprite" id="prof-${i}" width="64" height="64"></canvas>
      <h3>${esc(p.name)}</h3>
      <p>${esc(p.tag)}</p>
      <div class="small" style="color:var(--gold);margin-top:4px;">${esc(bonusSummary(p.statBonus))}</div>
      <hr class="divider">
      <div class="small"><b style="color:var(--text)">新技能：${esc(p.skill.name)}</b><br>${esc(p.skill.desc)}</div>
    </div>`).join('');
  return `
  <div class="panel">
    <p class="section-title pixel-font" style="font-size:12px;">🌱 生活覺醒 — Lv.${hero.level}</p>
    <p class="event-text">${esc(hero.name)} 已成長到足以選擇人生方向的年紀！請從 4 種生活職業中選擇一個，這將決定你未來能踏上哪些冒險職業之路。</p>
    <div class="grid class-grid">${cards}</div>
  </div>`;
}
function bindEvolveProfession(){
  PROFESSIONS.forEach((p,i)=> queueSprite('prof-'+i, 'prof_'+p.id, p.palette, 14));
  document.querySelectorAll('[data-prof]').forEach(card=>{
    card.addEventListener('click', ()=>{
      const hero = S.hero;
      setProfession(hero, card.dataset.prof);
      S.log.unshift(esc(hero.name)+' 踏上了 ['+displayClassName(hero)+'] 之路！');
      S.pendingStage = null;
      evaluateEvolution(hero);
      routeHome();
      render();
    });
  });
}

/* --- 第2階：冒險職業選擇（依生活職業篩選2個選項） --- */
function renderEvolveClass(){
  const hero = S.hero;
  const prof = PROFESSIONS.find(p=>p.id===hero.professionId);
  const opts = CLASSES.filter(c=>prof.leadsTo.includes(c.id));
  const cards = opts.map((c,i)=>`
    <div class="class-card" data-cls="${c.id}">
      <canvas class="sprite" id="clschoice-${i}" width="64" height="64"></canvas>
      <h3>${esc(c.name)}</h3>
      <p>${esc(c.tag)}</p>
      <div class="small" style="color:var(--gold);margin-top:4px;">${esc(bonusSummary(c.statBonus))}</div>
      <hr class="divider">
      <div class="small"><b style="color:var(--text)">被動：${esc(c.passive.name)}</b><br>${esc(c.passive.desc)}</div>
      <div class="small" style="margin-top:4px;">技能：${c.skills.map(s=>esc(s.name)).join('、')}</div>
    </div>`).join('');
  return `
  <div class="panel">
    <p class="section-title pixel-font" style="font-size:12px;">⚔️ 職業覺醒 — Lv.${hero.level}</p>
    <p class="event-text">身為 ${esc(prof.name)} 的 ${esc(hero.name)}，已經達到正式踏上冒險職業的等級！請從以下 2 條道路中選擇一個，永久決定你的戰鬥風格與專屬被動能力。</p>
    <div class="grid class-grid">${cards}</div>
  </div>`;
}
function bindEvolveClass(){
  const hero = S.hero;
  const prof = PROFESSIONS.find(p=>p.id===hero.professionId);
  const opts = CLASSES.filter(c=>prof.leadsTo.includes(c.id));
  opts.forEach((c,i)=> queueSprite('clschoice-'+i, 'class_'+c.id, c.palette, 14));
  document.querySelectorAll('[data-cls]').forEach(card=>{
    card.addEventListener('click', ()=>{
      setClass(hero, card.dataset.cls);
      S.log.unshift(esc(hero.name)+' 覺醒為 ['+displayClassName(hero)+']！');
      S.pendingStage = null;
      evaluateEvolution(hero);
      routeHome();
      render();
    });
  });
}

/* --- 第3階：職業分支選擇（3選1） --- */
function renderEvolveBranch(){
  const hero = S.hero;
  const cls = CLASSES.find(c=>c.id===hero.classId);
  const cards = cls.advancements.map((adv,i)=>`
    <div class="class-card" data-adv="${adv.id}">
      <canvas class="sprite" id="adv-${i}" width="64" height="64"></canvas>
      <h3>${esc(adv.name)}</h3>
      <p>${esc(adv.desc)}</p>
      <div class="small" style="color:var(--gold);margin-top:4px;">${esc(bonusSummary(adv.statBonus))}</div>
      <hr class="divider">
      <div class="small"><b style="color:var(--text)">新技能：${esc(adv.skill.name)}</b><br>${esc(adv.skill.desc)}</div>
    </div>`).join('');
  return `
  <div class="panel">
    <p class="section-title pixel-font" style="font-size:12px;">✨ 終極覺醒 — Lv.${hero.level}</p>
    <p class="event-text">${esc(hero.name)} 已達到覺醒等級！請從 ${esc(cls.name)} 的三條道路中選擇一個，永久決定未來的成長方向與新技能。</p>
    <div class="grid class-grid">${cards}</div>
  </div>`;
}
function bindEvolveBranch(){
  const hero = S.hero;
  const cls = CLASSES.find(c=>c.id===hero.classId);
  cls.advancements.forEach((adv,i)=> queueSprite('adv-'+i, 'adv_'+adv.id, cls.palette, 14));
  document.querySelectorAll('[data-adv]').forEach(card=>{
    card.addEventListener('click', ()=>{
      setAdvancement(hero, card.dataset.adv);
      S.log.unshift(esc(hero.name)+' 覺醒為 ['+displayClassName(hero)+']！習得新技能「'+getSkills(hero)[getSkills(hero).length-1].name+'」。');
      S.pendingStage = null;
      routeHome();
      render();
    });
  });
}

loadGame();
render();
</script>
